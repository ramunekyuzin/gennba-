<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>図面・書類</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #f5f6f8; color: #222;
      padding: 16px; max-width: 560px; margin: 0 auto;
    }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #777; margin-bottom: 16px; }
    .card {
      display: flex; align-items: center; gap: 12px;
      background: #fff; border-radius: 12px; padding: 16px;
      margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
      text-decoration: none; color: inherit;
    }
    .card:active { background: #eef3fb; }
    .icon {
      flex: 0 0 44px; height: 44px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: bold; color: #fff;
    }
    .icon.genba { background: #2d7d46; }
    .icon.folder { background: #1e5aa8; }
    .icon.pdf { background: #c0392b; }
    .name { font-size: 16px; font-weight: bold; word-break: break-all; }
    .meta { font-size: 12px; color: #888; margin-top: 3px; }
    .chev { margin-left: auto; color: #bbb; font-size: 20px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 14px; }
    .toolbar button, .toolbar a {
      flex: 1; padding: 12px; font-size: 14px; font-weight: bold; text-align: center;
      border: 1px solid #1e5aa8; border-radius: 10px; background: #fff; color: #1e5aa8;
      text-decoration: none;
    }
    .toolbar .primary { background: #1e5aa8; color: #fff; }
    #status { text-align: center; font-size: 14px; color: #888; padding: 24px 0; }
    #status.ng { color: #c0392b; }
    .empty { text-align: center; color: #888; padding: 32px 0; font-size: 14px; }

    /* ---- QRシート ---- */
    .qr-head { display: none; font-size: 18px; font-weight: bold; margin-bottom: 8mm; }
    .qr-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .qr-card {
      background: #fff; border: 2px solid #222; border-radius: 12px;
      padding: 18px 12px; text-align: center; break-inside: avoid;
    }
    .qr-card .qr { display: flex; justify-content: center; margin-bottom: 12px; }
    .qr-card .qr img, .qr-card .qr canvas { width: 180px; height: 180px; }
    .qr-card .genba { font-size: 13px; color: #555; }
    .qr-card .title { font-size: 22px; font-weight: bold; }
    .qr-card .hint { font-size: 12px; color: #666; margin-top: 6px; }
    .qr-card .url { font-size: 9px; color: #999; margin-top: 6px; word-break: break-all; }
    @media print {
      body { background: #fff; padding: 0; max-width: none; }
      .toolbar, .sub, h1, #status { display: none; }
      .qr-head { display: block; }
      .qr-grid { gap: 10mm; }
      .qr-card { page-break-inside: avoid; }
      @page { size: A4; margin: 12mm; }
    }
  </style>
</head>
<body>
  <h1 id="title">図面・書類</h1>
  <div class="sub" id="subtitle"></div>
  <div class="toolbar" id="toolbar"></div>
  <div id="list"></div>
  <div id="status">読み込み中...</div>

  <script>
    // ============================================
    // 設定
    // ============================================
    const GAS_URL = ''; // ★ GASのWebアプリURL(…/exec)を入れる

    // QRに埋め込む自分自身のURL(GitHub Pages上のこのファイル)
    const SELF_URL = location.origin + location.pathname;

    // URL: なし=現場一覧 / ?g=現場ID=工種一覧 / ?k=工種ID=PDF一覧 / ?qr&g=現場ID=QRシート
    const params = new URLSearchParams(location.search);
    const genbaId = params.get('g');
    const folderId = params.get('k');
    const qrMode = params.has('qr');
    const $ = id => document.getElementById(id);

    function setStatus(msg, ng) {
      const el = $('status');
      el.textContent = msg || '';
      el.className = ng ? 'ng' : '';
    }

    function api(req) {
      if (!GAS_URL) return Promise.reject('GAS_URL が未設定');
      return fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(req),
      })
      .then(r => r.json())
      .then(res => { if (!res.ok) throw res.error; return res.result; });
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function fmtSize(b) {
      if (!b) return '';
      if (b < 1024 * 1024) return Math.round(b / 1024) + ' KB';
      return (b / 1024 / 1024).toFixed(1) + ' MB';
    }

    function linkTo(q) { return SELF_URL + (q ? '?' + q : ''); }

    // ============================================
    // 画面1: 現場一覧(パラメータ無し)
    // ============================================
    function showGenba(nocache) {
      $('title').textContent = '図面・書類';
      $('toolbar').innerHTML = '<button onclick="showGenba(true)">更新</button>';
      $('list').innerHTML = '';
      setStatus('読み込み中...');
      api({ action: 'genba', nocache: !!nocache }).then(res => {
        $('subtitle').textContent = '現場を選んでください';
        if (!res.genba.length) { $('list').innerHTML = '<div class="empty">現場フォルダがまだないよ</div>'; setStatus(''); return; }
        $('list').innerHTML = res.genba.map(g =>
          '<a class="card" href="' + linkTo('g=' + encodeURIComponent(g.id)) + '">' +
            '<div class="icon genba">現場</div>' +
            '<div><div class="name">' + esc(g.name) + '</div>' +
            '<div class="meta">工種 ' + g.koushuCount + ' 件</div></div>' +
            '<div class="chev">›</div>' +
          '</a>').join('');
        setStatus('');
      }).catch(err => setStatus('エラー: ' + err, true));
    }

    // ============================================
    // 画面2: 工種一覧(?g=現場ID)
    // ============================================
    function showKoushu(nocache) {
      $('toolbar').innerHTML =
        '<a href="' + linkTo('') + '">他の現場</a>' +
        '<button onclick="showKoushu(true)">更新</button>' +
        '<a href="' + linkTo('qr&g=' + encodeURIComponent(genbaId)) + '">QRシート</a>';
      $('list').innerHTML = '';
      setStatus('読み込み中...');
      api({ action: 'koushu', genbaId: genbaId, nocache: !!nocache }).then(res => {
        $('title').textContent = res.genbaName;
        $('subtitle').textContent = '工種を選んでください';
        document.title = res.genbaName + ' - 図面・書類';
        if (!res.koushu.length) { $('list').innerHTML = '<div class="empty">工種フォルダがまだないよ</div>'; setStatus(''); return; }
        $('list').innerHTML = res.koushu.map(k =>
          '<a class="card" href="' + linkTo('k=' + encodeURIComponent(k.id)) + '">' +
            '<div class="icon folder">工種</div>' +
            '<div><div class="name">' + esc(k.name) + '</div>' +
            '<div class="meta">PDF ' + k.count + ' 件</div></div>' +
            '<div class="chev">›</div>' +
          '</a>').join('');
        setStatus('');
      }).catch(err => setStatus('エラー: ' + err, true));
    }

    // ============================================
    // 画面3: PDF一覧(?k=工種ID / QRを読むとここ)
    // ============================================
    function showFiles(nocache) {
      $('toolbar').innerHTML = '<button onclick="showFiles(true)">更新</button>';
      $('list').innerHTML = '';
      setStatus('読み込み中...');
      api({ action: 'files', folderId: folderId, nocache: !!nocache }).then(res => {
        $('title').textContent = res.koushuName;
        $('subtitle').textContent = res.genbaName + ' ・ タップするとPDFが開きます';
        document.title = res.koushuName + ' - ' + res.genbaName;
        $('toolbar').innerHTML =
          '<a href="' + linkTo('g=' + encodeURIComponent(res.genbaId)) + '">他の工種</a>' +
          '<button onclick="showFiles(true)">更新</button>';
        if (!res.files.length) { $('list').innerHTML = '<div class="empty">まだPDFがありません</div>'; setStatus(''); return; }
        $('list').innerHTML = res.files.map(f =>
          '<a class="card" href="https://drive.google.com/file/d/' + encodeURIComponent(f.id) + '/view" target="_blank" rel="noopener">' +
            '<div class="icon pdf">PDF</div>' +
            '<div><div class="name">' + esc(f.name) + '</div>' +
            '<div class="meta">' + esc(f.updated) + (f.size ? ' ・ ' + fmtSize(f.size) : '') + '</div></div>' +
            '<div class="chev">›</div>' +
          '</a>').join('');
        setStatus('');
      }).catch(err => setStatus('エラー: ' + err, true));
    }

    // ============================================
    // 画面4: QRシート(?qr&g=現場ID / 印刷用・工種ごとに1枚)
    // ============================================
    function showQr() {
      $('title').textContent = 'QRシート';
      $('subtitle').textContent = '工種ごとのQR。印刷して現場に貼る。PDFを追加してもQRはそのまま使える';
      $('toolbar').innerHTML =
        '<a href="' + linkTo('g=' + encodeURIComponent(genbaId)) + '">戻る</a>' +
        '<button class="primary" onclick="window.print()">印刷する</button>';
      $('list').innerHTML = '';
      setStatus('読み込み中...');
      api({ action: 'koushu', genbaId: genbaId, nocache: true }).then(res => {
        if (!res.koushu.length) { $('list').innerHTML = '<div class="empty">工種フォルダがまだないよ</div>'; setStatus(''); return; }
        const head = document.createElement('div');
        head.className = 'qr-head';
        head.textContent = res.genbaName + ' 図面・書類QR';
        $('list').appendChild(head);
        const grid = document.createElement('div');
        grid.className = 'qr-grid';
        res.koushu.forEach((k, i) => {
          const url = linkTo('k=' + encodeURIComponent(k.id));
          const card = document.createElement('div');
          card.className = 'qr-card';
          card.innerHTML =
            '<div class="qr" id="qr' + i + '"></div>' +
            '<div class="genba">' + esc(res.genbaName) + '</div>' +
            '<div class="title">' + esc(k.name) + '</div>' +
            '<div class="hint">スマホのカメラで読むと図面が見れます</div>' +
            '<div class="url">' + esc(url) + '</div>';
          grid.appendChild(card);
          new QRCode(card.querySelector('#qr' + i), {
            text: url, width: 180, height: 180,
            correctLevel: QRCode.CorrectLevel.M,
          });
        });
        $('list').appendChild(grid);
        setStatus('');
      }).catch(err => setStatus('エラー: ' + err, true));
    }

    // ============================================
    // 起動
    // ============================================
    if (qrMode && genbaId) showQr();
    else if (folderId) showFiles();
    else if (genbaId) showKoushu();
    else showGenba();
  </script>
</body>
</html>
