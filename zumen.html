<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>図面・書類</title><meta name="color-scheme" content="light dark"><script>try{var t=localStorage.getItem('officeTheme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;document.documentElement.dataset.design=localStorage.getItem('zumen_design')||'site';}catch(e){document.documentElement.dataset.design='site';}</script>
  <style>
:root{color-scheme:light;--bg:#f1f4f8;--paper:#fff;--field:#f6f8fb;--ink:#1e3049;--sub:#68798d;--line:#dce4ed;--accent:#285fd0;--soft:#eaf0ff;--danger:#b63739;--grid:transparent;--radius:15px;--hero:#18365d;--shadow:0 6px 24px #19375708}
html[data-design="site"]{--bg:#f2f1ec;--paper:#fffefa;--field:#f5f4ef;--ink:#24333a;--sub:#66747a;--line:#d8ddda;--accent:#b9511f;--soft:#fff0df;--grid:#263d4d08;--radius:7px;--hero:#263b44}
html[data-theme="dark"]{color-scheme:dark;--bg:#101923;--paper:#192736;--field:#14212d;--ink:#e9f0f7;--sub:#a4b5c6;--line:#344556;--accent:#99bcff;--soft:#253e60;--hero:#162b43;--danger:#ffa4a1}
html[data-theme="dark"][data-design="site"]{--bg:#182022;--paper:#202d31;--field:#1b2629;--ink:#edf2ef;--sub:#afbfbf;--line:#405153;--accent:#ffb377;--soft:#463528;--hero:#213238;--grid:#b3d9cd07}
@media(prefers-color-scheme:dark){html:not([data-theme]){color-scheme:dark;--bg:#101923;--paper:#192736;--field:#14212d;--ink:#e9f0f7;--sub:#a4b5c6;--line:#344556;--accent:#99bcff;--soft:#253e60;--hero:#162b43;--danger:#ffa4a1}html:not([data-theme])[data-design="site"]{--bg:#182022;--paper:#202d31;--field:#1b2629;--ink:#edf2ef;--sub:#afbfbf;--line:#405153;--accent:#ffb377;--soft:#463528;--hero:#213238;--grid:#b3d9cd07}}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);line-height:1.65}.wrap{max-width:1000px;margin:auto;padding:26px 28px 42px}.masthead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.brand{font-size:11px;font-weight:750;letter-spacing:.14em;display:flex;align-items:center;gap:9px}.brand svg{color:var(--accent);width:25px;height:25px}.settings{display:flex;align-items:center;gap:8px}.settings button,.settings select{font:inherit;font-size:11px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--sub);min-height:35px}.settings button[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:700}.settings select{max-width:98px}.hero{position:relative;overflow:hidden;background:var(--hero);color:#f5f8fa;border-radius:var(--radius);padding:30px 32px;margin-bottom:22px;border:1px solid #ffffff12}.hero::after{content:"";position:absolute;width:160px;height:160px;right:-10px;top:-24px;border:1px solid #ffffff17;transform:rotate(25deg);pointer-events:none}.hero-kicker{font-size:10px;letter-spacing:.2em;color:#bfced7;margin-bottom:7px}.hero h1{font-size:clamp(25px,4vw,36px);line-height:1.45;letter-spacing:.02em;position:relative;z-index:1;overflow-wrap:anywhere}.sub{font-size:13px;color:#d1dce2;margin-top:9px;position:relative;z-index:1}.sub:empty{display:none}.hero-badge{display:inline-block;font-size:10px;padding:3px 8px;border:1px solid #ffffff30;border-radius:3px;color:#d5e1e5;margin-top:18px}html[data-design="site"] .hero{border-top:4px solid #e99245}html[data-design="site"] .hero::before{content:"";position:absolute;right:26px;bottom:20px;width:104px;height:7px;background:repeating-linear-gradient(135deg,#eab360 0,#eab360 7px,transparent 7px,transparent 14px);opacity:.65}.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.list-label{font-size:12px;color:var(--sub);font-weight:600}.toolbar{display:flex;gap:8px}.toolbar:empty{display:none}.toolbar button,.toolbar a{padding:10px 16px;font:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);text-align:center;text-decoration:none;cursor:pointer}.toolbar .primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}#list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}#list>.empty,#list>.form,#list>.qr-opts,#list>.qr-grid,#list>.qr-head{grid-column:1 / -1}.card{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);text-decoration:none;color:inherit;min-width:0;transition:background .15s,border-color .15s}.card>div:nth-child(2){min-width:0;flex:1}a.card:hover{border-color:var(--accent);background:var(--field)}.icon{flex:0 0 46px;height:52px;display:grid;place-items:center;font-size:11px;font-weight:800;border-radius:6px;letter-spacing:.03em}.icon.folder{background:var(--soft);color:var(--accent);border:1px solid var(--line)}.icon.pdf{background:var(--field);color:var(--ink);border:1px solid var(--line);border-top:3px solid var(--accent)}.name{font-size:16px;font-weight:700;overflow-wrap:anywhere;line-height:1.65}.meta{font-size:11px;color:var(--sub);margin-top:6px;overflow-wrap:anywhere}.chev{margin-left:auto;color:var(--accent);font-size:23px}.empty{text-align:center;color:var(--sub);padding:46px 22px;background:var(--paper);border:1px dashed var(--line);border-radius:var(--radius);font-size:14px;line-height:2}.guide-art{display:grid;place-items:center;width:66px;height:66px;margin:0 auto 20px;background:var(--soft);color:var(--accent);border-radius:12px}.guide-art svg{width:38px;height:38px}.guide-title{display:block;font-size:19px;color:var(--ink);margin-bottom:10px}.guide-steps{font-size:12px;margin-top:18px;color:var(--sub)}#status{font-size:13px;color:var(--sub);padding:14px 0;overflow-wrap:anywhere}#status:empty{display:none}#status.ng{color:var(--danger)}.form{max-width:560px;width:100%;margin:auto;padding:28px}.form h2{font-size:19px;margin-bottom:8px}.form p{font-size:12px;color:var(--sub);margin-bottom:22px}.form label{display:block;font-size:12px;font-weight:700;margin-bottom:8px;color:var(--sub)}.form input{width:100%;padding:13px 14px;font:inherit;font-size:16px;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:7px;margin-bottom:16px;outline:0}.form input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}.form button{width:100%;padding:14px;font:inherit;font-size:14px;font-weight:700;border:1px solid var(--accent);border-radius:7px;background:var(--accent);color:var(--paper);cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.qr-head{display:none}.qr-grid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:16px}.qr-opts{display:flex;gap:10px;padding:15px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius)}.qr-opts select{flex:1;min-width:0;padding:10px;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink)}.qr-card{min-width:0;background:#fff;color:#20313a;border:1.5px solid #293f48;border-top:5px solid #db8c39;border-radius:4px;padding:16px 10px;text-align:center;break-inside:avoid}.qr-card .qr{display:flex;justify-content:center;background:#fff;margin:0 auto 10px;padding:12px;width:100%;max-width:204px}.qr-card .qr img,.qr-card .qr canvas{max-width:100%;width:180px;height:auto!important;aspect-ratio:1}.qr-card .title{font-size:clamp(13px,2vw,22px);font-weight:800;overflow-wrap:anywhere;line-height:1.5}.qr-card .hint{font-size:10px;color:#53636b;margin-top:7px}.qr-card .url{font-size:8px;color:#65737b;margin-top:8px;overflow-wrap:anywhere}.footer{text-align:center;font-size:10px;letter-spacing:.15em;color:var(--sub);border-top:1px solid var(--line);padding-top:22px;margin-top:30px}
@media(max-width:650px){.wrap{padding:20px 14px 30px}.masthead{align-items:flex-start;flex-direction:column;gap:14px}.settings{width:100%;gap:6px}.settings button{flex:1}.settings select{flex:1}.hero{padding:24px 21px}.hero h1{font-size:28px}.sub{font-size:12px}.hero-badge{margin-top:14px}#list{grid-template-columns:1fr;gap:10px}.card{padding:18px 16px}.list-head{align-items:flex-start;flex-wrap:wrap}.toolbar button,.toolbar a{padding:10px 12px}.qr-grid{gap:7px}.qr-card{padding:10px 4px;border-top-width:4px}.qr-card .qr{padding:7px;margin-bottom:5px}.qr-card .hint,.qr-card .url{font-size:8px}.qr-card .title{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{html,body{color-scheme:light;background:#fff!important;color:#000!important}.wrap{max-width:none;padding:0;margin:0}.masthead,.hero,.list-head,#status,.qr-opts,.footer{display:none!important}#list{display:block}.qr-head{display:block;font-size:18px;font-weight:700;margin-bottom:8mm;color:#000}.qr-grid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:6mm}.qr-card{page-break-inside:avoid;break-inside:avoid;border:1px solid #222;border-top:2mm solid #222;border-radius:0;padding:4mm 2mm;box-shadow:none;color:#000;background:#fff}.qr-card .qr{padding:2.5mm;max-width:55mm;margin-bottom:2mm}.qr-card .qr img,.qr-card .qr canvas{width:180px;max-width:100%;height:auto!important}.qr-card .title{font-size:14pt}.qr-card .hint{font-size:8pt;color:#333}.qr-card .url{font-size:6pt;color:#555}}
</style>

<body>
<main class="wrap"><div class="masthead"><div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 20V5h11v15M9 20v-5h3v5M15 10h5v10M2 20h20M7 8h2m2 0h2M7 11h2m2 0h2M17 13h1m-1 3h1"/></svg>GENBA / DOCUMENTS</div><div class="settings" role="group" aria-label="デザイン設定"><button type="button" data-design-value="standard">いつものブルー</button><button type="button" data-design-value="site">現場オレンジ</button><select id="themeMode" aria-label="表示モード"><option value="auto">自動</option><option value="light">ライト</option><option value="dark">ダーク</option></select></div></div><header class="hero"><div class="hero-kicker">SITE DOCUMENT CENTER</div><h1 id="title">図面・書類</h1><div class="sub" id="subtitle"></div><span class="hero-badge">現場で確認、すぐに作業へ。</span></header><div class="list-head"><div class="list-label" id="listLabel">現場の図面・書類を確認</div><div class="toolbar" id="toolbar"></div></div><div id="list"></div><div id="status" role="status" aria-live="polite"></div><footer class="footer">GENBA OFFICE / DRAWINGS & DOCUMENTS</footer></main>
  <style id="pageStyle">@media print { @page { size: A4; margin: 12mm; } }</style>

  <script>
    // ============================================
    // 設定
    // ============================================
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwpfJgmDkLnsplwMtsXkNEOP30Y08HDVrr-uzy5sKAGxlCqs0-Fkz17fNB84PTKKUGONg/exec';

    const SELF_URL = location.origin + location.pathname;

    // URL: ?k=工種ID=PDF一覧(職人・QR用) / ?admin=管理画面(工種一覧) / ?admin&qr=QRシート / なし=案内だけ
    const params = new URLSearchParams(location.search);
    const folderId = params.get('k');
    const adminMode = params.has('admin');
    const qrMode = params.has('qr');
    const $ = id => document.getElementById(id);

    let adminKey = sessionStorage.getItem('zumen_admin_key') || '';

    function setStatus(msg, ng) {
      const el = $('status');
      el.textContent = msg || '';
      el.className = ng ? 'ng' : '';
    }

    function api(req) {
      const q = Object.keys(req).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(req[k])).join('&');
      return fetch(GAS_URL + '?' + q)
        .then(r => r.json())
        .then(res => {
          if (!res.ok) throw res.error;
          if (!res.result) throw 'GASから結果が返ってこなかった(デプロイが古い可能性)';
          return res.result;
        });
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function linkTo(q) { return SELF_URL + (q ? '?' + q : ''); }

    // ============================================
    // 職人用: 工種内のPDF一覧(QRを読むとここ / ここから他へは行けない)
    //   前回の結果をスマホに覚えておいて即表示 → 裏で最新を取りに行く
    // ============================================
    const LS_KEY = 'zumen_files_' + folderId;

    function renderFiles(res, fromCache) {
      $('title').textContent = res.koushuName; $('listLabel').textContent = '図面・書類 / ' + res.files.length + '件';
      $('subtitle').textContent = 'タップするとPDFが開きます';
      document.title = res.koushuName + ' - 図面・書類';
      if (!res.files.length) { $('list').innerHTML = '<div class="empty">まだPDFがありません</div>'; return; }
      $('list').innerHTML = res.files.map(f =>
        '<a class="card" href="https://drive.google.com/file/d/' + encodeURIComponent(f.id) + '/view" target="_blank" rel="noopener">' +
          '<div class="icon pdf">PDF</div>' +
          '<div><div class="name">' + esc(f.name) + '</div>' +
          '<div class="meta">' + esc(f.updated) + '</div></div>' +
          '<div class="chev">›</div>' +
        '</a>').join('');
    }

    function showFiles(force) {
      $('toolbar').innerHTML = '<button onclick="showFiles(true)">更新</button>';
      let hadCache = false;
      if (!force) {
        try {
          const c = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
          if (c && c.files) { renderFiles(c, true); hadCache = true; }
        } catch (e) {}
      }
      setStatus(hadCache ? '最新を確認中...' : '読み込み中...');
      api({ action: 'files', folderId: folderId, nocache: force ? 1 : 0 }).then(res => {
        renderFiles(res, false);
        try { localStorage.setItem(LS_KEY, JSON.stringify(res)); } catch (e) {}
        setStatus('');
      }).catch(err => setStatus(hadCache ? '' : 'エラー: ' + err, true));
    }

    // ============================================
    // パラメータ無し: 案内だけ
    // ============================================
    function showGuide() {
      $('title').textContent = '図面・書類';
      $('list').innerHTML = '<div class="empty"><span class="guide-art" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 10V2h8m12 0h8v8M2 22v8h8m12 0h8v-8M8 8h5v5H8zM19 8h5v5h-5zM8 19h5v5H8zM19 19h5v5h-5z"/></svg></span><strong class="guide-title">QRから、必要な図面へ。</strong>現場に貼ってあるQRコードを<br>スマホのカメラで読み取ってください<div class="guide-steps">カメラを向ける → リンクを開く → 図面を選ぶ</div></div>';
    }

    // ============================================
    // 管理: 合言葉
    // ============================================
    function showLogin(msg) {
      $('title').textContent = '管理画面'; $('listLabel').textContent = '管理者向け';
      $('subtitle').textContent = '';
      $('toolbar').innerHTML = '';
      $('list').innerHTML =
        '<div class="card form" style="display:block">' +
          '<h2>管理者ログイン</h2><p>工種一覧の確認・QRシートの印刷はこちら。</p><label for="keyInput">合言葉</label>' +
          '<input id="keyInput" type="password" placeholder="管理用の合言葉" onkeydown="if(event.key===\'Enter\')doLogin()">' +
          '<button onclick="doLogin()">管理画面を開く</button>' +
        '</div>';
      setStatus(msg || '', !!msg);
      $('keyInput').focus();
    }

    function doLogin() {
      const k = $('keyInput').value.trim();
      if (!k) return setStatus('合言葉を入れて', true);
      adminKey = k;
      setStatus('確認中...');
      api({ action: 'koushu', key: adminKey, nocache: 0 }).then(res => {
        sessionStorage.setItem('zumen_admin_key', adminKey);
        qrMode ? renderQr(res) : renderKoushu(res);
      }).catch(err => { adminKey = ''; showLogin('エラー: ' + err); });
    }

    function adminFail(err) {
      adminKey = ''; sessionStorage.removeItem('zumen_admin_key');
      showLogin('エラー: ' + err);
    }

    // ============================================
    // 管理: 工種一覧
    // ============================================
    function showKoushu(nocache) {
      if (!adminKey) return showLogin();
      setStatus('読み込み中...');
      $('list').innerHTML = '';
      api({ action: 'koushu', key: adminKey, nocache: nocache ? 1 : 0 }).then(renderKoushu).catch(adminFail);
    }

    function renderKoushu(res) {
      $('title').textContent = '管理画面';
      $('subtitle').textContent = res.rootName || ''; $('listLabel').textContent = '工種一覧 / ' + res.koushu.length + '工種';
      $('toolbar').innerHTML =
        '<button onclick="showKoushu(true)">更新</button>' +
        '<a href="' + linkTo('admin&qr') + '">QRシート</a>';
      if (!res.koushu.length) { $('list').innerHTML = '<div class="empty">工種フォルダはまだありません</div>'; setStatus(''); return; }
      $('list').innerHTML = res.koushu.map(k =>
        '<a class="card" href="' + linkTo('k=' + encodeURIComponent(k.id)) + '" target="_blank" rel="noopener">' +
          '<div class="icon folder">工種</div>' +
          '<div><div class="name">' + esc(k.name) + '</div>' +
          '<div class="meta">職人が見る画面を開く</div></div>' +
          '<div class="chev">›</div>' +
        '</a>').join('');
      setStatus('');
    }

    // ============================================
    // 管理: QRシート(QRライブラリはここでだけ読み込む)
    // ============================================
    function loadQrLib() {
      return new Promise((ok, ng) => {
        if (window.QRCode) return ok();
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
        s.onload = ok; s.onerror = () => ng('QRライブラリが読めなかった');
        document.head.appendChild(s);
      });
    }

    function showQr() {
      if (!adminKey) return showLogin();
      setStatus('読み込み中...');
      $('list').innerHTML = '';
      api({ action: 'koushu', key: adminKey, nocache: 1 }).then(renderQr).catch(adminFail);
    }

    function renderQr(res) {
      $('title').textContent = 'QRシート'; $('listLabel').textContent = '現場掲示用 / ' + res.koushu.length + '工種';
      $('subtitle').textContent = '工種ごとのQR。印刷して現場に貼る。PDFを追加してもQRはそのまま使える';
      $('toolbar').innerHTML =
        '<a href="' + linkTo('admin') + '">管理画面に戻る</a>' +
        '<button class="primary" onclick="window.print()">印刷する</button>';
      $('list').innerHTML = '';
      if (!res.koushu.length) { $('list').innerHTML = '<div class="empty">工種フォルダはまだありません</div>'; setStatus(''); return; }
      const opts = document.createElement('div');
      opts.className = 'qr-opts';
      opts.innerHTML =
        '<select aria-label="印刷用紙" id="paperSel" onchange="applyQrOpts()">' +
          '<option value="A4">用紙 A4</option><option value="A3">用紙 A3</option>' +
          '<option value="A4 landscape">A4 横</option><option value="A3 landscape">A3 横</option>' +
        '</select>' +
        '<select aria-label="QRシートの列数" id="colsSel" onchange="applyQrOpts()">' +
          '<option value="2">2列</option><option value="3">3列</option><option value="4">4列</option><option value="5">5列</option>' +
        '</select>';
      $('list').appendChild(opts);
      try {
        const p = localStorage.getItem('zumen_paper'), c = localStorage.getItem('zumen_cols');
        if (p) $('paperSel').value = p;
        if (c) $('colsSel').value = c;
      } catch (e) {}
      loadQrLib().then(() => {
        const head = document.createElement('div');
        head.className = 'qr-head';
        head.textContent = (res.rootName || '') + ' 図面・書類QR';
        $('list').appendChild(head);
        const grid = document.createElement('div');
        grid.className = 'qr-grid';
        res.koushu.forEach((k, i) => {
          const url = linkTo('k=' + encodeURIComponent(k.id));
          const card = document.createElement('div');
          card.className = 'qr-card';
          card.innerHTML =
            '<div class="qr" id="qr' + i + '"></div>' +
            '<div class="title">' + esc(k.name) + '</div>' +
            '<div class="hint">スマホのカメラで読むと図面が見れます</div>' +
            '<div class="url">' + esc(url) + '</div>';
          grid.appendChild(card);
          new QRCode(card.querySelector('#qr' + i), {
            text: url, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M,
          });
        });
        $('list').appendChild(grid);
        applyQrOpts();
        setStatus('');
      }).catch(err => setStatus('エラー: ' + err, true));
    }

    // 用紙・列数の切り替え(選んだ内容はスマホに覚えておく)
    function applyQrOpts() {
      const paper = $('paperSel') ? $('paperSel').value : (localStorage.getItem('zumen_paper') || 'A4');
      const cols  = $('colsSel')  ? $('colsSel').value  : (localStorage.getItem('zumen_cols')  || '2');
      $('pageStyle').textContent = '@media print { @page { size: ' + paper + '; margin: 12mm; } }';
      document.documentElement.style.setProperty('--cols', cols);
      try { localStorage.setItem('zumen_paper', paper); localStorage.setItem('zumen_cols', cols); } catch (e) {}
    }
    // 前回の選択を復元
    (function () {
      const p = localStorage.getItem('zumen_paper'), c = localStorage.getItem('zumen_cols');
      document.addEventListener('DOMContentLoaded', () => {
        if ($('paperSel') && p) $('paperSel').value = p;
        if ($('colsSel') && c) $('colsSel').value = c;
      });
    })();

    function setDesign(v){if(!['standard','site'].includes(v))v='site';document.documentElement.dataset.design=v;document.querySelectorAll('[data-design-value]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.designValue===v)));try{localStorage.setItem('zumen_design',v);}catch(e){}}
    function setTheme(v){if(!['auto','light','dark'].includes(v))v='auto';if(v==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=v;$('themeMode').value=v;try{localStorage.setItem('officeTheme',v);}catch(e){}}
    setDesign(document.documentElement.dataset.design||'site');setTheme(localStorage.getItem('officeTheme')||'auto');
    document.querySelectorAll('[data-design-value]').forEach(b=>b.addEventListener('click',()=>setDesign(b.dataset.designValue)));
    $('themeMode').addEventListener('change',()=>setTheme($('themeMode').value));
    // ============================================
    // 起動
    // ============================================
    if (folderId) showFiles();
    else if (adminMode && qrMode) showQr();
    else if (adminMode) showKoushu();
    else showGuide();
  </script>
</body>
</html>
