<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>グループメールの宛先を暗号化</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7;
      --field: #ffffff;
      --ink: #1f2328;
      --muted: #5f6670;
      --line: #d0d5dc;
      --btn: #2f5fb3;
      --btn-ink: #ffffff;
      --error: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --field: #20242a;
        --ink: #eceff3;
        --muted: #a3aab4;
        --line: #3a4048;
        --btn: #7aa5f0;
        --btn-ink: #10141b;
        --error: #ff9b93;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: var(--ink);
      background: var(--bg);
    }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 40px; }
    h1 { font-size: 22px; margin-bottom: 6px; }
    p { color: var(--muted); margin-bottom: 16px; }
    label { display: block; font-weight: 700; margin: 20px 0 6px; }
    textarea {
      width: 100%;
      padding: 12px;
      font: 16px/1.6 ui-monospace, Consolas, monospace;
      color: var(--ink);
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    #src { min-height: 240px; }
    #out { min-height: 120px; word-break: break-all; }
    button {
      width: 100%;
      min-height: 56px;
      margin-top: 12px;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      color: var(--btn-ink);
      background: var(--btn);
      border: 0;
      border-radius: 12px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: wait; }
    #msg { margin-top: 12px; }
    #msg.ng { color: var(--error); }
    #msg:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>宛先の暗号化</h1>
    <p>グループメールの宛先を直すページです。事務所ツールにオーナーでログインしているときだけ使えます。</p>

    <label for="src">グループとアドレス</label>
    <textarea id="src" spellcheck="false">{ name: "グループA", emails: ["aaa@example.com", "bbb@example.com"] },
{ name: "グループB", emails: ["ccc@example.com"] }</textarea>
    <button id="encBtn" type="button">暗号化する</button>
    <p id="msg" role="status"></p>

    <label for="out">group-mail.html の data の行をこれに貼り替える</label>
    <textarea id="out" readonly></textarea>
    <button id="copyBtn" type="button">コピー</button>
  </main>
  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxKW8JNfxJs2HLOGGRZVWvSgUhsDG-oLFT0Bw0osTJy6wqtc4Ngtg9s_36py_Ae39_J/exec";

    const $ = id => document.getElementById(id);
    function setMsg(text, ng) { $("msg").textContent = text; $("msg").className = ng ? "ng" : ""; }

    const params = new URLSearchParams(location.search);
    let token = params.get("lt") || "";
    if (token) history.replaceState(null, "", location.pathname);
    if (!token) { try { token = localStorage.getItem("officeToken") || ""; } catch (e) { token = ""; } }

    function toBase64(bytes) {
      let s = "";
      for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
      return btoa(s);
    }
    function fromBase64(s) {
      const bin = atob(s);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    async function aesKey(keyText) {
      const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(keyText));
      return crypto.subtle.importKey("raw", hash, "AES-GCM", false, ["encrypt", "decrypt"]);
    }

    async function getKey() {
      if (!token) throw new Error("事務所ツールにオーナーでログインしてから開いてください。");
      const res = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: "groupMailKey", token: token, forEdit: true })
      });
      const r = await res.json();
      if (!r.ok) throw new Error(r.error);
      return r.result.key;
    }

    // { name: "…", emails: [...] } の形をそのまま読めるようにする
    function parseGroups(text) {
      let t = text.trim();
      if (!t.startsWith("[")) t = "[" + t + "]";
      t = t.replace(/\bname\s*:/g, '"name":').replace(/\bemails\s*:/g, '"emails":').replace(/,\s*([\]}])/g, "$1");
      let groups;
      try { groups = JSON.parse(t); } catch (e) { throw new Error("書き方が違う所があります。カッコ・カンマ・\" を確認してください。"); }
      groups.forEach(g => {
        if (!g || typeof g.name !== "string" || !g.name || !Array.isArray(g.emails) || !g.emails.length) {
          throw new Error("name と emails がそろっていないグループがあります。");
        }
        g.emails.forEach(m => {
          if (typeof m !== "string" || !/^[^\s@,]+@[^\s@,]+$/.test(m)) throw new Error("アドレスの形がおかしい所があります: " + m);
        });
      });
      return groups;
    }

    function showGroups(groups) {
      $("src").value = groups.map(g =>
        "{ name: " + JSON.stringify(g.name) + ", emails: [" + g.emails.map(m => JSON.stringify(m)).join(", ") + "] }"
      ).join(",\n");
    }

    // 今の group-mail.html の宛先を読み込んで、直せるようにする
    async function loadCurrent() {
      try {
        const html = await fetch("group-mail.html", { cache: "no-store" }).then(r => r.text());
        const m = html.match(/const data = "([^"]*)";/);
        if (!m || !m[1]) return;
        const key = await aesKey(await getKey());
        const bytes = fromBase64(m[1]);
        const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.slice(0, 12) }, key, bytes.slice(12));
        showGroups(JSON.parse(new TextDecoder().decode(plain)));
        setMsg("今の宛先を読み込みました。");
      } catch (e) {
        setMsg(e.message || "今の宛先を読み込めませんでした。", true);
      }
    }

    $("encBtn").addEventListener("click", async () => {
      $("encBtn").disabled = true;
      try {
        const groups = parseGroups($("src").value);
        const key = await aesKey(await getKey());
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, new TextEncoder().encode(JSON.stringify(groups))));
        const all = new Uint8Array(iv.length + ct.length);
        all.set(iv); all.set(ct, iv.length);
        $("out").value = 'const data = "' + toBase64(all) + '";';
        setMsg("できました。下の行をコピーして、group-mail.html の data の行と貼り替えてください。");
      } catch (e) {
        setMsg(e.message || String(e), true);
      } finally {
        $("encBtn").disabled = false;
      }
    });

    $("copyBtn").addEventListener("click", () => {
      if (!$("out").value) return;
      navigator.clipboard.writeText($("out").value).then(() => {
        $("copyBtn").textContent = "コピーしました";
        setTimeout(() => { $("copyBtn").textContent = "コピー"; }, 1200);
      });
    });

    loadCurrent();
  </script>
</body>
</html>
