const GROUPS=[...new Set(DATA.map(r=>r.g))];
const $=id=>document.getElementById(id);
let grp="";
const norm=s=>(s||"").normalize("NFKC").toLowerCase().replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function hl(text,terms){
  let html=esc(text);
  html=html.replace(/【追記】/g,'<span class="tag">追記</span>').replace(/【削除:([^】]*)】/g,'<span class="tag del">$1</span>');
  if(!terms.length) return html;
  // highlight outside tags
  return html.split(/(<[^>]+>)/).map(seg=>{
    if(seg.startsWith("<")) return seg;
    let out=seg;
    for(const t of terms){
      if(!t) continue;
      const re=new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
      out=out.replace(re,m=>"\u0001"+m+"\u0002");
    }
    return out.replace(/\u0001/g,"<mark>").replace(/\u0002/g,"</mark>");
  }).join("");
}
function render(){
  const raw=$("q").value.trim();
  const terms=raw.split(/\s+/).filter(Boolean);
  const nterms=terms.map(norm);
  let rows=DATA.filter(r=>!grp||r.g===grp);
  if(nterms.length){
    rows=rows.filter(r=>{
      const hay=norm(r.k+" "+r.c+" "+r.d+" "+r.g+" "+r.n);
      return nterms.every(t=>hay.includes(t));
    });
  }
  $("meta").innerHTML=`<strong>${rows.length}</strong> 件 <span>／ 全${DATA.length}件</span>`;
  $("result-title").textContent=grp || (raw ? "検索結果" : "すべての工種");
  if(!rows.length){$("list").innerHTML='<div class="none"><strong>該当する工種が見つかりません</strong>キーワードを短くするか、工事区分を変更してください。</div>';return;}
  $("list").innerHTML=rows.map(r=>`
    <div class="card">
      <div class="top">
        <span class="code">${hl(r.c,terms)}</span>
        <span class="name">${hl(r.k,terms)}</span>
        <span class="grp">${hl(r.g,terms)}<span>#${r.n}</span></span>
      </div>
      <p class="desc${r.d?"":" empty"}">${r.d?hl(r.d,terms):"(内訳の記載なし)"}</p>
    </div>`).join("")+
    '<div class="hint">スペース区切りでAND検索。カナ/英数字は全角半角どちらでも可</div>';
}
function chips(){
  $("chips").innerHTML=["",...GROUPS].map(g=>`<button type="button" class="chip${grp===g?" on":""}" data-g="${g}" aria-pressed="${grp===g}"><span>${g||"すべての工種"}</span><span class="count">${g?DATA.filter(r=>r.g===g).length:DATA.length}</span></button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{grp=b.dataset.g;chips();render(); if(matchMedia('(max-width:800px)').matches) $("categories").open=false;});
}
const mobileLayout=matchMedia('(max-width:800px)');
$("categories").open=!mobileLayout.matches;
mobileLayout.addEventListener('change',e=>{$("categories").open=!e.matches;});
$("q").addEventListener("input",render);
$("clr").onclick=()=>{$("q").value="";grp="";chips();render();$("q").focus();};
chips();render();
</script>
