<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex,nofollow">
<title>リンク集</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#1B2A3A; --muted:#5F6E7D; --line:#D3DAE1;
  --field:#F7F9FB; --main:#2F6DB5; --main-ink:#FFFFFF; --danger:#C4523F;
  --t0:#2F6DB5; --t1:#2E8B6A; --t2:#C9961A; --t3:#C4523F; --t4:#7A5BB0; --t5:#4F6475;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141B23; --surface:#1E2731; --ink:#E8EDF2; --muted:#9AA8B5; --line:#33404D;
    --field:#18202A; --main:#5B9BE6; --main-ink:#0E1620; --danger:#E27D6B;
    --t0:#5B9BE6; --t1:#4FB893; --t2:#E0B341; --t3:#E27D6B; --t4:#A58BDB; --t5:#8FA3B5;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:16px; line-height:1.6; -webkit-text-size-adjust:100%;
}
.wrap{max-width:960px; margin:0 auto; padding:16px 14px 80px}
header{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px}
h1{font-size:22px; margin:0; letter-spacing:.02em}
h1 small{font-size:13px; font-weight:700; color:var(--muted); margin-left:8px}
h2{font-size:15px; margin:22px 0 8px; color:var(--muted); font-weight:700; display:flex; align-items:center; gap:8px}
h2 .dot{width:10px; height:10px; border-radius:2px; background:var(--tab)}
button,input,textarea{font:inherit; color:inherit}
button{cursor:pointer}
button:disabled{opacity:.5; cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{
  outline:3px solid var(--main); outline-offset:2px;
}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px}
label{display:block; font-size:13px; color:var(--muted); margin-bottom:3px}
input[type=text],input[type=password],input[type=search],textarea{
  width:100%; min-height:48px; padding:10px 12px; border-radius:8px;
  border:1px solid var(--line); background:var(--field); color:var(--ink);
}
textarea{min-height:110px; font-size:14px; font-family:ui-monospace,Consolas,monospace}
.btn{
  min-height:48px; padding:0 18px; border-radius:8px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); font-weight:700; white-space:nowrap;
}
.btn.main{background:var(--main); color:var(--main-ink); border-color:var(--main)}
.btn.small{min-height:40px; padding:0 12px; font-size:14px}
.btn.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.hint{font-size:13px; color:var(--muted); margin:8px 0 0}
.grid{display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); align-items:start}
@media (min-width:700px){ .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))} }
.card{position:relative}
.link{
  display:flex; align-items:center; gap:10px; width:100%; min-height:72px;
  padding:10px 12px 10px 18px; text-align:left; text-decoration:none;
  background:var(--surface); color:var(--ink);
  border:1px solid var(--line); border-radius:10px; overflow:hidden; position:relative;
}
.link::before{content:""; position:absolute; left:0; top:0; bottom:0; width:8px; background:var(--tab)}
.link:hover{border-color:var(--tab)}
.link:active{transform:translateY(1px)}
.hasid .link{border-bottom-left-radius:0; border-bottom-right-radius:0}
.ini{
  flex:none; width:36px; height:36px; border-radius:8px; display:grid; place-items:center;
  background:var(--tab); color:var(--surface); font-weight:700; font-size:17px;
}
.txt{min-width:0}
.name{font-weight:700; font-size:16px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word}
.host{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block}
.idbtn{
  display:flex; align-items:center; gap:6px; width:100%; min-height:40px; padding:0 12px 0 18px;
  background:var(--field); color:var(--ink); border:1px solid var(--line); border-top:none;
  border-radius:0 0 10px 10px; font-size:13px; text-align:left; position:relative; overflow:hidden;
}
.idbtn::before{content:""; position:absolute; left:0; top:0; bottom:0; width:8px; background:var(--tab); opacity:.45}
.idbtn .idval{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:ui-monospace,Consolas,monospace}
.idbtn .idact{flex:none; font-weight:700; color:var(--muted)}
.idbtn:hover .idact{color:var(--ink)}
.idbtn:not(:last-of-type){border-radius:0}
.empty{text-align:center; color:var(--muted); padding:34px 10px; border:2px dashed var(--line); border-radius:10px; margin-top:18px}
#toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
  background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px;
  font-size:14px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .2s; max-width:90vw;
}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){ #toast{transition:none} .link:active{transform:none} }

/* ===== タブ + アプリ風アイコン表示 ===== */
.tabs{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 8px; margin:16px 0 2px; scrollbar-width:thin}
.tabbtn{flex:none; min-height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px; white-space:nowrap}
.tabbtn .dot{width:9px; height:9px; border-radius:50%; background:var(--tab)}
.tabbtn.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:18px 6px; margin-top:14px}
@media (min-width:700px){ .grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))} }
.tile{position:relative; display:flex; flex-direction:column; align-items:center; gap:5px; min-width:0}
.app{display:flex; flex-direction:column; align-items:center; gap:6px; width:100%; padding:4px 2px; background:none; border:none; color:var(--ink); text-decoration:none; border-radius:12px; text-align:center}
.icon{width:62px; height:62px; border-radius:16px; background:var(--tab); color:var(--surface); display:grid; place-items:center; font-size:27px; font-weight:700; box-shadow:inset 0 -4px 0 rgba(0,0,0,.16)}
.app:active .icon{transform:scale(.94)}
.tname{font-size:12.5px; line-height:1.3; font-weight:700; max-width:100%; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word}
.chips{display:flex; gap:4px}
.chip{min-width:38px; min-height:32px; padding:0 8px; font-size:11.5px; font-weight:700; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--muted)}
.chip:hover{color:var(--ink)}
.tile.private .icon{opacity:.5}
.mine{font-size:11px; color:var(--muted)}
.xbtn{position:absolute; top:-8px; left:calc(50% - 46px); width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--danger); font-weight:700; font-size:16px; line-height:1; display:grid; place-items:center; z-index:1}
.xbtn.sure{background:var(--danger); color:var(--surface); border-color:var(--danger)}
.tile{-webkit-touch-callout:none; -webkit-user-select:none; user-select:none}
.tile .app{-webkit-user-drag:none}
.tile.dragging{opacity:.35}
@media (prefers-reduced-motion:reduce){ .app:active .icon{transform:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">リンク集</h1>
    <button class="btn small" id="reload" type="button">最新にする</button>
  </header>
  <input id="q" type="search" autocomplete="off" aria-label="ボタンを名前で探す" placeholder="名前で探す">
  <div id="tabs" class="tabs" hidden></div>
  <div id="list"><div class="empty">読み込み中…</div></div>
  <p class="hint" id="idHint" style="margin-top:22px" hidden>IDが付いてるボタンは、押すとIDが自動でコピーされるよ。開いた先のID欄に貼り付けて、パスワードはここに戻ってアイコンの下の「PW」を押すとコピーできるよ。</p>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
// ▼▼▼ GASのWebアプリURL(デプロイし直してURLが変わったらここだけ書き換える) ▼▼▼
var GAS_URL = 'https://script.google.com/macros/s/AKfycbz8-TEf6fpPvpaAPAOfi5NOi75zkXBa4GQSgrCe4DZWoIBPQMFuLssYouE12okFwCJc3Q/exec';
// ▲▲▲ ここまで ▲▲▲

(function(){
  'use strict';
  var CACHE = 'linkButtons.view.v2';
  var TABS = 6;
  var DATA = [];
  var list = document.getElementById('list');
  var q = document.getElementById('q');
  var toastTimer;

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text != null) e.textContent = text;
    return e;
  }
  function hostOf(u){
    try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return u; }
  }
  function tabOf(group){
    if(!group) return 0;
    var h = 0;
    for(var i=0;i<group.length;i++){ h = (h*31 + group.charCodeAt(i)) >>> 0; }
    return 1 + (h % (TABS-1));
  }
  function toast(msg){
    var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }
  function copySync(text){
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px';
    document.body.appendChild(ta); ta.select();
    try{ ta.setSelectionRange(0, text.length); }catch(e){}
    var ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
    document.body.removeChild(ta);
    return ok;
  }
  function copy(text, msg){
    if(copySync(text)){ toast(msg); return; }
    var ng = function(){ toast('コピーできなかった。IDを見ながら手で入れてね'); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast(msg); }, ng);
    }else{ ng(); }
  }
  function safeUrl(u){ return /^https?:\/\//i.test(u); }

  var TAB_STORE = 'linkButtons.tab';
  var tab = '__all';
  try{ var t0 = localStorage.getItem(TAB_STORE); if(t0 !== null) tab = t0; }catch(e){}

  function renderTabs(groups){
    var box = document.getElementById('tabs'); box.textContent = '';
    if(!groups.filter(Boolean).length){ box.hidden = true; tab = '__all'; return; }
    box.hidden = false;
    if(tab !== '__all' && groups.indexOf(tab) < 0) tab = '__all';
    function add(val, label, color){
      var b = el('button','tabbtn' + (tab===val ? ' on' : '')); b.type = 'button';
      if(color){ b.style.setProperty('--tab', color); b.appendChild(el('span','dot')); }
      b.appendChild(document.createTextNode(label));
      b.onclick = function(){
        tab = val;
        try{ localStorage.setItem(TAB_STORE, tab); }catch(e){}
        render();
      };
      box.appendChild(b);
    }
    add('__all','すべて',null);
    groups.forEach(function(g){ add(g, g || '未分類', 'var(--t'+tabOf(g)+')'); });
  }

  /* ---------- 自分の端末だけの並び順(ドラッグ&ドロップで変えた順番を覚える) ---------- */
  var ORDER_STORE = 'linkButtons.order';
  var myOrder = [];
  try{ var o0 = JSON.parse(localStorage.getItem(ORDER_STORE) || '[]'); if(Array.isArray(o0)) myOrder = o0; }catch(e){}
  function keyOf(x){ return x.url + '|' + x.name; }
  function ordered(){
    var pos = {}; myOrder.forEach(function(k,i){ pos[k] = i; });
    return DATA.map(function(x,i){ return {x:x, i:i, p:(keyOf(x) in pos) ? pos[keyOf(x)] : 1e9}; })
      .sort(function(a,b){ return (a.p - b.p) || (a.i - b.i); })   // 覚えてないボタン(新しく増えたやつ)は後ろに元の順で
      .map(function(o){ return o.x; });
  }
  function saveOrderFromDom(grid){
    var g = grid.getAttribute('data-group');
    var keys = Array.prototype.map.call(grid.children, function(n){ return n.getAttribute('data-key'); });
    var cur = ordered(), qi = 0;
    myOrder = cur.map(function(x){ return x.group===g ? (keys[qi++] || keyOf(x)) : keyOf(x); });
    try{ localStorage.setItem(ORDER_STORE, JSON.stringify(myOrder)); }catch(e){}
    render();
  }

  function render(){
    var word = (q.value||'').trim().toLowerCase();
    list.textContent = '';
    var all = ordered().filter(function(x){ return safeUrl(x.url); });
    var allGroups = [];
    all.forEach(function(x){ if(allGroups.indexOf(x.group)<0) allGroups.push(x.group); });
    allGroups.sort(function(a,b){ return (a===''?-1:0) - (b===''?-1:0); });
    renderTabs(allGroups);

    var shown = all.filter(function(x){
      if(!word) return true;
      return (x.name+' '+x.group+' '+x.url).toLowerCase().indexOf(word) >= 0;
    });
    if(!shown.length){
      list.appendChild(el('div','empty', word ? '「'+q.value+'」に合うボタンがないよ。' : 'まだボタンが登録されてないよ。'));
      return;
    }
    // 探してるときはタブに関係なく全部から出す
    var viewAll = !!word || tab === '__all';
    var groups = viewAll ? allGroups : [tab];

    groups.forEach(function(g){
      var inG = shown.filter(function(x){ return x.group===g; });
      if(!inG.length) return;
      var color = 'var(--t'+tabOf(g)+')';
      if(viewAll && g){
        var h = el('h2'); h.style.setProperty('--tab', color);
        h.appendChild(el('span','dot')); h.appendChild(document.createTextNode(g));
        list.appendChild(h);
      }
      var grid = el('div','grid'); grid.setAttribute('data-group', g);
      inG.forEach(function(it){
        var t = el('div','tile'); t.style.setProperty('--tab', color);
        t.setAttribute('data-key', keyOf(it));
        if(!word) t.addEventListener('pointerdown', dragStart);   // 探してる最中は並べ替えなし
        var a = el('a','app');
        a.href = it.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.title = it.name + '\n' + it.url;
        a.draggable = false;
        a.appendChild(el('span','icon', Array.from(it.name)[0] || '?'));
        a.appendChild(el('span','tname', it.name));
        if(it.loginId){
          a.addEventListener('click', function(){
            if(suppressClick) return;
            if(copySync(it.loginId)) toast('IDをコピーした。開いた先で貼り付けてね');
          });
        }
        t.appendChild(a);
        if(it.loginId || it.pw){
          var chips = el('div','chips');
          if(it.loginId){
            var ib = el('button','chip','ID'); ib.type='button';
            ib.setAttribute('aria-label', it.name+' のログインIDをコピー');
            ib.onclick = function(){ copy(it.loginId, 'IDをコピーした'); };
            chips.appendChild(ib);
          }
          if(it.pw){
            var pb = el('button','chip','PW'); pb.type='button';
            pb.setAttribute('aria-label', it.name+' のパスワードをコピー');
            pb.onclick = function(){ copy(it.pw, 'パスワードをコピーした'); };
            chips.appendChild(pb);
          }
          t.appendChild(chips);
        }
        grid.appendChild(t);
      });
      list.appendChild(grid);
    });
  }

  /* ---------- ドラッグ&ドロップ並べ替え(スマホ=長押ししてから動かす / PC=そのままドラッグ) ---------- */
  var drag = null, suppressClick = false;
  function dragStart(e){
    if(drag) return;
    if(e.button != null && e.button > 0) return;
    if(e.target.closest && e.target.closest('.chip')) return;
    var t = e.currentTarget;
    drag = {el:t, grid:t.parentNode, x:e.clientX, y:e.clientY, active:false, changed:false,
            touch:e.pointerType !== 'mouse', timer:null};
    if(drag.touch){
      drag.timer = setTimeout(function(){ if(drag && !drag.active) dragActivate(); }, 350);
    }
    window.addEventListener('pointermove', dragMove);
    window.addEventListener('pointerup', dragEnd);
    window.addEventListener('pointercancel', dragEnd);
  }
  function dragActivate(){
    drag.active = true;
    drag.el.classList.add('dragging');
    try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){}
  }
  function dragMove(e){
    if(!drag) return;
    var far = Math.abs(e.clientX-drag.x) + Math.abs(e.clientY-drag.y) > 8;
    if(!drag.active){
      if(drag.touch){ if(far) dragCleanup(); return; }   // 長押し前に動いた = ふつうのスクロール
      if(!far) return;
      dragActivate();
    }
    if(e.cancelable) e.preventDefault();
    var under = document.elementFromPoint(e.clientX, e.clientY);
    var over = (under && under.closest) ? under.closest('.tile') : null;
    if(!over || over === drag.el || over.parentNode !== drag.grid) return;
    var kids = Array.prototype.slice.call(drag.grid.children);
    if(kids.indexOf(drag.el) < kids.indexOf(over)) drag.grid.insertBefore(drag.el, over.nextSibling);
    else drag.grid.insertBefore(drag.el, over);
    drag.changed = true;
  }
  function dragEnd(){
    if(!drag) return;
    var d = drag;
    dragCleanup();
    if(d.active){
      suppressClick = true;                               // 離した瞬間にリンクが開かないように
      setTimeout(function(){ suppressClick = false; }, 400);
      if(d.changed) saveOrderFromDom(d.grid);
    }
  }
  function dragCleanup(){
    if(!drag) return;
    clearTimeout(drag.timer);
    drag.el.classList.remove('dragging');
    window.removeEventListener('pointermove', dragMove);
    window.removeEventListener('pointerup', dragEnd);
    window.removeEventListener('pointercancel', dragEnd);
    drag = null;
  }
  document.addEventListener('touchmove', function(e){ if(drag && drag.active && e.cancelable) e.preventDefault(); }, {passive:false});
  list.addEventListener('click', function(e){ if(suppressClick){ e.preventDefault(); e.stopPropagation(); } }, true);
  list.addEventListener('contextmenu', function(e){ if(e.target.closest && e.target.closest('.tile')) e.preventDefault(); });
  list.addEventListener('dragstart', function(e){ e.preventDefault(); });

  function show(res){
    DATA = (res && res.items) || [];
    var title = (res && res.title) || 'リンク集';
    document.getElementById('title').textContent = title;
    document.title = title;
    document.getElementById('idHint').hidden = !DATA.some(function(x){ return !!(x.loginId || x.pw); });
    render();
  }
  function fail(msg){
    if(DATA.length){ toast('最新にできなかった(前回の内容を表示中)'); return; }
    list.textContent = '';
    list.appendChild(el('div','empty', msg));
  }

  function loadData(){
    if(!GAS_URL){ fail('まだ準備中だよ。(GAS_URL が未設定)'); return; }
    var btn = document.getElementById('reload');
    btn.disabled = true;
    fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({action:'view'}) })
      .then(function(r){ return r.json(); })
      .then(function(res){
        btn.disabled = false;
        if(!res.ok){ fail('読み込めなかった: ' + res.error); return; }
        show(res.result);
        // 端末に残す控えにはID・パスワードを入れない(ボタンだけ先に出す用)
        try{
          var lite = { title: res.result.title, items: (res.result.items||[]).map(function(x){
            return { name:x.name, url:x.url, group:x.group, loginId:'', pw:'' };
          }) };
          localStorage.setItem(CACHE, JSON.stringify(lite));
          localStorage.removeItem('linkButtons.view.v1');
        }catch(e){}
      })
      .catch(function(err){
        btn.disabled = false;
        fail('読み込めなかった。電波を確認して「最新にする」を押してみて。');
      });
  }

  // 前回の内容を先に出しておいて、裏で最新を取りに行く(開いた瞬間に押せるように)
  try{
    var c = localStorage.getItem(CACHE);
    if(c) show(JSON.parse(c));
  }catch(e){}

  q.addEventListener('input', render);
  document.getElementById('reload').onclick = loadData;
  loadData();
})();
</script>
</body>
</html>
