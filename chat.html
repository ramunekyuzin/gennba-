<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>現場チャット</title>
  <link rel="manifest" href="chat.webmanifest">
  <link rel="icon" href="chat-icon.png">
  <link rel="apple-touch-icon" href="chat-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="現場チャット">
  <meta name="theme-color" content="#1e5aa8">
  <style>
    :root {
      --bg: #f5f6f8; --card: #fff; --text: #222; --sub: #666; --line: #ddd;
      --primary: #1e5aa8; --danger: #c0392b; --ok: #1a8a3c; --chip: #eef3fb;
      --mine: #1e5aa8; --mine-text: #fff; --other: #fff; --overlay: rgba(0,0,0,.4);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121417; --card: #1e2227; --text: #eaeaea; --sub: #aaa; --line: #3a3f46;
        --primary: #4a8be0; --danger: #e5695c; --ok: #4fc26f; --chip: #2a3442;
        --mine: #2f6cc0; --mine-text: #fff; --other: #262b31; --overlay: rgba(0,0,0,.6);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg); color: var(--text); font-size: 16px;
    }
    .hidden { display: none !important; }
    .page { max-width: 640px; margin: 0 auto; padding: 14px; }
    h1 { font-size: 20px; margin-bottom: 12px; }
    .card {
      background: var(--card); border-radius: 12px; padding: 14px;
      margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.12);
    }
    label { display: block; font-size: 14px; margin-bottom: 4px; color: var(--sub); }
    input, textarea {
      width: 100%; padding: 12px; font-size: 16px; font-family: inherit;
      border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px;
      background: var(--card); color: var(--text);
    }
    button, a.btn {
      display: block; text-align: center; text-decoration: none;
      padding: 14px; font-size: 16px; font-weight: bold; width: 100%; font-family: inherit;
      border: none; border-radius: 10px; background: var(--primary); color: #fff; cursor: pointer;
    }
    button:active, a.btn:active { opacity: .8; }
    button:disabled { background: #888; }
    button.sub, a.btn.sub { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
    button.danger { background: var(--danger); }
    button.small { width: auto; padding: 10px 14px; font-size: 15px; font-weight: normal; }
    a.btn.off { background: #888; pointer-events: none; }
    .note { font-size: 14px; color: var(--sub); line-height: 1.6; margin-bottom: 10px; }
    .msg-error { color: var(--danger); font-size: 15px; margin-bottom: 10px; }
    .msg-ok { color: var(--ok); font-size: 15px; margin-bottom: 10px; }

    /* 名前の丸(アイコン) */
    .avatar {
      width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: bold; font-size: 17px; border: none; padding: 0; cursor: pointer;
    }
    .avatar.big { width: 64px; height: 64px; font-size: 26px; margin: 0 auto 8px; cursor: default; }

    /* チャット画面 */
    #chatView { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 640px; margin: 0 auto; }
    header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top));
      background: var(--card);
    }
    header .title { flex: 1; font-size: 18px; font-weight: bold; min-width: 0; }
    header .me { font-size: 13px; color: var(--sub); font-weight: normal; display: block; }
    header button { width: auto; padding: 10px 12px; font-size: 15px; font-weight: normal; }
    .tabs { display: flex; background: var(--card); border-bottom: 1px solid var(--line); }
    .tabs button {
      flex: 1; background: transparent; color: var(--sub); border-radius: 0; padding: 12px;
      border-bottom: 3px solid transparent; font-size: 16px;
    }
    .tabs button.on { color: var(--primary); border-bottom-color: var(--primary); }
    .badge {
      display: inline-block; min-width: 20px; padding: 1px 6px; border-radius: 10px;
      background: var(--danger); color: #fff; font-size: 13px; margin-left: 4px; vertical-align: middle;
    }
    #pushBar {
      padding: 10px 12px; background: var(--chip); font-size: 15px; line-height: 1.5;
      display: flex; gap: 8px; align-items: center;
    }
    #pushBar span { flex: 1; }
    #roomBar {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      background: var(--card); border-bottom: 1px solid var(--line);
    }
    #roomBar .rname { flex: 1; font-size: 17px; font-weight: bold; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #roomBar button, #roomBar a.btn { width: auto; padding: 10px 14px; font-size: 15px; font-weight: normal; }
    #messages { flex: 1; overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; }
    .day { text-align: center; margin: 12px 0 8px; }
    .day span { font-size: 13px; color: var(--sub); background: var(--chip); padding: 4px 12px; border-radius: 12px; }
    .msg { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 10px; }
    .msg.mine { justify-content: flex-end; }
    .msg .body { display: flex; flex-direction: column; align-items: flex-start; max-width: 80%; min-width: 0; }
    .msg.mine .body { align-items: flex-end; }
    .msg .name { font-size: 13px; color: var(--sub); margin: 0 4px 2px; }
    .msg .line { display: flex; align-items: flex-end; gap: 6px; max-width: 100%; }
    .msg.mine .line { flex-direction: row-reverse; }
    .bubble {
      background: var(--other); color: var(--text); padding: 10px 12px; border-radius: 16px;
      font-size: 16px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
      box-shadow: 0 1px 2px rgba(0,0,0,.1); min-width: 0;
    }
    .msg.mine .bubble { background: var(--mine); color: var(--mine-text); }
    .msg .time { font-size: 12px; color: var(--sub); white-space: nowrap; }
    .empty { text-align: center; color: var(--sub); margin-top: 40px; line-height: 1.6; }
    #composer {
      display: flex; gap: 8px; align-items: flex-end;
      padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
      background: var(--card); border-top: 1px solid var(--line);
    }
    #composer textarea { margin: 0; resize: none; max-height: 140px; line-height: 1.4; }
    #composer button { width: auto; padding: 12px 18px; flex-shrink: 0; }

    /* 個人チャットの一覧 */
    #listPane { flex: 1; overflow-y: auto; padding: 8px 12px; }
    .person {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
      background: var(--card); color: var(--text); border-radius: 12px; padding: 12px;
      margin-bottom: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); font-weight: normal;
    }
    .person .info { flex: 1; min-width: 0; }
    .person .pname { font-size: 17px; font-weight: bold; }
    .person .last { font-size: 14px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .person .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--danger); flex-shrink: 0; }
    .hint { background: var(--chip); border-radius: 10px; padding: 10px 12px; font-size: 15px; line-height: 1.5; margin-bottom: 10px; }

    /* 下から出るメニュー(個人チャット/電話) */
    #sheet { position: fixed; inset: 0; background: var(--overlay); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
    #sheet .panel {
      background: var(--card); width: 100%; max-width: 640px; border-radius: 16px 16px 0 0;
      padding: 18px 16px; padding-bottom: calc(18px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 10px; text-align: center;
    }
    #sheet .sname { font-size: 19px; font-weight: bold; }
    #sheet .sphone { font-size: 14px; color: var(--sub); margin-bottom: 4px; }

    /* 管理・設定 */
    .full { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 10; }
    .member { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .member:last-child { border-bottom: none; }
    .member .info { flex: 1; min-width: 0; }
    .member .mname { font-size: 16px; font-weight: bold; }
    .member .mmail { font-size: 14px; color: var(--sub); word-break: break-all; }
  </style>
</head>
<body>

<!-- 読み込み中 -->
<div id="loadingView" class="page">
  <p class="note">読み込み中…</p>
</div>

<!-- ログイン -->
<div id="loginView" class="page hidden">
  <h1>現場チャット</h1>
  <div class="card" id="stepEmail">
    <label for="loginEmail">招待されたメールアドレス</label>
    <input id="loginEmail" type="email" autocomplete="email" inputmode="email" placeholder="example@example.com">
    <div id="emailMsg"></div>
    <button id="sendCodeBtn">ログインコードを送る</button>
    <p class="note" style="margin-top:10px">メールに6けたのコードが届きます。招待されていないアドレスには届きません。</p>
  </div>
  <div class="card hidden" id="stepCode">
    <p class="note"><b id="codeEmail"></b> にコードを送りました。メールに書いてある6けたの数字を入れてください(10分間有効)。</p>
    <label for="loginCode">ログインコード</label>
    <input id="loginCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456">
    <div id="codeMsg"></div>
    <button id="loginBtn">ログイン</button>
    <button id="backBtn" class="sub" style="margin-top:8px">メールアドレスを入れ直す</button>
  </div>
</div>

<!-- メンバーから外されている -->
<div id="deniedView" class="page hidden">
  <h1>現場チャット</h1>
  <div class="card">
    <p class="note">このアカウントは使えません(メンバーから外されています)。管理者に確認してください。</p>
    <button id="deniedLogoutBtn" class="sub">ログアウト</button>
  </div>
</div>

<!-- エラー -->
<div id="errorView" class="page hidden">
  <h1>現場チャット</h1>
  <div class="card">
    <p class="msg-error" id="errorText"></p>
    <button onclick="location.reload()">読み込み直す</button>
  </div>
</div>

<!-- チャット -->
<div id="chatView" class="hidden">
  <header>
    <div class="title">現場チャット<span class="me" id="meName"></span></div>
    <button id="adminBtn" class="sub hidden">管理</button>
    <button id="settingsBtn" class="sub" aria-label="設定">⚙ 設定</button>
  </header>
  <nav class="tabs">
    <button id="tabAll" class="on">全体</button>
    <button id="tabDm">個人<span id="dmBadge" class="badge hidden"></span></button>
  </nav>
  <div id="pushBar" class="hidden">
    <span id="pushText"></span>
    <button id="pushBtn" class="small">通知ON</button>
  </div>
  <div id="listPane" class="hidden"></div>
  <div id="roomBar" class="hidden">
    <button id="roomBackBtn" class="sub" aria-label="一覧にもどる">←</button>
    <div class="rname" id="roomName"></div>
    <a id="roomCallBtn" class="btn sub" href="#">☎ 電話</a>
  </div>
  <div id="messages"><p class="empty">読み込み中…</p></div>
  <div id="composer">
    <textarea id="input" rows="1" placeholder="メッセージを入力" aria-label="メッセージ"></textarea>
    <button id="sendBtn">送信</button>
  </div>
</div>

<!-- 個人チャット/電話のメニュー -->
<div id="sheet" class="hidden">
  <div class="panel">
    <div class="avatar big" id="sheetAvatar"></div>
    <div class="sname" id="sheetName"></div>
    <div class="sphone" id="sheetPhone"></div>
    <button id="sheetChatBtn">💬 個人チャット</button>
    <a id="sheetCallBtn" class="btn" href="#">☎ 電話をかける</a>
    <button id="sheetCloseBtn" class="sub">閉じる</button>
  </div>
</div>

<!-- 設定 -->
<div id="settingsView" class="full hidden">
  <div class="page">
    <h1 style="display:flex;justify-content:space-between;align-items:center">
      設定
      <button id="settingsCloseBtn" class="small sub">もどる</button>
    </h1>
    <div class="card">
      <label for="myPhone">自分の電話番号</label>
      <input id="myPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="090-1234-5678">
      <div id="phoneMsg"></div>
      <button id="phoneSaveBtn">保存</button>
      <p class="note" style="margin-top:10px">登録すると、メンバーがあなたの名前の丸から電話をかけられるようになります。空にして保存すると消せます。</p>
    </div>
    <div class="card">
      <button id="logoutBtn" class="sub">ログアウト</button>
    </div>
  </div>
</div>

<!-- 管理 -->
<div id="adminView" class="full hidden">
  <div class="page">
    <h1 style="display:flex;justify-content:space-between;align-items:center">
      メンバー管理
      <button id="adminCloseBtn" class="small sub">もどる</button>
    </h1>
    <div class="card">
      <label for="invName">名前(チャットに出る名前)</label>
      <input id="invName" type="text" maxlength="20" placeholder="山田(職長)">
      <label for="invEmail">メールアドレス</label>
      <input id="invEmail" type="email" inputmode="email" placeholder="example@example.com">
      <div id="invMsg"></div>
      <button id="inviteBtn">招待メールを送る</button>
      <p class="note" style="margin-top:10px">同じメールアドレスでもう一度送ると、名前を変えられます。</p>
    </div>
    <div class="card">
      <label>メンバー</label>
      <div id="memberList"><p class="note">読み込み中…</p></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, onAuthStateChanged, signInWithCustomToken, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import {
    getFirestore, collection, query, where, orderBy, limitToLast, onSnapshot,
    addDoc, serverTimestamp, doc, getDoc, setDoc, updateDoc, deleteDoc, writeBatch
  } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
  import { getMessaging, getToken, deleteToken, isSupported } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js';

  // GASのWebアプリのURL
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbyvoQt931dpBNgRouxhzSdbG-GnssBbwrYoSFi6S1nZqD4jC1S0Gn5nNsY7yH5bcXi9/exec';

  const $ = id => document.getElementById(id);
  const views = ['loadingView', 'loginView', 'deniedView', 'errorView', 'chatView'];
  function show(id) { views.forEach(v => $(v).classList.toggle('hidden', v !== id)); }
  function showError(text) { $('errorText').textContent = text; show('errorView'); }
  function setMsg(el, text, ok) { el.className = ok ? 'msg-ok' : 'msg-error'; el.textContent = text || ''; }

  function store(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* 使えなくてもOK */ } }
  function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function forget(key) { try { localStorage.removeItem(key); } catch (e) { /* 使えなくてもOK */ } }

  function gas(payload) {
    return fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload) })
      .then(r => r.json())
      .then(res => { if (!res.ok) throw new Error(res.error); return res.result; });
  }

  // Firebaseの設定はGASからもらう(リポジトリに置かないため)。2回目からは覚えたものですぐ始める
  async function getConfig() {
    const fresh = fetch(GAS_URL + '?action=config').then(r => r.json()).then(res => {
      if (!res.ok) throw new Error(res.error);
      store('chatConfig', JSON.stringify(res.result));
      return res.result;
    });
    const cached = load('chatConfig');
    if (cached) { fresh.catch(() => {}); return JSON.parse(cached); }
    return fresh;
  }

  let auth, db, messaging, config;
  let me = null;            // { uid(メール), name, admin }
  let members = {};         // メール → { name, phone }
  let dms = {};             // 個人チャットのID → { members, lastAt, lastFrom, lastText }
  let room = { type: 'all' };   // { type: 'all' } または { type: 'dm', pairId, other }
  let tab = 'all';          // 'all' または 'dm'
  let unsubMessages = null, unsubMembers = null, unsubDms = null;

  async function start() {
    try {
      config = await getConfig();
    } catch (e) {
      showError('設定を読み込めませんでした。電波のいいところで読み込み直してください。');
      return;
    }
    const app = initializeApp(config.firebase);
    auth = getAuth(app);
    db = getFirestore(app);
    onAuthStateChanged(auth, onUser);
  }

  // ===== ログイン =====
  const params = new URLSearchParams(location.search);
  if (params.get('email')) $('loginEmail').value = params.get('email');
  else if (load('chatEmail')) $('loginEmail').value = load('chatEmail');

  let loginEmail = '';
  $('sendCodeBtn').onclick = async () => {
    const email = $('loginEmail').value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setMsg($('emailMsg'), 'メールアドレスを正しく入れてください。'); return; }
    $('sendCodeBtn').disabled = true;
    setMsg($('emailMsg'), '');
    try {
      await gas({ action: 'requestCode', email });
      loginEmail = email;
      store('chatEmail', email);
      $('codeEmail').textContent = email;
      $('loginCode').value = '';
      setMsg($('codeMsg'), '');
      $('stepEmail').classList.add('hidden');
      $('stepCode').classList.remove('hidden');
      $('loginCode').focus();
    } catch (e) {
      setMsg($('emailMsg'), e.message || '送れませんでした。もう一度ためしてください。');
    }
    $('sendCodeBtn').disabled = false;
  };

  $('backBtn').onclick = () => {
    $('stepCode').classList.add('hidden');
    $('stepEmail').classList.remove('hidden');
  };

  $('loginBtn').onclick = async () => {
    const code = $('loginCode').value.replace(/\D/g, '');
    if (code.length !== 6) { setMsg($('codeMsg'), '6けたの数字を入れてください。'); return; }
    $('loginBtn').disabled = true;
    setMsg($('codeMsg'), '');
    try {
      const token = await gas({ action: 'verifyCode', email: loginEmail, code });
      await signInWithCustomToken(auth, token);
    } catch (e) {
      setMsg($('codeMsg'), e.message || 'ログインできませんでした。');
    }
    $('loginBtn').disabled = false;
  };
  $('loginCode').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });
  $('loginEmail').addEventListener('keydown', e => { if (e.key === 'Enter') $('sendCodeBtn').click(); });

  async function onUser(user) {
    stopListeners();
    if (!user) { me = null; show('loginView'); return; }
    let member;
    try {
      const snap = await getDoc(doc(db, 'members', user.uid));
      member = snap.exists() ? snap.data() : null;
    } catch (e) {
      member = null;   // メンバーでなければ読めないルールなので、読めない=外されている
    }
    if (!member) { show('deniedView'); return; }
    let admin = false;
    try { admin = (await getDoc(doc(db, 'admins', user.uid))).exists(); } catch (e) { /* 管理者でない */ }
    me = { uid: user.uid, name: member.name, admin };
    members = {};
    dms = {};
    $('meName').textContent = me.name + ' としてログイン中';
    $('adminBtn').classList.toggle('hidden', !admin);
    show('chatView');
    listenMembers();
    listenDms();
    showTab('all');
    setupPush(false);
  }

  function stopListeners() {
    [unsubMessages, unsubMembers, unsubDms].forEach(fn => { if (fn) fn(); });
    unsubMessages = unsubMembers = unsubDms = null;
  }

  async function logout() {
    if (!confirm('ログアウトしますか?(このスマホに通知が来なくなります)')) return;
    const token = load('chatPushToken');
    if (token) {
      try { await deleteDoc(doc(db, 'tokens', token)); } catch (e) { /* 消せなくてもOK */ }
      try { if (messaging) await deleteToken(messaging); } catch (e) { /* 消せなくてもOK */ }
      forget('chatPushToken');
    }
    stopListeners();
    $('adminView').classList.add('hidden');
    $('settingsView').classList.add('hidden');
    await signOut(auth);
  }
  $('logoutBtn').onclick = logout;
  $('deniedLogoutBtn').onclick = () => signOut(auth);

  // ===== メンバーと個人チャットの一覧 =====
  function listenMembers() {
    unsubMembers = onSnapshot(collection(db, 'members'), snap => {
      members = {};
      snap.docs.forEach(d => { members[d.id] = d.data(); });
      if (members[me.uid]) me.name = members[me.uid].name;
      if (tab === 'dm' && room.type !== 'dm') renderList();
      if (room.type === 'dm') updateRoomBar();
      if (!$('adminView').classList.contains('hidden')) renderMembers();
    }, err => console.error(err));
  }

  function listenDms() {
    const q = query(collection(db, 'dms'), where('members', 'array-contains', me.uid));
    unsubDms = onSnapshot(q, snap => {
      dms = {};
      snap.docs.forEach(d => { dms[d.id] = d.data({ serverTimestamps: 'estimate' }); });
      if (room.type === 'dm' && isVisible()) markRead(room.pairId);
      updateBadge();
      if (tab === 'dm' && room.type !== 'dm') renderList();
    }, err => console.error(err));
  }

  const pairOf = other => [me.uid, other].sort().join('|');
  const millis = t => (t && t.toMillis ? t.toMillis() : 0);
  const isVisible = () => document.visibilityState === 'visible';
  function isUnread(pairId) {
    const d = dms[pairId];
    if (!d || d.lastFrom === me.uid) return false;
    return millis(d.lastAt) > Number(load('chatRead:' + pairId) || 0);
  }
  function markRead(pairId) {
    const d = dms[pairId];
    store('chatRead:' + pairId, String(Math.max(Date.now(), millis(d && d.lastAt))));
    updateBadge();
  }
  function updateBadge() {
    const n = Object.keys(dms).filter(isUnread).length;
    $('dmBadge').textContent = n;
    $('dmBadge').classList.toggle('hidden', n === 0);
  }
  document.addEventListener('visibilitychange', () => {
    if (isVisible() && me && room.type === 'dm') markRead(room.pairId);
  });

  // 名前の丸の色(人ごとに決まった色)
  const COLORS = ['#1e5aa8', '#1a8a3c', '#c0392b', '#8e44ad', '#d35400', '#16808a', '#7f6a00', '#b03a6f'];
  function colorOf(uid) {
    let h = 0;
    for (const c of String(uid)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return COLORS[h % COLORS.length];
  }
  function avatarEl(uid, name, tag) {
    const el = document.createElement(tag || 'button');
    el.className = 'avatar';
    el.style.background = colorOf(uid);
    el.textContent = String(name || '?').trim().charAt(0) || '?';
    return el;
  }
  const nameOf = uid => (members[uid] && members[uid].name) || '(外れたメンバー)';
  const phoneOf = uid => (members[uid] && members[uid].phone) || '';
  const telHref = phone => 'tel:' + phone.replace(/[^0-9+]/g, '');

  function renderList() {
    const pane = $('listPane');
    pane.innerHTML = '';
    if (!phoneOf(me.uid)) {
      const hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = '右上の「⚙ 設定」から自分の電話番号を登録すると、ほかの人から電話をかけてもらえます。';
      pane.appendChild(hint);
    }
    const others = Object.keys(members).filter(uid => uid !== me.uid);
    if (!others.length) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'まだほかのメンバーがいません';
      pane.appendChild(p);
      return;
    }
    // やりとりが新しい人を上に、まだの人は名前順
    others.sort((a, b) => {
      const ta = millis(dms[pairOf(a)] && dms[pairOf(a)].lastAt);
      const tb = millis(dms[pairOf(b)] && dms[pairOf(b)].lastAt);
      if (ta !== tb) return tb - ta;
      return nameOf(a).localeCompare(nameOf(b), 'ja');
    });
    others.forEach(uid => {
      const pairId = pairOf(uid);
      const d = dms[pairId];
      const row = document.createElement('button');
      row.className = 'person';
      row.appendChild(avatarEl(uid, nameOf(uid), 'span'));
      const info = document.createElement('div');
      info.className = 'info';
      const n = document.createElement('div');
      n.className = 'pname';
      n.textContent = nameOf(uid);
      const last = document.createElement('div');
      last.className = 'last';
      last.textContent = d && d.lastText ? (d.lastFrom === me.uid ? 'あなた: ' : '') + d.lastText : 'タップして個人チャット・電話';
      info.appendChild(n);
      info.appendChild(last);
      row.appendChild(info);
      if (isUnread(pairId)) {
        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.setAttribute('aria-label', '未読');
        row.appendChild(dot);
      }
      row.onclick = () => openSheet(uid);
      pane.appendChild(row);
    });
  }

  // ===== 画面の切り替え =====
  function showTab(name) {
    tab = name;
    $('tabAll').classList.toggle('on', name === 'all');
    $('tabDm').classList.toggle('on', name === 'dm');
    if (name === 'all') openRoom({ type: 'all' });
    else showList();
  }
  $('tabAll').onclick = () => showTab('all');
  $('tabDm').onclick = () => showTab('dm');

  function showList() {
    if (unsubMessages) { unsubMessages(); unsubMessages = null; }
    room = { type: 'list' };
    $('listPane').classList.remove('hidden');
    ['roomBar', 'messages', 'composer'].forEach(id => $(id).classList.add('hidden'));
    renderList();
  }

  function openRoom(r) {
    if (unsubMessages) { unsubMessages(); unsubMessages = null; }
    room = r;
    $('listPane').classList.add('hidden');
    $('messages').classList.remove('hidden');
    $('composer').classList.remove('hidden');
    $('roomBar').classList.toggle('hidden', r.type !== 'dm');
    if (r.type === 'dm') { updateRoomBar(); markRead(r.pairId); }
    listenMessages();
  }

  function updateRoomBar() {
    $('roomName').textContent = nameOf(room.other);
    setCallLink($('roomCallBtn'), room.other);
  }
  function setCallLink(a, uid) {
    const phone = phoneOf(uid);
    a.href = phone ? telHref(phone) : '#';
    a.classList.toggle('off', !phone);
    a.setAttribute('aria-disabled', phone ? 'false' : 'true');
  }
  $('roomBackBtn').onclick = () => showTab('dm');

  // 名前の丸を押したときのメニュー
  let sheetUid = null;
  function openSheet(uid) {
    if (!uid || uid === me.uid) return;
    sheetUid = uid;
    const av = $('sheetAvatar');
    av.style.background = colorOf(uid);
    av.textContent = nameOf(uid).charAt(0);
    $('sheetName').textContent = nameOf(uid);
    const phone = phoneOf(uid);
    $('sheetPhone').textContent = phone || '電話番号はまだ登録されていません';
    setCallLink($('sheetCallBtn'), uid);
    $('sheetCallBtn').textContent = phone ? '☎ 電話をかける' : '☎ 電話(未登録)';
    $('sheetChatBtn').disabled = !members[uid];
    $('sheet').classList.remove('hidden');
  }
  function closeSheet() { $('sheet').classList.add('hidden'); }
  $('sheetCloseBtn').onclick = closeSheet;
  $('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(); });
  $('sheetCallBtn').addEventListener('click', closeSheet);
  $('sheetChatBtn').onclick = () => {
    const uid = sheetUid;
    closeSheet();
    tab = 'dm';
    $('tabAll').classList.remove('on');
    $('tabDm').classList.add('on');
    openRoom({ type: 'dm', pairId: pairOf(uid), other: uid });
  };

  // ===== メッセージ =====
  const box = $('messages');
  const nearBottom = () => box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  let forceScroll = true;

  function messagesRef() {
    return room.type === 'dm' ? collection(db, 'dms', room.pairId, 'messages') : collection(db, 'messages');
  }

  function listenMessages() {
    const q = query(messagesRef(), orderBy('createdAt'), limitToLast(200));
    forceScroll = true;
    box.innerHTML = '<p class="empty">読み込み中…</p>';
    const current = room;
    unsubMessages = onSnapshot(q, snap => {
      if (room !== current) return;
      const list = snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) }));
      const stick = forceScroll || nearBottom();
      render(list);
      if (stick) box.scrollTop = box.scrollHeight;
      forceScroll = false;
    }, err => {
      console.error(err);
      box.innerHTML = '';
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'メッセージを読めませんでした。読み込み直してください。';
      box.appendChild(p);
    });
  }

  const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
  function dayLabel(d) {
    const today = new Date();
    const y = d.getFullYear() !== today.getFullYear() ? d.getFullYear() + '年' : '';
    return y + (d.getMonth() + 1) + '月' + d.getDate() + '日(' + WEEK[d.getDay()] + ')';
  }
  function timeLabel(d) { return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }

  function render(list) {
    box.innerHTML = '';
    if (!list.length) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = room.type === 'dm' ? nameOf(room.other) + ' さんとの個人チャットです。\nまだメッセージはありません' : 'まだメッセージはありません';
      p.style.whiteSpace = 'pre-line';
      box.appendChild(p);
      return;
    }
    let lastDay = '';
    list.forEach(m => {
      const d = m.createdAt && m.createdAt.toDate ? m.createdAt.toDate() : new Date();
      const day = dayLabel(d);
      if (day !== lastDay) {
        const div = document.createElement('div');
        div.className = 'day';
        const span = document.createElement('span');
        span.textContent = day;
        div.appendChild(span);
        box.appendChild(div);
        lastDay = day;
      }
      const mine = m.uid === me.uid;
      const wrap = document.createElement('div');
      wrap.className = 'msg' + (mine ? ' mine' : '');
      if (!mine) {
        const av = avatarEl(m.uid, m.name);
        av.setAttribute('aria-label', m.name + ' さんのメニュー');
        av.onclick = () => openSheet(m.uid);
        wrap.appendChild(av);
      }
      const body = document.createElement('div');
      body.className = 'body';
      if (!mine && room.type !== 'dm') {
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = m.name;
        body.appendChild(name);
      }
      const line = document.createElement('div');
      line.className = 'line';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = m.text;
      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = timeLabel(d);
      line.appendChild(bubble);
      line.appendChild(time);
      body.appendChild(line);
      wrap.appendChild(body);
      box.appendChild(wrap);
    });
  }

  const input = $('input');
  function autoGrow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight + 2, 140) + 'px'; }
  input.addEventListener('input', autoGrow);
  // スマホはEnterで改行。パソコンは Ctrl+Enter(Macは⌘+Enter)で送信
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); } });
  $('sendBtn').onclick = send;

  async function send() {
    const text = input.value.trim();
    if (!text || !me || (room.type !== 'all' && room.type !== 'dm')) return;
    if (text.length > 2000) { alert('長すぎます(2000文字まで)'); return; }
    $('sendBtn').disabled = true;
    try {
      forceScroll = true;
      const data = { uid: me.uid, name: me.name, text, createdAt: serverTimestamp() };
      let id, dm = null;
      if (room.type === 'dm') {
        dm = room.pairId;
        const ref = doc(collection(db, 'dms', dm, 'messages'));
        const batch = writeBatch(db);
        batch.set(ref, data);
        batch.set(doc(db, 'dms', dm), {
          members: dm.split('|'), lastAt: serverTimestamp(), lastFrom: me.uid, lastText: text.slice(0, 60)
        });
        await batch.commit();
        id = ref.id;
      } else {
        id = (await addDoc(collection(db, 'messages'), data)).id;
      }
      input.value = '';
      autoGrow();
      // 通知はGASにまかせる(失敗してもメッセージは届いている)
      auth.currentUser.getIdToken()
        .then(idToken => gas({ action: 'notify', idToken, id, dm }))
        .catch(e => console.warn('通知を送れませんでした', e));
    } catch (e) {
      console.error(e);
      alert('送れませんでした。電波を確認してもう一度送ってください。');
    }
    $('sendBtn').disabled = false;
    input.focus();
  }

  // ===== 通知 =====
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isStandalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;

  function pushBar(text, button) {
    $('pushText').textContent = text;
    $('pushBtn').classList.toggle('hidden', !button);
    $('pushBar').classList.remove('hidden');
  }

  // ask=true のときはボタンから(許可を聞く)。false のときは、すでに許可済みならトークンだけ更新する
  async function setupPush(ask) {
    $('pushBar').classList.add('hidden');
    const supported = 'serviceWorker' in navigator && 'Notification' in window && await isSupported().catch(() => false);
    if (!supported) {
      if (isIOS && !isStandalone) pushBar('通知を受けるには、共有ボタン →「ホーム画面に追加」してから、ホーム画面のアイコンで開いてください。', false);
      else pushBar('このブラウザでは通知が使えません。', false);
      return;
    }
    if (Notification.permission === 'denied') {
      pushBar('通知がブロックされています。スマホの設定でこのアプリの通知を許可してください。', false);
      return;
    }
    if (Notification.permission !== 'granted') {
      if (!ask) { pushBar('通知をONにすると、新しいメッセージが来たときにお知らせします。', true); return; }
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { setupPush(false); return; }
    }
    try {
      const reg = await navigator.serviceWorker.register('firebase-messaging-sw.js');
      await navigator.serviceWorker.ready;
      if (!messaging) messaging = getMessaging();
      const token = await getToken(messaging, { vapidKey: config.vapidKey, serviceWorkerRegistration: reg });
      const old = load('chatPushToken');
      if (old && old !== token) { try { await deleteDoc(doc(db, 'tokens', old)); } catch (e) { /* 消せなくてもOK */ } }
      await setDoc(doc(db, 'tokens', token), { uid: me.uid, updatedAt: serverTimestamp() });
      store('chatPushToken', token);
    } catch (e) {
      console.error(e);
      pushBar('通知の設定に失敗しました。もう一度ためしてください。', true);
    }
  }
  $('pushBtn').onclick = () => setupPush(true);

  // ===== 設定(電話番号) =====
  $('settingsBtn').onclick = () => {
    $('myPhone').value = phoneOf(me.uid);
    setMsg($('phoneMsg'), '');
    $('settingsView').classList.remove('hidden');
  };
  $('settingsCloseBtn').onclick = () => $('settingsView').classList.add('hidden');
  $('phoneSaveBtn').onclick = async () => {
    const phone = $('myPhone').value.trim();
    if (!/^[0-9+() -]{0,20}$/.test(phone)) { setMsg($('phoneMsg'), '数字とハイフンで入れてください(20文字まで)。'); return; }
    $('phoneSaveBtn').disabled = true;
    try {
      await updateDoc(doc(db, 'members', me.uid), { phone });
      setMsg($('phoneMsg'), phone ? '保存しました。' : '電話番号を消しました。', true);
    } catch (e) {
      console.error(e);
      setMsg($('phoneMsg'), '保存できませんでした。もう一度ためしてください。');
    }
    $('phoneSaveBtn').disabled = false;
  };

  // ===== 管理 =====
  $('adminBtn').onclick = () => {
    $('adminView').classList.remove('hidden');
    renderMembers();
  };
  $('adminCloseBtn').onclick = () => $('adminView').classList.add('hidden');

  function renderMembers() {
    const el = $('memberList');
    el.innerHTML = '';
    Object.keys(members)
      .sort((a, b) => nameOf(a).localeCompare(nameOf(b), 'ja'))
      .forEach(email => {
        const row = document.createElement('div');
        row.className = 'member';
        const info = document.createElement('div');
        info.className = 'info';
        const n = document.createElement('div');
        n.className = 'mname';
        n.textContent = nameOf(email);
        const mail = document.createElement('div');
        mail.className = 'mmail';
        mail.textContent = email;
        info.appendChild(n);
        info.appendChild(mail);
        row.appendChild(info);
        if (email !== me.uid) {
          const btn = document.createElement('button');
          btn.className = 'small danger';
          btn.textContent = '外す';
          btn.onclick = () => removeMember(email, btn);
          row.appendChild(btn);
        }
        el.appendChild(row);
      });
  }

  $('inviteBtn').onclick = async () => {
    const name = $('invName').value.trim();
    const email = $('invEmail').value.trim().toLowerCase();
    if (!name) { setMsg($('invMsg'), '名前を入れてください。'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setMsg($('invMsg'), 'メールアドレスを正しく入れてください。'); return; }
    $('inviteBtn').disabled = true;
    setMsg($('invMsg'), '');
    try {
      const idToken = await auth.currentUser.getIdToken();
      await gas({ action: 'invite', idToken, name, email });
      setMsg($('invMsg'), name + ' さんに招待メールを送りました。', true);
      $('invName').value = '';
      $('invEmail').value = '';
    } catch (e) {
      setMsg($('invMsg'), e.message || '送れませんでした。');
    }
    $('inviteBtn').disabled = false;
  };

  async function removeMember(email, btn) {
    if (!confirm(nameOf(email) + ' さんをメンバーから外しますか?')) return;
    btn.disabled = true;
    try {
      const idToken = await auth.currentUser.getIdToken();
      await gas({ action: 'remove', idToken, email });
    } catch (e) {
      alert(e.message || '外せませんでした。');
      btn.disabled = false;
    }
  }

  start();
</script>
</body>
</html>
