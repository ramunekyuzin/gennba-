<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f1720" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef0ec" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="マニュアル">
<title>事務所マニュアル</title>
<script>(function(){var t=localStorage.getItem("officeTheme");if(t&&t!=="auto")document.documentElement.setAttribute("data-theme",t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #eef0ec; --grid: rgba(20,40,60,.07); --ink: #142a3a; --ink-2: #5d6f7d;
    --rule: #142a3a; --hair: rgba(20,42,58,.18); --accent: #e0632a; --paper: #f8f8f5; --danger: #b3261e;
  }
  html[data-theme="dark"] {
    --bg: #0f1720; --grid: rgba(120,170,220,.09); --ink: #e8edf2; --ink-2: #8fa2b3;
    --rule: #e8edf2; --hair: rgba(232,237,242,.18); --accent: #ff8a4c; --paper: #17222d; --danger: #ff6b6b;
    color-scheme: dark;
  }
  html[data-theme="light"] { color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    html:not([data-theme]) {
      --bg: #0f1720; --grid: rgba(120,170,220,.09); --ink: #e8edf2; --ink-2: #8fa2b3;
      --rule: #e8edf2; --hair: rgba(232,237,242,.18); --accent: #ff8a4c; --paper: #17222d; --danger: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 20px 110px; }

  /* ---- 表題欄 ---- */
  .title-block { position: relative; border: 2px solid var(--rule); display: grid; grid-template-columns: 1fr auto; margin-bottom: 20px; background: var(--paper); }
  .title-block .l { padding: 14px 16px 12px; border-right: 2px solid var(--rule); }
  .title-block .kicker { font-size: 11px; letter-spacing: .28em; color: var(--ink-2); margin-bottom: 4px; }
  .title-block h1 { margin: 0; font-size: 30px; font-weight: 900; line-height: 1.1; letter-spacing: .02em; }
  .title-block .r { display: grid; grid-template-rows: 1fr 1fr; min-width: 120px; }
  .title-block .r div { padding: 8px 14px; display: flex; flex-direction: column; justify-content: center; }
  .title-block .r div + div { border-top: 2px solid var(--rule); }
  .title-block .r small { font-size: 10px; letter-spacing: .2em; color: var(--ink-2); }
  .title-block .r b { font-size: 17px; font-weight: 700; white-space: nowrap; }
  .theme { position: absolute; top: -2px; right: -2px; border: 2px solid var(--rule); background: var(--paper); color: var(--ink); font-size: 11px; font-weight: 700; letter-spacing: .12em; padding: 5px 9px; cursor: pointer; }
  .back { display: inline-block; font-size: 12px; letter-spacing: .1em; color: var(--ink-2); text-decoration: none; margin-bottom: 14px; }
  .back:hover { color: var(--accent); }

  /* ---- セクション見出し ---- */
  section { margin-bottom: 34px; }
  section.hidden { display: none; }
  section h2 { margin: 0 0 12px; display: flex; align-items: baseline; gap: 12px; font-size: 20px; font-weight: 900; letter-spacing: .04em; }
  section h2 .no { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .1em; }
  section h2::after { content: ""; flex: 1; border-bottom: 2px solid var(--rule); transform: translateY(-6px); }

  /* ---- 入力(下線式) ---- */
  label { display: block; font-size: 12px; color: var(--ink-2); letter-spacing: .08em; margin: 14px 0 4px; }
  input, textarea, select {
    width: 100%; padding: 12px 6px; font: inherit; font-size: 16px; border: 0; border-bottom: 2px solid var(--hair);
    background: transparent; color: var(--ink); outline: 0; border-radius: 0; -webkit-appearance: none; appearance: none;
  }
  input:focus, textarea:focus, select:focus { border-bottom-color: var(--accent); }
  textarea { resize: vertical; line-height: 1.6; }
  select { background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%); background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
  select option { color: #142a3a; background: #f8f8f5; }
  html[data-theme="dark"] select option { color: #e8edf2; background: #17222d; }
  @media (prefers-color-scheme: dark) { html:not([data-theme]) select option { color: #e8edf2; background: #17222d; } }
  .r2 { display: flex; gap: 14px; }
  .r2 > * { flex: 1; min-width: 0; }

  /* ---- セグメント選択(トーン/種類) ---- */
  .seg { display: flex; flex-wrap: wrap; gap: 0; border: 2px solid var(--rule); margin-top: 6px; }
  .seg button { flex: 1; min-width: 70px; border: 0; border-right: 2px solid var(--rule); background: var(--paper); color: var(--ink); padding: 12px 6px; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--rule); color: var(--paper); }
  html[data-theme="dark"] .seg button.on { color: #0f1720; }

  /* ---- ボタン ---- */
  .btns { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .btns button, .btn { flex: 1; min-width: 120px; border: 2px solid var(--rule); padding: 14px 10px; font: inherit; font-size: 15px; font-weight: 900; cursor: pointer; background: var(--paper); color: var(--ink); box-shadow: 4px 4px 0 var(--rule); text-decoration: none; text-align: center; -webkit-tap-highlight-color: transparent; }
  .btns button:active, .btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--rule); }
  .btns .ok, .btn.ok { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btns button:disabled { opacity: .5; box-shadow: none; }
  .btns button.wide { flex-basis: 100%; }
  .msg { font-size: 14px; margin-top: 10px; min-height: 20px; }
  .msg.ng { color: var(--danger); }
  .msg.ok { color: var(--accent); }

  /* ---- 目録行 ---- */
  .row { position: relative; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 14px; padding: 14px 4px; text-decoration: none; color: inherit; border-bottom: 1px solid var(--hair); -webkit-tap-highlight-color: transparent; cursor: pointer; transition: padding-left .12s ease; }
  .row:last-child { border-bottom: 0; }
  .row:hover, .row:active { padding-left: 10px; }
  .row:hover .name, .row:active .name { color: var(--accent); }
  .row.hidden { display: none; }
  .row .idx { font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .row .name { font-size: 18px; font-weight: 700; line-height: 1.25; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; transition: color .12s; }
  .row .desc { font-size: 13px; color: var(--ink-2); margin-top: 3px; word-break: break-all; }
  .row .desc mark { background: transparent; color: var(--accent); font-weight: 700; }
  .row .go { font-size: 22px; color: var(--ink-2); padding-right: 4px; }
  .tag { font-size: 11px; font-weight: 700; padding: 1px 7px; border: 1px solid var(--ink-2); color: var(--ink-2); letter-spacing: .06em; white-space: nowrap; }
  .tools { display: none; gap: 6px; }
  body.edit .tools { display: flex; }
  body.edit .go { display: none; }
  .tools button { border: 1px solid var(--hair); background: var(--paper); color: var(--ink); border-radius: 6px; padding: 7px 11px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .tools button.del { color: var(--danger); }

  /* ---- 検索 ---- */
  .search { display: flex; align-items: center; gap: 12px; border-bottom: 2px solid var(--rule); padding: 6px 2px 10px; margin-bottom: 26px; }
  .search .no { font-size: 12px; color: var(--ink-2); letter-spacing: .1em; }
  .search input { flex: 1; border: 0; padding: 4px 0; font-size: 18px; min-width: 0; }
  .search input::placeholder { color: var(--ink-2); }
  .search button { display: none; border: 0; background: transparent; color: var(--ink-2); font-size: 22px; line-height: 1; cursor: pointer; padding: 0 4px; }
  .search.has-text button { display: block; }

  /* ---- FAB ---- */
  .fab { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); display: flex; gap: 10px; z-index: 5; }
  .fab button { border: 2px solid var(--rule); background: var(--paper); color: var(--ink); padding: 12px 18px; font: inherit; font-size: 15px; font-weight: 900; letter-spacing: .04em; cursor: pointer; box-shadow: 4px 4px 0 var(--rule); }
  .fab button:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--rule); }
  .fab button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .fab button.add { display: none; }
  body.edit .fab button.add { display: inline-block; }

  /* ---- モーダル ---- */
  .modal-bg { position: fixed; inset: 0; background: rgba(10,20,30,.55); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .modal-bg.show { display: flex; }
  .modal { width: 100%; max-width: 560px; background: var(--paper); color: var(--ink); border: 2px solid var(--rule); border-bottom: 0; padding: 20px 18px calc(24px + env(safe-area-inset-bottom)); max-height: 90vh; overflow: auto; }
  @media (min-width: 600px) { .modal-bg { align-items: center; } .modal { border-bottom: 2px solid var(--rule); box-shadow: 8px 8px 0 var(--rule); } }
  .modal h3 { margin: 0 0 6px; font-size: 20px; font-weight: 900; }
  .modal .btns button { box-shadow: none; }

  .empty, .loading { text-align: center; color: var(--ink-2); padding: 36px 0; }
  .empty { display: none; }
  .empty.show { display: block; }
  footer { margin-top: 40px; font-size: 11px; color: var(--ink-2); letter-spacing: .1em; text-align: right; }

  /* ---- ビューア(全画面) ---- */
  .viewer { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: none; flex-direction: column; }
  .viewer.show { display: flex; }
  .viewer .bar { display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; border-bottom: 2px solid var(--rule); background: var(--paper); }
  .viewer .bar .t { flex: 1; min-width: 0; font-weight: 900; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .viewer .bar .t small { display: block; font-size: 11px; color: var(--ink-2); letter-spacing: .1em; font-weight: 700; }
  .viewer .bar button, .viewer .bar a { border: 2px solid var(--rule); background: var(--paper); color: var(--ink); padding: 8px 12px; font: inherit; font-size: 13px; font-weight: 900; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .viewer iframe { flex: 1; border: 0; width: 100%; background: #fff; }
  .viewer .hint { font-size: 12px; color: var(--ink-2); text-align: center; padding: 6px; border-top: 1px solid var(--hair); background: var(--paper); }
  .cache-note { font-size: 11px; color: var(--ink-2); margin-top: 2px; letter-spacing: .04em; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back mono" href="./office.html">← OFFICE TOOLS</a>

  <div class="title-block">
    <button class="theme mono" id="themeBtn" type="button" aria-label="表示切替">AUTO</button>
    <div class="l">
      <div class="kicker mono">GENBA OFFICE / MANUAL</div>
      <h1>事務所マニュアル</h1>
    </div>
    <div class="r">
      <div><small class="mono">DATE</small><b class="mono" id="date"></b></div>
      <div><small class="mono">TIME</small><b class="mono" id="time"></b></div>
    </div>
  </div>

  <div class="search" id="searchBox">
    <span class="no mono">FIND</span>
    <input id="q" type="search" placeholder="タイトル・タグ・本文を検索" autocomplete="off" enterkeyhint="search">
    <button id="clear" type="button" aria-label="クリア">×</button>
  </div>

  <div class="loading" id="loading">読み込み中…</div>
  <div id="sections"></div>
  <div class="empty" id="empty">該当なし</div>

  <footer class="mono" id="count"></footer>
</div>

<div class="fab">
  <button class="add primary" id="addBtn">＋ 追加</button>
  <button class="add" id="refreshBtn">本文更新</button>
  <button id="editBtn">編集</button>
</div>

<!-- ビューア -->
<div class="viewer" id="viewer">
  <div class="bar">
    <button type="button" onclick="closeViewer()">← 戻る</button>
    <div class="t" id="vTitle"><small class="mono" id="vCat"></small><span id="vName"></span></div>
    <a id="vOpen" href="#" target="_blank" rel="noopener">別タブ</a>
  </div>
  <iframe id="vFrame" src="about:blank" allow="clipboard-write"></iframe>
  <div class="hint">表示されない場合は「別タブ」で開いて(ドキュメントの共有設定を確認)</div>
</div>

<!-- 合言葉 -->
<div class="modal-bg" id="passModal">
  <div class="modal">
    <h3>編集モード</h3>
    <label>合言葉</label>
    <input id="passInput" type="password" autocomplete="off" enterkeyhint="done">
    <div class="msg" id="passMsg"></div>
    <div class="btns">
      <button type="button" onclick="closeModal('passModal')">やめる</button>
      <button type="button" class="ok" id="passOk" onclick="submitPass()">OK</button>
    </div>
  </div>
</div>

<!-- 登録・編集 -->
<div class="modal-bg" id="formModal">
  <div class="modal">
    <h3 id="formTitle">マニュアルを追加</h3>
    <input type="hidden" id="fId">
    <label>カテゴリ</label>
    <input id="fCat" list="catList" placeholder="例: 経理 / 現場事務 / 総務">
    <datalist id="catList"></datalist>
    <label>タイトル</label>
    <input id="fTitle" placeholder="例: 請求書の処理手順">
    <label>タグ(カンマ区切り・任意)</label>
    <input id="fTag" placeholder="例: 請求書, 月末, 経理">
    <label>GoogleドキュメントのURL</label>
    <input id="fUrl" type="url" inputmode="url" placeholder="https://docs.google.com/document/d/…">
    <div class="msg" id="formMsg"></div>
    <div class="btns">
      <button type="button" onclick="closeModal('formModal')">やめる</button>
      <button type="button" class="ok" id="formOk" onclick="submitForm()">保存</button>
    </div>
  </div>
</div>

<script>
// ============================================
// GASのWebアプリURL(デプロイ後にここへ貼る)
// ============================================
const GAS_URL = "https://script.google.com/macros/s/AKfycbzONR9VsGsimnsN1eCVlRSAXHlNomIZUXvJRBsI2r_MWCduIhY6JpDAKIDZtbjvcCM7/exec";

let DOCS = [];
let PASS = sessionStorage.getItem("officePass") || "";
let afterPass = null;

const $ = id => document.getElementById(id);
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function pad2(n){ return String(n).padStart(2, "0"); }
function setMsg(id, text, cls){ const m = $(id); m.textContent = text || ""; m.className = "msg " + (cls || ""); }

async function api(body){
  if (!GAS_URL) throw new Error("GAS_URL が未設定");
  const r = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) {
    if (/合言葉/.test(j.error || "")) { PASS = ""; sessionStorage.removeItem("officePass"); }
    throw new Error(j.error || "エラー");
  }
  return j.result;
}

async function load(){
  if (!GAS_URL) { $("loading").textContent = "GAS_URL が未設定"; return; }
  try {
    const r = await fetch(GAS_URL + "?t=" + Date.now());
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    DOCS = j.result;
    $("loading").style.display = "none";
    render(); filter();
  } catch (e) { $("loading").textContent = "読み込み失敗: " + e.message; }
}

// ---------- URL変換 ----------
function docId(url){ const m = String(url || "").match(/\/document\/d\/([a-zA-Z0-9_-]+)/); return m ? m[1] : ""; }
function embedUrl(url){
  const id = docId(url);
  if (id) return `https://docs.google.com/document/d/${id}/preview`;   // 軽くてスマホ向き
  return url;
}

// ---------- 描画 ----------
function grouped(){
  const map = new Map();
  DOCS.forEach(d => { const c = d["カテゴリ"] || "その他"; if (!map.has(c)) map.set(c, []); map.get(c).push(d); });
  return map;
}
function render(){
  const g = grouped();
  $("catList").innerHTML = [...g.keys()].map(c => `<option value="${esc(c)}">`).join("");
  let secNo = 0;
  $("sections").innerHTML = [...g.entries()].map(([cat, items]) => {
    secNo++;
    return `
    <section>
      <h2><span class="no mono">${pad2(secNo)}</span>${esc(cat)}</h2>
      ${items.map((d, i) => {
        const tags = String(d["タグ"] || "").split(/[,、\s]+/).filter(Boolean);
        const hasCache = !!d["本文キャッシュ"];
        return `
        <div class="row" data-id="${esc(d["ID"])}" onclick="openDoc('${esc(d["ID"])}')">
          <div class="idx mono">${pad2(secNo)}-${pad2(i + 1)}</div>
          <div>
            <div class="name">${esc(d["タイトル"])}${tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
            <div class="desc" id="snip-${esc(d["ID"])}"></div>
            <div class="cache-note mono">${hasCache ? "TEXT INDEXED " + esc(d["更新日時"] || "") : "本文未取得"}</div>
          </div>
          <div class="go">→</div>
          <div class="tools">
            <button type="button" onclick="event.stopPropagation();openForm('${esc(d["ID"])}')">編集</button>
            <button type="button" onclick="event.stopPropagation();refreshOne('${esc(d["ID"])}')">本文</button>
            <button type="button" class="del" onclick="event.stopPropagation();delDoc('${esc(d["ID"])}','${esc(d["タイトル"])}')">削除</button>
          </div>
        </div>`;
      }).join("")}
    </section>`;
  }).join("");
  $("count").textContent = `TOTAL ${DOCS.length} DOCS`;
}

// ---------- 検索(タイトル・タグ・カテゴリ・本文キャッシュ) ----------
function filter(){
  const q = $("q").value.trim().toLowerCase();
  $("searchBox").classList.toggle("has-text", q.length > 0);
  let shown = 0;
  document.querySelectorAll("section").forEach(sec => {
    let n = 0;
    sec.querySelectorAll(".row").forEach(row => {
      const d = DOCS.find(x => x["ID"] === row.dataset.id) || {};
      const head = [d["タイトル"], d["タグ"], d["カテゴリ"]].join(" ").toLowerCase();
      const body = String(d["本文キャッシュ"] || "");
      const snip = $("snip-" + d["ID"]);
      let hit = !q;
      if (q) {
        if (head.includes(q)) { hit = true; snip.innerHTML = ""; }
        else {
          const pos = body.toLowerCase().indexOf(q);
          if (pos >= 0) {
            hit = true;
            const s = Math.max(0, pos - 30), e = Math.min(body.length, pos + q.length + 50);
            const before = body.slice(s, pos), match = body.slice(pos, pos + q.length), after = body.slice(pos + q.length, e);
            snip.innerHTML = (s > 0 ? "…" : "") + esc(before) + `<mark>${esc(match)}</mark>` + esc(after) + (e < body.length ? "…" : "");
          }
        }
      } else snip.innerHTML = "";
      row.classList.toggle("hidden", !hit);
      if (hit) n++;
    });
    sec.classList.toggle("hidden", n === 0);
    shown += n;
  });
  $("empty").classList.toggle("show", shown === 0 && DOCS.length > 0);
}

// ---------- ビューア ----------
function openDoc(id){
  if (document.body.classList.contains("edit")) return;
  const d = DOCS.find(x => x["ID"] === id); if (!d || !d["URL"]) return;
  $("vCat").textContent = d["カテゴリ"] || "";
  $("vName").textContent = d["タイトル"] || "";
  $("vOpen").href = d["URL"];
  $("vFrame").src = embedUrl(d["URL"]);
  $("viewer").classList.add("show");
  history.pushState({ viewer: true }, "");
}
function closeViewer(){
  $("viewer").classList.remove("show");
  $("vFrame").src = "about:blank";
  if (history.state && history.state.viewer) history.back();
}
window.addEventListener("popstate", () => { if ($("viewer").classList.contains("show")) { $("viewer").classList.remove("show"); $("vFrame").src = "about:blank"; } });

// ---------- 合言葉 ----------
function withPass(fn){
  if (PASS) { fn(); return; }
  afterPass = fn;
  setMsg("passMsg", ""); $("passInput").value = "";
  openModal("passModal");
  setTimeout(() => $("passInput").focus(), 50);
}
async function submitPass(){
  const p = $("passInput").value;
  $("passOk").disabled = true;
  try {
    await api({ action: "checkPass", pass: p });
    PASS = p; sessionStorage.setItem("officePass", p);
    closeModal("passModal");
    const fn = afterPass; afterPass = null; if (fn) fn();
  } catch (e) { setMsg("passMsg", e.message, "ng"); }
  $("passOk").disabled = false;
}
$("passInput").addEventListener("keydown", e => { if (e.key === "Enter") submitPass(); });

// ---------- 編集モード ----------
function openModal(id){ $(id).classList.add("show"); }
function closeModal(id){ $(id).classList.remove("show"); }
$("editBtn").addEventListener("click", () => {
  if (document.body.classList.contains("edit")) { document.body.classList.remove("edit"); $("editBtn").textContent = "編集"; return; }
  withPass(() => { document.body.classList.add("edit"); $("editBtn").textContent = "完了"; });
});
$("addBtn").addEventListener("click", () => openForm(""));
$("refreshBtn").addEventListener("click", () => {
  if (!confirm("全ドキュメントの本文を再取得する？(件数が多いと少し時間がかかる)")) return;
  withPass(async () => {
    $("refreshBtn").disabled = true; $("refreshBtn").textContent = "更新中…";
    try { const r = await api({ action: "refresh", pass: PASS }); alert(`本文更新: ${r.refreshed}件OK / ${r.failed}件失敗`); await load(); }
    catch (e) { alert(e.message); }
    $("refreshBtn").disabled = false; $("refreshBtn").textContent = "本文更新";
  });
});
function refreshOne(id){
  withPass(async () => {
    try { const r = await api({ action: "refresh", pass: PASS, id: id }); if (!r.cached) alert(r.note || "本文を取得できなかった"); await load(); }
    catch (e) { alert(e.message); }
  });
}

function openForm(id){
  const d = DOCS.find(x => x["ID"] === id) || {};
  $("formTitle").textContent = id ? "マニュアルを編集" : "マニュアルを追加";
  $("fId").value = id;
  $("fCat").value = d["カテゴリ"] || "";
  $("fTitle").value = d["タイトル"] || "";
  $("fTag").value = d["タグ"] || "";
  $("fUrl").value = d["URL"] || "";
  setMsg("formMsg", "");
  openModal("formModal");
}
function submitForm(){
  const id = $("fId").value;
  const data = {
    "カテゴリ": $("fCat").value.trim() || "その他",
    "タイトル": $("fTitle").value.trim(),
    "タグ": $("fTag").value.trim(),
    "URL": $("fUrl").value.trim(),
  };
  if (!data["タイトル"]) { setMsg("formMsg", "タイトルは必須", "ng"); return; }
  if (!/^https?:\/\//.test(data["URL"])) { setMsg("formMsg", "URLを入れてね", "ng"); return; }
  withPass(async () => {
    $("formOk").disabled = true; setMsg("formMsg", "保存中(本文も読んでる)…");
    try {
      let r;
      if (id) r = await api({ action: "update", pass: PASS, id: id, data: data });
      else    r = await api({ action: "add", pass: PASS, data: data });
      closeModal("formModal");
      if (r && r.cached === false && r.note) alert("登録はした。" + r.note);
      await load();
    } catch (e) { setMsg("formMsg", e.message, "ng"); }
    $("formOk").disabled = false;
  });
}
function delDoc(id, name){
  if (!confirm(`「${name}」を削除する？(ドキュメント本体は消えない)`)) return;
  withPass(async () => {
    try { await api({ action: "delete", pass: PASS, id: id }); await load(); }
    catch (e) { alert(e.message); }
  });
}

// ---------- 表示モード(AUTO → LIGHT → DARK) office.htmlと共有 ----------
const THEMES = ["auto", "light", "dark"];
function applyTheme(t){
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  $("themeBtn").textContent = t.toUpperCase();
  localStorage.setItem("officeTheme", t);
}
$("themeBtn").addEventListener("click", () => {
  const cur = localStorage.getItem("officeTheme") || "auto";
  applyTheme(THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length]);
});
applyTheme(localStorage.getItem("officeTheme") || "auto");

// ---------- 表題欄の日時 ----------
function tick(){
  const d = new Date(), w = ["日","月","火","水","木","金","土"][d.getDay()];
  $("date").textContent = `${d.getFullYear()}.${pad2(d.getMonth()+1)}.${pad2(d.getDate())} ${w}`;
  $("time").textContent = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}
$("q").addEventListener("input", filter);
$("clear").addEventListener("click", () => { $("q").value = ""; filter(); $("q").focus(); });
document.querySelectorAll(".modal-bg").forEach(m => m.addEventListener("click", e => { if (e.target === m) m.classList.remove("show"); }));

tick(); setInterval(tick, 15000);
load();
</script>
