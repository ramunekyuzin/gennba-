<!DOCTYPE html>
<html lang="ja">
<head>
<script src="lock.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#142c43" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1019" media="(prefers-color-scheme: dark)">
<title>ダンプ積載量集計</title>
<style>
:root{color-scheme:light dark;--bg:#eef3f7;--card:#ffffff;--ink:#183148;--muted:#5b6e82;--line:#d1dce6;--navy:#142c43;--accent:#b9eddc;--focus:#4aa9df;--ok:#1f7a5c;--ng:#b3261e;--field:#ffffff;--soft:#f3f7fa}
@media (prefers-color-scheme: dark){:root{--bg:#0b1019;--card:#151d2a;--ink:#e3eaf2;--muted:#9aabbd;--line:#2c3a4d;--navy:#0f1a29;--accent:#7fd6bb;--ok:#6fd3a8;--ng:#ff8a80;--field:#0f1622;--soft:#1a2433}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.6}
.topbar{background:var(--navy);color:#fff;padding:20px max(18px,env(safe-area-inset-left))}
.topbar .inner{max-width:720px;margin:auto}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.18em;color:var(--accent);margin-bottom:4px}
h1{font-size:22px;margin:0;letter-spacing:.06em}
h2{font-size:18px;margin:0 0 14px}
main{max-width:720px;margin:auto;padding:18px 16px max(24px,env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px;margin-bottom:16px}
.field{margin-bottom:18px}
.label{display:block;font-weight:700;margin-bottom:8px}
.hint{font-size:14px;color:var(--muted);margin:0 0 8px}
input[type=text],input[type=date],input[type=number]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:50px}
input:focus-visible,button:focus-visible,.choice input:focus-visible+span,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{display:block;cursor:pointer}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice span{display:flex;flex-direction:column;justify-content:center;min-height:56px;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--field)}
.choice small{font-size:14px;color:var(--muted);font-weight:400}
.choice input:checked+span{border-color:var(--focus);font-weight:700}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:8px}
.stepper input{text-align:center;font-size:20px;font-weight:700}
.sbtn{min-height:50px;font:inherit;font-size:24px;font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer}
.subtotal{background:var(--soft);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:17px}
.subtotal b{font-size:20px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;font:inherit;font-size:17px;font-weight:700;border-radius:12px;border:0;background:var(--navy);color:#fff;cursor:pointer}
@media (prefers-color-scheme: dark){.btn{background:#2b6c8f}}
.btn:disabled{opacity:.6;cursor:wait}
.btn.sub{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.msg{min-height:1.6em;margin:12px 0 0;font-weight:700}
.msg.ok{color:var(--ok)}
.msg.ng{color:var(--ng)}
.calnav{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center;margin-bottom:10px}
.calnav span{text-align:center;font-weight:700;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-bottom:12px}
.cal .wd{text-align:center;font-size:16px;color:var(--muted);font-weight:700;padding:2px 0}
.cal .wd.sun,.cell.sun .dn{color:var(--ng)}
.cal .wd.sat,.cell.sat .dn{color:var(--focus)}
.cell{min-width:0;min-height:58px;padding:4px 2px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;cursor:pointer}
.cell.blank{visibility:hidden}
.cell .dn{font-size:16px;line-height:1.3}
.cell .v{font-size:16px;font-weight:700;color:var(--ok);line-height:1.4;letter-spacing:-.02em}
.cell.today{border-color:var(--ink)}
.cell.sel{border:2px solid var(--focus);background:var(--soft)}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--line);padding-top:12px;margin-top:4px;font-weight:700}
.total b{font-size:22px}
.day{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px;background:var(--field)}
.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.day-head .d{font-weight:700;font-size:17px}
.day-head .sum{font-weight:700;font-size:20px;color:var(--ok)}
.recrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.del{min-height:44px;min-width:64px;font:inherit;font-size:16px;border-radius:10px;border:1px solid var(--ng);background:transparent;color:var(--ng);cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:16px 0;margin:0}
.setrow input{min-width:0}
.setrow{display:grid;grid-template-columns:1fr 110px 64px;gap:8px;margin-bottom:10px;align-items:center}
.sethead{display:grid;grid-template-columns:1fr 110px 64px;gap:8px;font-size:14px;color:var(--muted);font-weight:700;margin-bottom:6px}
.btns{display:grid;gap:10px;margin-top:6px}
details.settings>summary{cursor:pointer;font-weight:700;font-size:18px;min-height:44px;display:flex;align-items:center;list-style:none}
details.settings>summary::-webkit-details-marker{display:none}
details.settings>summary::before{content:"▶";font-size:13px;margin-right:8px;transition:transform .15s}
details.settings[open]>summary::before{transform:rotate(90deg)}
details.settings[open]>summary{margin-bottom:12px}
@media(min-width:600px){.choices{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>
<header class="topbar"><div class="inner"><div class="eyebrow">DUMP TRUCK LOG</div><h1>ダンプ積載量集計</h1></div></header>
<main>
  <section class="card" aria-labelledby="inTitle">
    <h2 id="inTitle">入力</h2>
    <form id="form" novalidate>
      <div class="field">
        <label class="label" for="date">日付</label>
        <input type="date" id="date">
      </div>
      <div class="field" role="radiogroup" aria-labelledby="sizeLabel">
        <span class="label" id="sizeLabel">車格</span>
        <div class="choices" id="sizes"><p class="empty">読み込み中…</p></div>
      </div>
      <div class="field">
        <label class="label" for="count">台数</label>
        <div class="stepper">
          <button type="button" class="sbtn" id="minus" aria-label="1台減らす">−</button>
          <input type="number" id="count" inputmode="numeric" min="1" step="1" value="1">
          <button type="button" class="sbtn" id="plus" aria-label="1台増やす">＋</button>
        </div>
      </div>
      <div class="subtotal" id="subtotal" aria-live="polite">車格を選んでください</div>
      <button class="btn" id="send" type="submit">登録</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section class="card" aria-labelledby="sumTitle">
    <h2 id="sumTitle">カレンダー</h2>
    <div class="calnav">
      <button type="button" class="sbtn" id="prevM" aria-label="前の月">◀</button>
      <span id="monthLabel"></span>
      <button type="button" class="sbtn" id="nextM" aria-label="次の月">▶</button>
    </div>
    <div class="cal" id="cal"></div>
    <div class="total"><span id="totalLabel">月の合計</span><span><b id="grand">0</b> ㎥</span></div>
    <div id="detail"></div>
    <p class="msg" id="listMsg" role="status" aria-live="polite"></p>
  </section>

  <section class="card">
    <details class="settings" id="settings">
      <summary>積載量の設定</summary>
      <p class="hint">車格ごとの1台あたりの積載量（㎥）です。一度入れたら全員共通で使われます。変えても、もう登録した記録の量は変わりません。</p>
      <div class="sethead"><span>車格</span><span>積載量(㎥)</span><span></span></div>
      <div id="setRows"></div>
      <div class="btns">
        <button type="button" class="btn sub" id="addSize">＋ 車格を追加</button>
        <button type="button" class="btn" id="saveSet">設定を保存</button>
      </div>
      <p class="msg" id="setMsg" role="status" aria-live="polite"></p>
    </details>
  </section>
</main>
<script>
// ============================================
// GASのWebアプリURL(デプロイしたらここに貼る)
// ============================================
const GAS_URL = "";

const $ = (id) => document.getElementById(id);
let sizes = [];    // [{name, load}]
let records = [];  // [{id, date, size, load, count, total}]

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function num(n){ return String(Math.round(Number(n) * 100) / 100); }
function ymd(d){ return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function jpDate(s){
  const [y, m, d] = s.split("-").map(Number);
  const w = "日月火水木金土"[new Date(y, m - 1, d).getDay()];
  return m + "/" + d + "（" + w + "）";
}
function setMsg(el, text, kind){ el.textContent = text; el.className = "msg" + (kind ? " " + kind : ""); }

async function api(body){
  if (!GAS_URL) throw new Error("送信先(GAS_URL)が未設定です");
  const r = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "エラー");
  return j.result;
}

// ---------- 入力 ----------
function renderSizes(){
  const keep = (document.querySelector('input[name="size"]:checked') || {}).value;
  $("sizes").innerHTML = sizes.length
    ? sizes.map((s, i) => '<label class="choice"><input type="radio" name="size" value="' + esc(s.name) + '"' + ((keep ? keep === s.name : i === 0) ? " checked" : "") + '><span>' + esc(s.name) + '<small>1台 ' + num(s.load) + '㎥</small></span></label>').join("")
    : '<p class="empty">下の「積載量の設定」で車格を登録してください</p>';
  updateSubtotal();
}
function currentSize(){
  const v = (document.querySelector('input[name="size"]:checked') || {}).value;
  return sizes.find(s => s.name === v);
}
function currentCount(){ return Math.floor(Number($("count").value)); }
function updateSubtotal(){
  const s = currentSize(), c = currentCount();
  $("subtotal").innerHTML = (s && c > 0)
    ? esc(s.name) + " " + num(s.load) + "㎥ × " + c + "台 ＝ <b>" + num(s.load * c) + "</b> ㎥"
    : "車格と台数を入れてください";
}
$("sizes").addEventListener("change", updateSubtotal);
$("count").addEventListener("input", updateSubtotal);
$("minus").addEventListener("click", () => { $("count").value = Math.max(1, currentCount() - 1 || 1); updateSubtotal(); });
$("plus").addEventListener("click", () => { $("count").value = Math.max(0, currentCount() || 0) + 1; updateSubtotal(); });

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const s = currentSize(), c = currentCount(), date = $("date").value;
  if (!date)        return setMsg($("msg"), "日付を入れてください", "ng");
  if (!s)           return setMsg($("msg"), "車格を選んでください", "ng");
  if (!(c > 0))     return setMsg($("msg"), "台数は1以上で入れてください", "ng");
  $("send").disabled = true; $("send").textContent = "登録中…"; setMsg($("msg"), "");
  try {
    const rec = await api({ action: "add", data: { date: date, size: s.name, count: c } });
    records.push(rec);
    const [y, m] = date.split("-").map(Number);
    viewY = y; viewM = m - 1; selDate = date;
    renderDays();
    setMsg($("msg"), jpDate(date) + " " + s.name + " " + c + "台（" + num(rec.total) + "㎥）を登録しました", "ok");
    $("count").value = 1; updateSubtotal();
  } catch (err) {
    setMsg($("msg"), "登録できませんでした: " + err.message, "ng");
  } finally {
    $("send").disabled = false; $("send").textContent = "登録";
  }
});

// ---------- カレンダー ----------
let viewY, viewM;   // 表示中の年・月(月は0始まり)
let selDate = "";   // タップした日 yyyy-MM-dd

function dayTotals(){
  const t = {};
  records.forEach(r => { t[r.date] = (t[r.date] || 0) + Number(r.total); });
  return t;
}
function renderDays(){
  const totals = dayTotals();
  const today = ymd(new Date());
  const first = new Date(viewY, viewM, 1).getDay();
  const last = new Date(viewY, viewM + 1, 0).getDate();
  $("monthLabel").textContent = viewY + "年" + (viewM + 1) + "月";
  $("totalLabel").textContent = (viewM + 1) + "月の合計";
  let html = "日月火水木金土".split("").map((w, i) => '<div class="wd' + (i === 0 ? " sun" : i === 6 ? " sat" : "") + '">' + w + '</div>').join("");
  for (let i = 0; i < first; i++) html += '<div class="cell blank"></div>';
  let month = 0;
  for (let d = 1; d <= last; d++) {
    const key = ymd(new Date(viewY, viewM, d));
    const w = (first + d - 1) % 7;
    const v = totals[key];
    if (v) month += v;
    html += '<button type="button" class="cell' + (w === 0 ? " sun" : w === 6 ? " sat" : "") + (key === today ? " today" : "") + (key === selDate ? " sel" : "") +
      '" data-date="' + key + '" aria-label="' + jpDate(key) + (v ? " " + num(v) + "立米" : " 記録なし") + '"><span class="dn">' + d + '</span>' +
      (v ? '<span class="v">' + num(v) + '</span>' : "") + '</button>';
  }
  $("cal").innerHTML = html;
  $("grand").textContent = num(month);
  renderDetail();
}
function renderDetail(){
  if (!selDate) { $("detail").innerHTML = ""; return; }
  const recs = records.filter(r => r.date === selDate);
  const sum = recs.reduce((a, r) => a + Number(r.total), 0);
  $("detail").innerHTML = '<div class="day"><div class="day-head"><span class="d">' + jpDate(selDate) + '</span><span class="sum">' + num(sum) + ' ㎥</span></div>' +
    (recs.length
      ? recs.map(r => '<div class="recrow"><span>' + esc(r.size) + ' × ' + r.count + '台 ＝ ' + num(r.total) + '㎥</span><button type="button" class="del" data-id="' + esc(r.id) + '">削除</button></div>').join("")
      : '<p class="empty">この日の記録はありません</p>') +
    '</div>';
}
$("cal").addEventListener("click", (e) => {
  const cell = e.target.closest(".cell"); if (!cell || !cell.dataset.date) return;
  selDate = cell.dataset.date; setMsg($("listMsg"), "");
  renderDays();
});
$("prevM").addEventListener("click", () => { viewM--; if (viewM < 0) { viewM = 11; viewY--; } renderDays(); });
$("nextM").addEventListener("click", () => { viewM++; if (viewM > 11) { viewM = 0; viewY++; } renderDays(); });
$("detail").addEventListener("click", async (e) => {
  const id = e.target.dataset && e.target.dataset.id; if (!id) return;
  const r = records.find(x => x.id === id); if (!r) return;
  if (!confirm(jpDate(r.date) + " " + r.size + " × " + r.count + "台 を削除しますか？")) return;
  e.target.disabled = true;
  try {
    await api({ action: "delete", id: id });
    records = records.filter(x => x.id !== id);
    renderDays();
    setMsg($("listMsg"), "削除しました", "ok");
  } catch (err) {
    e.target.disabled = false;
    setMsg($("listMsg"), "削除できませんでした: " + err.message, "ng");
  }
});

// ---------- 積載量の設定 ----------
function setRowHtml(s){
  return '<div class="setrow"><input type="text" class="sname" aria-label="車格" placeholder="例：10t車" value="' + esc(s.name) + '">' +
    '<input type="number" class="sload" aria-label="積載量（㎥）" inputmode="decimal" min="0" step="0.1" value="' + esc(s.load) + '">' +
    '<button type="button" class="del" aria-label="この車格を消す">削除</button></div>';
}
function renderSetRows(){ $("setRows").innerHTML = sizes.map(setRowHtml).join(""); }
$("addSize").addEventListener("click", () => { $("setRows").insertAdjacentHTML("beforeend", setRowHtml({ name: "", load: "" })); });
$("setRows").addEventListener("click", (e) => { if (e.target.classList.contains("del")) e.target.closest(".setrow").remove(); });
$("saveSet").addEventListener("click", async () => {
  const rows = [...document.querySelectorAll("#setRows .setrow")].map(row => ({
    name: row.querySelector(".sname").value.trim(),
    load: Number(row.querySelector(".sload").value)
  })).filter(s => s.name);
  if (rows.some(s => !(s.load > 0))) return setMsg($("setMsg"), "積載量は0より大きい数を入れてください", "ng");
  if (new Set(rows.map(s => s.name)).size !== rows.length) return setMsg($("setMsg"), "同じ車格名が2つあります", "ng");
  $("saveSet").disabled = true; setMsg($("setMsg"), "保存中…");
  try {
    sizes = await api({ action: "saveSettings", sizes: rows });
    renderSetRows(); renderSizes();
    setMsg($("setMsg"), "保存しました", "ok");
  } catch (err) {
    setMsg($("setMsg"), "保存できませんでした: " + err.message, "ng");
  } finally {
    $("saveSet").disabled = false;
  }
});

// ---------- 最初の読み込み ----------
(async function init(){
  const now = new Date();
  $("date").value = ymd(now);
  viewY = now.getFullYear(); viewM = now.getMonth();
  renderDays();
  try {
    const res = await api({ action: "init" });
    sizes = res.sizes; records = res.records;
    renderSizes(); renderSetRows(); renderDays();
  } catch (err) {
    $("sizes").innerHTML = '<p class="empty">読み込めませんでした</p>';
    setMsg($("listMsg"), err.message, "ng");
  }
})();
</script>
</body>
</html>
