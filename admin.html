<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>現場ポータル 管理</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #f5f6f8; color: #222; padding-bottom: 80px; }
    header { background: #2c3e50; color: #fff; padding: 18px 16px 14px; }
    header h1 { font-size: 20px; }
    header .sub { font-size: 13px; opacity: .85; margin-top: 4px; }
    main { max-width: 600px; margin: 0 auto; padding: 12px 12px 0; }
    .card { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .card h2 { font-size: 15px; color: #1e5aa8; margin-bottom: 10px; }
    label.lb { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
    input, textarea, select { width: 100%; padding: 14px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px; font-family: inherit; background: #fff; }
    textarea { line-height: 1.6; }
    button { width: 100%; padding: 16px; font-size: 17px; font-weight: bold; border: none; border-radius: 10px; background: #1e5aa8; color: #fff; cursor: pointer; }
    button:active { opacity: .8; }
    button:disabled { background: #aaa; }
    button.sub2 { background: #fff; color: #1e5aa8; border: 2px solid #1e5aa8; }
    .row2 { display: flex; gap: 8px; } .row2 > * { flex: 1; min-width: 0; }
    .chk { display: flex; align-items: center; gap: 8px; font-size: 15px; margin-bottom: 12px; }
    .chk input { width: 22px; height: 22px; margin: 0; flex: none; }
    .msg { text-align: center; font-size: 14px; min-height: 20px; margin-top: 8px; }
    .ok { color: #1a8a3c; } .ng { color: #c0392b; }
    .item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
    .item:last-child { border-bottom: none; }
    .item .t { flex: 1; min-width: 0; font-size: 15px; word-break: break-all; }
    .item .s { font-size: 12px; color: #888; }
    .item .t a { color: #1e5aa8; }
    .item button { width: auto; flex: none; padding: 9px 14px; font-size: 14px; background: #fff; color: #c0392b; border: 1px solid #c0392b; border-radius: 8px; font-weight: normal; }
    .badge { display: inline-block; font-size: 11px; background: #fdecea; color: #c0392b; border-radius: 4px; padding: 1px 6px; margin-left: 4px; }
    .empty { color: #999; font-size: 14px; }
    .hint { font-size: 12px; color: #888; margin-top: 6px; line-height: 1.6; }
    nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #fff; border-top: 1px solid #ddd; }
    nav.tabs button { background: none; color: #666; font-size: 11px; padding: 10px 0 12px; border-radius: 0; font-weight: normal; }
    nav.tabs button .ic { display: block; font-size: 20px; margin-bottom: 2px; }
    nav.tabs button.on { color: #1e5aa8; font-weight: bold; }
    .sec { display: none; } .sec.on { display: block; }
    #status { text-align: center; color: #888; font-size: 13px; padding: 20px; }
    .back { display: block; text-align: center; color: #1e5aa8; font-size: 14px; margin: 8px 0 16px; }
    #qrBox { display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 0; }
    #qrBox img.qr { width: 180px; height: 180px; }
    .p-arrow { font-size: 26px; color: #1e5aa8; }
    .p-cap { font-size: 12px; color: #666; text-align: center; margin-top: 4px; }
    .phone { width: 150px; background: #fff; border: 3px solid #333; border-radius: 18px; overflow: hidden; text-align: left; font-size: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.15); font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    .phone .ph-head { background: #1e5aa8; color: #fff; padding: 8px 7px 6px; }
    .phone.adm .ph-head { background: #2c3e50; }
    .phone .ph-head b { font-size: 9.5px; display: block; }
    .phone .ph-head span { opacity: .85; font-size: 7px; }
    .phone .ph-body { padding: 5px; background: #f5f6f8; min-height: 150px; }
    .phone .ph-card { background: #fff; border-radius: 5px; padding: 5px 6px; margin-bottom: 5px; }
    .phone .ph-card h4 { font-size: 7.5px; color: #1e5aa8; margin-bottom: 3px; }
    .phone .ph-line { display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 2px 0; border-bottom: 1px solid #eee; }
    .phone .ph-line:last-child { border-bottom: none; }
    .phone .ph-line .nm { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .phone .ph-line small { color: #888; font-size: 6.5px; }
    .phone .ph-tel { background: #1a8a3c; color: #fff; border-radius: 3px; padding: 1px 4px; font-size: 7px; flex: none; }
    .phone .ph-d { color: #c0392b; font-weight: bold; margin-right: 3px; }
    .phone .ph-tabs { display: flex; border-top: 1px solid #ddd; background: #fff; }
    .phone .ph-tabs div { flex: 1; text-align: center; padding: 3px 0 4px; font-size: 6.5px; color: #666; }
    .phone .ph-tabs div.on { color: #1e5aa8; font-weight: bold; }
    #qrUrl { font-size: 12px; color: #888; word-break: break-all; text-align: center; margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>現場ポータル 管理</h1>
    <div class="sub" id="siteSub">読み込み中...</div>
  </header>

  <main>
    <!-- ログイン -->
    <div id="loginCard" class="card" style="display:none">
      <h2>管理者の合言葉</h2>
      <input id="adminPinInput" type="password" placeholder="管理者の合言葉(ADMIN_PIN)">
      <button onclick="login()">ログイン</button>
      <div class="msg" id="loginMsg"></div>
    </div>

    <div id="status">読み込み中...</div>

    <!-- 連絡先 -->
    <section id="sec-contact" class="sec">
      <div class="card">
        <h2>連絡先を登録</h2>
        <div class="row2">
          <input id="c_name" placeholder="名前">
          <input id="c_role" placeholder="役割(例: 所長)">
        </div>
        <input id="c_company" placeholder="会社名(任意)">
        <input id="c_tel" type="tel" placeholder="電話番号">
        <input id="c_mail" type="email" placeholder="メール(任意)">
        <input id="c_note" placeholder="備考(任意)">
        <label class="chk"><input type="checkbox" id="c_kinkyu"> 緊急連絡先として上に出す</label>
        <button id="c_btn" onclick="addContact()">登録する</button>
        <div class="msg" id="c_msg"></div>
      </div>
      <div class="card">
        <h2>登録済みの連絡先</h2>
        <div id="c_list"></div>
      </div>
    </section>

    <!-- お知らせ -->
    <section id="sec-news" class="sec">
      <div class="card">
        <h2>お知らせを追加</h2>
        <textarea id="n_body" rows="3" placeholder="例: 明日は8:30集合"></textarea>
        <button id="n_btn" onclick="addNews()">追加する</button>
        <div class="msg" id="n_msg"></div>
        <div class="hint">日付は自動で入ります</div>
      </div>
      <div class="card">
        <h2>お知らせ一覧</h2>
        <div id="n_list"></div>
      </div>
    </section>

    <!-- 現場情報・ルール -->
    <section id="sec-info" class="sec">
      <div class="card">
        <h2>現場情報</h2>
        <div id="i_fields"></div>
        <label class="lb">項目を追加(任意)</label>
        <div class="row2">
          <input id="i_newkey" placeholder="項目名(例: 工期)">
          <input id="i_newval" placeholder="内容">
        </div>
        <button id="i_btn" onclick="saveInfo()">現場情報を保存</button>
        <div class="msg" id="i_msg"></div>
        <div class="hint">「現場名」「住所」「工期」はポータル上部に出ます。内容を空にして保存するとその項目は消えます</div>
      </div>
      <div class="card">
        <h2>現場ルール</h2>
        <textarea id="r_body" rows="8" placeholder="1行に1ルール"></textarea>
        <button id="r_btn" onclick="saveRules()">ルールを保存</button>
        <div class="msg" id="r_msg"></div>
      </div>
    </section>

    <!-- 資料 -->
    <section id="sec-docs" class="sec">
      <div class="card">
        <h2>PDF資料をアップロード</h2>
        <input id="d_title" placeholder="表示名(空ならファイル名)">
        <input id="d_file" type="file" accept="application/pdf">
        <button id="d_btn" onclick="uploadPdf()">アップロード</button>
        <div class="msg" id="d_msg"></div>
        <div class="hint">目安: 1ファイル20MBまで。Googleドライブの「現場ポータル_資料」フォルダに保存されます</div>
      </div>
      <div class="card">
        <h2>資料一覧</h2>
        <div id="d_list"></div>
      </div>
    </section>

    <!-- QR -->
    <section id="sec-qr" class="sec">
      <div class="card">
        <h2>掲示用QRを作る</h2>
        <label class="lb">飛び先</label>
        <select id="q_dest" onchange="renderQr()">
          <option value="portal">現場ポータル(職人・職員向け)</option>
          <option value="admin">管理画面(自分用)</option>
        </select>
        <label class="lb">見出し</label>
        <input id="q_title" value="現場ポータル" oninput="renderQr()">
        <label class="lb">説明文</label>
        <textarea id="q_desc" rows="2" oninput="renderQr()">スマホで読み取ると、連絡先・お知らせ・資料が見られます</textarea>
        <div id="qrBox"></div>
        <div id="qrUrl"></div>
        <button style="margin-top:12px" onclick="printQr()">印刷する</button>
      </div>
    </section>

    <a class="back" href="portal.html">← ポータルを見る</a>
  </main>

  <nav class="tabs" id="tabs" style="display:none">
    <button class="on" onclick="showTab('contact')"><span class="ic">📞</span>連絡先</button>
    <button onclick="showTab('news')"><span class="ic">📢</span>お知らせ</button>
    <button onclick="showTab('info')"><span class="ic">🏗</span>現場情報</button>
    <button onclick="showTab('docs')"><span class="ic">📄</span>資料</button>
    <button onclick="showTab('qr')"><span class="ic">🔳</span>QR</button>
  </nav>

  <script>
    // ★ ポータルと同じGASのWebアプリURL
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx-UTuS9k4NNP_bzp_fSF6yEEZe08PSAk9byDCaptjsGry3Fq55jl8xbL3gf8Odyx3IEA/exec';
    const TABS = ['contact', 'news', 'info', 'docs', 'qr'];
    let DATA = null;
    let currentTab = 'contact';

    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function setStatus(msg) { const el = document.getElementById('status'); el.style.display = msg ? 'block' : 'none'; el.textContent = msg || ''; }
    function setMsg(id, text, ok) { const el = document.getElementById(id); el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'ng'); }
    function v(id) { return document.getElementById(id).value.trim(); }

    function showTab(name) {
      currentTab = name;
      document.querySelectorAll('.sec').forEach(s => s.classList.toggle('on', s.id === 'sec-' + name));
      document.querySelectorAll('nav.tabs button').forEach((b, i) => b.classList.toggle('on', TABS[i] === name));
      if (name === 'qr') renderQr();
      window.scrollTo(0, 0);
    }

    // ============================================
    // 通信(管理者PINは端末に保存)
    // ============================================
    function post(action, data) {
      return fetch(GAS_URL, {
        method: 'POST', headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action, data,
          pin: localStorage.getItem('portal_pin') || '',
          adminPin: localStorage.getItem('portal_admin') || ''
        })
      }).then(r => r.json()).then(res => {
        if (!res.ok && res.error === 'ADMIN_PIN_NG') { logout('合言葉が違うよ'); }
        return res;
      });
    }

    function showLogin(msg) {
      setStatus('');
      document.getElementById('loginCard').style.display = 'block';
      document.getElementById('tabs').style.display = 'none';
      document.querySelectorAll('.sec').forEach(s => s.classList.remove('on'));
      document.getElementById('siteSub').textContent = 'ログインしてください';
      if (msg) setMsg('loginMsg', msg, false);
    }

    function logout(msg) { localStorage.removeItem('portal_admin'); showLogin(msg); }

    function login() {
      const pin = v('adminPinInput');
      if (!pin) { setMsg('loginMsg', '合言葉を入れてね', false); return; }
      localStorage.setItem('portal_admin', pin);
      document.getElementById('loginCard').style.display = 'none';
      load();
    }

    function load() {
      if (!localStorage.getItem('portal_admin')) { showLogin(); return; }
      if (!DATA) setStatus('読み込み中...');
      post('adminAll', {}).then(res => {
        if (!res.ok) {
          if (res.error === 'ADMIN_PIN_NG') return;
          setStatus('エラー: ' + res.error); return;
        }
        DATA = res.result;
        setStatus('');
        render();
      }).catch(err => setStatus('通信エラー: ' + err));
    }

    // ============================================
    // 表示
    // ============================================
    function render() {
      const info = DATA['現場情報'] || [];
      const get = k => (info.find(r => r['項目'] === k) || {})['内容'] || '';
      document.getElementById('siteSub').textContent = get('現場名') || '現場名未登録';

      // 連絡先
      const cs = (DATA['連絡先'] || []).slice().sort((a, b) => (b['緊急'] ? 1 : 0) - (a['緊急'] ? 1 : 0));
      document.getElementById('c_list').innerHTML = cs.length ? cs.map(r => `
        <div class="item">
          <div class="t">
            <b>${esc(r['名前'] || r['会社'])}</b>${r['緊急'] ? '<span class="badge">緊急</span>' : ''}<br>
            <span class="s">${esc([r['役割'], r['名前'] ? r['会社'] : ''].filter(Boolean).join(' / '))}</span><br>
            <span class="s">${esc(r['電話'])}${r['メール'] ? ' / ' + esc(r['メール']) : ''}</span>
            ${r['備考'] ? `<br><span class="s">${esc(r['備考'])}</span>` : ''}
          </div>
          <button onclick="delRow('連絡先', ${Number(r._row)})">削除</button>
        </div>`).join('') : '<div class="empty">まだありません</div>';

      // お知らせ
      const ns = DATA['お知らせ'] || [];
      document.getElementById('n_list').innerHTML = ns.length ? ns.slice().reverse().map(r => `
        <div class="item">
          <div class="t"><span class="s">${esc(r['日付'])}</span><br>${esc(r['内容'])}</div>
          <button onclick="delRow('お知らせ', ${Number(r._row)})">削除</button>
        </div>`).join('') : '<div class="empty">まだありません</div>';

      // 現場情報(現場名・住所は必ず出す)
      const keys = info.map(r => r['項目']);
      const rows = info.slice();
      ['現場名', '住所'].forEach(k => { if (!keys.includes(k)) rows.unshift({ '項目': k, '内容': '' }); });
      document.getElementById('i_fields').innerHTML = rows.map(r => `
        <label class="lb">${esc(r['項目'])}</label>
        <textarea class="i_val" rows="1" data-key="${esc(r['項目'])}">${esc(r['内容'])}</textarea>`).join('');

      // ルール
      document.getElementById('r_body').value = (DATA['現場ルール'] || []).map(r => r['内容']).join('\n');

      // 資料
      const ds = DATA['資料'] || [];
      document.getElementById('d_list').innerHTML = ds.length ? ds.slice().reverse().map(r => `
        <div class="item">
          <div class="t"><a href="${esc(r['URL'])}" target="_blank" rel="noopener">📄 ${esc(r['名前'])}</a><br><span class="s">${esc(r['日付'])}</span></div>
          <button onclick="delPdf(${Number(r._row)})">削除</button>
        </div>`).join('') : '<div class="empty">まだありません</div>';

      document.getElementById('tabs').style.display = 'flex';
      showTab(currentTab);
    }

    // ============================================
    // 登録・保存・削除
    // ============================================
    function run(btnId, msgId, action, data, okText, onOk) {
      const btn = btnId && document.getElementById(btnId);
      if (btn) btn.disabled = true;
      if (msgId) setMsg(msgId, '送信中...', true);
      return post(action, data).then(res => {
        if (btn) btn.disabled = false;
        if (!res.ok) { if (msgId) setMsg(msgId, 'エラー: ' + res.error, false); else alert('エラー: ' + res.error); return; }
        if (msgId) setMsg(msgId, okText, true);
        if (onOk) onOk(res);
        load();
      }).catch(err => {
        if (btn) btn.disabled = false;
        if (msgId) setMsg(msgId, '通信エラー: ' + err, false); else alert('通信エラー: ' + err);
      });
    }

    function addContact() {
      if (!v('c_name') && !v('c_company')) { setMsg('c_msg', '名前か会社名は入れてね', false); return; }
      if (!v('c_tel') && !v('c_mail')) { setMsg('c_msg', '電話かメールは入れてね', false); return; }
      run('c_btn', 'c_msg', 'addContact', {
        '区分': '職員', '役割': v('c_role'), '会社': v('c_company'), '名前': v('c_name'),
        '電話': v('c_tel'), 'メール': v('c_mail'), '備考': v('c_note'),
        '緊急': document.getElementById('c_kinkyu').checked ? '○' : ''
      }, '登録したよ!', () => {
        ['c_name','c_role','c_company','c_tel','c_mail','c_note'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('c_kinkyu').checked = false;
      });
    }

    function addNews() {
      if (!v('n_body')) { setMsg('n_msg', '内容を入れてね', false); return; }
      run('n_btn', 'n_msg', 'addNews', { '内容': v('n_body') }, '追加したよ!', () => document.getElementById('n_body').value = '');
    }

    function saveInfo() {
      const items = [...document.querySelectorAll('.i_val')]
        .map(el => ({ '項目': el.dataset.key, '内容': el.value.trim() }))
        .filter(r => r['内容'] !== '');
      if (v('i_newkey')) items.push({ '項目': v('i_newkey'), '内容': v('i_newval') });
      run('i_btn', 'i_msg', 'setInfo', items, '保存したよ!', () => {
        document.getElementById('i_newkey').value = ''; document.getElementById('i_newval').value = '';
      });
    }

    function saveRules() {
      const lines = document.getElementById('r_body').value.split('\n').map(s => s.trim()).filter(Boolean);
      run('r_btn', 'r_msg', 'setRules', lines, '保存したよ!');
    }

    function delRow(sheet, row) {
      if (!confirm('削除する？')) return;
      run(null, null, 'deleteRow', { sheet, row });
    }

    function delPdf(row) {
      if (!confirm('この資料を削除する？(ドライブのファイルもゴミ箱へ)')) return;
      run(null, null, 'deletePdf', { row });
    }

    function uploadPdf() {
      const f = document.getElementById('d_file').files[0];
      if (!f) { setMsg('d_msg', 'PDFを選んでね', false); return; }
      if (f.size > 20 * 1024 * 1024) { setMsg('d_msg', '20MB以下にしてね', false); return; }
      const btn = document.getElementById('d_btn'); btn.disabled = true;
      setMsg('d_msg', 'アップロード中...(' + Math.round(f.size / 1024) + 'KB)', true);
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = reader.result.split(',')[1];
        btn.disabled = false;
        run('d_btn', 'd_msg', 'uploadPdf', { name: f.name, title: v('d_title'), base64 }, 'アップロードしたよ!', () => {
          document.getElementById('d_file').value = ''; document.getElementById('d_title').value = '';
        });
      };
      reader.onerror = () => { btn.disabled = false; setMsg('d_msg', 'ファイルの読み込みに失敗', false); };
      reader.readAsDataURL(f);
    }

    // ============================================
    // QR(掲示用)
    // ============================================
    function qrTarget() {
      const file = v('q_dest') === 'admin' ? 'admin.html' : 'portal.html';
      return new URL(file, location.href).href.split('?')[0].split('#')[0];
    }
    function qrImg(url, size) {
      return 'https://api.qrserver.com/v1/create-qr-code/?size=' + size + 'x' + size + '&margin=10&data=' + encodeURIComponent(url);
    }
    // 「開くとこんな画面」の見本(実データの先頭数件で描く・電話番号は出さない)
    function phoneHtml() {
      const d = DATA || {};
      const info = d['現場情報'] || [];
      const get = k => (info.find(r => r['項目'] === k) || {})['内容'] || '';
      const site = get('現場名') || '現場ポータル';
      if (v('q_dest') === 'admin') {
        return `<div class="phone adm">
          <div class="ph-head"><b>現場ポータル 管理</b><span>${esc(site)}</span></div>
          <div class="ph-body">
            <div class="ph-card"><h4>連絡先を登録</h4>
              <div class="ph-line"><span class="nm">名前・役割・電話…</span></div>
              <div class="ph-line"><span class="nm" style="color:#1e5aa8;font-weight:bold">登録する</span></div></div>
            <div class="ph-card"><h4>お知らせを追加</h4><div class="ph-line"><span class="nm">内容を入力…</span></div></div>
            <div class="ph-card"><h4>PDF資料</h4><div class="ph-line"><span class="nm">アップロード</span></div></div>
          </div>
          <div class="ph-tabs"><div class="on">📞<br>連絡先</div><div>📢<br>お知らせ</div><div>🏗<br>現場</div><div>📄<br>資料</div></div>
        </div>`;
      }
      const news = (d['お知らせ'] || []).slice().reverse().slice(0, 2);
      const cs = (d['連絡先'] || []).slice().sort((a, b) => (b['緊急'] ? 1 : 0) - (a['緊急'] ? 1 : 0)).slice(0, 3);
      const docs = (d['資料'] || []).slice().reverse().slice(0, 2);
      return `<div class="phone">
        <div class="ph-head"><b>${esc(site)}</b><span>${esc(get('住所'))}</span></div>
        <div class="ph-body">
          <div class="ph-card"><h4>お知らせ</h4>
            ${news.length ? news.map(r => `<div class="ph-line"><span class="nm"><span class="ph-d">${esc(r['日付'])}</span>${esc(r['内容'])}</span></div>`).join('')
              : '<div class="ph-line"><span class="nm">明日は8:30集合</span></div>'}
          </div>
          <div class="ph-card"><h4>連絡先</h4>
            ${cs.length ? cs.map(r => `<div class="ph-line"><span class="nm">${r['緊急'] ? '🚨' : ''}${esc(r['名前'] || r['会社'])}<br><small>${esc(r['役割'])}</small></span>${r['電話'] ? '<span class="ph-tel">📞</span>' : ''}</div>`).join('')
              : '<div class="ph-line"><span class="nm">所長<br><small>現場代理人</small></span><span class="ph-tel">📞</span></div>'}
          </div>
          <div class="ph-card"><h4>資料(PDF)</h4>
            ${docs.length ? docs.map(r => `<div class="ph-line"><span class="nm">📄 ${esc(r['名前'])}</span></div>`).join('')
              : '<div class="ph-line"><span class="nm">📄 工程表</span></div>'}
          </div>
        </div>
        <div class="ph-tabs"><div class="on">🏗<br>ホーム</div><div>📞<br>連絡先</div><div>📋<br>ルール</div></div>
      </div>`;
    }

    function renderQr() {
      const url = qrTarget();
      document.getElementById('qrBox').innerHTML = `
        <div><img class="qr" src="${esc(qrImg(url, 360))}" alt="QR"><div class="p-cap">読み取る</div></div>
        <div class="p-arrow">➜</div>
        <div>${phoneHtml()}<div class="p-cap">開くとこんな画面</div></div>`;
      document.getElementById('qrUrl').textContent = url;
    }
    const PHONE_STYLE = `.phone { width: 150px; background: #fff; border: 3px solid #333; border-radius: 18px; overflow: hidden; text-align: left; font-size: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.15); font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    .phone .ph-head { background: #1e5aa8; color: #fff; padding: 8px 7px 6px; }
    .phone.adm .ph-head { background: #2c3e50; }
    .phone .ph-head b { font-size: 9.5px; display: block; }
    .phone .ph-head span { opacity: .85; font-size: 7px; }
    .phone .ph-body { padding: 5px; background: #f5f6f8; min-height: 150px; }
    .phone .ph-card { background: #fff; border-radius: 5px; padding: 5px 6px; margin-bottom: 5px; }
    .phone .ph-card h4 { font-size: 7.5px; color: #1e5aa8; margin-bottom: 3px; }
    .phone .ph-line { display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 2px 0; border-bottom: 1px solid #eee; }
    .phone .ph-line:last-child { border-bottom: none; }
    .phone .ph-line .nm { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .phone .ph-line small { color: #888; font-size: 6.5px; }
    .phone .ph-tel { background: #1a8a3c; color: #fff; border-radius: 3px; padding: 1px 4px; font-size: 7px; flex: none; }
    .phone .ph-d { color: #c0392b; font-weight: bold; margin-right: 3px; }
    .phone .ph-tabs { display: flex; border-top: 1px solid #ddd; background: #fff; }
    .phone .ph-tabs div { flex: 1; text-align: center; padding: 3px 0 4px; font-size: 6.5px; color: #666; }
    .phone .ph-tabs div.on { color: #1e5aa8; font-weight: bold; }`;

    function printQr() {
      const url = qrTarget();
      const siteName = DATA ? ((DATA['現場情報'] || []).find(r => r['項目'] === '現場名') || {})['内容'] || '' : '';
      const dest = v('q_dest') === 'admin' ? '管理画面' : '現場ポータル';
      const w = window.open('', '_blank');
      if (!w) { alert('ポップアップがブロックされたよ。許可してもう一度押してね'); return; }
      w.document.write(`<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>QR掲示</title>
        <style>
          @page { size: A4; margin: 15mm; }
          body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; text-align: center; color: #222; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
          h1 { font-size: 40px; margin: 30px 0 8px; color: #1e5aa8; }
          .site { font-size: 22px; color: #555; margin-bottom: 24px; }
          .row { display: flex; justify-content: center; align-items: center; gap: 30px; margin: 10px 0; }
          img.qr { width: 300px; height: 300px; }
          .arrow { font-size: 48px; color: #1e5aa8; }
          .cap { font-size: 15px; color: #666; margin-top: 6px; }
          .big { transform: scale(1.5); transform-origin: center; margin: 70px 40px; }
          ${PHONE_STYLE}
          .desc { font-size: 22px; margin: 24px 30px 10px; line-height: 1.6; white-space: pre-wrap; }
          .dest { font-size: 16px; color: #666; }
          .url { font-size: 12px; color: #999; margin-top: 16px; word-break: break-all; }
        </style></head><body>
        <h1>${esc(v('q_title'))}</h1>
        <div class="site">${esc(siteName)}</div>
        <div class="row">
          <div><img class="qr" src="${esc(qrImg(url, 600))}" onload="setTimeout(() => print(), 300)"><div class="cap">① スマホで読み取る</div></div>
          <div class="arrow">➜</div>
          <div><div class="big">${phoneHtml()}</div><div class="cap">② こんな画面が開きます</div></div>
        </div>
        <div class="desc">${esc(v('q_desc'))}</div>
        <div class="dest">▶ 読み取ると「${esc(dest)}」が開きます</div>
        <div class="url">${esc(url)}</div>
        </body></html>`);
      w.document.close();
    }

    load();
  </script>
</body>
</html>
