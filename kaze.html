<!DOCTYPE html>
<html lang="ja">
<head>
<script src="lock.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今の風速</title>
<meta name="color-scheme" content="light dark">
<style>
:root{color-scheme:light;--bg:#f1f3f6;--paper:#fff;--field:#f7f8fa;--ink:#24272e;--muted:#69707d;--line:#dfe3ea;--accent:#2f6fd6;--gust:#c0392b}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#14161b;--paper:#1f222a;--field:#191c23;--ink:#eef1f6;--muted:#a7aebb;--line:#363b47;--accent:#8db4ff;--gust:#ff9a8f}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;color:var(--ink);background:var(--bg);line-height:1.4;overflow:hidden}
.board{height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:2vh;padding:3vh 3vw}

/* 上の段:場所と時刻、端に場所の切りかえ */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.place{font-size:max(16px,4.2vw);font-weight:800}
.time{font-size:max(16px,2.2vw);font-weight:600;color:var(--muted)}
.ctrl{display:flex;gap:8px}
select,button{font:inherit;font-size:16px;min-height:48px;padding:8px 14px;font-weight:600;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);cursor:pointer}
select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* まん中:大きな数字3つ */
.now{display:grid;grid-template-columns:repeat(3,1fr);gap:2vw;min-height:0}
.box{background:var(--paper);border:1px solid var(--line);border-radius:2vw;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2vh 1vw;min-width:0}
.box span{font-size:max(16px,2.6vw);font-weight:700;color:var(--muted)}
.box strong{font-size:max(32px,11vw);font-weight:800;line-height:1.1;white-space:nowrap}
.box strong.dir{font-size:max(28px,7.5vw)}
.box small{font-size:max(16px,2.6vw);font-weight:700;color:var(--muted)}
#gust{color:var(--gust)}

/* 下の段:このあと6時間 */
.hours{display:grid;grid-template-columns:auto repeat(6,1fr);gap:1vw;background:var(--paper);border:1px solid var(--line);border-radius:2vw;padding:2vh 2vw;align-items:center;text-align:center}
.hours div{font-size:max(16px,2.2vw);font-weight:700}
.hours .h{color:var(--muted);text-align:left}
.hours .g{color:var(--gust)}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:16px;color:var(--muted)}
</style>
</head>
<body>
<div class="board">
  <div class="top">
    <div>
      <div class="place" id="place">-</div>
      <div class="time" id="time">調べています…</div>
    </div>
    <div class="ctrl">
      <select id="city" aria-label="場所を選ぶ">
        <option value="35.8325,140.1458">印西市</option>
        <option value="35.7917,140.0561">白井市</option>
        <option value="35.7764,140.3183">成田市</option>
        <option value="35.8642,140.0281">我孫子市</option>
        <option value="35.7239,140.2242">佐倉市</option>
        <option value="35.7225,140.0997">八千代市</option>
      </select>
      <button id="here" type="button">今いる場所</button>
    </div>
  </div>

  <div class="now">
    <div class="box"><span>風速</span><strong id="speed">-</strong><small>m/s</small></div>
    <div class="box"><span>最大瞬間風速</span><strong id="gust">-</strong><small>m/s</small></div>
    <div class="box"><span>風の向き</span><strong class="dir" id="dir">-</strong><small>から吹く風</small></div>
  </div>

  <div>
    <div class="hours" id="hours"><div class="h">-</div></div>
    <div class="foot">
      <span id="msg"></span>
      <span>Open-Meteo の予報モデルの値です。現場の風速計の値を優先してください。10分ごとに新しくなります。</span>
    </div>
  </div>
</div>

<script>
const cityEl = document.getElementById('city');
const hereBtn = document.getElementById('here');
const placeEl = document.getElementById('place');
const timeEl = document.getElementById('time');
const speedEl = document.getElementById('speed');
const gustEl = document.getElementById('gust');
const dirEl = document.getElementById('dir');
const msgEl = document.getElementById('msg');
const hoursEl = document.getElementById('hours');

const DIRS = ['北','北北東','北東','東北東','東','東南東','南東','南南東','南','南南西','南西','西南西','西','西北西','北西','北北西'];
const REFRESH_MS = 10 * 60 * 1000;

// 今表示している場所。自動更新のときもこの場所を調べ直す
let current = null;

// 角度(0〜360)を16方位にする。風は「吹いてくる向き」
function dirName(deg) {
  return DIRS[Math.round(deg / 22.5) % 16];
}

// "2026-10-21T11:30" → "11:30"
function hhmm(t) {
  return t.slice(11, 16);
}

async function load() {
  const { lat, lon, name } = current;
  try {
    const url = 'https://api.open-meteo.com/v1/forecast'
      + '?latitude=' + lat + '&longitude=' + lon
      + '&current=wind_speed_10m,wind_gusts_10m,wind_direction_10m'
      + '&hourly=wind_speed_10m,wind_gusts_10m&forecast_hours=7'
      + '&wind_speed_unit=ms&timezone=Asia%2FTokyo';
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();
    const c = d.current;

    placeEl.textContent = name;
    timeEl.textContent = hhmm(c.time) + ' 時点';
    speedEl.textContent = c.wind_speed_10m.toFixed(1);
    gustEl.textContent = c.wind_gusts_10m.toFixed(1);
    dirEl.textContent = dirName(c.wind_direction_10m);
    msgEl.textContent = '';

    // 1件目は今の時間帯なので、その次から6件出す
    const h = d.hourly;
    let t = '<div class="h">時刻</div>';
    let s = '<div class="h">風速</div>';
    let g = '<div class="h">最大瞬間</div>';
    for (let i = 1; i < h.time.length; i++) {
      t += '<div>' + hhmm(h.time[i]) + '</div>';
      s += '<div>' + h.wind_speed_10m[i].toFixed(1) + '</div>';
      g += '<div class="g">' + h.wind_gusts_10m[i].toFixed(1) + '</div>';
    }
    hoursEl.innerHTML = t + s + g;
  } catch (e) {
    // 前の数字は残したまま、次の自動更新でもう一度試す
    msgEl.textContent = '新しくできませんでした。10分後にもう一度試します。';
  }
}

function useCity() {
  const [lat, lon] = cityEl.value.split(',');
  current = { lat, lon, name: cityEl.options[cityEl.selectedIndex].text };
  load();
}

cityEl.addEventListener('change', useCity);

hereBtn.addEventListener('click', () => {
  if (!navigator.geolocation) {
    msgEl.textContent = 'この端末では今いる場所がわかりません。';
    return;
  }
  msgEl.textContent = '今いる場所を調べています…';
  navigator.geolocation.getCurrentPosition(
    p => {
      current = { lat: p.coords.latitude.toFixed(4), lon: p.coords.longitude.toFixed(4), name: '今いる場所' };
      load();
    },
    () => { msgEl.textContent = '場所の許可がないので調べられません。右上から場所を選んでください。'; },
    { timeout: 10000 }
  );
});

useCity();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
