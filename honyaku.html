<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>翻訳(声・エクセル)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<!-- 訳したエクセルの文字の幅を測るための書体(Arial と文字の幅が同じ) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap">
<style>
  :root {
    --bg: #f3f5f8; --card: #fff; --text: #222; --sub: #777; --line: #ccd;
    --field: #fff; --row: #f6f7f9; --accent: #1565c0;
    --err: #c62828; --ok: #2e7d32; --shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --card: #1e2227; --text: #eaeaea; --sub: #aaa; --line: #3a3f46;
      --field: #15181c; --row: #2a2f36; --accent: #4a8be0;
      --err: #ef7a6e; --ok: #5fc97c; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    font-size: 16px; background: var(--bg); color: var(--text);
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 16px; }
  .card {
    background: var(--card); border-radius: 12px; padding: 16px;
    box-shadow: var(--shadow); margin-bottom: 16px;
  }
  label { display: block; font-weight: bold; margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  input[type=file], select {
    width: 100%; font-size: 16px; padding: 10px;
    border: 1px solid var(--line); border-radius: 8px; font-family: inherit;
    background: var(--field); color: var(--text);
  }
  .hint { font-size: 14px; color: var(--sub); margin-top: 4px; }
  .msg { font-size: 16px; margin-top: 10px; min-height: 22px; }
  .msg.err { color: var(--err); }
  .msg.ok { color: var(--ok); }
  button.act {
    width: 100%; font-size: 18px; font-weight: bold; margin-top: 16px;
    padding: 16px; border: none; border-radius: 10px; cursor: pointer;
    background: #1565c0; color: #fff; font-family: inherit;
  }
  button.act:disabled { opacity: .4; cursor: default; }

  .rows { display: flex; flex-direction: column; gap: 10px; }
  .row { background: var(--row); border-radius: 10px; padding: 10px 12px; }
  .addr { font-size: 14px; color: var(--sub); margin-bottom: 4px; }
  .pair { display: grid; grid-template-columns: 1fr; gap: 6px; }
  .pair div { white-space: pre-wrap; word-break: break-word; }
  .to { color: var(--accent); font-weight: bold; }
  @media (min-width: 640px) {
    .pair { grid-template-columns: 1fr 1fr; gap: 12px; }
  }

  h2 { font-size: 18px; margin: 0 0 12px; }
  .langs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
  .langs label { margin-top: 0; }
  button.swap {
    min-width: 52px; min-height: 46px; font-size: 22px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--field); color: var(--text); cursor: pointer;
  }
  button.mic { font-size: 20px; padding: 20px; }
  button.mic.on { background: #c62828; }
  button.sub {
    width: 100%; font-size: 16px; margin-top: 10px; padding: 12px;
    border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
    background: var(--field); color: var(--text); font-family: inherit;
  }
  #vResult { margin-top: 12px; }
  #vResult .pair div { font-size: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>翻訳(声・エクセル)</h1>

  <div class="card">
    <h2>声で翻訳</h2>
    <div class="langs">
      <div>
        <label for="vFrom">話す言語</label>
        <select id="vFrom"></select>
      </div>
      <button id="btnSwap" class="swap" type="button" aria-label="話す言語と訳す言語を入れ替える">⇄</button>
      <div>
        <label for="vTo">訳す言語</label>
        <select id="vTo"></select>
      </div>
    </div>
    <button id="btnMic" class="act mic" type="button">🎤 押して話す</button>
    <div id="vMsg" class="msg"></div>
    <div id="vResult" class="row" hidden>
      <div class="pair">
        <div id="vSaid"></div>
        <div id="vOut" class="to"></div>
      </div>
      <button id="btnSpeak" class="sub" type="button">🔊 もう一度読む</button>
    </div>
  </div>

  <div class="card">
    <h2>エクセル翻訳</h2>
    <label for="file">エクセルを選ぶ</label>
    <input id="file" type="file" accept=".xlsx,.xls,.csv">

    <label for="sheet">シート</label>
    <select id="sheet" disabled></select>

    <label for="lang">訳す言語</label>
    <select id="lang">
      <option value="ja">日本語</option>
      <option value="en">英語</option>
      <option value="vi">ベトナム語</option>
      <option value="zh-CN">中国語(簡体字)</option>
      <option value="ko">韓国語</option>
      <option value="id">インドネシア語</option>
      <option value="tl">タガログ語(フィリピン)</option>
      <option value="ne">ネパール語</option>
      <option value="my">ミャンマー語</option>
      <option value="th">タイ語</option>
      <option value="pt">ポルトガル語</option>
    </select>
    <div class="hint">元の言語は自動で判定します。数字だけのセルは訳しません。</div>

    <button id="btnGo" class="act" disabled>訳す</button>
    <button id="btnAll" class="sub" type="button" disabled>📥 画像・図そのままで全シート訳す</button>
    <div class="hint">.xlsx だけ。全シートとテキストボックスの文字を訳して保存します。画像の中の文字は訳せません。訳が長いと枠からはみ出すことがあります。</div>
    <div id="msg" class="msg"></div>
  </div>

  <div id="result" class="card" hidden>
    <button id="btnSave" class="sub" type="button">📥 訳したエクセルを保存</button>
    <div class="hint">セルの色や罫線は引き継がれません(文字と並びはそのままです)。</div>
    <div id="rows" class="rows" style="margin-top: 12px;"></div>
  </div>
</div>

<script>
// 翻訳用GAS(LanguageApp)のWebアプリURL
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzlCSYzBT_YYmZ7rn5_2g_g1R-ieZ561hYSYWXBXchfSdx5_yt9kesw-9bRaUuI2H87/exec';

const BATCH = 50;        // 1回にGASへ送るセル数
const MAX_CELLS = 2000;  // 1シートで訳すセルの上限

const $ = id => document.getElementById(id);
let book = null;
let translated = null;  // 最後に訳したシート(保存用)

function setMsg(text, kind) {
  $('msg').textContent = text;
  $('msg').className = 'msg' + (kind ? ' ' + kind : '');
}

$('file').addEventListener('change', async () => {
  const f = $('file').files[0];
  book = null;
  translated = null;
  $('sheet').innerHTML = '';
  $('sheet').disabled = true;
  $('btnGo').disabled = true;
  $('btnAll').disabled = true;
  $('result').hidden = true;
  if (!f) return;
  try {
    book = XLSX.read(await f.arrayBuffer(), { type: 'array', cellStyles: true });  // 列の幅も読む(保存用)
  } catch (e) {
    setMsg('このファイルは読めませんでした。', 'err');
    return;
  }
  book.SheetNames.forEach(name => {
    const o = document.createElement('option');
    o.value = name; o.textContent = name;
    $('sheet').appendChild(o);
  });
  $('sheet').disabled = false;
  $('btnGo').disabled = false;
  $('btnAll').disabled = !/\.xlsx$/i.test(f.name);
  setMsg('');
});

// シートから訳すセル(文字のあるセル)を順番に取り出す
function pickCells(ws) {
  const cells = [];
  if (!ws['!ref']) return cells;
  const r = XLSX.utils.decode_range(ws['!ref']);
  for (let y = r.s.r; y <= r.e.r; y++) {
    for (let x = r.s.c; x <= r.e.c; x++) {
      const addr = XLSX.utils.encode_cell({ r: y, c: x });
      const c = ws[addr];
      if (!c || c.t !== 's') continue;
      const text = String(c.v).trim();
      // 文字(ひらがな・漢字・アルファベットなど)が1つもないセルは飛ばす
      if (!text || !/\p{L}/u.test(text)) continue;
      cells.push({ addr, text });
    }
  }
  return cells;
}

// 現場の言葉は、そのままだと誤訳されやすいので、訳す前にふつうの日本語に言い換える
// (例:昼礼 →「Daytime Ritual」、地ばい配線 →「Ground wiring」と訳されていた)。長い言葉から順に置き換える
const PRE_EDIT = [
  ['地ばい配線', '床に這わせた配線'],
  ['つまずき養生', 'つまずき防止の保護'],
  ['配線養生', '配線の保護'],
  ['風散養生', '飛散防止対策'],
  ['新規入場者教育', '新しく入場する作業員への安全教育'],
  ['揚重作業', 'クレーンによる揚重作業'],
  ['楊重', '揚重'],
  ['KY活動', '危険予知活動（KY）'],
  ['ＫＹ活動', '危険予知活動（KY）'],
  ['安全帯', '安全帯（墜落制止用器具）'],
  ['親綱', '墜落防止用の親綱ロープ'],
  ['行先表示', '持ち主の表示'],
  ['作業所長', '工事現場の所長'],
  ['一斉清掃', '工事現場の全員での清掃'],
  ['昼礼', '昼の打合せ'],
  ['許可制', '許可が必要'],
  ['持ち帰りです', '各自で持ち帰ってください'],
  ['場内', '工事現場内'],
  ['注意換気', '注意喚起'],
  ['詰所', '作業員の休憩所'],
  ['開口部', '床や壁の開口部'],
  ['裏門', '裏口の門']
];
const preEdit = s => PRE_EDIT.reduce((t, [a, b]) => t.split(a).join(b), s);

// 地図の方位(東・西・南・北の1文字だけ)は、小さい枠に入るよう、地図でふつう使う1文字の略字にする
const COMPASS = {
  en: { 東: 'E', 西: 'W', 南: 'S', 北: 'N' },
  vi: { 東: 'Đ', 西: 'T', 南: 'N', 北: 'B' },
  tl: { 東: 'S', 西: 'K', 南: 'T', 北: 'H' },
  id: { 東: 'T', 西: 'B', 南: 'S', 北: 'U' },
  pt: { 東: 'L', 西: 'O', 南: 'S', 北: 'N' },
  'zh-CN': { 東: '东', 西: '西', 南: '南', 北: '北' },
  ko: { 東: '동', 西: '서', 南: '남', 北: '북' }
};
const compassLabel = (s, target) => (COMPASS[target] || {})[s.trim()];

async function translateBatch(texts, target) {
  if (target !== 'ja') texts = texts.map(preEdit);
  const r = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'translate', texts, target })
  });
  const res = await r.json();
  if (!res.ok) throw new Error(res.error || '翻訳できませんでした');
  return res.texts;
}

function showRows(cells) {
  const box = $('rows');
  box.innerHTML = '';
  cells.forEach(c => {
    const row = document.createElement('div');
    row.className = 'row';
    const addr = document.createElement('div');
    addr.className = 'addr';
    addr.textContent = c.addr;
    const pair = document.createElement('div');
    pair.className = 'pair';
    const from = document.createElement('div');
    from.textContent = c.text;
    const to = document.createElement('div');
    to.className = 'to';
    to.textContent = c.out;
    pair.append(from, to);
    row.append(addr, pair);
    box.appendChild(row);
  });
  $('result').hidden = false;
}

$('btnGo').addEventListener('click', async () => {
  if (!GAS_URL) { setMsg('翻訳用GASのURLがまだ設定されていません。', 'err'); return; }
  if (!book) return;
  const cells = pickCells(book.Sheets[$('sheet').value]);
  if (!cells.length) { setMsg('このシートには訳す文字がありません。', 'err'); return; }
  if (cells.length > MAX_CELLS) {
    setMsg(`文字のあるセルが多すぎます(${cells.length}個)。${MAX_CELLS}個までにしてください。`, 'err');
    return;
  }

  // 同じ文は1回だけ訳す
  const uniq = [...new Set(cells.map(c => c.text))];
  const done = new Map();
  const target = $('lang').value;
  $('btnGo').disabled = true;
  try {
    for (let i = 0; i < uniq.length; i += BATCH) {
      setMsg(`訳しています… ${Math.min(i + BATCH, uniq.length)} / ${uniq.length}`);
      const part = uniq.slice(i, i + BATCH);
      const out = await translateBatch(part, target);
      part.forEach((t, k) => done.set(t, out[k]));
    }
    cells.forEach(c => { c.out = done.get(c.text); });
    showRows(cells);
    translated = {
      cells,
      sheet: $('sheet').value,
      file: $('file').files[0].name.replace(/\.[^.]+$/, ''),
      lang: $('lang').selectedOptions[0].textContent
    };
    setMsg(`${cells.length}個のセルを訳しました。`, 'ok');
  } catch (e) {
    setMsg('翻訳できませんでした:' + e.message, 'err');
  } finally {
    $('btnGo').disabled = false;
  }
});

// 元のシートをコピーして、訳したセルだけ置き換えたエクセルを作る
$('btnSave').addEventListener('click', () => {
  if (!book || !translated) return;
  const src = book.Sheets[translated.sheet];
  const ws = {};
  Object.keys(src).forEach(k => { ws[k] = k[0] === '!' ? src[k] : { ...src[k] }; });
  translated.cells.forEach(c => { ws[c.addr] = { t: 's', v: c.out }; });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, translated.sheet);
  XLSX.writeFile(wb, `${translated.file}_${translated.lang}.xlsx`);
});

// ===== 画像・図そのままで全シート訳す =====
// .xlsx の中の文字の部分(XML)だけを訳した文に差し替え、画像・図形・書式には触らない
const NS_MAIN = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
const NS_DRAW = 'http://schemas.openxmlformats.org/drawingml/2006/main';
const NS_XML = 'http://www.w3.org/XML/1998/namespace';
// どのファイルの、どのまとまり(セル1つ・図形の段落1つ)を訳すか
const XML_PARTS = [
  { re: /^xl\/sharedStrings\.xml$/, ns: NS_MAIN, unit: 'si' },        // セルの文字
  { re: /^xl\/worksheets\/sheet\d+\.xml$/, ns: NS_MAIN, unit: 'is' }, // セルに直接書かれた文字
  { re: /^xl\/drawings\/drawing\d+\.xml$/, ns: NS_DRAW, unit: 'p', box: true }, // テキストボックス・図形
  { re: /^xl\/charts\/chart\d+\.xml$/, ns: NS_DRAW, unit: 'p' }       // グラフの文字
];

// まとまりごとに文字のノードを集める(ふりがなは除く)。idx は sharedStrings の番号に使う
function collectUnits(doc, ns, unit) {
  const units = [];
  [...doc.getElementsByTagNameNS(ns, unit)].forEach((u, idx) => {
    const nodes = [...u.getElementsByTagNameNS(ns, 't')].filter(t => t.parentNode.localName !== 'rPh');
    const text = nodes.map(t => t.textContent).join('');
    if (!text.trim() || !/\p{L}/u.test(text)) return;
    units.push({ el: u, idx, nodes, text });
  });
  return units;
}

// ----- 枠やセルに収める -----
// 文字の幅はブラウザで実際に測る。英字の訳は Arimo(Arial と文字の幅が同じ書体)、日本語はゴシックで測る。
// 行の高さ・列の幅はエクセルの計算のしかたに合わせる
const EMU_PT = 12700;      // 図形の大きさの単位(EMU)→ pt
const PT_PX = 96 / 72;     // pt → 画面の px(エクセルは 96dpi で計算する)
const PRINT_MARGIN = 1.03; // 印刷で少し広がる分の余裕
const MIN_RATE = 0.5;      // テキストボックス:元の大きさの半分より小さくしない
const CELL_MIN_RATE = 0.8; // セル:折り返して行を広げずに収めるとき、小さくするのは 8割まで
const LINE_MIN_RATE = 0.7; // セル:1行のまま小さくして収めるのは 7割まで(それより長ければ折り返す)
const GROW_RATES = [0.9, 0.85, 0.8, 0.75, 0.7, 0.65, 0.6]; // 行を広げるときの文字の大きさの候補
const GROW_BUDGET = 0.2;   // 行を広げるのは、シート全体の高さの 2割まで(A3 1枚に収める設定なので)
const MAX_ROW_H = 409;     // エクセルの行の高さの上限(pt)
// 英字の言語は、アクセント記号まで入っている Arial にする(MS Pゴシックにない字で書体が混ざらないように)
const LATIN_LANGS = ['en', 'vi', 'tl', 'id', 'pt'];
const LATIN_FONT = 'Arial';
const FONT_STACK = {
  latin: 'Arimo, Arial, sans-serif',
  ja: '"MS PGothic", "ＭＳ Ｐゴシック", "Hiragino Sans", "Noto Sans JP", sans-serif'
};
// 1行の高さ(文字の大きさに対する倍率)。エクセルの行の高さの出し方に合わせた値
const LINE_EM = { latin: 1.149, ja: 1.0 };

const measureCtx = document.createElement('canvas').getContext('2d');
const measureCache = new Map();
// 文字の幅(pt)
function textW(s, size, fam, bold) {
  const key = fam + (bold ? 'b|' : '|') + s;
  let em = measureCache.get(key);
  if (em === undefined) {
    measureCtx.font = `${bold ? 'bold ' : ''}100px ${FONT_STACK[fam]}`;
    em = measureCtx.measureText(s).width / 100;
    measureCache.set(key, em);
  }
  return em * size * PRINT_MARGIN;
}

// 折り返したときの行数。英字は単語の切れ目、漢字・かなは1文字ずつで折り返す。行の終わりの空白は数えない
const WRAP_TOKEN = /[⺀-｠￠-￯]|[^\s⺀-｠￠-￯]+|\s+/g;
function countLines(text, size, width, fam, bold) {
  let lines = 0;
  for (const para of text.split('\n')) {
    lines++;
    let x = 0;
    for (const tok of para.match(WRAP_TOKEN) || []) {
      const w = textW(tok, size, fam, bold);
      if (/^\s+$/.test(tok) || x + w <= width) { x += w; continue; }
      if (x > 0) { lines++; x = 0; }
      if (w <= width) { x = w; continue; }
      // 1語が行の幅より長いときは、文字の途中で折り返す
      for (const ch of tok) {
        const cw = textW(ch, size, fam, bold);
        if (x + cw > width && x > 0) { lines++; x = 0; }
        x += cw;
      }
    }
  }
  return lines;
}

// 1行の高さ(pt)。エクセルは px に丸めて計算する
const lineH = (size, fam) => Math.round(size * PT_PX * LINE_EM[fam]) / PT_PX;

// 1.0 から 0.05 ずつ下げて、収まる最初の倍率を返す(収まらなければ 0)
function bestRate(fits, min) {
  for (let r = 1; r >= min - 1e-9; r -= 0.05) {
    const rate = Math.round(r * 100) / 100;
    if (fits(rate)) return rate;
  }
  return 0;
}

const childOf = (el, name) => el && [...el.children].find(e => e.localName === name);
const isOn = el => !!el && !['0', 'false'].includes(el.getAttribute('val') || el.getAttribute('b') || '1');

// 図形の文字の書体を Arial にする(a:rPr の中の a:latin。決まった並び順の位置に入れる)
function setDrawFont(rPr) {
  let latin = childOf(rPr, 'latin');
  if (!latin) {
    latin = rPr.ownerDocument.createElementNS(NS_DRAW, 'a:latin');
    const next = [...rPr.children].find(e => ['ea', 'cs', 'sym', 'hlinkClick', 'hlinkMouseOver', 'rtl', 'extLst'].includes(e.localName));
    rPr.insertBefore(latin, next || null);
  }
  latin.setAttribute('typeface', LATIN_FONT);
}

// テキストボックス・図形:箱の幅で折り返し、箱の高さに収まる大きさにする(sz は 1/100 pt)
function fitBoxes(units, latin) {
  const fam = latin ? 'latin' : 'ja';
  const boxes = new Set(units.map(u => u.el.parentNode));
  boxes.forEach(box => {
    const doc = box.ownerDocument;
    if (latin) {
      // 訳した段落の文字の部分すべてを Arial に
      units.filter(u => u.el.parentNode === box).forEach(u => {
        for (const r of [...u.el.children].filter(e => ['r', 'fld'].includes(e.localName))) {
          let rPr = childOf(r, 'rPr');
          if (!rPr) { rPr = doc.createElementNS(NS_DRAW, 'a:rPr'); r.insertBefore(rPr, r.firstChild); }
          setDrawFont(rPr);
        }
        const end = childOf(u.el, 'endParaRPr');
        if (end) setDrawFont(end);
      });
    }

    const bodyPr = childOf(box, 'bodyPr');
    const props = [...box.getElementsByTagNameNS(NS_DRAW, '*')]
      .filter(e => ['rPr', 'endParaRPr', 'defRPr'].includes(e.localName));
    const sized = props.filter(e => e.hasAttribute('sz'));
    const defSz = sized.length ? +sized[0].getAttribute('sz') : 1100;

    // 段落ごとの文字・大きさ・太字
    const paras = [...box.children].filter(e => e.localName === 'p').map(p => {
      const pr = [...p.getElementsByTagNameNS(NS_DRAW, '*')].filter(e => ['rPr', 'endParaRPr', 'defRPr'].includes(e.localName));
      const s = pr.find(e => e.hasAttribute('sz'));
      return {
        text: [...p.getElementsByTagNameNS(NS_DRAW, 't')].map(t => t.textContent).join(''),
        size: (s ? +s.getAttribute('sz') : defSz) / 100,
        bold: pr.some(e => e.getAttribute('b') === '1')
      };
    });

    // 箱の大きさ(グループの中なら、グループの拡大・縮小もかける)
    const sp = box.parentNode;
    const ext = childOf(childOf(childOf(sp, 'spPr'), 'xfrm'), 'ext');
    const vertical = bodyPr && bodyPr.getAttribute('vert') && bodyPr.getAttribute('vert') !== 'horz';
    if (!ext || vertical) return;   // 大きさが分からない図形・縦書きはそのまま
    let sx = 1, sy = 1;
    for (let g = sp.parentNode; g && g.localName === 'grpSp'; g = g.parentNode) {
      const x = childOf(childOf(g, 'grpSpPr'), 'xfrm');
      const e = childOf(x, 'ext'), ce = childOf(x, 'chExt');
      if (e && ce && +ce.getAttribute('cx') && +ce.getAttribute('cy')) {
        sx *= e.getAttribute('cx') / ce.getAttribute('cx');
        sy *= e.getAttribute('cy') / ce.getAttribute('cy');
      }
    }
    const ins = (k, d) => (bodyPr && bodyPr.hasAttribute(k) ? +bodyPr.getAttribute(k) : d);
    const W = (ext.getAttribute('cx') * sx - ins('lIns', 91440) - ins('rIns', 91440)) / EMU_PT;
    const H = (ext.getAttribute('cy') * sy - ins('tIns', 45720) - ins('bIns', 45720)) / EMU_PT;
    if (W <= 0 || H <= 0) return;
    // 元の大きさのまま1行ずつ入るなら何もしない
    if (paras.every(p => textW(p.text.trimEnd(), p.size, fam, p.bold) <= W)) return;
    if (bodyPr) bodyPr.setAttribute('wrap', 'square');   // 箱の幅で折り返す
    // 図形の文字の1行は文字の大きさの 1.2 倍
    const need = r => paras.reduce((h, p) => h + countLines(p.text, p.size * r, W, fam, p.bold) * p.size * r * 1.2, 0);
    const rate = bestRate(r => need(r) <= H, MIN_RATE) || MIN_RATE;
    if (rate >= 1) return;

    sized.forEach(e => e.setAttribute('sz', Math.max(100, Math.floor(e.getAttribute('sz') * rate))));
    if (sized.length) return;
    // 大きさの指定がない(標準の11pt)ときは、文字の部分に大きさを書き足す
    for (const r of box.getElementsByTagNameNS(NS_DRAW, 'r')) {
      let rPr = childOf(r, 'rPr');
      if (!rPr) { rPr = doc.createElementNS(NS_DRAW, 'a:rPr'); r.insertBefore(rPr, r.firstChild); }
      rPr.setAttribute('sz', Math.round(1100 * rate));
    }
  });
}

// セルの書体を Arial にする(font の中の name。テーマの書体指定 scheme と文字コード charset は外す)
function setCellFont(font, doc) {
  let name = childOf(font, 'name') || childOf(font, 'rFont');
  if (!name) {
    name = doc.createElementNS(NS_MAIN, font.localName === 'rPr' ? 'rFont' : 'name');
    const next = [...font.children].find(e => ['family', 'charset', 'scheme'].includes(e.localName));
    font.insertBefore(name, next || null);
  }
  name.setAttribute('val', LATIN_FONT);
  ['charset', 'scheme'].forEach(k => { const e = childOf(font, k); if (e) e.remove(); });
}

// セルを結合する(mergeCells が無ければ、決まった並び順の位置に作る)
function addMerge(doc, rg) {
  let mc = doc.getElementsByTagNameNS(NS_MAIN, 'mergeCells')[0];
  if (!mc) {
    mc = doc.createElementNS(NS_MAIN, 'mergeCells');
    const ws = doc.documentElement;
    const after = ['phoneticPr', 'conditionalFormatting', 'dataValidations', 'hyperlinks', 'printOptions',
      'pageMargins', 'pageSetup', 'headerFooter', 'rowBreaks', 'colBreaks', 'customProperties', 'cellWatches',
      'ignoredErrors', 'smartTags', 'drawing', 'legacyDrawing', 'legacyDrawingHF', 'picture', 'oleObjects',
      'controls', 'webPublishItems', 'tableParts', 'extLst'];
    ws.insertBefore(mc, [...ws.children].find(e => after.includes(e.localName)) || null);
  }
  const m = doc.createElementNS(NS_MAIN, 'mergeCell');
  m.setAttribute('ref', XLSX.utils.encode_range(rg));
  mc.appendChild(m);
  mc.setAttribute('count', mc.children.length);
}

// セル:列の幅・行の高さから使える広さを出し、
//   1行で入る → そのまま / 7割までの縮小で1行に入る → 縮小 / それ以外 → 折り返し(足りなければ行を広げる)
// セルの書式(styles.xml)を複製して、文字の大きさ・書体・折り返しだけ変えたものを使う
function fitCells(docs, styles, latin) {
  const fam = latin ? 'latin' : 'ja';
  const ss = docs.find(d => d.name === 'xl/sharedStrings.xml');
  const ssUnits = new Map((ss ? ss.units : []).map(u => [u.idx, u]));
  const fonts = styles.getElementsByTagNameNS(NS_MAIN, 'fonts')[0];
  const xfs = styles.getElementsByTagNameNS(NS_MAIN, 'cellXfs')[0];
  const fontEls = [...fonts.children].filter(e => e.localName === 'font');
  const xfEls = [...xfs.children].filter(e => e.localName === 'xf');
  const made = new Map();
  let styleChanged = false;

  const fontSize = f => { const sz = childOf(f, 'sz'); return sz ? parseFloat(sz.getAttribute('val')) : 11; };
  const xfOf = i => xfEls[i] || xfEls[0];
  const fontOf = i => fontEls[+xfOf(i).getAttribute('fontId') || 0];
  const align = i => childOf(xfOf(i), 'alignment');
  const isWrap = i => ['1', 'true'].includes(align(i) && align(i).getAttribute('wrapText'));
  const hAlign = i => (align(i) && align(i).getAttribute('horizontal')) || 'general';

  // 列の幅の計算に使う「0〜9 のいちばん広い数字の幅(px)」。ブックの標準の書体で測る
  const f0 = fontEls[0];
  const f0name = (childOf(f0, 'name') && childOf(f0, 'name').getAttribute('val')) || '';
  const f0fam = /Arial/i.test(f0name) ? 'latin' : 'ja';
  const MDW = Math.max(5, Math.round(Math.max(...'0123456789'.split('').map(d =>
    textW(d, fontSize(f0) * PT_PX, f0fam, false) / PRINT_MARGIN))));
  const colPxOf = w => Math.trunc(((256 * w + Math.trunc(128 / MDW)) / 256) * MDW);

  // rate: 文字の大きさの倍率 / wrap: 折り返す / font: 書体を変えるか
  const styleFor = (i, rate, wrap, font) => {
    const key = [i, rate, wrap, font].join('|');
    if (made.has(key)) return made.get(key);
    const nx = xfOf(i).cloneNode(true);
    if (rate < 1 || font) {
      const f = fontEls[+nx.getAttribute('fontId') || 0].cloneNode(true);
      let sz = childOf(f, 'sz');
      const base = sz ? parseFloat(sz.getAttribute('val')) : 11;
      if (!sz) {
        // エクセルは中の並び順が決まっているので、color・name などより前に入れる
        sz = styles.createElementNS(NS_MAIN, 'sz');
        const next = [...f.children].find(e => ['color', 'name', 'family', 'charset', 'scheme'].includes(e.localName));
        f.insertBefore(sz, next || null);
      }
      sz.setAttribute('val', Math.max(1, Math.floor(base * rate * 2) / 2));   // 0.5pt 刻みで切り捨て(切り上げるとはみ出す)
      if (font) setCellFont(f, styles);
      fonts.appendChild(f); fontEls.push(f);
      fonts.setAttribute('count', fontEls.length);
      nx.setAttribute('fontId', fontEls.length - 1);
      nx.setAttribute('applyFont', '1');
    }
    if (wrap) {
      let a = childOf(nx, 'alignment');
      if (!a) { a = styles.createElementNS(NS_MAIN, 'alignment'); nx.insertBefore(a, nx.firstChild); }
      a.setAttribute('wrapText', '1');
      a.removeAttribute('shrinkToFit');
      nx.setAttribute('applyAlignment', '1');
    }
    xfs.appendChild(nx); xfEls.push(nx);
    xfs.setAttribute('count', xfEls.length);
    made.set(key, xfEls.length - 1);
    styleChanged = true;
    return xfEls.length - 1;
  };

  docs.filter(d => /^xl\/worksheets\//.test(d.name)).forEach(sh => {
    const doc = sh.doc;
    const fmt = doc.getElementsByTagNameNS(NS_MAIN, 'sheetFormatPr')[0];
    const defColW = fmt && fmt.hasAttribute('defaultColWidth') ? +fmt.getAttribute('defaultColWidth')
      : (fmt && fmt.hasAttribute('baseColWidth') ? +fmt.getAttribute('baseColWidth') : 8) + 0.71;
    const defRowH = fmt && fmt.hasAttribute('defaultRowHeight') ? +fmt.getAttribute('defaultRowHeight') : 13.5;
    const colW = new Map();
    for (const c of doc.getElementsByTagNameNS(NS_MAIN, 'col')) {
      for (let x = +c.getAttribute('min'); x <= +c.getAttribute('max') && x <= 16384; x++) {
        colW.set(x - 1, c.getAttribute('hidden') === '1' ? 0 : +c.getAttribute('width'));
      }
    }
    const colPx = x => { const w = colW.has(x) ? colW.get(x) : defColW; return w ? colPxOf(w) : 0; };
    const rowEls = new Map();
    const rowH = new Map();
    for (const row of doc.getElementsByTagNameNS(NS_MAIN, 'row')) {
      const y = +row.getAttribute('r') - 1;
      rowEls.set(y, row);
      if (row.getAttribute('hidden') === '1') rowH.set(y, 0);
      else if (row.hasAttribute('ht')) rowH.set(y, +row.getAttribute('ht'));
    }
    const rowPt = y => (rowH.has(y) ? rowH.get(y) : defRowH);
    const merges = new Map();
    const inMerge = new Set();
    for (const m of doc.getElementsByTagNameNS(NS_MAIN, 'mergeCell')) {
      const rg = XLSX.utils.decode_range(m.getAttribute('ref'));
      merges.set(XLSX.utils.encode_cell(rg.s), rg);
      for (let y = rg.s.r; y <= rg.e.r; y++) for (let x = rg.s.c; x <= rg.e.c; x++) inMerge.add(y + ',' + x);
    }
    const cells = [...doc.getElementsByTagNameNS(NS_MAIN, 'c')];
    const filled = new Set();
    cells.forEach(c => {
      if (childOf(c, 'v') || childOf(c, 'is')) {
        const p = XLSX.utils.decode_cell(c.getAttribute('r'));
        filled.add(p.r + ',' + p.c);
      }
    });
    // セルの中の余白:左右あわせて 6px、上下あわせて 3px
    const innerW = (x1, x2) => { let px = -6; for (let x = x1; x <= x2; x++) px += colPx(x); return px / PT_PX; };

    const inline = new Map(sh.units.map(u => [u.el.parentNode, u]));
    const plans = [];   // 決めた直し方(あとでまとめて書き込む)
    cells.forEach(c => {
      let u = null;
      if (c.getAttribute('t') === 's') {
        const v = childOf(c, 'v');
        u = v && ssUnits.get(+v.textContent);
      } else if (c.getAttribute('t') === 'inlineStr') {
        u = inline.get(c);
      }
      if (!u) return;

      const xfIdx = +(c.getAttribute('s') || 0);
      const p = XLSX.utils.decode_cell(c.getAttribute('r'));
      const rg = merges.get(c.getAttribute('r')) || { s: p, e: p };
      let W = innerW(rg.s.c, rg.e.c);
      let H = -3 / PT_PX;
      for (let y = rg.s.r; y <= rg.e.r; y++) H += rowPt(y);
      if (W <= 0 || H <= 0) return;

      // 文字の一部に大きさの指定があるとき(リッチテキスト)は、そちらの大きさ・太字を使う
      const run = u.nodes[0].parentNode;
      const runPr = run.localName === 'r' && childOf(run, 'rPr');
      const runSz = runPr && childOf(runPr, 'sz');
      if (runSz && !u.runSz) u.runSz = parseFloat(runSz.getAttribute('val'));
      const size = runSz ? u.runSz : fontSize(fontOf(xfIdx));
      const bold = runPr ? isOn(childOf(runPr, 'b')) : isOn(childOf(fontOf(xfIdx), 'b'));
      const text = u.out;
      const plan = { c, u, xfIdx, rg, runPr, runSz, rate: 1, wrap: false, grow: null };

      if (!isWrap(xfIdx) && !text.includes('\n')) {
        // 1行のまま:左寄せなら右の空いたセルまで使える(エクセルの表示と同じ)
        let endX = rg.e.c;
        if (!merges.has(c.getAttribute('r')) && ['general', 'left'].includes(hAlign(xfIdx))) {
          for (let x = p.c + 1; x < p.c + 30; x++) {
            if (filled.has(p.r + ',' + x) || inMerge.has(p.r + ',' + x)) break;
            endX = x;
          }
        }
        const W1 = innerW(rg.s.c, endX);
        const tw = textW(text.trimEnd(), size, fam, bold);
        if (tw <= W1) { plans.push(plan); return; }   // そのまま入る(書体だけ変える)
        if (W1 / tw >= LINE_MIN_RATE) {
          plan.rate = Math.floor(W1 / tw * 20) / 20;  // 少し小さくすれば1行に入る
          plans.push(plan); return;
        }
        // 折り返す。右の空いたセルまではみ出していた文は、そこまで結合して、その幅で折り返す
        if (endX > rg.e.c) {
          plan.mergeTo = endX;
          for (let x = p.c + 1; x <= endX; x++) inMerge.add(p.r + ',' + x);
          W = W1;
        }
      }
      plan.wrap = true;
      const need = r => countLines(text, size * r, W, fam, bold) * lineH(size * r, fam);
      plan.rate = bestRate(r => need(r) <= H, CELL_MIN_RATE);
      if (!plan.rate) plan.grow = { need, others: H - rowPt(rg.e.r), row: rg.e.r };
      plans.push(plan);
    });

    // 行を広げる文の文字の大きさを決める:シートの高さの増え方が 2割以内になる、いちばん大きい倍率
    const growing = plans.filter(pl => pl.grow);
    let total = 0;
    rowEls.forEach((row, y) => { total += rowPt(y); });
    const heightsAt = g => {
      const hs = new Map();
      growing.forEach(pl => {
        const want = Math.min(MAX_ROW_H, Math.ceil((pl.grow.need(g) - pl.grow.others) * 4) / 4);
        if (want > (hs.get(pl.grow.row) || rowPt(pl.grow.row))) hs.set(pl.grow.row, want);
      });
      return hs;
    };
    let g = GROW_RATES[GROW_RATES.length - 1];
    for (const r of GROW_RATES) {
      let extra = 0;
      heightsAt(r).forEach((h, y) => { extra += h - rowPt(y); });
      if (extra <= total * GROW_BUDGET) { g = r; break; }
    }
    growing.forEach(pl => { pl.rate = g; });
    heightsAt(g).forEach((ht, y) => {
      const row = rowEls.get(y);
      if (!row) return;
      row.setAttribute('ht', ht);
      row.setAttribute('customHeight', '1');
      sh.changed = true;
    });

    // 書き込む
    plans.forEach(pl => {
      if (pl.rate >= 1 && !pl.wrap && !latin) return;
      if (pl.mergeTo !== undefined) addMerge(doc, { s: pl.rg.s, e: { r: pl.rg.s.r, c: pl.mergeTo } });
      if (pl.runSz) {
        pl.runSz.setAttribute('val', Math.max(1, Math.floor(pl.u.runSz * pl.rate * 2) / 2));
        if (latin) setCellFont(pl.runPr, pl.runPr.ownerDocument);
        if (pl.wrap || latin) pl.c.setAttribute('s', styleFor(pl.xfIdx, 1, pl.wrap, latin));
      } else {
        pl.c.setAttribute('s', styleFor(pl.xfIdx, pl.rate, pl.wrap, latin));
      }
      sh.changed = true;
    });
  });
  return styleChanged;
}

$('btnAll').addEventListener('click', async () => {
  const f = $('file').files[0];
  if (!f) return;
  const target = $('lang').value;
  $('btnAll').disabled = true;
  $('btnGo').disabled = true;
  try {
    setMsg('ファイルを開いています…');
    const zip = await JSZip.loadAsync(await f.arrayBuffer());
    const docs = [];
    for (const name of Object.keys(zip.files)) {
      const part = XML_PARTS.find(p => p.re.test(name));
      if (!part) continue;
      const doc = new DOMParser().parseFromString(await zip.file(name).async('string'), 'application/xml');
      if (doc.getElementsByTagName('parsererror').length) continue;
      docs.push({ name, doc, box: part.box, units: collectUnits(doc, part.ns, part.unit) });
    }
    const all = docs.flatMap(d => d.units);
    if (!all.length) { setMsg('このファイルには訳す文字がありません。', 'err'); return; }
    const uniq = [...new Set(all.map(u => u.text))];
    if (uniq.length > MAX_CELLS) {
      setMsg(`文字が多すぎます(${uniq.length}種類)。${MAX_CELLS}種類までにしてください。`, 'err');
      return;
    }

    const done = new Map();
    for (let i = 0; i < uniq.length; i += BATCH) {
      setMsg(`訳しています… ${Math.min(i + BATCH, uniq.length)} / ${uniq.length}`);
      const part = uniq.slice(i, i + BATCH);
      const out = await translateBatch(part, target);
      part.forEach((t, k) => done.set(t, out[k]));
    }

    // 最初の文字ノードに訳を入れ、残りは空にする(書式は最初の部分のものになる)
    all.forEach(u => {
      const first = u.nodes[0];
      u.out = compassLabel(u.text, target) || done.get(u.text);
      first.textContent = u.out;
      if (first.namespaceURI === NS_MAIN) first.setAttributeNS(NS_XML, 'xml:space', 'preserve');
      u.nodes.slice(1).forEach(t => { t.textContent = ''; });
      // 日本語のふりがなは消す
      [...u.el.children].filter(c => c.localName === 'rPh').forEach(c => c.remove());
    });
    // 訳が長くなった所は文字を小さくして枠に収める
    const latin = LATIN_LANGS.includes(target);
    // 幅を測る書体が読み込まれるのを待つ(読み込めなければ、パソコンの Arial などで測る)
    try { await Promise.all(['100px Arimo', 'bold 100px Arimo'].map(f => document.fonts.load(f))); } catch (e) { /* そのまま */ }
    docs.filter(d => d.box).forEach(d => fitBoxes(d.units, latin));
    const stylesFile = zip.file('xl/styles.xml');
    if (stylesFile) {
      const styles = new DOMParser().parseFromString(await stylesFile.async('string'), 'application/xml');
      if (!styles.getElementsByTagName('parsererror').length && fitCells(docs, styles, latin)) {
        docs.push({ name: 'xl/styles.xml', doc: styles, units: [], changed: true });
      }
    }

    docs.filter(d => d.units.length || d.changed).forEach(d => {
      let xml = new XMLSerializer().serializeToString(d.doc);
      if (!xml.startsWith('<?xml')) xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + xml;
      zip.file(d.name, xml, { createFolders: false });
    });

    setMsg('保存するファイルを作っています…');
    const blob = await zip.generateAsync({
      type: 'blob', compression: 'DEFLATE',
      mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
    });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${f.name.replace(/\.[^.]+$/, '')}_${$('lang').selectedOptions[0].textContent}.xlsx`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    setMsg(`${all.length}か所の文字を訳して保存しました。`, 'ok');
  } catch (e) {
    setMsg('翻訳できませんでした:' + e.message, 'err');
  } finally {
    $('btnAll').disabled = false;
    $('btnGo').disabled = false;
  }
});

// ===== 声で翻訳(声→文字→翻訳→読み上げ) =====
// v: GASに送る言語コード / sr: 音声認識・読み上げの言語コード
const VOICE_LANGS = [
  { v: 'ja', sr: 'ja-JP', name: '日本語' },
  { v: 'en', sr: 'en-US', name: '英語' },
  { v: 'vi', sr: 'vi-VN', name: 'ベトナム語' },
  { v: 'hi', sr: 'hi-IN', name: 'ヒンディー語' },
  { v: 'zh-CN', sr: 'zh-CN', name: '中国語' },
  { v: 'tl', sr: 'fil-PH', name: 'タガログ語' }
];
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
let last = null;  // 最後に訳した文と言語(もう一度読む用)

function setVMsg(text, kind) {
  $('vMsg').textContent = text;
  $('vMsg').className = 'msg' + (kind ? ' ' + kind : '');
}
function voiceLang(v) { return VOICE_LANGS.find(l => l.v === v); }

['vFrom', 'vTo'].forEach((id, i) => {
  VOICE_LANGS.forEach(l => {
    const o = document.createElement('option');
    o.value = l.v; o.textContent = l.name;
    $(id).appendChild(o);
  });
  $(id).value = i === 0 ? 'ja' : 'vi';
});

$('btnSwap').addEventListener('click', () => {
  const a = $('vFrom').value;
  $('vFrom').value = $('vTo').value;
  $('vTo').value = a;
});

function speak(text, lang) {
  if (!('speechSynthesis' in window)) { setVMsg('このブラウザは読み上げに対応していません。', 'err'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang.sr;
  const voices = speechSynthesis.getVoices();
  const base = lang.sr.split('-')[0];
  const norm = s => s.replace('_', '-').toLowerCase();
  const voice = voices.find(x => norm(x.lang) === lang.sr.toLowerCase())
    || voices.find(x => norm(x.lang).startsWith(base) || (base === 'fil' && norm(x.lang).startsWith('tl')));
  if (voice) u.voice = voice;
  else if (voices.length) setVMsg(`このスマホには${lang.name}の読み上げの声がないかもしれません。訳の文字を見せてください。`);
  speechSynthesis.speak(u);
}

$('btnSpeak').addEventListener('click', () => { if (last) speak(last.text, last.lang); });

function micIdle() {
  $('btnMic').classList.remove('on');
  $('btnMic').textContent = '🎤 押して話す';
  $('btnMic').disabled = false;
}

$('btnMic').addEventListener('click', () => {
  if (rec) { rec.stop(); return; }
  if (!SR) { setVMsg('このブラウザは声の入力に対応していません。AndroidのChromeで開いてください。', 'err'); return; }
  const from = voiceLang($('vFrom').value);
  const to = voiceLang($('vTo').value);
  if (from.v === to.v) { setVMsg('話す言語と訳す言語はちがうものを選んでください。', 'err'); return; }

  let said = '';
  rec = new SR();
  rec.lang = from.sr;
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onresult = e => { said = e.results[0][0].transcript.trim(); };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') setVMsg('マイクが許可されていません。ブラウザの設定でマイクを許可してください。', 'err');
    else if (e.error === 'no-speech') setVMsg('声が聞き取れませんでした。もう一度押して話してください。', 'err');
    else setVMsg('声の入力でエラーが出ました:' + e.error, 'err');
  };
  rec.onend = async () => {
    rec = null;
    if (!said) { micIdle(); return; }
    $('btnMic').classList.remove('on');
    $('btnMic').textContent = '訳しています…';
    $('btnMic').disabled = true;
    try {
      const out = (await translateBatch([said], to.v))[0];
      $('vSaid').textContent = said;
      $('vOut').textContent = out;
      $('vResult').hidden = false;
      setVMsg('');
      last = { text: out, lang: to };
      speak(out, to);
    } catch (e) {
      setVMsg('翻訳できませんでした:' + e.message, 'err');
    } finally {
      micIdle();
    }
  };
  rec.start();
  $('btnMic').classList.add('on');
  $('btnMic').textContent = '■ 聞いています…(押すと止める)';
  setVMsg(`${from.name}で話してください。`);
});
</script>
</body>
</html>
