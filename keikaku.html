<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>作業計画書</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f5f6f8; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <iframe id="f" title="作業計画書"></iframe>
  <script>
    // 職人用GASのURL（アクセス「全員」でデプロイしたもの）
    const GAS_URL = 'https://script.google.com/macros/s/AKfycby2UOL9qnGPzx0VASPk35n14eOU_xGhwwlhOUwTfJR_v4ljq8ZOkOIZTIEYF0ORPfd7/exec';

    // ?k=キー → 職人（QR・メールのリンク） / ?m=admin&a=管理キー → 管理用
    const q = new URLSearchParams(location.search);
    const k = q.get('k') || '';
    const a = q.get('a') || '';
    if (/^K[0-9a-f]{32}$/.test(k)) {
      document.getElementById('f').src = GAS_URL + '?k=' + encodeURIComponent(k);
    } else if (q.get('m') === 'admin' && /^A[0-9a-f]{48}$/.test(a)) {
      document.getElementById('f').src = GAS_URL + '?m=admin&a=' + encodeURIComponent(a);
    } else {
      document.body.innerHTML = '<p style="font-family:sans-serif;padding:40px 20px;text-align:center;color:#555">QRコードかメールのリンクから開いてください。</p>';
    }
  </script>
</body>
</html>
