<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>グループメール</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7;
      --ink: #1f2328;
      --muted: #5f6670;
      --btn: #2f5fb3;
      --btn-ink: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --ink: #eceff3;
        --muted: #a3aab4;
        --btn: #7aa5f0;
        --btn-ink: #10141b;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: var(--ink);
      background: var(--bg);
    }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
    h1 { font-size: 22px; margin-bottom: 6px; }
    p { color: var(--muted); margin-bottom: 20px; }
    #groups { display: flex; flex-direction: column; gap: 12px; }
    #groups a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 12px 16px;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      color: var(--btn-ink);
      background: var(--btn);
      border-radius: 12px;
    }
    #groups a:hover { filter: brightness(1.08); }
    #groups a:focus-visible { outline: 3px solid var(--btn); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>グループメール</h1>
    <p>ボタンを押すと、そのグループ全員が宛先に入った新規メールが開きます。</p>
    <div id="groups"></div>
  </main>
  <script>
    // グループとアドレス(ここを書き換える)
    const groups = [
      { name: "グループA", emails: ["aaa@example.com", "bbb@example.com"] },
      { name: "グループB", emails: ["ccc@example.com"] }
    ];

    const list = document.getElementById("groups");
    groups.forEach(function (g) {
      const a = document.createElement("a");
      a.href = "mailto:" + g.emails.join(",");
      a.textContent = g.name;
      list.appendChild(a);
    });
  </script>
</body>
</html>
