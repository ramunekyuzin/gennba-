<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>グループメール</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7;
      --card: #ffffff;
      --ink: #1f2328;
      --muted: #5f6670;
      --line: #d0d5dc;
      --btn: #2f5fb3;
      --btn-ink: #ffffff;
      --error: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --card: #20242a;
        --ink: #eceff3;
        --muted: #a3aab4;
        --line: #3a4048;
        --btn: #7aa5f0;
        --btn-ink: #10141b;
        --error: #ff9b93;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: var(--ink);
      background: var(--bg);
    }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
    h1 { font-size: 22px; margin-bottom: 6px; }
    p { color: var(--muted); margin-bottom: 20px; }
    #msg.ng { color: var(--error); }
    #msg:empty { display: none; }
    #msg a { color: var(--btn); }
    #groups { display: flex; flex-direction: column; gap: 12px; }
    #groups a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 12px 16px;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      color: var(--btn-ink);
      background: var(--btn);
      border-radius: 12px;
    }
    #groups a:hover { filter: brightness(1.08); }
    #groups a:focus-visible { outline: 3px solid var(--btn); outline-offset: 3px; }

    /* 宛先の編集(オーナーだけ) */
    #edit { margin-top: 32px; border-top: 1px solid var(--line); padding-top: 8px; }
    #edit summary { min-height: 48px; display: flex; align-items: center; font-weight: 700; cursor: pointer; }
    .row { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 12px; }
    .row label { display: block; font-size: 16px; font-weight: 700; margin: 8px 0 4px; }
    .row input, .row textarea {
      width: 100%;
      padding: 10px 12px;
      font: inherit;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .row textarea { min-height: 96px; }
    button {
      width: 100%;
      min-height: 48px;
      margin-top: 12px;
      font: inherit;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
    }
    .main-btn { color: var(--btn-ink); background: var(--btn); border: 0; min-height: 56px; font-size: 18px; }
    .sub-btn { color: var(--ink); background: var(--card); border: 1px solid var(--line); }
    button:disabled { opacity: .5; cursor: wait; }
    #saveMsg { margin: 12px 0 0; }
    #saveMsg.ng { color: var(--error); }
  </style>
</head>
<body>
  <main>
    <h1>グループメール</h1>
    <p>ボタンを押すと、そのグループ全員が宛先に入った新規メールが開きます。</p>
    <p id="msg" role="status">読み込み中…</p>
    <div id="groups"></div>

    <details id="edit" hidden>
      <summary>宛先を編集</summary>
      <p>アドレスは1行に1つずつ書いてください。</p>
      <div id="rows"></div>
      <button class="sub-btn" id="addBtn" type="button">＋ グループを追加</button>
      <button class="main-btn" id="saveBtn" type="button">保存する</button>
      <p id="saveMsg" role="status"></p>
    </details>
  </main>
  <script>
    // 宛先は事務所ツールのスプシ(シート「グループメール」)にある。事務所ツールでこのページを使える人にだけGASが返す
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxKW8JNfxJs2HLOGGRZVWvSgUhsDG-oLFT0Bw0osTJy6wqtc4Ngtg9s_36py_Ae39_J/exec";

    const $ = id => document.getElementById(id);

    // 事務所ツールから開くと ?lt= でログイン情報が来る。なければこのブラウザの事務所ツールのログインを使う
    const params = new URLSearchParams(location.search);
    let token = params.get("lt") || "";
    if (token) history.replaceState(null, "", location.pathname);
    if (!token) { try { token = localStorage.getItem("officeToken") || ""; } catch (e) { token = ""; } }

    function setMsg(text, ng) { $("msg").textContent = text; $("msg").className = ng ? "ng" : ""; }
    function showLoginMsg(text) {
      setMsg(text + " ", true);
      const a = document.createElement("a");
      a.href = "office.html";
      a.textContent = "事務所ツールを開く";
      $("msg").appendChild(a);
    }

    async function api(body) {
      const res = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(Object.assign({ token: token }, body))
      });
      return res.json();
    }

    let savedGroups = [];   // 最後に保存できた宛先(保存に失敗したらこれに戻す)

    function showButtons(groups) {
      const list = $("groups");
      list.textContent = "";
      groups.forEach(function (g) {
        const a = document.createElement("a");
        // Outlook はブラウザ(outlook.office.com)で使っているので、その新規作成画面を開く
        a.href = "https://outlook.office.com/mail/deeplink/compose?to=" + encodeURIComponent(g.emails.join(","));
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = g.name;
        list.appendChild(a);
      });
      if (groups.length) setMsg("");
      else setMsg("まだ宛先が登録されていません。");
    }

    // ---- 宛先の編集(オーナーだけ) ----
    function addRow(g) {
      const row = document.createElement("div");
      row.className = "row";
      const l1 = document.createElement("label");
      l1.textContent = "グループ名";
      const name = document.createElement("input");
      name.className = "name";
      name.value = g ? g.name : "";
      const l2 = document.createElement("label");
      l2.textContent = "アドレス";
      const emails = document.createElement("textarea");
      emails.className = "emails";
      emails.value = g ? g.emails.join("\n") : "";
      emails.placeholder = "aaa@example.com\nbbb@example.com";
      const del = document.createElement("button");
      del.type = "button";
      del.className = "sub-btn";
      del.textContent = "このグループを消す";
      del.addEventListener("click", () => row.remove());
      row.append(l1, name, l2, emails, del);
      $("rows").appendChild(row);
      return row;
    }

    function showEditor(groups) {
      $("edit").hidden = false;
      $("rows").textContent = "";
      groups.forEach(addRow);
      if (!groups.length) { addRow(); $("edit").open = true; }
    }

    $("addBtn").addEventListener("click", () => addRow().querySelector("input").focus());

    $("saveBtn").addEventListener("click", async () => {
      const groups = [...document.querySelectorAll("#rows .row")].map(row => ({
        name: row.querySelector(".name").value.trim(),
        emails: row.querySelector(".emails").value.split(/[\s,、]+/).filter(Boolean)
      })).filter(g => g.name || g.emails.length);
      const bad = groups.find(g => !g.name || !g.emails.length);
      if (bad) { $("saveMsg").textContent = "グループ名とアドレスの両方を入れてください。"; $("saveMsg").className = "ng"; return; }
      // 保存を待たずにボタンへ反映する。失敗したら元に戻す
      showButtons(groups);
      $("saveBtn").disabled = true;
      $("saveMsg").textContent = "保存中…(ボタンはもう使えます)";
      $("saveMsg").className = "";
      try {
        const r = await api({ action: "groupMailSave", groups: groups });
        if (!r.ok) throw new Error(r.error);
        savedGroups = r.result.groups;
        showButtons(savedGroups);
        $("saveMsg").textContent = "保存しました。";
      } catch (e) {
        showButtons(savedGroups);
        $("saveMsg").textContent = (e.message || "保存できませんでした。") + " ボタンは保存前に戻しました。";
        $("saveMsg").className = "ng";
      } finally {
        $("saveBtn").disabled = false;
      }
    });

    async function start() {
      if (!token) { showLoginMsg("事務所ツールにログインしてから開いてください。"); return; }
      let r;
      try { r = await api({ action: "groupMailList" }); }
      catch (e) { setMsg("通信できませんでした。電波のよい所でもう一度開いてください。", true); return; }
      if (!r.ok) {
        if (r.code === "AUTH") showLoginMsg(r.error);
        else setMsg(r.error, true);
        return;
      }
      savedGroups = r.result.groups;
      showButtons(savedGroups);
      if (r.result.canEdit) showEditor(savedGroups);
    }
    start();
  </script>
</body>
</html>
