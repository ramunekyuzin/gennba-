<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>グループメール</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7;
      --ink: #1f2328;
      --muted: #5f6670;
      --btn: #2f5fb3;
      --btn-ink: #ffffff;
      --error: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --ink: #eceff3;
        --muted: #a3aab4;
        --btn: #7aa5f0;
        --btn-ink: #10141b;
        --error: #ff9b93;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: var(--ink);
      background: var(--bg);
    }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
    h1 { font-size: 22px; margin-bottom: 6px; }
    p { color: var(--muted); margin-bottom: 20px; }
    #msg { color: var(--error); }
    #msg:empty { display: none; }
    #msg a { color: var(--btn); }
    #groups { display: flex; flex-direction: column; gap: 12px; }
    #groups a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 12px 16px;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      color: var(--btn-ink);
      background: var(--btn);
      border-radius: 12px;
    }
    #groups a:hover { filter: brightness(1.08); }
    #groups a:focus-visible { outline: 3px solid var(--btn); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>グループメール</h1>
    <p>ボタンを押すと、そのグループ全員が宛先に入った新規メールが開きます。</p>
    <p id="msg" role="status">読み込み中…</p>
    <div id="groups"></div>
  </main>
  <script>
    // 暗号にしたグループとアドレス(group-mail-angou.html で作って貼り替える)
    const data = "";

    // 事務所ツールのGAS。鍵は事務所ツールで group-mail.html を使える人にだけ返ってくる
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxKW8JNfxJs2HLOGGRZVWvSgUhsDG-oLFT0Bw0osTJy6wqtc4Ngtg9s_36py_Ae39_J/exec";

    const msg = document.getElementById("msg");
    const list = document.getElementById("groups");

    // 事務所ツールから開くと ?lt= でログイン情報が来る。なければこのブラウザの事務所ツールのログインを使う
    const params = new URLSearchParams(location.search);
    let token = params.get("lt") || "";
    if (token) history.replaceState(null, "", location.pathname);
    if (!token) { try { token = localStorage.getItem("officeToken") || ""; } catch (e) { token = ""; } }

    function showLoginMsg(text) {
      msg.textContent = text + " ";
      const a = document.createElement("a");
      a.href = "office.html";
      a.textContent = "事務所ツールを開く";
      msg.appendChild(a);
    }

    function fromBase64(s) {
      const bin = atob(s);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    async function decrypt(keyText, b64) {
      const hash = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(keyText));
      const key = await crypto.subtle.importKey("raw", hash, "AES-GCM", false, ["decrypt"]);
      const bytes = fromBase64(b64);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.slice(0, 12) }, key, bytes.slice(12));
      return JSON.parse(new TextDecoder().decode(plain));
    }

    async function start() {
      if (!data) { msg.textContent = "まだ宛先が登録されていません。"; return; }
      if (!token) { showLoginMsg("事務所ツールにログインしてから開いてください。"); return; }
      let r;
      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "groupMailKey", token: token })
        });
        r = await res.json();
      } catch (e) {
        msg.textContent = "通信できませんでした。電波のよい所でもう一度開いてください。";
        return;
      }
      if (!r.ok) {
        if (r.code === "AUTH") showLoginMsg(r.error);
        else msg.textContent = r.error;
        return;
      }
      let groups;
      try { groups = await decrypt(r.result.key, data); }
      catch (e) { msg.textContent = "宛先を読み込めませんでした。暗号を作り直してください。"; return; }
      msg.textContent = "";
      groups.forEach(function (g) {
        const a = document.createElement("a");
        a.href = "mailto:" + g.emails.join(",");
        a.textContent = g.name;
        list.appendChild(a);
      });
    }
    start();
  </script>
</body>
</html>
