<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>現場の箱庭</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #dfe9f2;
    --panel: rgba(255, 255, 255, 0.92);
    --sheet: #ffffff;
    --field: #f4f6f8;
    --line: #d5d9de;
    --text: #22262b;
    --sub: #69717a;
    --track: #d9dee4;
    --accent: #e8891c;
    --phase: #b45f06;
    --btn: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a28;
      --panel: rgba(28, 32, 42, 0.94);
      --sheet: #1d222c;
      --field: #282e3a;
      --line: #39404d;
      --text: #eef1f5;
      --sub: #a3abb6;
      --track: #3b4350;
      --accent: #f29a35;
      --phase: #f6b25e;
      --btn: #2a303c;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 16px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .stage { position: relative; flex: 1; min-height: 0; }
  .stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .title {
    position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 12px;
    max-width: calc(100% - 150px);
    padding: 8px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    pointer-events: none;
  }
  .title b { display: block; font-size: 18px; }
  .title small { display: block; font-size: 16px; color: var(--sub); }
  .tools {
    position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 12px;
    display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
  }
  .btn {
    min-height: 44px; padding: 0 14px;
    font: inherit; font-size: 16px; color: var(--text);
    background: var(--btn);
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .panel {
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .date { font-size: 22px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
  .phase { font-size: 16px; font-weight: 700; text-align: center; color: var(--phase); min-height: 1.5em; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 44px; margin: 0;
    background: transparent;
    touch-action: pan-x;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; background: var(--track); border-radius: 4px; }
  input[type=range]::-moz-range-track { height: 8px; background: var(--track); border-radius: 4px; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 32px; height: 32px; margin-top: -12px;
    background: var(--accent);
    border: 3px solid #fff;
    border-radius: 50%;
    box-shadow: 0 1px 4px rgba(0,0,0,.35);
  }
  input[type=range]::-moz-range-thumb {
    width: 26px; height: 26px;
    background: var(--accent);
    border: 3px solid #fff;
    border-radius: 50%;
  }
  .range-labels { display: flex; justify-content: space-between; font-size: 16px; color: var(--sub); }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; margin-top: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 16px; }
  .legend i { width: 18px; height: 18px; display: inline-block; border: 1px solid var(--line); border-radius: 4px; }

  /* ===== 設定画面 ===== */
  .sheet-bg {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(0, 0, 0, 0.35);
    display: none; align-items: flex-end; justify-content: center;
  }
  .sheet-bg.open { display: flex; }
  .sheet {
    width: 100%; max-width: 640px; max-height: 88vh; max-height: 88dvh;
    display: flex; flex-direction: column;
    background: var(--sheet);
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -6px 24px rgba(0,0,0,.25);
  }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .sheet-head h2 { margin: 0; font-size: 20px; }
  .sheet-body { overflow-y: auto; overflow-x: hidden; padding: 8px 16px 16px; -webkit-overflow-scrolling: touch; }
  .sheet-foot {
    display: flex; gap: 8px; flex-wrap: wrap;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
  }
  .sheet-foot .primary { flex: 1; }
  .sheet h3 { font-size: 18px; margin: 18px 0 8px; }
  .sheet h4 { font-size: 16px; margin: 14px 0 6px; color: var(--sub); }
  .note { color: var(--sub); font-size: 16px; margin: 4px 0 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .grid .wide { grid-column: 1 / -1; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 16px; color: var(--sub); }
  select, input[type=date], input[type=number] {
    min-width: 0;
    font: inherit; font-size: 16px; color: var(--text);
    min-height: 44px; padding: 6px 10px; width: 100%;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .uses { display: flex; flex-wrap: wrap; gap: 8px; }
  .uses button { flex: 1 1 30%; }
  .uses button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .floor-card { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; }
  .floor-card b { display: block; margin-bottom: 6px; }
  .krow { display: grid; grid-template-columns: 3em minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px; align-items: center; margin-bottom: 6px; }
  .krow.site { grid-template-columns: 6.5em minmax(0, 1fr) auto minmax(0, 1fr); }
  .krow span { color: var(--sub); }
  .err { color: #d9443a; font-weight: 700; min-height: 1.2em; margin: 6px 0 0; }

  /* ===== AR ===== */
  .ar-overlay {
    display: none; position: fixed; inset: 0; z-index: 20;
    flex-direction: column; justify-content: space-between;
    background: transparent; pointer-events: none;
  }
  .ar-overlay.on { display: flex; }
  .ar-overlay > * { pointer-events: auto; }
  .ar-top { padding: calc(12px + env(safe-area-inset-top)) 12px 0; display: flex; flex-direction: column; gap: 8px; }
  .ar-hint {
    align-self: center; padding: 8px 14px; border-radius: 10px;
    background: rgba(0, 0, 0, 0.55); color: #fff; font-size: 16px; text-align: center;
  }
  .ar-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .ar-row .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .toast {
    position: fixed; left: 50%; bottom: calc(180px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    z-index: 30; max-width: calc(100% - 32px);
    padding: 10px 16px; border-radius: 10px;
    background: rgba(0, 0, 0, 0.78); color: #fff; font-size: 16px; text-align: center;
    display: none;
  }
  .toast.on { display: block; }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="title"><b>現場の箱庭</b><small id="summary"></small><small>指でまわす・2本指で拡大</small></div>
    <div class="tools">
      <button class="btn primary" id="settingsBtn" type="button">設定</button>
      <button class="btn primary" id="arBtn" type="button">AR</button>
      <button class="btn" id="qualityBtn" type="button">高画質 ON</button>
    </div>
  </div>
  <div class="panel" id="panel">
    <div class="date" id="dateLabel">----</div>
    <div class="phase" id="phaseLabel"></div>
    <input type="range" id="slider" min="0" max="100" value="0" aria-label="日付">
    <div class="range-labels"><span id="minLabel"></span><span id="maxLabel"></span></div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<!-- AR中にカメラ映像の上に出す操作パネル（Android） -->
<div class="ar-overlay" id="arOverlay">
  <div class="ar-top">
    <div class="ar-hint" id="arHint">床や机を映して、白い輪が出たらタップ</div>
    <div class="ar-row" id="arScales">
      <button class="btn" type="button" data-scale="50">1/50</button>
      <button class="btn on" type="button" data-scale="100">1/100</button>
      <button class="btn" type="button" data-scale="200">1/200</button>
      <button class="btn primary" type="button" id="arExit">終了</button>
    </div>
  </div>
  <div id="arPanelSlot"></div>
</div>
<div class="toast" id="toast"></div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-label="設定">
    <div class="sheet-head"><h2>建物と工期の設定</h2><button class="btn" id="closeBtn" type="button">閉じる</button></div>
    <div class="sheet-body">
      <h3>用途</h3>
      <div class="uses" id="uses"></div>
      <h3>建物</h3>
      <div class="grid">
        <label class="f wide">階数<select id="fFloors"></select></label>
        <label class="f">間口（柱6m間隔）<select id="fSpanX"></select></label>
        <label class="f">奥行（柱6m間隔）<select id="fSpanZ"></select></label>
      </div>
      <h3>工期（かんたん設定）</h3>
      <div class="grid">
        <label class="f wide">着工日（準備工事の開始）<input type="date" id="fStart"></label>
      </div>
      <h4>現場全体の日数</h4>
      <div class="grid" id="siteDays"></div>
      <h4>各階の日数</h4>
      <div class="grid">
        <label class="f">床の日数<input type="number" id="fD0" min="1" max="365" inputmode="numeric"></label>
        <label class="f">躯体の日数<input type="number" id="fD1" min="1" max="365" inputmode="numeric"></label>
        <label class="f">外装の日数<input type="number" id="fD2" min="1" max="365" inputmode="numeric"></label>
        <label class="f">内装の日数<input type="number" id="fD3" min="1" max="365" inputmode="numeric"></label>
        <label class="f wide">上の階へのずれ（日）<input type="number" id="fShift" min="1" max="120" inputmode="numeric"></label>
        <button class="btn wide" id="genBtn" type="button">この日数で工程を作り直す</button>
      </div>
      <h3>工程の細かい調整</h3>
      <p class="note">工程ごとに、開始日〜終了日を直せます。</p>
      <div id="table"></div>
      <p class="err" id="err"></p>
    </div>
    <div class="sheet-foot">
      <button class="btn" id="resetBtn" type="button">サンプルに戻す</button>
      <button class="btn primary" id="applyBtn" type="button">この内容で建てる</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { USDZExporter } from 'three/addons/exporters/USDZExporter.js';

// ===== 進捗サンプルデータ =====
// 現場全体の工程（開始日・終了日）
const SITE_SAMPLE = {
  prep:     ['2026-01-13', '2026-01-27'],
  pile:     ['2026-01-26', '2026-02-20'],
  excav:    ['2026-02-15', '2026-03-09'],
  found:    ['2026-03-06', '2026-03-31'],
  crane:    ['2026-03-23', '2026-03-31'],
  craneOff: ['2026-10-13', '2026-10-20'],
  ext:      ['2026-10-19', '2026-11-28'],
};
// 各階の工程（日付ごとの進捗%。間の日は直線でつなぐ）
const DATA = [
  { floor: 1, kind: '床',   progress: [['2026-04-01', 0], ['2026-04-21', 100]] },
  { floor: 1, kind: '躯体', progress: [['2026-04-15', 0], ['2026-05-15', 100]] },
  { floor: 1, kind: '外装', progress: [['2026-05-10', 0], ['2026-06-20', 100]] },
  { floor: 1, kind: '内装', progress: [['2026-06-01', 0], ['2026-07-20', 100]] },
  { floor: 2, kind: '床',   progress: [['2026-04-29', 0], ['2026-05-19', 100]] },
  { floor: 2, kind: '躯体', progress: [['2026-05-13', 0], ['2026-06-12', 100]] },
  { floor: 2, kind: '外装', progress: [['2026-06-07', 0], ['2026-07-18', 100]] },
  { floor: 2, kind: '内装', progress: [['2026-06-29', 0], ['2026-08-17', 100]] },
  { floor: 3, kind: '床',   progress: [['2026-05-27', 0], ['2026-06-16', 100]] },
  { floor: 3, kind: '躯体', progress: [['2026-06-10', 0], ['2026-07-10', 100]] },
  { floor: 3, kind: '外装', progress: [['2026-07-05', 0], ['2026-08-15', 100]] },
  { floor: 3, kind: '内装', progress: [['2026-07-27', 0], ['2026-09-14', 100]] },
  { floor: 4, kind: '床',   progress: [['2026-06-24', 0], ['2026-07-14', 100]] },
  { floor: 4, kind: '躯体', progress: [['2026-07-08', 0], ['2026-08-07', 100]] },
  { floor: 4, kind: '外装', progress: [['2026-08-02', 0], ['2026-09-12', 100]] },
  { floor: 4, kind: '内装', progress: [['2026-08-24', 0], ['2026-10-12', 100]] },
  { floor: 5, kind: '床',   progress: [['2026-07-22', 0], ['2026-08-11', 100]] },
  { floor: 5, kind: '躯体', progress: [['2026-08-05', 0], ['2026-09-04', 100]] },
  { floor: 5, kind: '外装', progress: [['2026-08-30', 0], ['2026-10-10', 100]] },
  { floor: 5, kind: '内装', progress: [['2026-09-21', 0], ['2026-11-09', 100]] },
];
const KIND_NAMES = ['床', '躯体', '外装', '内装'];
const SITE_PHASES = [
  { key: 'prep',     label: '準備工事' },
  { key: 'pile',     label: '杭工事' },
  { key: 'excav',    label: '山留め・掘削' },
  { key: 'found',    label: '基礎工事' },
  { key: 'crane',    label: 'クレーン組立' },
  { key: 'craneOff', label: 'クレーン解体' },
  { key: 'ext',      label: '外構工事' },
];
const SAMPLE = {
  use: 'office', floors: 5, spanX: 5, spanZ: 3,
  auto: {
    start: '2026-01-13', shift: 28,
    days: { '床': 20, '躯体': 30, '外装': 40, '内装': 50 },
    site: { prep: 14, pile: 25, excav: 22, found: 25, crane: 8, craneOff: 7, ext: 40 },
  },
  site: SITE_SAMPLE,
  data: DATA,
};
// 用途ごとの階高
const USES = {
  office:     { label: '事務所',         h: () => 3.5 },
  apartment:  { label: '共同住宅',       h: () => 3.0 },
  shop:       { label: '店舗',           h: f => (f === 1 ? 4.5 : 3.5) },
  warehouse:  { label: '倉庫',           h: () => 6.0 },
  datacenter: { label: 'データセンター', h: () => 5.0 },
};
const LEGEND = [
  ['床（スラブ）', '#b9b6af'],
  ['躯体（柱）', '#d4d1ca'],
  ['外装', 'linear-gradient(135deg,#8fb3cc,#e4e1da)'],
  ['内装', '#b7d9e6'],
];

// ===== 日付 =====
const DAY = 86400000;
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
const fmt = d => `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日(${WEEK[d.getDay()]})`;
const fmtShort = d => `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
const validIso = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parseDate(s));
const clamp01 = v => Math.min(1, Math.max(0, v));

function progressAt(points, date) {
  const t = date.getTime();
  const pts = points.map(([d, p]) => [parseDate(d).getTime(), p]);
  if (t <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) {
    if (t <= pts[i][0]) {
      const [t0, p0] = pts[i - 1], [t1, p1] = pts[i];
      return t1 === t0 ? p1 : p0 + (p1 - p0) * (t - t0) / (t1 - t0);
    }
  }
  return pts[pts.length - 1][1];
}
const phaseRatio = ([s, e], date) => clamp01(progressAt([[s, 0], [e, 100]], date) / 100);

// ===== かんたん設定から工程を作る（工程は少しずつ重ねて進める） =====
function genFloor(f, a, base) {
  const d = a.days;
  const lag = { '床': 0, '躯体': Math.round(d['床'] * 0.7) };
  lag['外装'] = lag['躯体'] + Math.round(d['躯体'] * 0.8);
  lag['内装'] = lag['外装'] + Math.round(d['外装'] * 0.55);
  return KIND_NAMES.map(k => {
    const st = addDays(base, (f - 1) * a.shift + lag[k]);
    return { floor: f, kind: k, progress: [[iso(st), 0], [iso(addDays(st, d[k])), 100]] };
  });
}
const floorBase = site => addDays(parseDate(site.found[1]), 1);
const span = (st, n) => [iso(st), iso(addDays(st, n))];
function genAll(floors, a) {
  const sd = a.site, s0 = parseDate(a.start), site = {};
  site.prep = span(s0, sd.prep);
  const pile = addDays(s0, Math.round(sd.prep * 0.9));
  site.pile = span(pile, sd.pile);
  const ex = addDays(pile, Math.round(sd.pile * 0.8));
  site.excav = span(ex, sd.excav);
  const fo = addDays(ex, Math.round(sd.excav * 0.85));
  site.found = span(fo, sd.found);
  site.crane = span(addDays(parseDate(site.found[1]), -sd.crane), sd.crane);
  const data = Array.from({ length: floors }, (_, i) => genFloor(i + 1, a, floorBase(site))).flat();
  finishSite(site, data, floors, sd);
  return { site, data };
}
// クレーン解体・外構は、外装がいちばん遅く終わる日から決める
function finishSite(site, data, floors, sd) {
  const lastExt = new Date(Math.max(...data.filter(d => d.kind === '外装' && d.floor <= floors)
    .map(d => parseDate(d.progress[d.progress.length - 1][0]).getTime())));
  site.craneOff = span(addDays(lastExt, 3), sd.craneOff);
  site.ext = span(addDays(lastExt, 9), sd.ext);
}

// ===== 設定の読み込み・保存（このブラウザだけに保存） =====
const STORE_KEY = 'hakoniwa-config-v2';
const OLD_KEY = 'hakoniwa-config-v1';
const clone = o => JSON.parse(JSON.stringify(o));
function validConfig(c) {
  try {
    if (!USES[c.use]) return false;
    if (!(c.floors >= 1 && c.floors <= 10 && c.spanX >= 2 && c.spanX <= 8 && c.spanZ >= 2 && c.spanZ <= 5)) return false;
    if (!validIso(c.auto.start) || !(c.auto.shift >= 1)) return false;
    if (!KIND_NAMES.every(k => c.auto.days[k] >= 1)) return false;
    if (!SITE_PHASES.every(p => c.auto.site[p.key] >= 1 && validIso(c.site[p.key][0]) && validIso(c.site[p.key][1]))) return false;
    for (let f = 1; f <= c.floors; f++) for (const k of KIND_NAMES) {
      const it = c.data.find(d => d.floor === f && d.kind === k);
      if (!it || !it.progress.every(([d]) => validIso(d))) return false;
    }
    return true;
  } catch { return false; }
}
// 前の版の設定（工種「基礎」）を新しい形に直す。現場全体の工程は1階の床の前に入れる
function migrate(old) {
  const c = clone(old);
  c.data.forEach(d => { if (d.kind === '基礎') d.kind = '床'; });
  c.auto.days['床'] = c.auto.days['基礎'] || 20;
  delete c.auto.days['基礎'];
  c.auto.site = clone(SAMPLE.auto.site);
  const first = parseDate(c.data.find(d => d.floor === 1 && d.kind === '床').progress[0][0]);
  const trial = genAll(1, c.auto).site;

function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function noiseCanvas(n, { base, fine, mottle, cells = 6, dots = 0, dotRange = [0, 0], seed = 1, tint = [1, 1, 1] }) {
  const rnd = rng(seed);
  const grid = Array.from({ length: cells * cells }, rnd);
  const g = (x, y) => grid[((y % cells) + cells) % cells * cells + ((x % cells) + cells) % cells];
  const smooth = t => t * t * (3 - 2 * t);
  const c = document.createElement('canvas'); c.width = c.height = n;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(n, n);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const fx = x / n * cells, fy = y / n * cells;
    const ix = Math.floor(fx), iy = Math.floor(fy), tx = smooth(fx - ix), ty = smooth(fy - iy);
    const v0 = g(ix, iy) + (g(ix + 1, iy) - g(ix, iy)) * tx;
    const v1 = g(ix, iy + 1) + (g(ix + 1, iy + 1) - g(ix, iy + 1)) * tx;
    const m = v0 + (v1 - v0) * ty;
    const v = base + (rnd() - 0.5) * fine + (m - 0.5) * mottle;
    const i = (y * n + x) * 4;
    for (let ch = 0; ch < 3; ch++) img.data[i + ch] = Math.max(0, Math.min(255, v * tint[ch]));
    img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  for (let k = 0; k < dots; k++) {
    const v = dotRange[0] + rnd() * (dotRange[1] - dotRange[0]);
    ctx.fillStyle = `rgb(${v * tint[0]},${v * tint[1]},${v * tint[2]})`;
    ctx.fillRect(rnd() * n, rnd() * n, 1 + rnd() * 1.5, 1 + rnd() * 1.5);
  }
  return c;
}
function tex(canvas, { srgb = true, repeat = [1, 1], rotate = 0 } = {}) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat[0], repeat[1]);
  t.anisotropy = 4;
  if (rotate) { t.center.set(0.5, 0.5); t.rotation = rotate; }
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

    wall(6, gh - 0.05, 6, (GX[0] + GX[1]) / 2, (GZ[j] + GZ[j + 1]) / 2);
    if (GX.length > 3) for (let k = 1; k < GZ.length - 1; k++) wall(x1 - GX[1], gh - 0.25, 0.12, (GX[1] + x1) / 2, GZ[k]);
    for (let i = 2; i < GX.length - 1; i++) { wall(0.12, gh - 0.25, 6, GX[i], z0 + 3); wall(0.12, gh - 0.25, 6, GX[i], z1 - 3); }
  }
}

// --- 足場（パイプ＋手すり＋布板）と養生シート ---
function scaffoldGeos(h, off) {
  const ai = { x: EX + off, z: EZ + off }, ao = { x: EX + off + 0.9, z: EZ + off + 0.9 };
  const corners = a => [[-a.x, -a.z], [a.x, -a.z], [a.x, a.z], [-a.x, a.z]];
  const ring = a => {
    const c = corners(a), pts = [];
    for (let k = 0; k < 4; k++) {
      const [x1, z1] = c[k], [x2, z2] = c[(k + 1) % 4];
      const n = Math.ceil(Math.hypot(x2 - x1, z2 - z1) / 1.8);
      for (let i = 0; i < n; i++) pts.push([x1 + (x2 - x1) * i / n, z1 + (z2 - z1) * i / n]);
    }
    return pts;
  };
  const r = 0.024, pipes = [], decks = [];
  const inner = ring(ai), outer = ring(ao);
  for (const [x, z] of [...inner, ...outer]) pipes.push(pipe(V(x, 0, z), V(x, h, z), r));
  const lifts = h > 4.5 ? [0, h / 3, (2 * h) / 3] : [0, h / 2];
  const lift = h / lifts.length;
  for (const L of lifts) {
    for (const a of [ai, ao]) {
      const c = corners(a);
      for (let k = 0; k < 4; k++) {
        const [x1, z1] = c[k], [x2, z2] = c[(k + 1) % 4];
        pipes.push(pipe(V(x1, L + 0.06, z1), V(x2, L + 0.06, z2), r));
        if (a === ao) for (const hh of [0.5, 0.95]) pipes.push(pipe(V(x1, L + hh, z1), V(x2, L + hh, z2), r)); // 手すり・中桟
      }
    }
    outer.forEach(([x, z], i) => { // 筋かい
      const [x2, z2] = outer[(i + 1) % outer.length];
      if (i % 2 === 0) pipes.push(pipe(V(x, L, z), V(x2, L + lift, z2), r * 0.8));
    });
    const t = 0.04, dz = ao.z - ai.z, dx = ao.x - ai.x;
    for (const s of [-1, 1]) {
      decks.push(new THREE.BoxGeometry(ao.x * 2, t, dz).translate(0, L + t / 2, s * (ai.z + ao.z) / 2));
      decks.push(new THREE.BoxGeometry(dx, t, ai.z * 2).translate(s * (ai.x + ao.x) / 2, L + t / 2, 0));
    }
  }
  const sx = ao.x + 0.08, sz = ao.z + 0.08;
  const plane = (w, ry, x, z) => {
    const g = new THREE.PlaneGeometry(w, h);
    const uv = g.attributes.uv;
    for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * w / 1.2, uv.getY(i) * h / 1.2);
    return g.rotateY(ry).translate(x, h / 2, z);
  };
  const sheets = [plane(sx * 2, 0, 0, sz), plane(sx * 2, Math.PI, 0, -sz), plane(sz * 2, Math.PI / 2, sx, 0), plane(sz * 2, -Math.PI / 2, -sx, 0)];
  return { pipes: mergeGeometries(pipes), decks: mergeGeometries(decks), sheets: mergeGeometries(sheets) };
}

// ===== 現場全体：地面・仮囲い・事務所・杭・山留め・基礎・重機・クレーン・外構 =====
let site = {};
function holedPlane(ox, oz, hx, hz) { // 四角い穴のあいた地面（XZ平面・上向き）
  const shape = new THREE.Shape();
  shape.moveTo(-ox, -oz); shape.lineTo(ox, -oz); shape.lineTo(ox, oz); shape.lineTo(-ox, oz); shape.closePath();
  const hole = new THREE.Path();
  hole.moveTo(-hx, -hz); hole.lineTo(-hx, hz); hole.lineTo(hx, hz); hole.lineTo(hx, -hz); hole.closePath();
  shape.holes.push(hole);
  return new THREE.ShapeGeometry(shape).rotateX(-Math.PI / 2);
}

function buildGround() {
  site.asphalt = addMesh(holedPlane(1500, 1500, FX + 1, FZ + 1), M.asphalt, world, false);

  for (const [w, x, z, ry] of [[PX * 2, 0, -PZ, 0], [PX * 2, 0, PZ, Math.PI], [PZ * 2, -PX, 0, Math.PI / 2], [PZ * 2, PX, 0, -Math.PI / 2]]) {

  for (let k = 0; k < 4; k++) {
    const [x1, z1] = ring[k], [x2, z2] = ring[(k + 1) % 4];

  }
  site.hsteel = addMesh(mergeGeometries(posts), M.hsteel);
}

function buildPrep() { // 準備工事：仮囲い（3.6mずつ）・ゲート・現場事務所・仮設トイレ

function buildFoundation() { // 基礎工事：捨てコン→フーチング→基礎梁→基礎版

function buildExterior() { // 外構工事：犬走り・舗装・植栽・駐車場の白線・植木
  const list = [], ax = EX + 1.5, az = EZ + 1.5, ix = FX - 2, iz = FZ - 2;
  for (const s of [-1, 1]) { // 建物まわりのコンクリート
    const a = newEl(V(0, 0, s * (az - 0.75)), 'xz'); P(a, M.apron, ax * 2, 0.1, 1.5, 0, 0.05, s * (az - 0.75), 0.02); list.push(a);
    const b = newEl(V(s * (ax - 0.75), 0, 0), 'xz'); P(b, M.apron, 1.5, 0.1, az * 2 - 3, s * (ax - 0.75), 0.05, 0, 0.02); list.push(b);
  }
  const tiles = [];
  const region = (x1, x2, z1, z2) => {
    const nx = Math.max(1, Math.round((x2 - x1) / 6)), nz = Math.max(1, Math.round((z2 - z1) / 6));

  };
  region(-ix, ix, az, iz); region(-ix, ix, -iz, -az); region(-ix, -ax, -az, az); region(ax, ix, -az, az);
  tiles.sort((a, b) => a[0] - b[0]).forEach(([, cx, cz, w, d]) => {
    const e = newEl(V(cx, 0, cz), 'xz');
    P(e, M.pave, w, 0.08, d, cx, 0.04, cz, 0.01);
    list.push(e);
  });
  for (const s of [-1, 1]) { // 植栽帯
    const a = newEl(V(0, 0, s * (FZ - 1)), 'xz'); P(a, M.lawn, FX * 2 - 0.4, 0.14, 1.8, 0, 0.07, s * (FZ - 1), 0.03); list.push(a);
    const b = newEl(V(s * (FX - 1), 0, 0), 'xz'); P(b, M.lawn, 1.8, 0.14, FZ * 2 - 4, s * (FX - 1), 0.07, 0, 0.03); list.push(b);
  }
  for (let x = -ix + 2; x <= ix - 2; x += 2.5) { // 駐車場の白線

  for (let x = -FX + 4; x <= FX - 4; x += 8) { tree(x, -FZ + 1); if (Math.abs(x) > 8) tree(x, FZ - 1); }
  for (let z = -FZ + 8; z <= FZ - 8; z += 8) { tree(-FX + 1, z); tree(FX - 1, z); }

function buildCrane(roofTop) { // タワークレーン（組立・解体で背が変わる）
  const cx = EX + 8, cz = EZ + 8, dist = Math.hypot(cx, cz);

  const mast = addMesh(lattice(MH, 1.7, 2.0, 0.16, 0.08), M.crane, crane);
  mast.position.y = 1.2;

  const slew = new THREE.Group();
  slew.rotation.y = -Math.atan2(cz, cx); // ジブを建物の方へ
  crane.add(slew);
  const jib = Math.max(30, Math.round(dist + 10));
  const Y = [], S = [];
  Y.push(new THREE.BoxGeometry(2.6, 1.0, 2.6).translate(0, top + 0.5, 0));

  for (const [x, z] of [[-.85, -.85], [.85, -.85], [.85, .85], [-.85, .85]]) Y.push(bar(V(x, top + 1, z), apex, 0.16));
  Y.push(lattice(jib, 1.4, 2.2, 0.12, 0.07).rotateZ(-Math.PI / 2).translate(1.3, top + 1.7, 0));
  for (const z of [-0.8, 0.8]) Y.push(new THREE.BoxGeometry(12, 0.5, 0.35).translate(-7.3, top + 1.25, z)); // カウンタージブ
  Y.push(bar(apex, V(jib * 0.72, top + 2.4, 0), 0.07), bar(apex, V(-12.8, top + 1.5, 0), 0.07)); // 吊りロッド
  const trolleyX = dist * 0.9, hookY = roofTop + 5;
  Y.push(new THREE.BoxGeometry(1.4, 0.5, 1.2).translate(trolleyX, top + 0.8, 0));
  Y.push(new THREE.BoxGeometry(0.7, 0.9, 0.5).translate(trolleyX, hookY, 0));
  S.push(new THREE.BoxGeometry(12, 0.06, 1.9).translate(-7.3, top + 1.0, 0));
  for (const dx of [-0.2, 0.2]) S.push(pipe(V(trolleyX + dx, top + 0.6, 0), V(trolleyX + dx, hookY + 0.45, 0), 0.018));
  addMesh(mergeGeometries(Y), M.crane, slew);

  box(slew, M.cab, 2.0, 2.2, 2.0, 0.6, top + 0.4, 2.0, 0.08);
  addMesh(pbox(0.04, 1.2, 1.6), M.glass, slew, false).position.set(1.62, top + 0.7, 2.0);
  crane.visible = false;
  site.crane = { g: crane, mast, slew };
  return top + 8;
}

const ZERO = new THREE.Matrix4().makeScale(0, 0, 0);

function build(cfg) {
  // 前の建物を片付ける
  if (world) {

    arRoot.remove(world);
  }
  Object.values(GEO).forEach(g => g.dispose());
  worldMats.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
  world = new THREE.Group(); arRoot.add(world);
  worldMats = []; GEO = {}; batches = new Map(); elements = []; floors = {}; site = {};

  CFG = cfg; NF = cfg.floors;
  GX = Array.from({ length: cfg.spanX + 1 }, (_, i) => -cfg.spanX * 3 + i * 6);
  GZ = Array.from({ length: cfg.spanZ + 1 }, (_, i) => -cfg.spanZ * 3 + i * 6);
  EX = cfg.spanX * 3 + 1; EZ = cfg.spanZ * 3 + 1;
  FX = EX + 16; FZ = EZ + 14;      // 仮囲い
  PX = EX + 2; PZ = EZ + 2;        // 掘削範囲
  hs = [0]; ys = [0, BASE];
  for (let f = 1; f <= NF; f++) { hs[f] = USES[cfg.use].h(f); ys[f + 1] = ys[f] + hs[f]; }

  const fx = EX - CW, fz = EZ - CW;
  const XB = GX.slice(0, -1).map((x, i) => [i === 0 ? -fx : x, i === GX.length - 2 ? fx : GX[i + 1]]);
  const ZB = GZ.slice(0, -1).map((z, i) => [i === 0 ? -fz : z, i === GZ.length - 2 ? fz : GZ[i + 1]]);
  const bays = [
    ...XB.map(([a, b], i) => ['front', i, (a + b) / 2, fz, b - a, 0]),
    ...ZB.map(([a, b], i) => ['right', i, fx, -(a + b) / 2, b - a, Math.PI / 2]),
    ...XB.map(([a, b], i) => ['back', i, -(a + b) / 2, -fz, b - a, Math.PI]),
    ...ZB.map(([a, b], i) => ['left', i, -fx, (a + b) / 2, b - a, -Math.PI / 2]),
  ];

  buildGround();
  buildPrep();
  buildFoundation();
  buildExterior();
  buildPiles();
  buildMachines();

  for (let f = 1; f <= NF; f++) {
    const y0 = yb(f), H = hs[f], yt = y0 + SLAB, colH = H - SLAB;
    const fl = { '床': [], '躯体': [], '外装': [], '内装': [], cols: [], rebar: [], roof: [], scaffold: null };
    floors[f] = fl;

    slabPanels(y0, M.slab, fl['床']);

    // 躯体（柱 0.8m角）＋ 柱頭から出る鉄筋
    for (const gz of GZ) for (const gx of GX) {
      const c = newEl(V(gx, yt, gz));
      P(c, M.column, 0.8, colH, 0.8, gx, yt + colH / 2, gz, 0.05);
      fl['躯体'].push(c); fl.cols.push(c);
      const r = newEl(V(gx, y0 + H, gz));
      const rg = GEO.rebar ||= new THREE.CylinderGeometry(0.016, 0.016, 1.1, 6);
      for (const [dx, dz] of [[-.28, -.28], [.28, -.28], [.28, .28], [-.28, .28], [0, -.28], [0, .28], [-.28, 0], [.28, 0]])
        addPart(r, rg, M.rebar, m4(gx + dx, y0 + H + 0.55, gz + dz));
      fl.rebar.push(r);
    }
    if (f === NF) { // 屋上スラブ＋パラペット
      const yr = yb(NF + 1);
      slabPanels(yr, M.slab, fl.roof);
      for (const s of [-1, 1]) {
        const a = newEl(V(0, yr + SLAB, s * (EZ - 0.1)));
        P(a, M.column, EX * 2, 1.0, 0.2, 0, yr + SLAB + 0.5, s * (EZ - 0.1));
        const b = newEl(V(s * (EX - 0.1), yr + SLAB, 0));
        P(b, M.column, 0.2, 1.0, EZ * 2 - 0.4, s * (EX - 0.1), yr + SLAB + 0.5, 0);
        fl.roof.push(a, b);
      }
      fl['躯体'].push(...fl.roof);
    }

    // 外装（用途ごとの外壁）
    for (const [side, i, x, z, w, ry] of bays) {
      const e = newEl(V(x, yt, z));
      const tmp = { parts: [] };
      exteriorBay(tmp, f, side, i, Math.round(w * 100) / 100, colH);
      const place = m4(x, yt, z, ry);
      tmp.parts.forEach(p => e.parts.push({ ...p, base: place.clone().multiply(p.base) }));
      fl['外装'].push(e);
    }
    if (f === NF && CFG.use === 'datacenter') { // 屋上の冷却設備
      const yr = yb(NF + 1) + SLAB;
      for (let i = 0; i < GX.length - 1; i++) for (let j = 0; j < GZ.length - 1; j++) {
        const x = (GX[i] + GX[i + 1]) / 2, z = (GZ[j] + GZ[j + 1]) / 2;
        const e = newEl(V(x, yr, z));
        P(e, M.equip, 3.2, 2.2, 3.2, x, yr + 1.1, z, 0.08);
        addPart(e, GEO.fan ||= new THREE.CylinderGeometry(1.1, 1.1, 0.12, 24), M.fan, m4(x, yr + 2.26, z));
        fl['外装'].push(e);
      }
    }

    // 内装（窓越しにうっすら見える）
    interior(f, yt, colH, fl['内装']);
  }

  // 部材の InstancedMesh を作る
  for (const b of batches.values()) {
    b.mesh = new THREE.InstancedMesh(b.geo, b.mat, b.count);
    b.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    b.mesh.castShadow = b.cast;
    b.mesh.receiveShadow = true;
    b.mesh.frustumCulled = false;
    for (let i = 0; i < b.count; i++) b.mesh.setMatrixAt(i, ZERO);
    world.add(b.mesh);
  }

  // 足場（各階）
  const off = 0.45 + (CFG.use === 'apartment' ? 1.6 : 0);
  const cache = {};
  for (let f = 1; f <= NF; f++) {
    const bottom = f === 1 ? 0 : yb(f), h = f === 1 ? hs[f] + BASE : hs[f];
    const g = cache[h] ||= scaffoldGeos(h, off);
    const grp = new THREE.Group();
    grp.position.y = bottom;
    addMesh(g.pipes, M.pipe, grp);
    addMesh(g.decks, M.deck, grp);
    addMesh(g.sheets, M.sheet, grp, false);
    grp.visible = false;
    world.add(grp);
    const e = newEl(V(0, bottom, 0));
    e.obj = grp;
    floors[f].scaffold = e;
  }

  const roofTop = yb(NF + 1) + SLAB + 1.0;
  const craneTop = buildCrane(roofTop);

  // 影・霧・カメラを現場の大きさに合わせる
  shadowS = Math.max(FX, FZ, 40) + 14;
  sunDist = shadowS * 1.9;
  applyTheme();
  fitCamera(roofTop, craneTop);

  document.getElementById('summary').textContent =
    `${USES[CFG.use].label}・${NF}階建て・${cfg.spanX * 6}m×${cfg.spanZ * 6}m`;
  setupSlider();
}

const darkMQ = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const dark = darkMQ.matches;
  const top = dark ? '#1b2a52' : '#5f93cf', hor = dark ? '#e39a6c' : '#f1dcc0';
  skyMat.uniforms.top.value.set(top);
  skyMat.uniforms.horizon.value.set(hor);
  skyMat.uniforms.bottom.value.set(hor);
  fog.color.set(hor);
  sun.color.set(dark ? '#ff9f62' : '#ffcf9e');
  sun.intensity = dark ? 2.4 : 3.2;
  sunDir.set(...(dark ? [-80, 34, 60] : [-70, 58, 62])).normalize();
  applySun();
  hemi.intensity = dark ? 0.45 : 0.8;
  hemi.color.set(dark ? '#7f94c8' : '#a9c8ff');
  if (skyEnv) skyEnv.dispose();
  skyEnv = pmrem.fromScene(skyScene, 0.02);
  M.glass.envMap = skyEnv.texture; // ガラスには空を映す
  M.glass.needsUpdate = true;
}
darkMQ.addEventListener('change', applyTheme);
// 太陽と影の範囲（AR では模型の縮尺 k と置いた場所 center に合わせる）
function applySun(k = arRoot.scale.x, center = arRoot.position) {
  const s = shadowS * k;
  Object.assign(sun.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: 5 * k, far: shadowS * 5 * k });
  sun.shadow.camera.updateProjectionMatrix();
  sun.shadow.normalBias = 0.03 * k;
  sun.target.position.copy(center);
  sun.position.copy(center).addScaledVector(sunDir, sunDist * k);
}

const camera = new THREE.PerspectiveCamera(35, 1, 0.5, 4000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minPolarAngle = 0.25;
controls.maxPolarAngle = Math.PI * 0.47;
let fitInfo = null;
function fitCamera(roofTop, craneTop) {
  fitInfo = { roofTop, craneTop };
  const R = Math.max(Math.hypot(EX, EZ) * 1.6, roofTop * 1.3, 30);
  const base = R / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.05;
  const dist = base * Math.max(1, 1.15 / camera.aspect);
  controls.target.set(0, Math.min(roofTop * 0.45, 30), 0);
  camera.position.copy(controls.target).add(V(60, 22, 75).setLength(dist));
  controls.minDistance = Math.max(20, R * 0.6);
  controls.maxDistance = dist * 3;
  fog.near = dist * 1.05;
  fog.far = dist * 4.2;
  controls.update();
}

// ===== 部材のアニメーション =====
const _A = new THREE.Matrix4(), _T = new THREE.Matrix4(), _S = new THREE.Matrix4(), _M = new THREE.Matrix4();
function applyEl(e) {
  const s = e.cur;
  if (e.obj) { e.obj.visible = s > 0.002; e.obj.scale.y = Math.max(s, 0.001); return; }
  if (s <= 0.002) {
    for (const p of e.parts) { p.b.mesh.setMatrixAt(p.i, ZERO); p.b.dirty = true; }
    return;
  }
  const { x, y, z } = e.anchor;
  _S.makeScale(e.mode === 'xz' ? s : 1, e.mode === 'xz' ? 1 : s, e.mode === 'xz' ? s : 1);
  _A.makeTranslation(x, y, z).multiply(_S).multiply(_T.makeTranslation(-x, -y, -z));
  for (const p of e.parts) {
    p.b.mesh.setMatrixAt(p.i, _M.multiplyMatrices(_A, p.base));
    p.b.dirty = true;
  }
}
function stepElements() {
  for (const e of elements) {
    if (e.cur === e.target) continue;
    const d = e.target - e.cur;
    e.cur = Math.abs(d) < 0.004 ? e.target : e.cur + d * 0.16;
    applyEl(e);
  }
  for (const b of batches.values()) if (b.dirty) { b.mesh.instanceMatrix.needsUpdate = true; b.dirty = false; }
}
function animateMachines(t) { // 重機を少しだけ動かす
  const b = site.backhoe;
  if (b && b.g.visible) {
    b.upper.rotation.y = Math.sin(t * 0.5) * 0.6;
    b.boom.rotation.z = 0.35 + Math.sin(t * 0.9) * 0.22;
    b.arm.rotation.z = -1.75 + Math.sin(t * 0.9 + 1.2) * 0.35;
  }
  if (site.rig && site.rig.visible) site.hammer.position.y = site.hammerBase + Math.abs(Math.sin(t * 3)) * 0.5;
}

// ===== 日付スライダー =====
const slider = document.getElementById('slider');
const dateLabel = document.getElementById('dateLabel');
const phaseLabel = document.getElementById('phaseLabel');
let rangeStart = new Date(), totalDays = 1;
const dayToDate = n => addDays(rangeStart, n);
document.getElementById('legend').innerHTML = LEGEND.map(([n, c]) => `<span><i style="background:${c}"></i>${n}</span>`).join('');

function allDates() {
  return [
    ...CFG.data.filter(d => d.floor <= NF).flatMap(d => d.progress.map(([s]) => s)),
    ...SITE_PHASES.flatMap(p => CFG.site[p.key]),
  ].map(s => parseDate(s).getTime());
}
function setupSlider() {
  const all = allDates();
  rangeStart = addDays(new Date(Math.min(...all)), -7);
  totalDays = Math.round((addDays(new Date(Math.max(...all)), 10) - rangeStart) / DAY);
  slider.max = totalDays;
  document.getElementById('minLabel').textContent = fmtShort(rangeStart);
  document.getElementById('maxLabel').textContent = fmtShort(dayToDate(totalDays));
  const t = new Date();
  const idx = Math.round((new Date(t.getFullYear(), t.getMonth(), t.getDate()) - rangeStart) / DAY);
  slider.value = Math.min(totalDays, Math.max(0, idx));
  setDay(Number(slider.value));
}
// いまどの工程か
function phaseText(date, sp, pct) {
  const t = date.getTime(), all = allDates();
  if (t < Math.min(...all)) return '更地（着工前）';
  if (t > Math.max(...all)) return '竣工';
  const act = SITE_PHASES.filter(p => sp[p.key] > 0 && sp[p.key] < 1).map(p => p.label);
  for (const k of KIND_NAMES) {
    const fs = [];
    for (let f = 1; f <= NF; f++) { const v = pct(f, k); if (v > 0 && v < 100) fs.push(f); }
    if (fs.length) act.push(`${k} ${fs.length > 2 ? `${fs[0]}〜${fs[fs.length - 1]}` : fs.join('・')}階`);
  }
  return act.length ? 'いま：' + act.join(' / ') : '工程の合間';
}
function setDay(n) {
  const date = dayToDate(n);
  dateLabel.textContent = fmt(date);
  const pct = (f, k) => {
    const item = CFG.data.find(d => d.floor === f && d.kind === k);
    return item ? Math.min(100, Math.max(0, progressAt(item.progress, date))) : 0;
  };
  const sp = {};
  SITE_PHASES.forEach(p => { sp[p.key] = phaseRatio(CFG.site[p.key], date); });
  phaseLabel.textContent = phaseText(date, sp, pct);

  for (let f = 1; f <= NF; f++) {
    const fl = floors[f];
    for (const k of KIND_NAMES) {
      const list = fl[k], shown = Math.round(list.length * pct(f, k) / 100);
      list.forEach((e, i) => { e.target = i < shown ? 1 : 0; });
    }
    // 躯体だけの階：上にまだ床が無ければ柱頭から鉄筋が出る
    const covered = f < NF ? pct(f + 1, '床') > 0 : fl.roof.some(e => e.target === 1);
    const bare = pct(f, '外装') === 0 && !covered;
    fl.cols.forEach((c, i) => { fl.rebar[i].target = bare && c.target === 1 ? 1 : 0; });
    // 外装工事中の階：足場と養生シート（外装が終われば外す）
    const ext = pct(f, '外装');
    fl.scaffold.target = ext > 0 && ext < 100 ? 1 : 0;
  }
  updateSite(sp);
}

function updateSite(sp) {
  // 準備工事（外構工事の最初に撤去）
  const fenceGone = Math.round(site.fenceCount * clamp01(sp.ext / 0.25));
  const shownPrep = Math.round(site.prepList.length * sp.prep);
  let fi = 0;
  site.prepList.forEach((e, i) => {
    let on = i < shownPrep;
    if (e.tag === 'fence') { if (fi < fenceGone) on = false; fi++; }
    if (e.tag === 'office' && sp.ext > 0.12) on = false;
    e.target = on ? 1 : 0;
  });
  // 基礎工事：最後の15%で埋め戻し
  const nF = site.foundList.length, shownF = Math.round(nF * clamp01(sp.found / 0.85));
  site.foundList.forEach((e, i) => { e.target = i < shownF ? 1 : 0; });
  const backfill = clamp01((sp.found - 0.85) / 0.15);
  const depth = PIT * Math.min(sp.excav, 1 - backfill);
  site.pitFloor.position.y = -depth - 0.003;
  site.pitMat.color.setRGB(1, 1, 1).lerp(PIT_DEEP, depth / PIT); // 深いほど湿った暗い土
  site.walls.forEach(w => { w.visible = depth > 0.02; w.scale.y = Math.max(depth, 0.01); });
  site.hsteel.visible = sp.excav > 0 && backfill < 1;
  // 外構
  const nE = site.extList.length, shownE = Math.round(nE * clamp01((sp.ext - 0.3) / 0.7));
  site.extList.forEach((e, i) => { e.target = i < shownE ? 1 : 0; });
  // 杭：1本ずつ打ち込む（掘ったところは杭頭を切りそろえる）
  const N = site.piles.length, k = Math.min(N, Math.floor(sp.pile * N)), frac = sp.pile * N - k;
  const cut = Math.min(PIT * sp.excav, PIT - 0.3);
  site.piles.forEach((m, i) => {
    m.visible = i < k;
    m.scale.y = PILE_LEN - cut;
  });
  const rigOn = sp.pile > 0 && sp.pile < 1 && k < N;
  site.rig.visible = rigOn;
  if (rigOn) {
    const p = site.piles[k].position;
    site.rig.position.set(p.x - 2.15, 0, p.z);
    const out = (1 - frac) * 7; // 地上に出ている長さ
    site.rigPile.position.y = out - PILE_LEN;
    site.rigPile.scale.y = PILE_LEN;
    site.hammerBase = out + 1.2;
  }
  // 掘削・埋め戻し中だけ重機を出す
  const digging = (sp.excav > 0 && sp.excav < 1) || (backfill > 0 && backfill < 1);
  site.backhoe.g.visible = site.dump.visible = digging;
  // タワークレーン：組立は下から、解体は上から
  const c = site.crane;
  let mast = 0, slewOn = false;
  if (sp.crane > 0 && sp.craneOff < 1) {
    if (sp.craneOff > 0) { mast = 1 - clamp01((sp.craneOff - 0.3) / 0.7); slewOn = sp.craneOff < 0.3; }
    else { mast = clamp01(sp.crane / 0.75); slewOn = sp.crane >= 0.8; }
  }
  c.g.visible = sp.crane > 0 && sp.craneOff < 1;
  c.mast.scale.y = Math.max(mast, 0.001);
  c.slew.visible = slewOn;
}

  const g = genAll(draft.floors, draft.auto);
  draft.site = g.site; draft.data = g.data;
  renderTable(); $('err').textContent = '';
});
$('table').addEventListener('change', e => {
  const t = e.target;
  if (!validIso(t.value)) return;
  const i = t.dataset.p === 's' ? 0 : 1;
  if (t.dataset.site) { draft.site[t.dataset.site][i] = t.value; return; }
  if (!t.dataset.f) return;
  const it = draft.data.find(d => d.floor === Number(t.dataset.f) && d.kind === t.dataset.k);
  it.progress[i === 0 ? 0 : it.progress.length - 1][0] = t.value;
});
$('settingsBtn').addEventListener('click', () => { draft = clone(CFG); $('err').textContent = ''; fillForm(); sheetBg.classList.add('open'); });
$('closeBtn').addEventListener('click', () => sheetBg.classList.remove('open'));
sheetBg.addEventListener('click', e => { if (e.target === sheetBg) sheetBg.classList.remove('open'); });
$('resetBtn').addEventListener('click', () => { draft = clone(SAMPLE); $('err').textContent = ''; fillForm(); });
$('applyBtn').addEventListener('click', () => {
  readAuto();
  for (const p of SITE_PHASES) {
    const [s, e] = draft.site[p.key];
    if (parseDate(e) < parseDate(s)) { $('err').textContent = `${p.label}：終了日が開始日より前になっています`; return; }
  }
  for (const it of draft.data) {
    const s = it.progress[0][0], e = it.progress[it.progress.length - 1][0];
    if (parseDate(e) < parseDate(s)) { $('err').textContent = `${it.floor}階の${it.kind}：終了日が開始日より前になっています`; return; }
  }
  if (!validConfig(draft)) { $('err').textContent = '入力に足りないところがあります'; return; }
  saveConfig(draft);
  build(clone(draft));
  sheetBg.classList.remove('open');
});

// ===== サイズ調整・描画 =====
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h || renderer.xr.isPresenting) return;
  renderer.setSize(w, h, false);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(w, h);
  const first = camera.aspect === 1;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (first && fitInfo) fitCamera(fitInfo.roofTop, fitInfo.craneTop);
}
new ResizeObserver(resize).observe(stage);
resize();
build(loadConfig());

// ===== AR =====
// Android（Chrome）：WebXR でカメラ映像の上に模型を置く。日付スライダーもそのまま使える
// iPhone・iPad（Safari）：選んでいる日の模型を USDZ にして AR クイックルックで開く
const arBtn = $('arBtn'), arOverlay = $('arOverlay'), arHint = $('arHint');
const toast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.remove('on'), 4000); };
const quickLook = (() => { const a = document.createElement('a'); return !!(a.relList && a.relList.supports && a.relList.supports('ar')); })();
let webxrOK = false;
if (navigator.xr && navigator.xr.isSessionSupported) navigator.xr.isSessionSupported('immersive-ar').then(ok => { webxrOK = ok; }).catch(() => {});

renderer.xr.enabled = true;
let arScale = 100, hitSource = null;
const reticle = new THREE.Mesh(new THREE.RingGeometry(0.07, 0.09, 40).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff }));
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);
const controller = renderer.xr.getController(0);
scene.add(controller);
controller.addEventListener('select', () => { // タップした場所に置く（何度でも置き直せる）
  if (!reticle.visible) return;
  arRoot.position.setFromMatrixPosition(reticle.matrix);
  const cam = new THREE.Vector3().setFromMatrixPosition(renderer.xr.getCamera().matrixWorld);
  arRoot.rotation.y = Math.atan2(cam.x - arRoot.position.x, cam.z - arRoot.position.z) - Math.atan2(60, 75); // いつもの向きで手前に見せる
  arRoot.visible = true;
  applySun();
  arHint.textContent = 'タップで置き直し・下のスライダーで日付を変えられます';
});
// AR中の操作パネルを押したときは、模型を置き直さない
for (const el of [$('arScales'), $('arPanelSlot')]) el.addEventListener('beforexrselect', e => e.preventDefault());
$('arScales').addEventListener('click', e => {
  const b = e.target.closest('button[data-scale]');
  if (!b) return;
  arScale = Number(b.dataset.scale);
  arRoot.scale.setScalar(1 / arScale);
  applySun();
  document.querySelectorAll('#arScales button[data-scale]').forEach(x => x.classList.toggle('on', x === b));
});
$('arExit').addEventListener('click', () => { const s = renderer.xr.getSession(); if (s) s.end(); });

function enterAR() {
  arOverlay.classList.add('on');
  $('arPanelSlot').appendChild($('panel'));
  scene.background = null;
  sky.visible = false;
  scene.fog = null;
  site.asphalt.visible = false;
  site.catcher.visible = true;
  controls.enabled = false;
  arRoot.visible = false;
  arRoot.scale.setScalar(1 / arScale);
  arHint.textContent = '床や机を映して、白い輪が出たらタップ';
}
function exitAR() {
  arOverlay.classList.remove('on');
  document.querySelector('.app').appendChild($('panel'));
  sky.visible = true;
  scene.fog = fog;
  if (site.asphalt) site.asphalt.visible = true;
  if (site.catcher) site.catcher.visible = false;
  controls.enabled = true;
  arRoot.visible = true;
  arRoot.position.set(0, 0, 0);
  arRoot.rotation.set(0, 0, 0);
  arRoot.scale.setScalar(1);
  reticle.visible = false;
  hitSource = null;
  applySun();
  resize();
}
async function startWebXR() {
  try {
    const session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'], optionalFeatures: ['dom-overlay'], domOverlay: { root: arOverlay },
    });
    enterAR();
    session.addEventListener('end', exitAR);
    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(session);
    hitSource = await session.requestHitTestSource({ space: await session.requestReferenceSpace('viewer') });
  } catch (err) {
    toast('ARを始められませんでした。カメラの使用を許可しているか確認してください');
  }
}
function arFrame(frame) {
  if (!frame || !hitSource) return;
  const hits = frame.getHitTestResults(hitSource);
  if (hits.length) {
    reticle.matrix.fromArray(hits[0].getPose(renderer.xr.getReferenceSpace()).transform.matrix);
    reticle.visible = true;
  } else reticle.visible = false;
}

// --- iPhone・iPad：いま見えている模型を USDZ にする ---
const simpleBox = new Map(); // 面取りの箱はファイルを軽くするため普通の箱にする
function exportGeo(geo) {
  if (!(geo instanceof RoundedBoxGeometry)) return geo;
  if (!simpleBox.has(geo)) {
    geo.computeBoundingBox();
    const s = geo.boundingBox.getSize(new THREE.Vector3());
    simpleBox.set(geo, new THREE.BoxGeometry(s.x, s.y, s.z));
  }
  return simpleBox.get(geo);
}
function forExport(geo, matrix) {
  let g = geo.index ? geo.toNonIndexed() : geo.clone();
  g.applyMatrix4(matrix);
  for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
  if (!g.attributes.normal) g.computeVertexNormals();
  if (!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
  return g;
}
async function startQuickLook() {
  const label = arBtn.textContent;
  arBtn.textContent = '準備中…'; arBtn.disabled = true;
  try {
    for (const e of elements) { if (e.cur !== e.target) { e.cur = e.target; applyEl(e); } }
    stepElements();
    arRoot.updateMatrixWorld(true);
    const byMat = new Map(), m = new THREE.Matrix4(), mw = new THREE.Matrix4();
    const push = (geo, mat, matrix) => { if (!byMat.has(mat)) byMat.set(mat, []); byMat.get(mat).push(forExport(geo, matrix)); };
    world.traverseVisible(o => {
      if (!o.isMesh || o === site.asphalt || o === site.catcher) return;
      if (o.isInstancedMesh) {
        for (let i = 0; i < o.count; i++) {
          o.getMatrixAt(i, m);
          if (m.determinant() === 0) continue;
          push(exportGeo(o.geometry), o.material, mw.multiplyMatrices(o.matrixWorld, m));
        }
      } else push(o.geometry, o.material, o.matrixWorld);
    });
    const out = new THREE.Scene(), model = new THREE.Group();
    model.scale.setScalar(1 / 100); // 机に乗る大きさ（AR クイックルックの中で拡大・縮小できる）
    out.add(model);
    for (const [mat, list] of byMat) model.add(new THREE.Mesh(mergeGeometries(list), mat));
    const data = await new USDZExporter().parse(out);
    const url = URL.createObjectURL(new Blob([data], { type: 'model/vnd.usdz+zip' }));
    const a = document.createElement('a');
    a.rel = 'ar';
    a.href = url;
    a.appendChild(document.createElement('img'));
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    window.__lastUsdzSize = data.byteLength;
  } catch (err) {
    toast('ARの模型を作れませんでした');
  } finally {
    arBtn.textContent = label; arBtn.disabled = false;
  }
}
arBtn.addEventListener('click', () => {
  if (webxrOK) startWebXR();
  else if (quickLook) startQuickLook();
  else toast('この端末ではARが使えません。AndroidのChrome、またはiPhone・iPadのSafariで開いてください');
});

const clock = new THREE.Clock();
let frames = 0, t0 = 0;
renderer.setAnimationLoop((time, frame) => {
  stepElements();
  animateMachines(clock.getElapsedTime());
  if (renderer.xr.isPresenting) { // AR中はカメラ映像の上にそのまま描く
    arFrame(frame);
    renderer.render(scene, camera);
    return;
  }
  controls.update();
  composer.render();
  // 動きが重ければ SSAO を自動で切る
  if (autoQuality && ssaoOn && frames < 120) {
    frames++;
    if (frames === 30) t0 = performance.now();
    if (frames === 120 && (performance.now() - t0) / 90 > 30) setSSAO(false);
  }
});
</script>
</body>
</html>
