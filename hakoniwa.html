$('closeBtn').addEventListener('click', () => sheetBg.classList.remove('open'));
sheetBg.addEventListener('click', e => { if (e.target === sheetBg) sheetBg.classList.remove('open'); });
$('resetBtn').addEventListener('click', () => { draft = clone(SAMPLE); $('err').textContent = ''; fillForm(); });
$('applyBtn').addEventListener('click', () => {
  readAuto();
  for (const p of SITE_PHASES) {
    const [s, e] = draft.site[p.key];
    if (parseDate(e) < parseDate(s)) { $('err').textContent = `${p.label}：終了日が開始日より前になっています`; return; }
  }
  for (const it of draft.data) {
    const s = it.progress[0][0], e = it.progress[it.progress.length - 1][0];
    if (parseDate(e) < parseDate(s)) { $('err').textContent = `${it.floor}階の${it.kind}：終了日が開始日より前になっています`; return; }
  }
  for (const [id, axis, key, label] of [['fNamesX', 'x', 'gridNamesX', '間口'], ['fNamesZ', 'z', 'gridNamesZ', '奥行']]) {
    const want = spansOf(draft, axis).length + 1;
    const v = $(id).value.split(/[,、，\s]+/).map(s => s.trim()).filter(Boolean);
    if (v.length !== want) { $('err').textContent = `通り芯の名前（${label}）は柱の数と同じ${want}個入れてください（いまは${v.length}個）`; return; }
    if (v.some(s => s.length > 8)) { $('err').textContent = `通り芯の名前（${label}）は1つ8文字までにしてください`; return; }
    if (v.join() === defaultNames(want, axis).join()) delete draft[key]; else draft[key] = v;
  }
  if (!validConfig(draft)) { $('err').textContent = '入力に足りないところがあります'; return; }
  saveConfig(draft);
  build(clone(draft));
  sheetBg.classList.remove('open');
});

// ===== サイズ調整・描画 =====
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h || renderer.xr.isPresenting) return;
  renderer.setSize(w, h, false);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(w, h);
  const first = camera.aspect === 1;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  if (first && fitInfo) fitCamera(fitInfo.roofTop, fitInfo.craneTop);
}
new ResizeObserver(resize).observe(stage);
resize();
build(loadConfig());

// ===== AR =====
// Android（Chrome）：WebXR でカメラ映像の上に模型を置く。日付スライダーもそのまま使える
// iPhone・iPad（Safari）：選んでいる日の模型を USDZ にして AR クイックルックで開く
const arBtn = $('arBtn'), arOverlay = $('arOverlay'), arHint = $('arHint');
const toast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.remove('on'), 4000); };
const quickLook = (() => { const a = document.createElement('a'); return !!(a.relList && a.relList.supports && a.relList.supports('ar')); })();
let webxrOK = false;
if (navigator.xr && navigator.xr.isSessionSupported) navigator.xr.isSessionSupported('immersive-ar').then(ok => { webxrOK = ok; }).catch(() => {});

renderer.xr.enabled = true;
let arScale = 100, hitSource = null;
const reticle = new THREE.Mesh(new THREE.RingGeometry(0.07, 0.09, 40).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff }));
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);
const controller = renderer.xr.getController(0);
scene.add(controller);
controller.addEventListener('select', () => { // タップした場所に置く（何度でも置き直せる）
  if (!reticle.visible) return;
  arRoot.position.setFromMatrixPosition(reticle.matrix);
  const cam = new THREE.Vector3().setFromMatrixPosition(renderer.xr.getCamera().matrixWorld);
  arRoot.rotation.y = Math.atan2(cam.x - arRoot.position.x, cam.z - arRoot.position.z) - Math.atan2(60, 75); // いつもの向きで手前に見せる
  arRoot.visible = true;
  applySun();
  arHint.textContent = 'タップで置き直し・下のスライダーで日付を変えられます';
});
// AR中の操作パネルを押したときは、模型を置き直さない
for (const el of [$('arScales'), $('arPanelSlot')]) el.addEventListener('beforexrselect', e => e.preventDefault());
$('arScales').addEventListener('click', e => {
  const b = e.target.closest('button[data-scale]');
  if (!b) return;
  arScale = Number(b.dataset.scale);
  arRoot.scale.setScalar(1 / arScale);
  applySun();
  document.querySelectorAll('#arScales button[data-scale]').forEach(x => x.classList.toggle('on', x === b));
});
$('arExit').addEventListener('click', () => { const s = renderer.xr.getSession(); if (s) s.end(); });

function enterAR() {
  arOverlay.classList.add('on');
  $('arPanelSlot').appendChild($('panel'));
  scene.background = null;
  sky.visible = false;
  scene.fog = null;
  site.asphalt.visible = false;
  site.catcher.visible = true;
  controls.enabled = false;
  arRoot.visible = false;
  arRoot.scale.setScalar(1 / arScale);
  arHint.textContent = '床や机を映して、白い輪が出たらタップ';
}
function exitAR() {
  arOverlay.classList.remove('on');
  document.querySelector('.app').appendChild($('panel'));
  sky.visible = true;
  scene.fog = fog;
  if (site.asphalt) site.asphalt.visible = true;
  if (site.catcher) site.catcher.visible = false;
  controls.enabled = true;
  arRoot.visible = true;
  arRoot.position.set(0, 0, 0);
  arRoot.rotation.set(0, 0, 0);
  arRoot.scale.setScalar(1);
  reticle.visible = false;
  hitSource = null;
  applySun();
  resize();
}
async function startWebXR() {
  try {
    const session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'], optionalFeatures: ['dom-overlay'], domOverlay: { root: arOverlay },
    });
    enterAR();
    session.addEventListener('end', exitAR);
    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(session);
    hitSource = await session.requestHitTestSource({ space: await session.requestReferenceSpace('viewer') });
  } catch (err) {
    toast('ARを始められませんでした。カメラの使用を許可しているか確認してください');
  }
}
function arFrame(frame) {
  if (!frame || !hitSource) return;
  const hits = frame.getHitTestResults(hitSource);
  if (hits.length) {
    reticle.matrix.fromArray(hits[0].getPose(renderer.xr.getReferenceSpace()).transform.matrix);
    reticle.visible = true;
  } else reticle.visible = false;
}

// --- iPhone・iPad：いま見えている模型を USDZ にする ---
const simpleBox = new Map(); // 面取りの箱はファイルを軽くするため普通の箱にする
function exportGeo(geo) {
  if (!(geo instanceof RoundedBoxGeometry)) return geo;
  if (!simpleBox.has(geo)) {
    geo.computeBoundingBox();
    const s = geo.boundingBox.getSize(new THREE.Vector3());
    simpleBox.set(geo, new THREE.BoxGeometry(s.x, s.y, s.z));
  }
  return simpleBox.get(geo);
}
function forExport(geo, matrix) {
  let g = geo.index ? geo.toNonIndexed() : geo.clone();
  g.applyMatrix4(matrix);
  for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
  if (!g.attributes.normal) g.computeVertexNormals();
  if (!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
  return g;
}
async function startQuickLook() {
  const label = arBtn.textContent;
  arBtn.textContent = '準備中…'; arBtn.disabled = true;
  try {
    for (const e of elements) { if (e.cur !== e.target) { e.cur = e.target; applyEl(e); } }
    stepElements();
    arRoot.updateMatrixWorld(true);
    const byMat = new Map(), m = new THREE.Matrix4(), mw = new THREE.Matrix4();
    const push = (geo, mat, matrix) => { if (!byMat.has(mat)) byMat.set(mat, []); byMat.get(mat).push(forExport(geo, matrix)); };
    world.traverseVisible(o => {
      if (!o.isMesh || o === site.asphalt || o === site.catcher) return;
      if (o.isInstancedMesh) {
        for (let i = 0; i < o.count; i++) {
          o.getMatrixAt(i, m);
          if (m.determinant() === 0) continue;
          push(exportGeo(o.geometry), o.material, mw.multiplyMatrices(o.matrixWorld, m));
        }
      } else push(o.geometry, o.material, o.matrixWorld);
    });
    const out = new THREE.Scene(), model = new THREE.Group();
    model.scale.setScalar(1 / 100); // 机に乗る大きさ（AR クイックルックの中で拡大・縮小できる）
    out.add(model);
    for (const [mat, list] of byMat) model.add(new THREE.Mesh(mergeGeometries(list), mat));
    const data = await new USDZExporter().parse(out);
    const url = URL.createObjectURL(new Blob([data], { type: 'model/vnd.usdz+zip' }));
    const a = document.createElement('a');
    a.rel = 'ar';
    a.href = url;
    a.appendChild(document.createElement('img'));
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    window.__lastUsdzSize = data.byteLength;
  } catch (err) {
    toast('ARの模型を作れませんでした');
  } finally {
    arBtn.textContent = label; arBtn.disabled = false;
  }
}
arBtn.addEventListener('click', () => {
  if (webxrOK) startWebXR();
  else if (quickLook) startQuickLook();
  else toast('この端末ではARが使えません。AndroidのChrome、またはiPhone・iPadのSafariで開いてください');
});

// ===== 通り芯の表示切り替え =====
const gridBtn = $('gridBtn');
function setGrid(on) {
  gridOn = on;
  if (site.grid) site.grid.visible = on;
  gridBtn.textContent = on ? '通り芯 ON' : '通り芯 OFF';
  try { localStorage.setItem('hakoniwa-grid', on ? 'on' : 'off'); } catch {}
}
gridBtn.addEventListener('click', () => setGrid(!gridOn));
setGrid(gridOn);

// ===== 部材をタップすると、通り芯の位置と工程を出す =====
const ITEM_LABEL = {
  guard: '守衛所', guide: '誘導員', sign: '工事のお知らせ看板', office: '現場事務所', toilet: '仮設トイレ', rest: '作業員詰所・休憩所',
  smoking: '喫煙所', assembly: '朝礼広場', parking: '作業員駐車場', rebar: '鉄筋置き場', formwork: '型枠置き場', scafmat: '足場材置き場',
  waste: '廃材の分別コンテナ', cubicle: 'キュービクル', panel: '分電盤', water: '仮設水道', wash: 'タイヤ洗浄機',
};
const infoCard = $('infoCard');
const marker = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 10), M.marker);
marker.renderOrder = 10;
marker.visible = false;
scene.add(marker);
const span2 = (s, e) => `${fmtShort(parseDate(s))}〜${fmtShort(parseDate(e))}`;
function floorLine(f, k) {
  const it = CFG.data.find(d => d.floor === f && d.kind === k);
  if (!it) return '';
  const date = dayToDate(Number(slider.value));
  const p = Math.round(Math.min(100, Math.max(0, progressAt(it.progress, date))));
  return `${k}：${span2(it.progress[0][0], it.progress[it.progress.length - 1][0])}（いま ${p}%）`;
}
function siteLine(key) {
  const ph = SITE_PHASES.find(p => p.key === key), [s, e] = CFG.site[key];
  const p = Math.round(phaseRatio(CFG.site[key], dayToDate(Number(slider.value))) * 100);
  return `${ph.label}：${span2(s, e)}（いま ${p}%）`;
}
function describe(info) {
  const NX = namesOf(CFG, 'x'), NZ = namesOf(CFG, 'z'), nx = NX.length - 1, nz = NZ.length - 1;
  const f = info.floor;
  switch (info.kind) {
    case 'col': return [`${f}階 柱　${NX[info.ix]}-${NZ[info.iz]}通り`, [floorLine(f, '躯体'), floorLine(f, '外装')]];
    case 'rebar': return [`${f}階 柱の鉄筋　${NX[info.ix]}-${NZ[info.iz]}通り`, [floorLine(f, '躯体'), f < NF ? floorLine(f + 1, '床') : '']];
    case 'slab': return [`${f}階 床　${NX[info.i]}〜${NX[info.i + 1]}／${NZ[info.j]}〜${NZ[info.j + 1]}通り`, [floorLine(f, '床'), floorLine(f, '躯体')]];
    case 'roof': return [`屋上（${f}階の上）`, [floorLine(f, '躯体')]];
    case 'ext': {
      const sides = {
        front: [`${NZ[nz]}通り側`, NX[info.i], NX[info.i + 1]],
        back: [`${NZ[0]}通り側`, NX[nx - 1 - info.i], NX[nx - info.i]],
        right: [`${NX[nx]}通り側`, NZ[nz - 1 - info.i], NZ[nz - info.i]],
        left: [`${NX[0]}通り側`, NZ[info.i], NZ[info.i + 1]],
      }[info.side];
      return [`${f}階 外装　${sides[0]}（${sides[1]}〜${sides[2]}）`, [floorLine(f, '外装'), floorLine(f, '内装')]];
    }
    case 'int': return [`${f}階 内装`, [floorLine(f, '内装')]];
    case 'equip': return ['屋上の冷却設備', [floorLine(f, '外装')]];
    case 'scaffold': return [`${f}階 足場・養生シート`, ['外装工事のあいだ付いています', floorLine(f, '外装')]];
    case 'found': return ['基礎（捨てコン・フーチング・基礎梁・基礎版）', [siteLine('found')]];
    case 'pile': return ['杭', [siteLine('pile')]];
    case 'rig': return ['杭打ち機', [siteLine('pile')]];
    case 'dig': return ['バックホウ・ダンプ（掘削・埋め戻し）', [siteLine('excav'), siteLine('found')]];
    case 'crane': return ['タワークレーン', [siteLine('crane'), siteLine('craneOff')]];
    case 'pour': return ['生コン車・ポンプ車', ['床や基礎のコンクリートを打つ日に来ます']];
    case 'fence': return ['仮囲い・ゲート（高さ3m）', [siteLine('prep'), siteLine('ext')]];
    case 'item': return [ITEM_LABEL[info.type] || '仮設物', [siteLine('prep'), '外構工事の始めに片付けます']];
    case 'extsite': return ['外構（舗装・植栽・駐車場）', [siteLine('ext')]];
  }
  return null;
}
function showInfo(info, point) {
  const d = describe(info);
  if (!d) return hideInfo();
  $('infoTitle').textContent = d[0];
  $('infoBody').innerHTML = d[1].filter(Boolean).map(esc).join('<br>');
  infoCard.classList.add('on');
  marker.position.copy(point);
  marker.scale.setScalar(Math.max(0.4, camera.position.distanceTo(point) / 120));
  marker.visible = true;
}
function hideInfo() { infoCard.classList.remove('on'); marker.visible = false; }
$('infoClose').addEventListener('click', hideInfo);
const shown = o => { for (; o; o = o.parent) if (!o.visible) return false; return true; };
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(cx, cy) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  for (const b of batches.values()) b.mesh.computeBoundingSphere(); // 部材が出たり消えたりするので毎回はかり直す
  for (const h of raycaster.intersectObject(world, true)) {
    const o = h.object;
    if (!o.isMesh || o === site.catcher || !shown(o)) continue;
    if (o.isInstancedMesh) {
      const e = pickMap.get(o.uuid + '|' + h.instanceId);
      if (!e || e.cur < 0.5) continue;
      return e.info ? showInfo(e.info, h.point) : hideInfo();
    }
    let p = o;
    while (p && !p.userData.info) p = p.parent;
    return p ? showInfo(p.userData.info, h.point) : hideInfo(); // 地面などを押したら閉じる
  }
  hideInfo();
}
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = { x: e.clientX, y: e.clientY, t: performance.now() }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || renderer.xr.isPresenting) return;
  const tap = Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) < 6 && performance.now() - downAt.t < 600;
  downAt = null;
  if (tap) pick(e.clientX, e.clientY);
});
slider.addEventListener('input', () => { if (infoCard.classList.contains('on')) hideInfo(); });

const clock = new THREE.Clock();
let frames = 0, t0 = 0;
renderer.setAnimationLoop((time, frame) => {
  stepElements();
  animateMachines(clock.getElapsedTime());
  if (renderer.xr.isPresenting) { // AR中はカメラ映像の上にそのまま描く
    arFrame(frame);
    renderer.render(scene, camera);
    return;
  }
  controls.update();
  composer.render();
  // 動きが重ければ SSAO を自動で切る
  if (autoQuality && ssaoOn && frames < 120) {
    frames++;
    if (frames === 30) t0 = performance.now();
    if (frames === 120 && (performance.now() - t0) / 90 > 30) setSSAO(false);
  }
});
</script>
