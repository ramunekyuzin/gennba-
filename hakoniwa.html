<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>現場の箱庭</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #dfe9f2;
    --panel: rgba(255, 255, 255, 0.92);
    --sheet: #ffffff;
    --field: #f4f6f8;
    --line: #d5d9de;
    --text: #22262b;
    --sub: #69717a;
    --track: #d9dee4;
    --accent: #e8891c;
    --phase: #b45f06;
    --btn: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a28;
      --panel: rgba(28, 32, 42, 0.94);
      --sheet: #1d222c;
      --field: #282e3a;
      --line: #39404d;
      --text: #eef1f5;
      --sub: #a3abb6;
      --track: #3b4350;
      --accent: #f29a35;
      --phase: #f6b25e;
      --btn: #2a303c;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 16px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .stage { position: relative; flex: 1; min-height: 0; }
  .stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .title {
    position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 12px;
    max-width: calc(100% - 150px);
    padding: 8px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    pointer-events: none;
  }
  .title b { display: block; font-size: 18px; }
  .title small { display: block; font-size: 16px; color: var(--sub); }
  .tools {
    position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 12px;
    display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
  }
  .btn {
    min-height: 44px; padding: 0 14px;
    font: inherit; font-size: 16px; color: var(--text);
    background: var(--btn);
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .panel {
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .date { font-size: 22px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
  .phase { font-size: 16px; font-weight: 700; text-align: center; color: var(--phase); min-height: 1.5em; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 44px; margin: 0;
    background: transparent;
    touch-action: pan-x;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; background: var(--track); border-radius: 4px; }
  input[type=range]::-moz-range-track { height: 8px; background: var(--track); border-radius: 4px; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 32px; height: 32px; margin-top: -12px;
    background: var(--accent);
    border: 3px solid #fff;
    border-radius: 50%;
    box-shadow: 0 1px 4px rgba(0,0,0,.35);
  }
  input[type=range]::-moz-range-thumb {
    width: 26px; height: 26px;
    background: var(--accent);
    border: 3px solid #fff;
    border-radius: 50%;
  }
  .range-labels { display: flex; justify-content: space-between; font-size: 16px; color: var(--sub); }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; margin-top: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 16px; }
  .legend i { width: 18px; height: 18px; display: inline-block; border: 1px solid var(--line); border-radius: 4px; }

  /* ===== 設定画面 ===== */
  .sheet-bg {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(0, 0, 0, 0.35);
    display: none; align-items: flex-end; justify-content: center;
  }
  .sheet-bg.open { display: flex; }
  .sheet {
    width: 100%; max-width: 640px; max-height: 88vh; max-height: 88dvh;
    display: flex; flex-direction: column;
    background: var(--sheet);
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -6px 24px rgba(0,0,0,.25);
  }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .sheet-head h2 { margin: 0; font-size: 20px; }
  .sheet-body { overflow-y: auto; overflow-x: hidden; padding: 8px 16px 16px; -webkit-overflow-scrolling: touch; }
  .sheet-foot {
    display: flex; gap: 8px; flex-wrap: wrap;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
  }
  .sheet-foot .primary { flex: 1; }
  .sheet h3 { font-size: 18px; margin: 18px 0 8px; }
  .sheet h4 { font-size: 16px; margin: 14px 0 6px; color: var(--sub); }
  .note { color: var(--sub); font-size: 16px; margin: 4px 0 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .grid .wide { grid-column: 1 / -1; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 16px; color: var(--sub); }
  .file-btn { display: flex; align-items: center; justify-content: center; margin-top: 6px; }
  .pdf-row { display: grid; grid-template-columns: minmax(0, 1fr) 9.5em 44px; gap: 6px; align-items: center; margin-bottom: 6px; }
  .pdf-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pdf-row .btn { padding: 0; }
  .ai-box { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-top: 10px; }
  .ai-box b { display: block; margin: 4px 0; }
  .ai-box ul { margin: 0 0 6px; padding-left: 1.3em; }
  .ai-box .warn { color: #c0392b; }
  .dim-note { margin-top: 8px; color: var(--sub); }
  .dim-note:empty { display: none; }
  select, input[type=date], input[type=number], input[type=url], input[type=password], input[type=text] {
    min-width: 0;
    font: inherit; font-size: 16px; color: var(--text);
    min-height: 44px; padding: 6px 10px; width: 100%;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .uses { display: flex; flex-wrap: wrap; gap: 8px; }
  .uses button { flex: 1 1 30%; }
  .uses button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .floor-card { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; }
  .floor-card b { display: block; margin-bottom: 6px; }
  .krow { display: grid; grid-template-columns: 3em minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px; align-items: center; margin-bottom: 6px; }
  .krow.site { grid-template-columns: 6.5em minmax(0, 1fr) auto minmax(0, 1fr); }
  .krow span { color: var(--sub); }
  .err { color: #d9443a; font-weight: 700; min-height: 1.2em; margin: 6px 0 0; }
  .info-card {
    position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 5;
    max-width: 520px; margin: 0 auto;
    padding: 10px 14px; padding-right: 54px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.18);
    display: none;
  }
  .info-card.on { display: block; }
  .info-card b { display: block; font-size: 18px; margin-bottom: 4px; }
  .info-card div { font-size: 16px; color: var(--sub); line-height: 1.5; }
  .info-card .btn { position: absolute; top: 8px; right: 8px; width: 44px; padding: 0; }

  /* ===== AR ===== */
  .ar-overlay {
    display: none; position: fixed; inset: 0; z-index: 20;
    flex-direction: column; justify-content: space-between;
    background: transparent; pointer-events: none;
  }
  .ar-overlay.on { display: flex; }
  .ar-overlay > * { pointer-events: auto; }
  .ar-top { padding: calc(12px + env(safe-area-inset-top)) 12px 0; display: flex; flex-direction: column; gap: 8px; }
  .ar-hint {
    align-self: center; padding: 8px 14px; border-radius: 10px;
    background: rgba(0, 0, 0, 0.55); color: #fff; font-size: 16px; text-align: center;
  }
  .ar-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .ar-row .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .toast {
    position: fixed; left: 50%; bottom: calc(180px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    z-index: 30; max-width: calc(100% - 32px);
    padding: 10px 16px; border-radius: 10px;
    background: rgba(0, 0, 0, 0.78); color: #fff; font-size: 16px; text-align: center;
    display: none;
  }
  .toast.on { display: block; }
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="title"><b>現場の箱庭</b><small id="summary"></small><small>指でまわす・2本指で拡大</small></div>
    <div class="tools">
      <button class="btn primary" id="settingsBtn" type="button">設定</button>
      <button class="btn primary" id="arBtn" type="button">AR</button>
      <button class="btn" id="gridBtn" type="button">通り芯 ON</button>
      <button class="btn" id="qualityBtn" type="button">高画質 ON</button>
    </div>
    <div class="info-card" id="infoCard" role="status"><b id="infoTitle"></b><div id="infoBody"></div><button class="btn" id="infoClose" type="button" aria-label="閉じる">✕</button></div>
  </div>
  <div class="panel" id="panel">
    <div class="date" id="dateLabel">----</div>
    <div class="phase" id="phaseLabel"></div>
    <input type="range" id="slider" min="0" max="100" value="0" aria-label="日付">
    <div class="range-labels"><span id="minLabel"></span><span id="maxLabel"></span></div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<!-- AR中にカメラ映像の上に出す操作パネル（Android） -->
<div class="ar-overlay" id="arOverlay">
  <div class="ar-top">
    <div class="ar-hint" id="arHint">床や机を映して、白い輪が出たらタップ</div>
    <div class="ar-row" id="arScales">
      <button class="btn" type="button" data-scale="50">1/50</button>
      <button class="btn on" type="button" data-scale="100">1/100</button>
      <button class="btn" type="button" data-scale="200">1/200</button>
      <button class="btn primary" type="button" id="arExit">終了</button>
    </div>
  </div>
  <div id="arPanelSlot"></div>
</div>
<div class="toast" id="toast"></div>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-label="設定">
    <div class="sheet-head"><h2>建物と工期の設定</h2><button class="btn" id="closeBtn" type="button">閉じる</button></div>
    <div class="sheet-body">
      <h3>図面・工程表から作る（AI）</h3>
      <p class="note">工程表・配置図（仮設計画図）・平面図などのPDFを選んで「AIで読み取る」を押すと、建物・配置・工程を自動で入れます。下で確かめてから「この内容で建てる」を押してください。</p>
      <div id="pdfList"></div>
      <label class="btn file-btn">PDFを選ぶ<input type="file" id="pdfInput" accept="application/pdf,.pdf" multiple hidden></label>
      <div class="grid" style="margin-top:10px">
        <label class="f wide">GASのURL<input type="url" id="aiUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
        <label class="f wide">合言葉<input type="password" id="aiPass" autocomplete="off"></label>
        <button class="btn primary wide" id="aiBtn" type="button">AIで読み取る</button>
      </div>
      <div id="aiResult"></div>
      <h3>用途</h3>
      <div class="uses" id="uses"></div>
      <h3>建物</h3>
      <div class="grid">
        <label class="f wide">階数<select id="fFloors"></select></label>
        <label class="f">間口（柱6m間隔）<select id="fSpanX"></select></label>
        <label class="f">奥行（柱6m間隔）<select id="fSpanZ"></select></label>
        <label class="f wide">通り芯の名前（間口・左から、カンマ区切り）<input type="text" id="fNamesX" autocomplete="off"></label>
        <label class="f wide">通り芯の名前（奥行・上から、カンマ区切り）<input type="text" id="fNamesZ" autocomplete="off"></label>
      </div>
      <div id="dimNote" class="dim-note"></div>
      <h3>工期（かんたん設定）</h3>
      <div class="grid">
        <label class="f wide">着工日（準備工事の開始）<input type="date" id="fStart"></label>
      </div>
      <h4>現場全体の日数</h4>
      <div class="grid" id="siteDays"></div>
      <h4>各階の日数</h4>
      <div class="grid">
        <label class="f">床の日数<input type="number" id="fD0" min="1" max="365" inputmode="numeric"></label>
        <label class="f">躯体の日数<input type="number" id="fD1" min="1" max="365" inputmode="numeric"></label>
        <label class="f">外装の日数<input type="number" id="fD2" min="1" max="365" inputmode="numeric"></label>
        <label class="f">内装の日数<input type="number" id="fD3" min="1" max="365" inputmode="numeric"></label>
        <label class="f wide">上の階へのずれ（日）<input type="number" id="fShift" min="1" max="120" inputmode="numeric"></label>
        <button class="btn wide" id="genBtn" type="button">この日数で工程を作り直す</button>
      </div>
      <h3>工程の細かい調整</h3>
      <p class="note">工程ごとに、開始日〜終了日を直せます。</p>
      <div id="table"></div>
      <p class="err" id="err"></p>
    </div>
    <div class="sheet-foot">
      <button class="btn" id="resetBtn" type="button">サンプルに戻す</button>
      <button class="btn primary" id="applyBtn" type="button">この内容で建てる</button>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { USDZExporter } from 'three/addons/exporters/USDZExporter.js';

// ===== 進捗サンプルデータ =====
// 現場全体の工程（開始日・終了日）
const SITE_SAMPLE = {
  prep:     ['2026-01-13', '2026-01-27'],
  pile:     ['2026-01-26', '2026-02-20'],
  excav:    ['2026-02-15', '2026-03-09'],
  found:    ['2026-03-06', '2026-03-31'],
  crane:    ['2026-03-23', '2026-03-31'],
  craneOff: ['2026-10-13', '2026-10-20'],
  ext:      ['2026-10-19', '2026-11-28'],
};
// 各階の工程（日付ごとの進捗%。間の日は直線でつなぐ）
const DATA = [
  { floor: 1, kind: '床',   progress: [['2026-04-01', 0], ['2026-04-21', 100]] },
  { floor: 1, kind: '躯体', progress: [['2026-04-15', 0], ['2026-05-15', 100]] },
  { floor: 1, kind: '外装', progress: [['2026-05-10', 0], ['2026-06-20', 100]] },
  { floor: 1, kind: '内装', progress: [['2026-06-01', 0], ['2026-07-20', 100]] },
  { floor: 2, kind: '床',   progress: [['2026-04-29', 0], ['2026-05-19', 100]] },
  { floor: 2, kind: '躯体', progress: [['2026-05-13', 0], ['2026-06-12', 100]] },
  { floor: 2, kind: '外装', progress: [['2026-06-07', 0], ['2026-07-18', 100]] },
  { floor: 2, kind: '内装', progress: [['2026-06-29', 0], ['2026-08-17', 100]] },
  { floor: 3, kind: '床',   progress: [['2026-05-27', 0], ['2026-06-16', 100]] },
  { floor: 3, kind: '躯体', progress: [['2026-06-10', 0], ['2026-07-10', 100]] },
  { floor: 3, kind: '外装', progress: [['2026-07-05', 0], ['2026-08-15', 100]] },
  { floor: 3, kind: '内装', progress: [['2026-07-27', 0], ['2026-09-14', 100]] },
  { floor: 4, kind: '床',   progress: [['2026-06-24', 0], ['2026-07-14', 100]] },
  { floor: 4, kind: '躯体', progress: [['2026-07-08', 0], ['2026-08-07', 100]] },
  { floor: 4, kind: '外装', progress: [['2026-08-02', 0], ['2026-09-12', 100]] },
  { floor: 4, kind: '内装', progress: [['2026-08-24', 0], ['2026-10-12', 100]] },
  { floor: 5, kind: '床',   progress: [['2026-07-22', 0], ['2026-08-11', 100]] },
  { floor: 5, kind: '躯体', progress: [['2026-08-05', 0], ['2026-09-04', 100]] },
  { floor: 5, kind: '外装', progress: [['2026-08-30', 0], ['2026-10-10', 100]] },
  { floor: 5, kind: '内装', progress: [['2026-09-21', 0], ['2026-11-09', 100]] },
];
const KIND_NAMES = ['床', '躯体', '外装', '内装'];
const SITE_PHASES = [
  { key: 'prep',     label: '準備工事' },
  { key: 'pile',     label: '杭工事' },
  { key: 'excav',    label: '山留め・掘削' },
  { key: 'found',    label: '基礎工事' },
  { key: 'crane',    label: 'クレーン組立' },
  { key: 'craneOff', label: 'クレーン解体' },
  { key: 'ext',      label: '外構工事' },
];
const SAMPLE = {
  use: 'office', floors: 5, spanX: 5, spanZ: 3,
  auto: {
    start: '2026-01-13', shift: 28,
    days: { '床': 20, '躯体': 30, '外装': 40, '内装': 50 },
    site: { prep: 14, pile: 25, excav: 22, found: 25, crane: 8, craneOff: 7, ext: 40 },
  },
  site: SITE_SAMPLE,
  data: DATA,
};
// 用途ごとの階高
const USES = {
  office:     { label: '事務所',         h: () => 3.5 },
  apartment:  { label: '共同住宅',       h: () => 3.0 },
  shop:       { label: '店舗',           h: f => (f === 1 ? 4.5 : 3.5) },
  warehouse:  { label: '倉庫',           h: () => 6.0 },
  datacenter: { label: 'データセンター', h: () => 5.0 },
};
const LEGEND = [
  ['床（スラブ）', '#b9b6af'],
  ['躯体（柱）', '#d4d1ca'],
  ['外装', 'linear-gradient(135deg,#8fb3cc,#e4e1da)'],
  ['内装', '#b7d9e6'],
];

// ===== 日付 =====
const DAY = 86400000;
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
const fmt = d => `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日(${WEEK[d.getDay()]})`;
const fmtShort = d => `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
const validIso = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parseDate(s));
const clamp01 = v => Math.min(1, Math.max(0, v));

function progressAt(points, date) {
  const t = date.getTime();
  const pts = points.map(([d, p]) => [parseDate(d).getTime(), p]);
  if (t <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) {
    if (t <= pts[i][0]) {
      const [t0, p0] = pts[i - 1], [t1, p1] = pts[i];
      return t1 === t0 ? p1 : p0 + (p1 - p0) * (t - t0) / (t1 - t0);
    }
  }
  return pts[pts.length - 1][1];
}
const phaseRatio = ([s, e], date) => clamp01(progressAt([[s, 0], [e, 100]], date) / 100);

// ===== かんたん設定から工程を作る（工程は少しずつ重ねて進める） =====
function genFloor(f, a, base) {
  const d = a.days;
  const lag = { '床': 0, '躯体': Math.round(d['床'] * 0.7) };
  lag['外装'] = lag['躯体'] + Math.round(d['躯体'] * 0.8);
  lag['内装'] = lag['外装'] + Math.round(d['外装'] * 0.55);
  return KIND_NAMES.map(k => {
    const st = addDays(base, (f - 1) * a.shift + lag[k]);
    return { floor: f, kind: k, progress: [[iso(st), 0], [iso(addDays(st, d[k])), 100]] };
  });
}

  try {

    if (!(c.floors >= 1 && c.floors <= MAX_FLOORS && c.spanX >= 1 && c.spanX <= MAX_SPAN_X && c.spanZ >= 1 && c.spanZ <= MAX_SPAN_Z)) return false;
    if (!okSpans(c.spansX, MAX_SPAN_X) || !okSpans(c.spansZ, MAX_SPAN_Z) || !okLayout(c.layout)) return false;
    if (!okNames(c.gridNamesX) || !okNames(c.gridNamesZ)) return false;
    if (c.floorH !== undefined && !(Array.isArray(c.floorH) && c.floorH.every(v => okNum(v) && v >= 2 && v <= 12))) return false;

    if (!SITE_PHASES.every(p => c.auto.site[p.key] >= 1 && validIso(c.site[p.key][0]) && validIso(c.site[p.key][1]))) return false;
    for (let f = 1; f <= c.floors; f++) for (const k of KIND_NAMES) {

// 前の版の設定（工種「基礎」）を新しい形に直す。現場全体の工程は1階の床の前に入れる
function migrate(old) {
  const c = clone(old);
  c.data.forEach(d => { if (d.kind === '基礎') d.kind = '床'; });
  c.auto.days['床'] = c.auto.days['基礎'] || 20;
  delete c.auto.days['基礎'];
  c.auto.site = clone(SAMPLE.auto.site);
  const first = parseDate(c.data.find(d => d.floor === 1 && d.kind === '床').progress[0][0]);
  const trial = genAll(1, c.auto).site;
  c.auto.start = iso(addDays(parseDate(c.auto.start), Math.round((first - floorBase(trial)) / DAY)));
  c.site = genAll(1, c.auto).site;

function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function noiseCanvas(n, { base, fine, mottle, cells = 6, dots = 0, dotRange = [0, 0], seed = 1, tint = [1, 1, 1] }) {
  const rnd = rng(seed);
  const grid = Array.from({ length: cells * cells }, rnd);
  const g = (x, y) => grid[((y % cells) + cells) % cells * cells + ((x % cells) + cells) % cells];
  const smooth = t => t * t * (3 - 2 * t);
  const c = document.createElement('canvas'); c.width = c.height = n;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(n, n);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const fx = x / n * cells, fy = y / n * cells;
    const ix = Math.floor(fx), iy = Math.floor(fy), tx = smooth(fx - ix), ty = smooth(fy - iy);
    const v0 = g(ix, iy) + (g(ix + 1, iy) - g(ix, iy)) * tx;
    const v1 = g(ix, iy + 1) + (g(ix + 1, iy + 1) - g(ix, iy + 1)) * tx;
    const m = v0 + (v1 - v0) * ty;
    const v = base + (rnd() - 0.5) * fine + (m - 0.5) * mottle;
    const i = (y * n + x) * 4;
    for (let ch = 0; ch < 3; ch++) img.data[i + ch] = Math.max(0, Math.min(255, v * tint[ch]));
    img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  for (let k = 0; k < dots; k++) {
    const v = dotRange[0] + rnd() * (dotRange[1] - dotRange[0]);
    ctx.fillStyle = `rgb(${v * tint[0]},${v * tint[1]},${v * tint[2]})`;
    ctx.fillRect(rnd() * n, rnd() * n, 1 + rnd() * 1.5, 1 + rnd() * 1.5);
  }

}

    const y = i * len / n, y2 = (i + 1) * len / n;
    for (let k = 0; k < 4; k++) {
      const [x1, z1] = c[k], [x2, z2] = c[(k + 1) % 4];
      out.push(bar(V(x1, y, z1), V(x2, y, z2), tl));
      if (i < n) out.push(i % 2 ? bar(V(x1, y, z1), V(x2, y2, z2), tl) : bar(V(x2, y, z2), V(x1, y2, z1), tl));
    }
  }
  return mergeGeometries(out);
}
let world = null;          // 建て直すたびに作り直すもの一式
let worldMats = [];
function addMesh(geo, mat, parent = world, cast = true) {

}
const box = (parent, mat, w, h, d, x, y, z, r = 0.04) => { const m = addMesh(rbox(w, h, d, r), mat, parent); m.position.set(x, y, z); return m; };

// ===== 進捗で現れる「部材」：同じ形はまとめて InstancedMesh で描く =====
let batches = new Map();
let elements = [];
function newEl(anchor, mode = 'y') {
  const e = { anchor, mode, parts: [], obj: null, target: 0, cur: 0 };
  elements.push(e);
  return e;
}
function addPart(e, geo, mat, matrix, cast = true) {
  const bk = geo.uuid + '|' + mat.uuid;
  if (!batches.has(bk)) batches.set(bk, { geo, mat, cast, count: 0, mesh: null, dirty: true });
  const b = batches.get(bk);

}
// 面取りした箱・ガラス板を部材に足す
const P = (e, mat, w, h, d, x, y, z, r = 0.03, cast = true) => addPart(e, rbox(w, h, d, r), mat, m4(x, y, z), cast);
const G = (e, w, h, d, x, y, z) => addPart(e, pbox(w, h, d), M.glass, m4(x, y, z), false);
const PR = (e, mat, w, h, d, x, y, z, ry, r = 0.03) => addPart(e, rbox(w, h, d, r), mat, m4(x, y, z, ry));

// ===== 建物の寸法（1単位 = 1m） =====
const SLAB = 0.25, BASE = 0.3, CW = 0.15, PIT = 2.2, PILE_LEN = 14;
const PIT_DEEP = new THREE.Color(0.42, 0.33, 0.26);
let CFG, GX, GZ, EX, EZ, NF, hs, ys, PX, PZ;
let F, GATE, GF; // 仮囲いの範囲・ゲート・ゲートを正面にした向き
const yb = f => ys[f];
const gridOf = spans => { const t = spans.reduce((a, b) => a + b, 0); let s = -t / 2; return [s, ...spans.map(v => (s += v))]; };
// ゲートのある辺を「正面（z+）」とみなした座標と、実際の座標の行き来
const SIDE_DEG = { front: 0, right: 90, back: 180, left: -90 };
function makeGateFrame(rect, gate) {
  const th = THREE.MathUtils.degToRad(SIDE_DEG[gate.side] || 0), c = Math.cos(th), s = Math.sin(th);
  const toW = (x, z) => [x * c + z * s, -x * s + z * c];
  const toC = (x, z) => [x * c - z * s, x * s + z * c];
  const pts = [[rect.x1, rect.z1], [rect.x2, rect.z1], [rect.x1, rect.z2], [rect.x2, rect.z2]].map(([x, z]) => toC(x, z));
  const C = { x1: Math.min(...pts.map(p => p[0])), x2: Math.max(...pts.map(p => p[0])), z1: Math.min(...pts.map(p => p[1])), z2: Math.max(...pts.map(p => p[1])) };
  const [bx, bz] = toC(EX, EZ).map(Math.abs); // 建物の半分の大きさ（正面の向きで）
  return { th, deg: SIDE_DEG[gate.side] || 0, toW, toC, C, bx, bz };
}

function slabPanels(y, mat, list, info = {}) {
  const XI = GX.slice(0, -1).map((x, i) => [i === 0 ? -EX : x, i === GX.length - 2 ? EX : GX[i + 1]]);
  const ZI = GZ.slice(0, -1).map((z, i) => [i === 0 ? -EZ : z, i === GZ.length - 2 ? EZ : GZ[i + 1]]);
  const tmp = [];
  XI.forEach(([x1, x2], i) => ZI.forEach(([z1, z2], j) => {
    const w = x2 - x1, d = z2 - z1, cx = (x1 + x2) / 2, cz = (z1 + z2) / 2;
    const e = newEl(V(cx, y, cz), 'xz');
    P(e, mat, w, SLAB, d, cx, y + SLAB / 2, cz, 0.05);
    e.info = { ...info, i, j };
    tmp.push([i + j, e]);
  }));
  tmp.sort((a, b) => a[0] - b[0]).forEach(([, e]) => list.push(e));
}

// --- 外装（ローカル座標：x=幅方向、y=床スラブ上端から上、z=外向き） ---
function curtainBay(e, w, gh) {
  G(e, w, gh, 0.024, 0, gh / 2, 0);
  P(e, M.frame, w, 0.08, 0.14, 0, 0.04, 0.03, 0.02);
  P(e, M.frame, w, 0.08, 0.14, 0, gh - 0.04, 0.03, 0.02);
  const n = Math.round(w / 1.5);
  for (let i = 0; i <= n; i++) P(e, M.frame, 0.07, gh, 0.16, -w / 2 + i * w / n, gh / 2, 0.03, 0.02);
}
function punchedBay(e, w, gh, sill, head, ww, mat) { // 外壁パネル＋窓
  const oh = gh - sill - head, sw = (w - ww) / 2, t = 0.12, z = 0.06;
  P(e, mat, w, sill + SLAB, t, 0, (sill - SLAB) / 2, z);
  P(e, mat, w, head, t, 0, gh - head / 2, z);
  if (sw > 0.02) {
    P(e, mat, sw, oh, t, -(ww / 2 + sw / 2), sill + oh / 2, z);
    P(e, mat, sw, oh, t, ww / 2 + sw / 2, sill + oh / 2, z);
  }
  G(e, ww, oh, 0.024, 0, sill + oh / 2, 0.02);
  P(e, M.frame, ww, 0.05, 0.1, 0, sill + 0.025, 0.04, 0.015);
  P(e, M.frame, ww, 0.05, 0.1, 0, sill + oh - 0.025, 0.04, 0.015);
  P(e, M.frame, 0.05, oh, 0.1, 0, sill + oh / 2, 0.04, 0.015);
}
function exteriorBay(e, f, side, i, w, gh) {
  const use = CFG.use;
  if (use === 'office' || (use === 'shop' && f === 1 && side === 'front')) {
    curtainBay(e, w, gh);
    if (use === 'shop') P(e, M.frame, w, 0.15, 1.6, 0, gh - 0.45, 0.8, 0.03); // 庇
  } else if (use === 'apartment') {
    if (side === 'front') { // バルコニー側
      P(e, M.column, w, 0.18, 1.5, 0, -0.09, 0.8, 0.03);
      P(e, M.column, 0.15, gh, 1.5, -w / 2 + 0.08, gh / 2, 0.8, 0.03);
      P(e, M.railing, w - 0.2, 1.0, 0.04, 0, 0.6, 1.5, 0.01, false);
      P(e, M.frame, w, 0.05, 0.08, 0, 1.12, 1.5, 0.02);
      punchedBay(e, w, gh, 0.05, 0.45, w - 1.4, M.tile);
    } else punchedBay(e, w, gh, 0.9, 0.5, Math.min(1.8, w - 1.6), M.tile);
  } else if (use === 'shop') {
    if (f === 1) punchedBay(e, w, gh, 1.0, 0.9, w * 0.45, M.stone);
    else punchedBay(e, w, gh, 0.9, 0.6, w - 1.0, M.stone); // 横連窓
  } else if (use === 'warehouse') {
    P(e, M.metal, w, gh + SLAB, 0.1, 0, (gh - SLAB) / 2, 0.05, 0.02);
    G(e, w - 1.2, 0.6, 0.03, 0, gh - 0.9, 0.12);
    if (f === 1 && (side === 'front' || side === 'back') && i % 2 === 0)
      P(e, M.shutter, Math.min(4, w - 1.5), 4.0, 0.08, 0, 2.0, 0.15, 0.02); // シャッター
  } else { // データセンター：窓なしパネル＋縦ルーバー
    P(e, M.dc, w, gh + SLAB, 0.1, 0, (gh - SLAB) / 2, 0.05, 0.02);
    const n = Math.round(w / 0.75);
    for (let k = 0; k < n; k++) P(e, M.fin, 0.06, gh + SLAB - 0.2, 0.4, -w / 2 + (k + 0.5) * w / n, (gh - SLAB) / 2, 0.3, 0.02);
  }
}

// --- 内装 ---
function interior(f, yt, gh, list) {
  const use = CFG.use, x0 = GX[0], x1 = GX[GX.length - 1], z0 = GZ[0], z1 = GZ[GZ.length - 1];
  const fe = newEl(V(0, yt, 0), 'xz');
  P(fe, M.ifloor, EX * 2 - 1.4, 0.04, EZ * 2 - 1.4, 0, yt + 0.02, 0, 0.015);
  list.push(fe);
  const wall = (w, h, d, x, z, mat = M.iwall) => {
    const e = newEl(V(x, yt, z));
    P(e, mat, w, h, d, x, yt + h / 2, z, 0.03);
    list.push(e);
  };
  if (use === 'warehouse' || use === 'datacenter') { // 棚・サーバーラックの列
    const step = use === 'warehouse' ? 3 : 2.6, rh = use === 'warehouse' ? Math.min(4.5, gh - 0.8) : 2.2;
    for (let z = z0 + 2; z <= z1 - 1.5; z += step) wall(x1 - x0 - 4, rh, use === 'warehouse' ? 1.0 : 1.1, 0, z);
  } else if (use === 'apartment') { // 住戸の境の壁
    for (let i = 1; i < GX.length - 1; i++) wall(0.15, gh - 0.05, z1 - z0, GX[i], 0);
  } else { // 事務所・店舗：コア＋間仕切り
    const j = Math.floor((GZ.length - 1) / 2);
    wall(GX[1] - GX[0], gh - 0.05, GZ[j + 1] - GZ[j], (GX[0] + GX[1]) / 2, (GZ[j] + GZ[j + 1]) / 2);
    if (GX.length > 3) for (let k = 1; k < GZ.length - 1; k++) wall(x1 - GX[1], gh - 0.25, 0.12, (GX[1] + x1) / 2, GZ[k]);
    const dz0 = GZ[1] - GZ[0], dz1 = z1 - GZ[GZ.length - 2];
    for (let i = 2; i < GX.length - 1; i++) { wall(0.12, gh - 0.25, dz0, GX[i], z0 + dz0 / 2); wall(0.12, gh - 0.25, dz1, GX[i], z1 - dz1 / 2); }
  }
}

// --- 足場（パイプ＋手すり＋布板）と養生シート ---
function scaffoldGeos(h, off) {
  const ai = { x: EX + off, z: EZ + off }, ao = { x: EX + off + 0.9, z: EZ + off + 0.9 };
  const corners = a => [[-a.x, -a.z], [a.x, -a.z], [a.x, a.z], [-a.x, a.z]];
  const ring = a => {
    const c = corners(a), pts = [];
    for (let k = 0; k < 4; k++) {
      const [x1, z1] = c[k], [x2, z2] = c[(k + 1) % 4];
      const n = Math.ceil(Math.hypot(x2 - x1, z2 - z1) / 1.8);
      for (let i = 0; i < n; i++) pts.push([x1 + (x2 - x1) * i / n, z1 + (z2 - z1) * i / n]);
    }
    return pts;
  };
  const r = 0.024, pipes = [], decks = [];
  const inner = ring(ai), outer = ring(ao);
  for (const [x, z] of [...inner, ...outer]) pipes.push(pipe(V(x, 0, z), V(x, h, z), r));
  const lifts = h > 4.5 ? [0, h / 3, (2 * h) / 3] : [0, h / 2];
  const lift = h / lifts.length;
  for (const L of lifts) {
    for (const a of [ai, ao]) {
      const c = corners(a);
      for (let k = 0; k < 4; k++) {
        const [x1, z1] = c[k], [x2, z2] = c[(k + 1) % 4];
        pipes.push(pipe(V(x1, L + 0.06, z1), V(x2, L + 0.06, z2), r));
        if (a === ao) for (const hh of [0.5, 0.95]) pipes.push(pipe(V(x1, L + hh, z1), V(x2, L + hh, z2), r)); // 手すり・中桟
      }
    }
    outer.forEach(([x, z], i) => { // 筋かい
      const [x2, z2] = outer[(i + 1) % outer.length];
      if (i % 2 === 0) pipes.push(pipe(V(x, L, z), V(x2, L + lift, z2), r * 0.8));
    });
    const t = 0.04, dz = ao.z - ai.z, dx = ao.x - ai.x;
    for (const s of [-1, 1]) {
      decks.push(new THREE.BoxGeometry(ao.x * 2, t, dz).translate(0, L + t / 2, s * (ai.z + ao.z) / 2));
      decks.push(new THREE.BoxGeometry(dx, t, ai.z * 2).translate(s * (ai.x + ao.x) / 2, L + t / 2, 0));
    }
  }
  const sx = ao.x + 0.08, sz = ao.z + 0.08;
  const plane = (w, ry, x, z) => {
    const g = new THREE.PlaneGeometry(w, h);
    const uv = g.attributes.uv;
    for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * w / 1.2, uv.getY(i) * h / 1.2);
    return g.rotateY(ry).translate(x, h / 2, z);
  };
  const sheets = [plane(sx * 2, 0, 0, sz), plane(sx * 2, Math.PI, 0, -sz), plane(sz * 2, Math.PI / 2, sx, 0), plane(sz * 2, -Math.PI / 2, -sx, 0)];
  return { pipes: mergeGeometries(pipes), decks: mergeGeometries(decks), sheets: mergeGeometries(sheets) };
}

// ===== 現場全体：地面・仮囲い・事務所・杭・山留め・基礎・重機・クレーン・外構 =====
let site = {};
// 四角い穴のあいた地面（XZ平面・上向き）。o・h は {x1,x2,z1,z2}
function holedPlane(o, h) {
  const shape = new THREE.Shape();
  shape.moveTo(o.x1, -o.z2); shape.lineTo(o.x2, -o.z2); shape.lineTo(o.x2, -o.z1); shape.lineTo(o.x1, -o.z1); shape.closePath();
  const hole = new THREE.Path();
  hole.moveTo(h.x1, -h.z2); hole.lineTo(h.x1, -h.z1); hole.lineTo(h.x2, -h.z1); hole.lineTo(h.x2, -h.z2); hole.closePath();
  shape.holes.push(hole);
  return new THREE.ShapeGeometry(shape).rotateX(-Math.PI / 2);
}
const grow = (r, d) => ({ x1: r.x1 - d, x2: r.x2 + d, z1: r.z1 - d, z2: r.z2 + d });

function buildGround() {
  const site1 = grow(F, 1);
  site.asphalt = addMesh(holedPlane({ x1: -1500, x2: 1500, z1: -1500, z2: 1500 }, site1), M.asphalt, world, false);
  // AR のとき、実際の床に影を落とすための透明な板
  site.catcher = new THREE.Mesh(new THREE.PlaneGeometry(F.x2 - F.x1 + 24, F.z2 - F.z1 + 24).rotateX(-Math.PI / 2), M.catcher);
  site.catcher.receiveShadow = true;
  site.catcher.position.set((F.x1 + F.x2) / 2, -0.01, (F.z1 + F.z2) / 2);
  site.catcher.visible = false;
  world.add(site.catcher);
  addMesh(holedPlane(site1, { x1: -PX, x2: PX, z1: -PZ, z2: PZ }), M.soil, world, false).position.y = 0.004;
  // 掘削の底と山留めの壁（深さは日付で変わる）
  const pitMat = std({ map: tex(soilCv, { repeat: [PX / 4, PZ / 4] }), roughness: 1 });
  worldMats.push(pitMat);
  site.pitMat = pitMat;
  site.pitFloor = addMesh(new THREE.PlaneGeometry(PX * 2, PZ * 2).rotateX(-Math.PI / 2), pitMat, world, false);
  site.walls = [];
  for (const [w, x, z, ry] of [[PX * 2, 0, -PZ, 0], [PX * 2, 0, PZ, Math.PI], [PZ * 2, -PX, 0, Math.PI / 2], [PZ * 2, PX, 0, -Math.PI / 2]]) {
    const m = addMesh(new THREE.PlaneGeometry(w, 1).translate(0, -0.5, 0), M.board, world, false);
    m.position.set(x, 0, z); m.rotation.y = ry;
    site.walls.push(m);
  }
  // 山留めのH鋼（1.5m間隔）と腹起し
  const posts = [];
  const ring = [[-PX, -PZ], [PX, -PZ], [PX, PZ], [-PX, PZ]];
  for (let k = 0; k < 4; k++) {
    const [x1, z1] = ring[k], [x2, z2] = ring[(k + 1) % 4];
    const n = Math.ceil(Math.hypot(x2 - x1, z2 - z1) / 1.5);
    for (let i = 0; i < n; i++) {
      const x = x1 + (x2 - x1) * i / n, z = z1 + (z2 - z1) * i / n;
      posts.push(new THREE.BoxGeometry(0.3, PIT + 1.3, 0.3).translate(x, (PIT + 1.3) / 2 - PIT - 0.8, z));
    }
    posts.push(bar(V(x1, -1.0, z1), V(x2, -1.0, z2), 0.3));
  }
  site.hsteel = addMesh(mergeGeometries(posts), M.hsteel);
}

function buildPrep() { // 準備工事：仮囲い（3.6mずつ）・ゲート・仮設物
  const list = [], FH = 3;
  const side = (x1, z1, x2, z2) => {
    const len = Math.hypot(x2 - x1, z2 - z1);
    if (len < 0.5) return;
    const n = Math.max(1, Math.round(len / 3.6)), w = len / n;
    const ry = -Math.atan2(z2 - z1, x2 - x1);
    for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n, x = x1 + (x2 - x1) * t, z = z1 + (z2 - z1) * t;
      const e = newEl(V(x, 0, z)); e.tag = 'fence';
      PR(e, M.fence, w, FH, 0.06, x, FH / 2, z, ry, 0.02);
      list.push(e);
    }
  };
  // 正面（ゲートの辺）から時計回りに4辺。ゲートの幅だけあける
  const C = GF.C, g0 = GATE.pos - GATE.width / 2, g1 = GATE.pos + GATE.width / 2;
  const W = (x, z) => GF.toW(x, z);
  const seg = (a, b) => { const [x1, z1] = W(...a), [x2, z2] = W(...b); side(x1, z1, x2, z2); };
  seg([g1, C.z2], [C.x2, C.z2]); seg([C.x2, C.z2], [C.x2, C.z1]); seg([C.x2, C.z1], [C.x1, C.z1]);
  seg([C.x1, C.z1], [C.x1, C.z2]); seg([C.x1, C.z2], [g0, C.z2]);
  // ゲート（引き戸）
  const g = itemEl('fence', ...W(GATE.pos, C.z2), GF.deg, t => {
    for (const x of [-GATE.width / 2, GATE.width / 2]) P(t, M.gate, 0.3, FH + 0.4, 0.3, x, (FH + 0.4) / 2, 0, 0.04);
    for (const s of [-1, 1]) P(t, M.gate, GATE.width / 2 - 0.4, 0.25, 0.12, s * GATE.width / 4, FH + 0.1, 0, 0.03);
  });
  list.push(g);
  list.forEach(e => { e.info = { kind: "fence" }; });
  site.fenceCount = list.length;
  // 仮設物（配置図にあればその位置、無い種類は自動で置く）
  const given = (CFG.layout && CFG.layout.items) || [];
  const types = new Set(given.map(i => i.type));
  const items = [...given.map(i => ({ ...i, world: true })), ...defaultItems().filter(i => !types.has(i.type))];
  site.items = items;
  for (const it of items) {
    if (it.type === 'crane' || it.type === 'pump') continue; // クレーンと生コン車は別に作る
    const [x, z] = it.world ? [it.x, it.z] : W(it.x, it.z);
    const deg = it.world ? it.rot : it.rot + GF.deg;
    const e = itemEl('office', x, z, deg, ITEM_BUILD[it.type]);
    e.info = { kind: 'item', type: it.type };
    list.push(e);
  }
  site.prepList = list;
}

// ゲートを正面にした座標で、仮設物のいつもの置き場所
function defaultItems() {
  const C = GF.C, g = GATE.pos, w = GATE.width, bx = GF.bx, bz = GF.bz;
  const a = (type, x, z, rot = 0) => ({ type, x, z, rot });
  return [
    a('guard', g + w / 2 + 2.6, C.z2 - 2.4),
    a('guide', g - w / 2 - 1.2, C.z2 + 1.6), a('guide', g + w / 2 + 1.2, C.z2 + 1.6),
    a('sign', Math.max(C.x1 + 3, g - w / 2 - 6), C.z2 + 0.4),
    a('wash', g, C.z2 - 4.5),
    a('office', C.x2 - 9, C.z2 - 5), a('toilet', C.x2 - 3.6, C.z2 - 3.2), a('water', C.x2 - 3, C.z2 - 9.5),
    a('rest', C.x1 + 7, C.z2 - 5), a('smoking', C.x1 + 3.2, C.z2 - 10.5, 90),
    a('assembly', C.x1 + 6.5, 0, 90),
    a('parking', C.x2 - 9, C.z1 + 3.5, 180),
    a('cubicle', C.x2 - 3, C.z1 + 9.5, -90),
    a('rebar', C.x2 - 5, -6, 90), a('formwork', C.x2 - 5, 1, 90), a('scafmat', C.x2 - 5, 8, 90),
    a('waste', 0, C.z1 + 3),
    a('panel', -(bx + 3.6), bz + 3.6), a('panel', bx + 3.6, -(bz + 3.6), 180),
    a('crane', -(bx + 8), -(bz + 8)),
    a('pump', Math.min(6, C.x2 - 16), bz + 6.5),
  ];
}
// 仮設物を1つの部材にする（build はローカル座標で、正面は z+）
function itemEl(tag, x, z, deg, build) {
  const e = newEl(V(x, 0, z)); e.tag = tag;
  const t = { parts: [] };
  build(t);
  const place = m4(x, 0, z, THREE.MathUtils.degToRad(deg || 0));

function buildPour(item) { // 生コン車とポンプ車（床を打つ日だけ）
  const [px, pz] = item.world ? [item.x, item.z] : GF.toW(item.x, item.z);
  const grp = new THREE.Group();
  grp.position.set(px, 0, pz);
  grp.rotation.y = -Math.atan2(-pz, -px); // ブームを建物の方へ
  world.add(grp);
  // ポンプ車
  box(grp, M.track, 9, 0.5, 2.3, 0, 0.75, 0, 0.05);
  box(grp, M.cab, 2.2, 2.3, 2.4, 3.6, 1.9, 0, 0.12);
  box(grp, M.pumpBody, 6, 1.2, 2.3, -1.2, 1.6, 0, 0.08);
  for (const s of [-1, 1]) box(grp, M.pumpBody, 0.3, 0.3, 3.2, 0.5, 0.6, s * 1.9, 0.04); // アウトリガー
  const wheel = GEO.truckWheel ||= new THREE.CylinderGeometry(0.55, 0.55, 0.4, 16).rotateX(Math.PI / 2);
  for (const x of [-3, -1.6, 3.4]) for (const z of [-1, 1]) addMesh(wheel, M.track, grp).position.set(x, 0.55, z);
  const turret = new THREE.Group(); turret.position.set(0.5, 2.2, 0); grp.add(turret);
  addMesh(cyl(0.6, 0.6, 16), M.pumpBody, turret);
  const segs = [[10, 1.15], [9, -0.75], [8, -0.95]]; // 長さと曲げ角
  let parent = turret;
  for (const [len, ang] of segs) {
    const s = new THREE.Group(); s.rotation.z = ang; parent.add(s);
    box(s, M.pumpBody, len, 0.4, 0.4, len / 2, 0, 0, 0.06);
    const next = new THREE.Group(); next.position.x = len; s.add(next);
    parent = next;
  }
  addMesh(cyl(0.06, 3, 8), M.track, parent).position.y = -1.5; // 先のホース
  // 生コン車（ドラムは回る）
  const mixer = new THREE.Group(); mixer.position.set(-2.5, 0, 3.6); grp.add(mixer); // ポンプ車の横につける
  box(mixer, M.track, 7.5, 0.5, 2.3, 0, 0.75, 0, 0.05);
  box(mixer, M.cab, 2.0, 2.2, 2.4, 2.9, 1.85, 0, 0.12);
  const drum = new THREE.Group(); drum.position.set(-0.8, 2.3, 0); drum.rotation.z = 0.25; mixer.add(drum);
  site.drum = addMesh(new THREE.CylinderGeometry(0.9, 1.25, 4.2, 18).rotateZ(Math.PI / 2), M.dump, drum);
  for (const x of [-2.6, -1.2, 2.6]) for (const z of [-1, 1]) addMesh(wheel, M.track, mixer).position.set(x, 0.55, z);
  grp.visible = false;
  grp.userData.info = { kind: "pour" };
  site.pour = grp;
}

function buildFoundation() { // 基礎工事：捨てコン→フーチング→基礎梁→基礎版
  const list = [], y0 = -PIT;
  const lx = [-EX - 0.5, ...GX.slice(1, -1), EX + 0.5];
  const lz = [-EZ - 0.5, ...GZ.slice(1, -1), EZ + 0.5];
  for (let i = 0; i < lx.length - 1; i++) for (let j = 0; j < lz.length - 1; j++) {
    const w = lx[i + 1] - lx[i], d = lz[j + 1] - lz[j], cx = (lx[i] + lx[i + 1]) / 2, cz = (lz[j] + lz[j + 1]) / 2;
    const e = newEl(V(cx, y0, cz), 'xz');
    P(e, M.lean, w, 0.05, d, cx, y0 + 0.025, cz, 0.01);
    list.push(e);
  }
  for (const gz of GZ) for (const gx of GX) { // フーチング
    const e = newEl(V(gx, y0 + 0.05, gz));
    P(e, M.slab, 2.6, 1.1, 2.6, gx, y0 + 0.05 + 0.55, gz, 0.04);
    list.push(e);
  }
  const bh = PIT - 0.05;
  for (const gz of GZ) GX.slice(0, -1).forEach((a, i) => { // 基礎梁
    const b = GX[i + 1], e = newEl(V((a + b) / 2, y0 + 0.05, gz));
    P(e, M.column, b - a, bh, 0.7, (a + b) / 2, y0 + 0.05 + bh / 2, gz, 0.04);
    list.push(e);
  });
  for (const gx of GX) GZ.slice(0, -1).forEach((a, i) => {
    const b = GZ[i + 1], e = newEl(V(gx, y0 + 0.05, (a + b) / 2));
    P(e, M.column, 0.7, bh, b - a, gx, y0 + 0.05 + bh / 2, (a + b) / 2, 0.04);
    list.push(e);
  });
  const base = newEl(V(0, 0, 0)); // 基礎版（1階の床の下）
  P(base, M.slab, EX * 2 + 0.6, BASE, EZ * 2 + 0.6, 0, BASE / 2, 0, 0.05);
  list.push(base);
  list.forEach(e => { e.info = { kind: "found" }; });
  site.foundList = list;
}

function buildExterior() { // 外構工事：犬走り・舗装・植栽・駐車場の白線・植木（ゲートの辺を正面にした座標で作る）
  const C = GF.C, list = [], ax = GF.bx + 1.5, az = GF.bz + 1.5;
  const ix1 = C.x1 + 2, ix2 = C.x2 - 2, iz1 = C.z1 + 2, iz2 = C.z2 - 2;
  const g0 = GATE.pos - GATE.width / 2 - 1, g1 = GATE.pos + GATE.width / 2 + 1;
  const add = (x, z, mode, build) => {
    const [wx, wz] = GF.toW(x, z);
    const e = itemEl('ext', wx, wz, GF.deg, build);
    e.mode = mode;
    list.push(e);
  };
  for (const s of [-1, 1]) { // 建物まわりのコンクリート
    add(0, s * (az - 0.75), 'xz', t => P(t, M.apron, ax * 2, 0.1, 1.5, 0, 0.05, 0, 0.02));
    add(s * (ax - 0.75), 0, 'xz', t => P(t, M.apron, 1.5, 0.1, az * 2 - 3, 0, 0.05, 0, 0.02));
  }
  const tiles = [];
  const region = (x1, x2, z1, z2) => {
    if (x2 - x1 < 0.5 || z2 - z1 < 0.5) return;
    const nx = Math.max(1, Math.round((x2 - x1) / 6)), nz = Math.max(1, Math.round((z2 - z1) / 6));
    const w = (x2 - x1) / nx, d = (z2 - z1) / nz;
    for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++) {
      const cx = x1 + (i + 0.5) * w, cz = z1 + (j + 0.5) * d;
      tiles.push([Math.hypot(cx, cz), cx, cz, w, d]);
    }
  };
  region(ix1, ix2, az, iz2); region(ix1, ix2, iz1, -az); region(ix1, -ax, -az, az); region(ax, ix2, -az, az);
  tiles.sort((a, b) => a[0] - b[0]).forEach(([, cx, cz, w, d]) => add(cx, cz, 'xz', t => P(t, M.pave, w, 0.08, d, 0, 0.04, 0, 0.01)));
  // 植栽帯（ゲートの前はあける）
  const lawnX = (x1, x2, z) => { if (x2 - x1 > 0.5) add((x1 + x2) / 2, z, 'xz', t => P(t, M.lawn, x2 - x1, 0.14, 1.8, 0, 0.07, 0, 0.03)); };
  lawnX(C.x1 + 0.2, C.x2 - 0.2, C.z1 + 1);
  lawnX(C.x1 + 0.2, g0, C.z2 - 1); lawnX(g1, C.x2 - 0.2, C.z2 - 1);
  for (const s of [-1, 1]) {
    const x = s < 0 ? C.x1 + 1 : C.x2 - 1;
    add(x, (C.z1 + C.z2) / 2, 'xz', t => P(t, M.lawn, 1.8, 0.14, C.z2 - C.z1 - 4, 0, 0.07, 0, 0.03));
  }
  if (iz2 - az > 7) for (let x = ix1 + 2; x <= ix2 - 2; x += 2.5) { // 駐車場の白線
    if (x > g0 - 1 && x < g1 + 1) continue;
    add(x, az + 5, 'y', t => P(t, M.line, 0.12, 0.02, 5, 0, 0.09, 0, 0.005));
  }
  const leafGeo = GEO.leaf ||= new THREE.IcosahedronGeometry(1.4, 1);
  const trunkGeo = GEO.trunk ||= new THREE.CylinderGeometry(0.12, 0.16, 2.2, 8);
  const tree = (x, z) => add(x, z, 'y', t => { addPart(t, trunkGeo, M.trunk, m4(0, 1.1, 0)); addPart(t, leafGeo, M.leaf, m4(0, 3.0, 0)); });
  for (let x = C.x1 + 4; x <= C.x2 - 4; x += 8) { tree(x, C.z1 + 1); if (x < g0 - 2 || x > g1 + 2) tree(x, C.z2 - 1); }
  for (let z = C.z1 + 8; z <= C.z2 - 8; z += 8) { tree(C.x1 + 1, z); tree(C.x2 - 1, z); }
  list.forEach(e => { e.info = { kind: "extsite" }; });
  site.extList = list;
}

function buildMachines() { // バックホウとダンプ
  const bh = new THREE.Group();

  addMesh(pbox(0.03, 0.8, 1.9), M.glass, dump, false).position.set(3.62, 2.1, 0);
  box(dump, M.crane, 4.2, 1.3, 2.4, -0.6, 1.6, 0, 0.08);

  for (const x of [-1.8, -0.6, 2.6]) for (const z of [-1.0, 1.0]) addMesh(wheel, M.track, dump).position.set(x, 0.55, z);

function buildCrane(roofTop) { // タワークレーン（組立・解体で背が変わる）
  const ci = site.items.find(i => i.type === "crane");
  const [qx, qz] = ci.world ? [ci.x, ci.z] : GF.toW(ci.x, ci.z);
  const cx = -qx, cz = -qz, dist = Math.max(Math.hypot(cx, cz), 8);
  const crane = new THREE.Group();
  crane.position.set(-cx, 0, -cz);
  world.add(crane);
  box(crane, M.heavy, 6, 1.2, 6, 0, 0.6, 0, 0.06);
  const MH = Math.max(30, Math.ceil((roofTop + 14) / 2) * 2), top = 1.2 + MH;
  const mast = addMesh(lattice(MH, 1.7, 2.0, 0.16, 0.08), M.crane, crane);
  mast.position.y = 1.2;

  const slew = new THREE.Group();
  slew.rotation.y = -Math.atan2(cz, cx); // ジブを建物の方へ
  crane.add(slew);
  const jib = Math.max(30, Math.round(dist + 10));
  const Y = [], S = [];
  Y.push(new THREE.BoxGeometry(2.6, 1.0, 2.6).translate(0, top + 0.5, 0));
  const apex = V(0, top + 8, 0);
  for (const [x, z] of [[-.85, -.85], [.85, -.85], [.85, .85], [-.85, .85]]) Y.push(bar(V(x, top + 1, z), apex, 0.16));
  Y.push(lattice(jib, 1.4, 2.2, 0.12, 0.07).rotateZ(-Math.PI / 2).translate(1.3, top + 1.7, 0));
  for (const z of [-0.8, 0.8]) Y.push(new THREE.BoxGeometry(12, 0.5, 0.35).translate(-7.3, top + 1.25, z)); // カウンタージブ
  Y.push(bar(apex, V(jib * 0.72, top + 2.4, 0), 0.07), bar(apex, V(-12.8, top + 1.5, 0), 0.07)); // 吊りロッド
  const trolleyX = dist * 0.9, hookY = roofTop + 5;
  Y.push(new THREE.BoxGeometry(1.4, 0.5, 1.2).translate(trolleyX, top + 0.8, 0));
  Y.push(new THREE.BoxGeometry(0.7, 0.9, 0.5).translate(trolleyX, hookY, 0));
  S.push(new THREE.BoxGeometry(12, 0.06, 1.9).translate(-7.3, top + 1.0, 0));
  for (const dx of [-0.2, 0.2]) S.push(pipe(V(trolleyX + dx, top + 0.6, 0), V(trolleyX + dx, hookY + 0.45, 0), 0.018));
  addMesh(mergeGeometries(Y), M.crane, slew);
  addMesh(mergeGeometries(S), M.pipe, slew);
  for (let i = 0; i < 4; i++) box(slew, M.heavy, 0.7, 2.6, 2.2, -10 - i * 0.8, top - 0.3, 0, 0.05); // カウンターウェイト
  box(slew, M.cab, 2.0, 2.2, 2.0, 0.6, top + 0.4, 2.0, 0.08);
  addMesh(pbox(0.04, 1.2, 1.6), M.glass, slew, false).position.set(1.62, top + 0.7, 2.0);
  crane.visible = false;
  crane.userData.info = { kind: "crane" };
  site.crane = { g: crane, mast, slew };
  return top + 8;
}

// ===== 建物を組み立てる（設定が変わるたびに作り直す） =====
const ZERO = new THREE.Matrix4().makeScale(0, 0, 0);
let floors = {};
let pickMap = new Map();
let gridOn = true;
try { gridOn = localStorage.getItem('hakoniwa-grid') !== 'off'; } catch {}

// ===== 通り芯（線・記号・寸法） =====
function gridSprite(text, kind) {
  const c = document.createElement('canvas');
  const bubble = kind === 'bubble';
  c.width = bubble ? 128 : 256; c.height = bubble ? 128 : 80;
  const g = c.getContext('2d');
  if (bubble) {
    g.fillStyle = '#ffffff'; g.strokeStyle = '#c0392b'; g.lineWidth = 8;
    g.beginPath(); g.arc(64, 64, 56, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = '#c0392b'; g.font = `bold ${text.length > 3 ? 34 : 46}px ${FONT}`;
  } else {
    g.fillStyle = 'rgba(255,255,255,0.88)'; g.fillRect(20, 10, 216, 60);
    g.fillStyle = '#1d2a3a'; g.font = `bold 40px ${FONT}`;
  }
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, c.width / 2, c.height / 2 + 2, c.width - 24);
  const m = new THREE.SpriteMaterial({ map: tex(c), transparent: true, fog: false });
  worldMats.push(m);
  const s = new THREE.Sprite(m);
  s.scale.set(bubble ? 2.4 : 3.6, bubble ? 2.4 : 1.1, 1);
  return s;
}
function gridLines(x1, x2, z1, z2) {
  const p = [];
  GX.forEach(x => p.push(x, 0, z1, x, 0, z2));
  GZ.forEach(z => p.push(x1, 0, z, x2, 0, z));
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  const l = new THREE.LineSegments(g, M.gridLine);
  l.computeLineDistances();
  return l;
}
function buildGrid() {
  const grp = new THREE.Group(), NX = namesOf(CFG, 'x'), NZ = namesOf(CFG, 'z'), out = 5;
  world.add(grp);
  const ground = gridLines(-EX - out, EX + out, -EZ - out, EZ + out);
  ground.position.y = 0.08;
  grp.add(ground);
  site.gridFloors = [];
  for (let f = 1; f <= NF + 1; f++) { // 各階の床の上（床ができたら見える）
    const l = gridLines(-EX, EX, -EZ, EZ);
    l.position.y = yb(f) + SLAB + 0.03;
    l.visible = false;
    grp.add(l);
    site.gridFloors[f] = l;
  }
  const put = (s, x, z, y) => { s.position.set(x, y, z); grp.add(s); };
  const bz = EZ + out + 1.4, bx = EX + out + 1.4;
  GX.forEach((x, i) => { put(gridSprite(NX[i], 'bubble'), x, bz, 1.3); put(gridSprite(NX[i], 'bubble'), x, -bz, 1.3); });
  GZ.forEach((z, i) => { put(gridSprite(NZ[i], 'bubble'), -bx, z, 1.3); put(gridSprite(NZ[i], 'bubble'), bx, z, 1.3); });
  const mm = v => Math.round(v * 1000).toLocaleString('ja-JP');
  GX.slice(0, -1).forEach((x, i) => put(gridSprite(mm(GX[i + 1] - x), 'dim'), (x + GX[i + 1]) / 2, bz, 0.7));
  GZ.slice(0, -1).forEach((z, i) => put(gridSprite(mm(GZ[i + 1] - z), 'dim'), -bx, (z + GZ[i + 1]) / 2, 0.7));
  grp.visible = gridOn;
  site.grid = grp;
}
function build(cfg) {
  // 前の建物を片付ける
  if (world) {
    world.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.isInstancedMesh) o.dispose(); });
    arRoot.remove(world);
  }
  Object.values(GEO).forEach(g => g.dispose());
  worldMats.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
  world = new THREE.Group(); arRoot.add(world);
  worldMats = []; GEO = {}; batches = new Map(); elements = []; floors = {}; site = {};

  CFG = cfg; NF = cfg.floors;
  GX = gridOf(spansOf(cfg, 'x'));
  GZ = gridOf(spansOf(cfg, 'z'));
  EX = GX[GX.length - 1] + 1; EZ = GZ[GZ.length - 1] + 1;
  PX = EX + 2; PZ = EZ + 2;        // 掘削範囲
  // 仮囲いとゲート（配置図から読んだものが無ければ建物のまわりに自動で）
  const need = { x1: -PX - 6, x2: PX + 6, z1: -PZ - 6, z2: PZ + 6 };
  const lf = cfg.layout && cfg.layout.fence;
  F = lf ? { x1: Math.min(lf.x1, need.x1), x2: Math.max(lf.x2, need.x2), z1: Math.min(lf.z1, need.z1), z2: Math.max(lf.z2, need.z2) }
         : { x1: -(EX + 16), x2: EX + 16, z1: -(EZ + 14), z2: EZ + 14 };
  GATE = cfg.layout ? { ...cfg.layout.gate, width: Math.min(Math.max(cfg.layout.gate.width, 4), 20) } : { side: 'front', pos: 0, width: 12 };
  GF = makeGateFrame(F, GATE);
  GATE.pos = Math.min(Math.max(GATE.pos, GF.C.x1 + GATE.width / 2 + 1), GF.C.x2 - GATE.width / 2 - 1);
  hs = [0]; ys = [0, BASE];
  for (let f = 1; f <= NF; f++) {
    hs[f] = (cfg.floorH && cfg.floorH[f - 1]) || USES[cfg.use].h(f);
    ys[f + 1] = ys[f] + hs[f];
  }
  // 工事のお知らせ看板の中身（用途・規模・工期）
  if (M.signboard.map) M.signboard.map.dispose();
  const dates = [...SITE_PHASES.flatMap(p => cfg.site[p.key]), ...cfg.data.filter(d => d.floor <= NF).flatMap(d => d.progress.map(([s]) => s))].sort();
  const jd = s => { const d = parseDate(s); return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`; };
  M.signboard.map = tex(signCanvas([
    `建物の用途：${USES[cfg.use].label}`,
    `規模：地上${NF}階建て`,
    `工事期間：${jd(dates[0])}〜${jd(dates[dates.length - 1])}`,
    'ご迷惑をおかけしますが、ご協力をお願いします。',
  ]));
  M.signboard.needsUpdate = true;

  const fx = EX - CW, fz = EZ - CW;
  const XB = GX.slice(0, -1).map((x, i) => [i === 0 ? -fx : x, i === GX.length - 2 ? fx : GX[i + 1]]);
  const ZB = GZ.slice(0, -1).map((z, i) => [i === 0 ? -fz : z, i === GZ.length - 2 ? fz : GZ[i + 1]]);
  const bays = [
    ...XB.map(([a, b], i) => ['front', i, (a + b) / 2, fz, b - a, 0]),
    ...ZB.map(([a, b], i) => ['right', i, fx, -(a + b) / 2, b - a, Math.PI / 2]),
    ...XB.map(([a, b], i) => ['back', i, -(a + b) / 2, -fz, b - a, Math.PI]),
    ...ZB.map(([a, b], i) => ['left', i, -fx, (a + b) / 2, b - a, -Math.PI / 2]),
  ];

  buildGround();
  buildPrep();
  buildFoundation();
  buildExterior();
  buildPiles();
  buildMachines();

  for (let f = 1; f <= NF; f++) {
    const y0 = yb(f), H = hs[f], yt = y0 + SLAB, colH = H - SLAB;
    const fl = { '床': [], '躯体': [], '外装': [], '内装': [], cols: [], rebar: [], roof: [], scaffold: null };
    floors[f] = fl;

    slabPanels(y0, M.slab, fl['床'], { kind: 'slab', floor: f });

    // 躯体（柱 0.8m角）＋ 柱頭から出る鉄筋
    GZ.forEach((gz, iz) => GX.forEach((gx, ix) => {
      const c = newEl(V(gx, yt, gz));
      c.info = { kind: 'col', floor: f, ix, iz };
      P(c, M.column, 0.8, colH, 0.8, gx, yt + colH / 2, gz, 0.05);
      fl['躯体'].push(c); fl.cols.push(c);
      const r = newEl(V(gx, y0 + H, gz));
      const rg = GEO.rebar ||= new THREE.CylinderGeometry(0.016, 0.016, 1.1, 6);
      for (const [dx, dz] of [[-.28, -.28], [.28, -.28], [.28, .28], [-.28, .28], [0, -.28], [0, .28], [-.28, 0], [.28, 0]])
        addPart(r, rg, M.rebar, m4(gx + dx, y0 + H + 0.55, gz + dz));
      r.info = { kind: 'rebar', floor: f, ix, iz };
      fl.rebar.push(r);
    }));
    if (f === NF) { // 屋上スラブ＋パラペット
      const yr = yb(NF + 1);
      slabPanels(yr, M.slab, fl.roof, { kind: 'roof', floor: f });
      for (const s of [-1, 1]) {
        const a = newEl(V(0, yr + SLAB, s * (EZ - 0.1)));
        P(a, M.column, EX * 2, 1.0, 0.2, 0, yr + SLAB + 0.5, s * (EZ - 0.1));
        const b = newEl(V(s * (EX - 0.1), yr + SLAB, 0));
        P(b, M.column, 0.2, 1.0, EZ * 2 - 0.4, s * (EX - 0.1), yr + SLAB + 0.5, 0);
        a.info = b.info = { kind: 'roof', floor: f };
        fl.roof.push(a, b);
      }
      fl['躯体'].push(...fl.roof);
    }

    // 外装（用途ごとの外壁）
    for (const [side, i, x, z, w, ry] of bays) {
      const e = newEl(V(x, yt, z));
      e.info = { kind: 'ext', floor: f, side, i };
      const tmp = { parts: [] };
      exteriorBay(tmp, f, side, i, Math.round(w * 100) / 100, colH);
      const place = m4(x, yt, z, ry);
      tmp.parts.forEach(p => e.parts.push({ ...p, base: place.clone().multiply(p.base) }));
      fl['外装'].push(e);
    }
    if (f === NF && CFG.use === 'datacenter') { // 屋上の冷却設備
      const yr = yb(NF + 1) + SLAB;
      for (let i = 0; i < GX.length - 1; i++) for (let j = 0; j < GZ.length - 1; j++) {
        const x = (GX[i] + GX[i + 1]) / 2, z = (GZ[j] + GZ[j + 1]) / 2;
        const e = newEl(V(x, yr, z));
        e.info = { kind: 'equip', floor: f };
        P(e, M.equip, 3.2, 2.2, 3.2, x, yr + 1.1, z, 0.08);
        addPart(e, GEO.fan ||= new THREE.CylinderGeometry(1.1, 1.1, 0.12, 24), M.fan, m4(x, yr + 2.26, z));
        fl['外装'].push(e);
      }
    }

    // 内装（窓越しにうっすら見える）
    interior(f, yt, colH, fl['内装']);
    fl['内装'].forEach(e => { e.info = { kind: 'int', floor: f }; });
  }

  // 部材の InstancedMesh を作る
  for (const b of batches.values()) {
    b.mesh = new THREE.InstancedMesh(b.geo, b.mat, b.count);
    b.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    b.mesh.castShadow = b.cast;
    b.mesh.receiveShadow = true;
    b.mesh.frustumCulled = false;
    for (let i = 0; i < b.count; i++) b.mesh.setMatrixAt(i, ZERO);
    world.add(b.mesh);
  }
  // タップした部材を探すための表（InstancedMesh の何番目 → 部材）
  pickMap = new Map();
  for (const e of elements) for (const p of e.parts) pickMap.set(p.b.mesh.uuid + '|' + p.i, e);

  // 足場（各階）
  const off = 0.45 + (CFG.use === 'apartment' ? 1.6 : 0);
  const cache = {};
  for (let f = 1; f <= NF; f++) {
    const bottom = f === 1 ? 0 : yb(f), h = f === 1 ? hs[f] + BASE : hs[f];
    const g = cache[h] ||= scaffoldGeos(h, off);
    const grp = new THREE.Group();
    grp.position.y = bottom;
    addMesh(g.pipes, M.pipe, grp);
    addMesh(g.decks, M.deck, grp);
    addMesh(g.sheets, M.sheet, grp, false);
    grp.visible = false;
    grp.userData.info = { kind: 'scaffold', floor: f };
    world.add(grp);
    const e = newEl(V(0, bottom, 0));
    e.obj = grp;
    floors[f].scaffold = e;
  }

  const roofTop = yb(NF + 1) + SLAB + 1.0;
  const craneTop = buildCrane(roofTop);
  buildPour(site.items.find(i => i.type === "pump"));
  buildGrid();

  // 影・霧・カメラを現場の大きさに合わせる
  shadowS = Math.max(-F.x1, F.x2, -F.z1, F.z2, 40) + 14;
  sunDist = shadowS * 1.9;
  applyTheme();
  fitCamera(roofTop, craneTop);

  document.getElementById('summary').textContent =
    `${USES[CFG.use].label}・${NF}階建て・${+(EX * 2 - 2).toFixed(1)}m×${+(EZ * 2 - 2).toFixed(1)}m`;
  setupSlider();
}

const darkMQ = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const dark = darkMQ.matches;

  skyMat.uniforms.top.value.set(top);
  skyMat.uniforms.horizon.value.set(hor);
  skyMat.uniforms.bottom.value.set(hor);
  fog.color.set(hor);
  sun.color.set(dark ? '#ff9f62' : '#ffcf9e');

darkMQ.addEventListener('change', applyTheme);
// 太陽と影の範囲（AR では模型の縮尺 k と置いた場所 center に合わせる）
function applySun(k = arRoot.scale.x, center = arRoot.position) {
  const s = shadowS * k;
  Object.assign(sun.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: 5 * k, far: shadowS * 5 * k });
  sun.shadow.camera.updateProjectionMatrix();
  sun.shadow.normalBias = 0.03 * k;
  sun.target.position.copy(center);
  sun.position.copy(center).addScaledVector(sunDir, sunDist * k);
}

const camera = new THREE.PerspectiveCamera(35, 1, 0.5, 4000);
const controls = new OrbitControls(camera, renderer.domElement);

controls.zoomSpeed = 0.45;     // マウスのホイールで急に寄りすぎない

function fitCamera(roofTop, craneTop) {
  fitInfo = { roofTop, craneTop };
  const R = Math.max(Math.hypot(EX, EZ) * 1.6, roofTop * 1.3, 30);
  const base = R / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.05;
  const dist = base * Math.max(1, 1.15 / camera.aspect);
  controls.target.set(0, Math.min(roofTop * 0.45, 30), 0);
  camera.position.copy(controls.target).add(V(60, 22, 75).setLength(dist));
  controls.minDistance = Math.max(20, R * 0.6);
  controls.maxDistance = dist * 2.2;
  fog.near = dist * 1.05;
  fog.far = dist * 4.2;
  controls.update();
}

const _A = new THREE.Matrix4(), _T = new THREE.Matrix4(), _S = new THREE.Matrix4(), _M = new THREE.Matrix4();
function applyEl(e) {
  const s = e.cur;
  if (e.obj) { e.obj.visible = s > 0.002; e.obj.scale.y = Math.max(s, 0.001); return; }
  if (s <= 0.002) {
    for (const p of e.parts) { p.b.mesh.setMatrixAt(p.i, ZERO); p.b.dirty = true; }
    return;
  }
  const { x, y, z } = e.anchor;
  _S.makeScale(e.mode === 'xz' ? s : 1, e.mode === 'xz' ? 1 : s, e.mode === 'xz' ? s : 1);
  _A.makeTranslation(x, y, z).multiply(_S).multiply(_T.makeTranslation(-x, -y, -z));
  for (const p of e.parts) {
    p.b.mesh.setMatrixAt(p.i, _M.multiplyMatrices(_A, p.base));
    p.b.dirty = true;
  }
}
function stepElements() {
  for (const e of elements) {
    if (e.cur === e.target) continue;
    const d = e.target - e.cur;
    e.cur = Math.abs(d) < 0.004 ? e.target : e.cur + d * 0.16;
    applyEl(e);
  }
  for (const b of batches.values()) if (b.dirty) { b.mesh.instanceMatrix.needsUpdate = true; b.dirty = false; }
}
function animateMachines(t) { // 重機を少しだけ動かす
  const b = site.backhoe;
  if (b && b.g.visible) {
    b.upper.rotation.y = Math.sin(t * 0.5) * 0.6;
    b.boom.rotation.z = 0.35 + Math.sin(t * 0.9) * 0.22;
    b.arm.rotation.z = -1.75 + Math.sin(t * 0.9 + 1.2) * 0.35;
  }
  if (site.rig && site.rig.visible) site.hammer.position.y = site.hammerBase + Math.abs(Math.sin(t * 3)) * 0.5;
  if (site.pour && site.pour.visible) site.drum.rotation.x = t * 1.5; // 生コン車のドラム
}

  const all = allDates();
  rangeStart = addDays(new Date(Math.min(...all)), -7);
  totalDays = Math.round((addDays(new Date(Math.max(...all)), 10) - rangeStart) / DAY);
  slider.max = totalDays;
  document.getElementById('minLabel').textContent = fmtShort(rangeStart);
  document.getElementById('maxLabel').textContent = fmtShort(dayToDate(totalDays));
  const t = new Date();
  const idx = Math.round((new Date(t.getFullYear(), t.getMonth(), t.getDate()) - rangeStart) / DAY);
  slider.value = Math.min(totalDays, Math.max(0, idx));
  setDay(Number(slider.value));
}
// いまどの工程か
function phaseText(date, sp, pct) {
  const t = date.getTime(), all = allDates();
  if (t < Math.min(...all)) return '更地（着工前）';
  if (t > Math.max(...all)) return '竣工';
  const act = SITE_PHASES.filter(p => sp[p.key] > 0 && sp[p.key] < 1).map(p => p.label);
  for (const k of KIND_NAMES) {
    const fs = [];
    for (let f = 1; f <= NF; f++) { const v = pct(f, k); if (v > 0 && v < 100) fs.push(f); }
    if (fs.length) act.push(`${k} ${fs.length > 2 ? `${fs[0]}〜${fs[fs.length - 1]}` : fs.join('・')}階`);
  }
  return act.length ? 'いま：' + act.join(' / ') : '工程の合間';
}
function setDay(n) {
  const date = dayToDate(n);
  dateLabel.textContent = fmt(date);
  const pct = (f, k) => {
    const item = CFG.data.find(d => d.floor === f && d.kind === k);
    return item ? Math.min(100, Math.max(0, progressAt(item.progress, date))) : 0;
  };
  const sp = {};
  SITE_PHASES.forEach(p => { sp[p.key] = phaseRatio(CFG.site[p.key], date); });
  phaseLabel.textContent = phaseText(date, sp, pct);

  for (let f = 1; f <= NF; f++) {
    const fl = floors[f];
    for (const k of KIND_NAMES) {
      const list = fl[k], shown = Math.round(list.length * pct(f, k) / 100);
      list.forEach((e, i) => { e.target = i < shown ? 1 : 0; });
    }
    // 躯体だけの階：上にまだ床が無ければ柱頭から鉄筋が出る
    const covered = f < NF ? pct(f + 1, '床') > 0 : fl.roof.some(e => e.target === 1);
    const bare = pct(f, '外装') === 0 && !covered;
    fl.cols.forEach((c, i) => { fl.rebar[i].target = bare && c.target === 1 ? 1 : 0; });
    // 外装工事中の階：足場と養生シート（外装が終われば外す）
    // 通り芯は、その階の床ができたら床の上にも出す
    site.gridFloors[f].visible = pct(f, '床') > 0;
    if (f === NF) site.gridFloors[NF + 1].visible = fl.roof.some(e => e.target === 1);
    const ext = pct(f, '外装');
    fl.scaffold.target = ext > 0 && ext < 100 ? 1 : 0;
  }
  // 床（スラブ）や基礎を打っている日は生コン車とポンプ車が来る
  let pour = sp.found > 0.15 && sp.found < 0.85;
  for (let f = 1; f <= NF && !pour; f++) { const v = pct(f, "床"); if (v > 0 && v < 100) pour = true; }
  updateSite(sp, pour);
}

function updateSite(sp, pour) {
  site.pour.visible = pour;
  // 準備工事（外構工事の最初に撤去）
  const fenceGone = Math.round(site.fenceCount * clamp01(sp.ext / 0.25));
  const shownPrep = Math.round(site.prepList.length * sp.prep);
  let fi = 0;
  site.prepList.forEach((e, i) => {
    let on = i < shownPrep;
    if (e.tag === 'fence') { if (fi < fenceGone) on = false; fi++; }
    if (e.tag === 'office' && sp.ext > 0.12) on = false;
    e.target = on ? 1 : 0;
  });
  // 基礎工事：最後の15%で埋め戻し
  const nF = site.foundList.length, shownF = Math.round(nF * clamp01(sp.found / 0.85));
  site.foundList.forEach((e, i) => { e.target = i < shownF ? 1 : 0; });
  const backfill = clamp01((sp.found - 0.85) / 0.15);
  const depth = PIT * Math.min(sp.excav, 1 - backfill);
  site.pitFloor.position.y = -depth - 0.003;
  site.pitMat.color.setRGB(1, 1, 1).lerp(PIT_DEEP, depth / PIT); // 深いほど湿った暗い土
  site.walls.forEach(w => { w.visible = depth > 0.02; w.scale.y = Math.max(depth, 0.01); });
  site.hsteel.visible = sp.excav > 0 && backfill < 1;
  // 外構
  const nE = site.extList.length, shownE = Math.round(nE * clamp01((sp.ext - 0.3) / 0.7));
  site.extList.forEach((e, i) => { e.target = i < shownE ? 1 : 0; });
  // 杭：1本ずつ打ち込む（掘ったところは杭頭を切りそろえる）
  const N = site.piles.length, k = Math.min(N, Math.floor(sp.pile * N)), frac = sp.pile * N - k;
  const cut = Math.min(PIT * sp.excav, PIT - 0.3);
  site.piles.forEach((m, i) => {
    m.visible = i < k;
    m.scale.y = PILE_LEN - cut;
  });
  const rigOn = sp.pile > 0 && sp.pile < 1 && k < N;
  site.rig.visible = rigOn;
  if (rigOn) {
    const p = site.piles[k].position;
    site.rig.position.set(p.x - 2.15, 0, p.z);
    const out = (1 - frac) * 7; // 地上に出ている長さ
    site.rigPile.position.y = out - PILE_LEN;
    site.rigPile.scale.y = PILE_LEN;
    site.hammerBase = out + 1.2;
  }
  // 掘削・埋め戻し中だけ重機を出す
  const digging = (sp.excav > 0 && sp.excav < 1) || (backfill > 0 && backfill < 1);
  site.backhoe.g.visible = site.dump.visible = digging;
  // タワークレーン：組立は下から、解体は上から
  const c = site.crane;
  let mast = 0, slewOn = false;
  if (sp.crane > 0 && sp.craneOff < 1) {
    if (sp.craneOff > 0) { mast = 1 - clamp01((sp.craneOff - 0.3) / 0.7); slewOn = sp.craneOff < 0.3; }
    else { mast = clamp01(sp.crane / 0.75); slewOn = sp.crane >= 0.8; }
  }
  c.g.visible = sp.crane > 0 && sp.craneOff < 1;
  c.mast.scale.y = Math.max(mast, 0.001);
  c.slew.visible = slewOn;
}

const AI_KEY = 'hakoniwa-ai';

  : /平面|立面|断面|矩計|plan|elev/i.test(n) ? 'plan' : 'other';
const readB64 = file => new Promise((ok, ng) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(',')[1]);
  r.onerror = () => ng(r.error);

});

// AI の読み取り結果を設定（draft）に入れる。入れられなかったことを返す
function applyAi(r) {
  const notes = [];
  const b = r.building;
  if (b) {
    if (USES[b.use]) draft.use = b.use;
    let fl = Math.round(b.floors);
    if (fl > MAX_FLOORS) { notes.push(`${fl}階建てと読みましたが、箱庭は${MAX_FLOORS}階までなので${MAX_FLOORS}階で作ります`); fl = MAX_FLOORS; }
    if (fl >= 1) draft.floors = fl;
    const spans = (a, max, label) => {
      const v = (a || []).filter(x => okNum(x) && x >= 1 && x <= 30).map(m1);
      if (v.length > max) notes.push(`${label}の柱の間隔は${max}スパンまでなので、${max}スパンで作ります`);
      return v.slice(0, max);
    };
    const sx = spans(b.spansX, MAX_SPAN_X, '間口'), sz = spans(b.spansZ, MAX_SPAN_Z, '奥行');
    if (sx.length) { draft.spansX = sx; draft.spanX = sx.length; }
    if (sz.length) { draft.spansZ = sz; draft.spanZ = sz.length; }
    // 通り芯の名前（柱の数と合うときだけ使う）
    for (const [src, axis, key, label] of [[b.gridNamesX, 'x', 'gridNamesX', '間口'], [b.gridNamesZ, 'z', 'gridNamesZ', '奥行']]) {
      const v = (src || []).map(s => String(s).trim().slice(0, 8)).filter(Boolean);
      const want = spansOf(draft, axis).length + 1;
      if (v.length === want) draft[key] = v;
      else { delete draft[key]; if (v.length) notes.push(`通り芯の名前（${label}）が柱の数と合わなかったので、${defaultNames(want, axis)[0]}… の名前にしました`); }
    }
    const fh = (b.floorHeights || []).filter(x => okNum(x) && x >= 2 && x <= 12).map(m1);
    if (fh.length) draft.floorH = fh.slice(0, draft.floors); else delete draft.floorH;
  }
  if (r.layout) {
    const l = r.layout, f = l.fence || {};
    const items = (l.items || []).filter(i => ITEM_TYPES.includes(i.type) && okNum(i.x) && okNum(i.z))
      .map(i => ({ type: i.type, x: m1(i.x), z: m1(i.z), rot: okNum(i.rot) ? i.rot : 0 }));
    const lay = {
      fence: { x1: Math.min(f.x1, f.x2), x2: Math.max(f.x1, f.x2), z1: Math.min(f.z1, f.z2), z2: Math.max(f.z1, f.z2) },
      gate: { side: ['front', 'back', 'left', 'right'].includes(l.gate && l.gate.side) ? l.gate.side : 'front', pos: okNum(l.gate && l.gate.pos) ? l.gate.pos : 0, width: okNum(l.gate && l.gate.width) ? l.gate.width : 8 },
      items,
    };
    if (okLayout(lay)) draft.layout = lay; else notes.push('配置図の仮囲いの範囲が読み取れなかったので、配置は自動にします');
  }
  const s = r.schedule;
  if (s) {
    const fromAi = new Map(); // "階|工種" → 工程
    for (const it of s.floors || []) {
      if (!(it.floor >= 1 && it.floor <= draft.floors && KIND_NAMES.includes(it.kind) && validIso(it.start) && validIso(it.end))) continue;
      const [a, z] = [it.start, it.end].sort();
      fromAi.set(`${it.floor}|${it.kind}`, { floor: it.floor, kind: it.kind, progress: [[a, 0], [z, 100]] });
    }
    const floorsSet = fromAi.size;
    draft.data = [...fromAi.values()];
    // 工程表に無い階はかんたん設定で埋め、無い現場全体の工程は1階の床の前後に入れる
    const got = {};
    SITE_PHASES.forEach(p => { const v = s.site && s.site[p.key]; if (v && validIso(v.start) && validIso(v.end)) got[p.key] = [v.start, v.end].sort(); });
    if (got.prep) draft.auto.start = got.prep[0];
    else if (floorsSet) {
      const f1 = draft.data.find(x => x.floor === 1 && x.kind === '床');
      if (f1) {
        const trial = genAll(1, draft.auto).site;
        draft.auto.start = iso(addDays(parseDate(draft.auto.start), Math.round((parseDate(f1.progress[0][0]) - floorBase(trial)) / DAY)));
      }
    }
    const gen = genAll(draft.floors, draft.auto);
    for (let f = 1; f <= draft.floors; f++) for (const k of KIND_NAMES)
      if (!fromAi.has(`${f}|${k}`)) draft.data.push(gen.data.find(x => x.floor === f && x.kind === k));
    draft.site = { ...gen.site };
    finishSite(draft.site, draft.data, draft.floors, draft.auto.site);
    Object.assign(draft.site, got);
    const miss = SITE_PHASES.filter(p => !got[p.key]).map(p => p.label);
    if (miss.length) notes.push(`工程表に無かったので自動で入れた工程：${miss.join('・')}`);
    if (!floorsSet) notes.push('各階の工程が読み取れなかったので、かんたん設定の日数で入れました');
  } else {
    syncFloors();
  }
  return notes;
}

});
