<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>画像QR作成</title>
<script src="lock.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #f3f5f8; --card: #fff; --text: #222; --sub: #666; --line: #ccd;
    --field: #fff; --err: #c62828; --ok: #2e7d32; --shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --card: #1e2227; --text: #eaeaea; --sub: #aaa; --line: #3a3f46;
      --field: #15181c; --err: #ef7a6e; --ok: #5fc97c; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; font-size: 16px;
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--bg); color: var(--text);
  }
  .wrap { max-width: 600px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 4px 0 16px; }
  .card {
    background: var(--card); border-radius: 12px; padding: 16px;
    box-shadow: var(--shadow); margin-bottom: 16px;
  }
  label { display: block; font-weight: bold; margin: 0 0 8px; }
  input[type=password] {
    width: 100%; font-size: 16px; padding: 12px;
    border: 1px solid var(--line); border-radius: 8px; font-family: inherit;
    background: var(--field); color: var(--text);
  }
  .hint { font-size: 16px; color: var(--sub); margin-top: 8px; line-height: 1.6; }
  .msg { font-size: 16px; margin-top: 10px; min-height: 1.5em; line-height: 1.6; }
  .msg.err { color: var(--err); }
  .msg.ok { color: var(--ok); }

  .pick {
    display: block; text-align: center; font-size: 18px; font-weight: bold;
    padding: 18px; border: 2px dashed var(--line); border-radius: 12px; cursor: pointer;
  }
  .pick input { display: none; }
  .pick.drag { border-color: #1565c0; background: rgba(21, 101, 192, .12); }
  #preview { display: none; width: 100%; max-height: 360px; object-fit: contain; margin-top: 12px; border-radius: 8px; background: var(--bg); }
  #fileInfo { font-size: 16px; color: var(--sub); margin-top: 8px; word-break: break-all; }

  button.act {
    width: 100%; font-size: 18px; font-weight: bold; min-height: 56px;
    padding: 14px; border: none; border-radius: 12px; cursor: pointer;
    background: #1565c0; color: #fff; font-family: inherit; margin-top: 12px;
  }
  button.act.sub { background: #455a64; }
  button.act:disabled { opacity: .4; cursor: default; }

  #result { display: none; text-align: center; }
  #qrImg { width: 100%; max-width: 320px; background: #fff; border-radius: 8px; }
  #url { font-size: 16px; color: var(--sub); word-break: break-all; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>画像QR作成</h1>

  <div class="card">
    <label for="pass">合言葉</label>
    <input id="pass" type="password" autocomplete="off">
    <div class="hint">はじめの1回だけ。この端末に残ります</div>
  </div>

  <div class="card">
    <label id="pick" class="pick">📷 画像を選ぶ・撮る(ドラッグでもOK)
      <input id="file" type="file" accept="image/*">
    </label>
    <img id="preview" alt="選んだ画像">
    <div id="fileInfo"></div>
    <button id="btnUp" class="act" disabled>アップロードしてQRを作る</button>
    <div id="msg" class="msg"></div>
    <div class="hint">QRを読み取った人は、誰でもこの画像を見られます。外に出したくない写真には使わないでください。</div>
  </div>

  <div id="result" class="card">
    <img id="qrImg" alt="画像を開くQRコード">
    <div id="url"></div>
    <button id="btnSave" class="act sub">QRを画像で保存</button>
  </div>
</div>

<script>
// 画像QRのGAS。合言葉が無いと動かないので、URLは公開してよい
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyZvGfuGwwgUkDNKv4yPdu3qZE6ALbWxwCwXl54am5uV9OVjTXEKRhuMFgxyKCDHQLt/exec';
const PASS_KEY = 'gazoQrPass';
const MAX_SIDE = 2000;   // 送る前に長い辺をここまで縮める

const $ = id => document.getElementById(id);
let picked = null;   // { name, data(base64 JPEG) }

try { $('pass').value = localStorage.getItem(PASS_KEY) || ''; } catch (e) { /* 使えなくてもOK */ }

function setMsg(text, cls) {
  $('msg').textContent = text;
  $('msg').className = 'msg' + (cls ? ' ' + cls : '');
}

// 長い辺を MAX_SIDE までに縮めて JPEG にする(透明な部分は白にする)
function shrink(file) {
  return new Promise((ok, ng) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const r = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * r);
      c.height = Math.round(img.naturalHeight * r);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); ng(new Error('この画像は読み込めませんでした')); };
    img.src = url;
  });
}

$('file').addEventListener('change', e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (f) pickFile(f);
});

// 枠に画像をドラッグして入れる。枠の外に落としてもブラウザが画像を開かないようにする
['dragover', 'drop'].forEach(t => window.addEventListener(t, e => e.preventDefault()));
$('pick').addEventListener('dragover', () => $('pick').classList.add('drag'));
$('pick').addEventListener('dragleave', () => $('pick').classList.remove('drag'));
$('pick').addEventListener('drop', e => {
  $('pick').classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (!f) return;
  if (!/^image\//.test(f.type)) return setMsg('画像ファイルを入れてください', 'err');
  pickFile(f);
});

async function pickFile(f) {
  picked = null;
  $('btnUp').disabled = true;
  $('result').style.display = 'none';
  setMsg('');
  try {
    const dataUrl = await shrink(f);
    const base = f.name.replace(/\.[^.]*$/, '') || 'image';
    picked = { name: base + '.jpg', data: dataUrl.split(',')[1] };
    $('preview').src = dataUrl;
    $('preview').style.display = 'block';
    $('fileInfo').textContent = f.name;
    $('btnUp').disabled = false;
  } catch (err) {
    $('preview').style.display = 'none';
    $('fileInfo').textContent = '';
    setMsg(err.message, 'err');
  }
}

function makeQR(text) {
  const div = document.createElement('div');
  new QRCode(div, {
    text, width: 800, height: 800,
    colorDark: '#000000', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
  // 周りに白い余白をつける(読み取りやすくするため)
  const qr = div.querySelector('canvas');
  const m = 80;
  const c = document.createElement('canvas');
  c.width = c.height = qr.width + m * 2;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(qr, m, m);
  return c.toDataURL('image/png');
}

$('btnUp').addEventListener('click', async () => {
  const pass = $('pass').value.trim();
  if (!picked) return;
  if (!GAS_URL) return setMsg('GASのURLがまだ設定されていません', 'err');
  if (!pass) return setMsg('合言葉を入れてください', 'err');
  try { localStorage.setItem(PASS_KEY, pass); } catch (e) { /* 使えなくてもOK */ }

  const btn = $('btnUp');
  btn.disabled = true;
  btn.textContent = 'アップロード中…';
  setMsg('');
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'upload', passcode: pass, name: picked.name, data: picked.data }),
    });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'アップロードに失敗しました');
    $('qrImg').src = makeQR(j.url);
    $('url').textContent = j.url;
    $('result').style.display = 'block';
    $('result').scrollIntoView({ behavior: 'smooth' });
    setMsg('QRを作りました', 'ok');
  } catch (err) {
    setMsg('アップロードできませんでした:' + (err.message || err), 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'アップロードしてQRを作る';
  }
});

$('btnSave').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = $('qrImg').src;
  a.download = 'qr_' + (picked ? picked.name.replace(/\.jpg$/, '') : 'image') + '.png';
  document.body.appendChild(a);
  a.click();
  a.remove();
});
</script>
</body>
</html>
