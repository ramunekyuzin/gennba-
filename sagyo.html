<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>作業依頼表</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #f5f6f8; --card: #fff; --text: #222; --sub: #666; --line: #ddd;
      --primary: #1e5aa8; --danger: #c0392b; --ok: #1a8a3c; --late: #fdecea; --chip: #eef3fb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121417; --card: #1e2227; --text: #eaeaea; --sub: #aaa; --line: #3a3f46;
        --primary: #4a8be0; --danger: #e5695c; --ok: #4fc26f; --late: #4a2622; --chip: #2a3442;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg); color: var(--text);
      padding: 14px; max-width: 640px; margin: 0 auto;
    }
    h1 { font-size: 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    h1 small { font-size: 13px; color: var(--sub); font-weight: normal; }
    .card {
      background: var(--card); border-radius: 12px; padding: 14px;
      margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.12);
    }
    label { display: block; font-size: 13px; margin-bottom: 4px; color: var(--sub); }
    input, select, textarea {
      width: 100%; padding: 12px; font-size: 16px;
      border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px;
      background: var(--card); color: var(--text);
    }
    input[type=checkbox] { width: auto; padding: 0; margin: 0 6px 0 0; transform: scale(1.3); vertical-align: middle; }
    input[type=file] { padding: 8px; font-size: 14px; }
    .inline { display: flex; align-items: center; gap: 4px; font-size: 15px; margin-bottom: 10px; color: var(--text); }
    button {
      padding: 14px; font-size: 16px; font-weight: bold; width: 100%;
      border: none; border-radius: 10px; background: var(--primary); color: #fff;
    }
    button:active { opacity: .8; }
    button:disabled { background: #888; }
    button.sub { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
    button.danger { background: var(--danger); }
    button.small { width: auto; padding: 8px 12px; font-size: 14px; font-weight: normal; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
    .toolbar select { margin-bottom: 0; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .chip {
      padding: 8px 12px; border-radius: 20px; background: var(--chip); color: var(--text);
      font-size: 14px; border: 1px solid transparent; width: auto; font-weight: normal;
    }
    .chip.on { border-color: var(--primary); color: var(--primary); font-weight: bold; }
    .item {
      background: var(--card); border-radius: 10px; padding: 12px; margin-bottom: 8px;
      border-left: 5px solid var(--primary); box-shadow: 0 1px 3px rgba(0,0,0,.1);
    }
    .item.done { opacity: .5; border-left-color: var(--ok); }
    .item.late { border-left-color: var(--danger); background: var(--late); }
    .item.tbd { border-left-color: var(--sub); }
    .item .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .item .date { font-weight: bold; font-size: 15px; }
    .item .gyosha { font-size: 13px; color: var(--sub); background: var(--chip); padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
    .item .work { font-size: 17px; margin: 6px 0 2px; }
    .item .memo { font-size: 13px; color: var(--sub); white-space: pre-wrap; }
    .item .acts { display: flex; gap: 6px; margin-top: 8px; }
    .item .acts button { width: auto; padding: 8px 12px; font-size: 14px; font-weight: normal; }
    .files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .files a {
      display: inline-block; padding: 6px 10px; border-radius: 8px; background: var(--chip);
      color: var(--primary); font-size: 14px; text-decoration: none; max-width: 100%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .filelist { margin-bottom: 10px; }
    .filelist .frow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    .filelist .frow span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .filelist .frow button { width: auto; padding: 6px 10px; font-size: 13px; font-weight: normal; }
    #status { text-align: center; font-size: 14px; margin: 8px 0; min-height: 20px; color: var(--sub); }
    .ok { color: var(--ok) !important; } .ng { color: var(--danger) !important; }
    .qrbox { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .qrbox:last-child { border-bottom: none; }
    .qrbox .qr { background: #fff; padding: 6px; border-radius: 6px; }
    .qrbox .info { flex: 1; }
    .qrbox .info b { font-size: 17px; display: block; margin-bottom: 4px; }
    .qrbox .info small { color: var(--sub); font-size: 12px; word-break: break-all; }
    .empty { text-align: center; color: var(--sub); padding: 30px 0; }
    .hidden { display: none !important; }

    /* 印刷用 */
    #printArea { display: none; }
    @media print {
      body { background: #fff; color: #000; padding: 0; max-width: none; }
      body > *:not(#printArea) { display: none !important; }
      #printArea { display: block; }
      .psheet { page-break-after: always; padding: 10mm; }
      .psheet:last-child { page-break-after: auto; }
      .psheet h2 { font-size: 20px; margin-bottom: 4px; }
      .psheet .pmeta { font-size: 12px; color: #444; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-start; }
      .psheet table { width: 100%; border-collapse: collapse; font-size: 13px; }
      .psheet th, .psheet td { border: 1px solid #333; padding: 6px 8px; text-align: left; vertical-align: top; }
      .psheet th { background: #eee; }
      .psheet .pqr { background: #fff; }
      .psheet .pfile { font-size: 11px; color: #333; }
    }

    /* 作業依頼表 / refreshed interface */

    .brand{display:flex;gap:15px;align-items:center;min-width:0}.brand-icon{flex:0 0 46px;height:46px;border-radius:12px;background:#ffffff0e;border:1px solid #ffffff22;display:grid;place-items:center;color:#adc8ff}.brand-icon svg{width:25px;height:25px}.eyebrow{font-size:10px;color:#acc0e0;letter-spacing:.17em;font-weight:700;margin-bottom:2px}h1{font-size:24px;line-height:1.4;margin:0;overflow-wrap:anywhere}.header-caption{font-size:12px;color:#b5c5dc;margin-top:5px}.header-side{text-align:right;flex-shrink:0}#mode{font-size:11px;display:inline-block;border:1px solid #ffffff27;border-radius:99px;padding:4px 12px;color:#d5e3ff}#todayLabel{display:block;color:#bccce3;font-size:12px;margin-top:8px}
    .overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px 20px;box-shadow:var(--shadow)}.stat-name{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:var(--primary)}.stat.overdue .dot{background:var(--danger)}.stat.today .dot{background:#c18a2c}.stat.complete .dot{background:var(--ok)}.stat strong{font-size:30px;letter-spacing:-.04em;line-height:1.5;font-variant-numeric:tabular-nums}.stat small{font-size:11px;color:var(--sub);margin-left:7px}.stat.overdue strong{color:var(--danger)}

    label{font-size:12px;font-weight:650;color:var(--sub);margin-bottom:6px}input,select,textarea{border-color:var(--line);background:var(--soft);border-radius:9px;padding:11px 12px;margin-bottom:16px;min-width:0;font-size:14px;line-height:1.6}input:focus,select:focus,textarea:focus{outline:2px solid var(--ring);outline-offset:1px;background:var(--card)}textarea{resize:vertical;min-height:86px}.row2{gap:12px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.inline{font-size:12px;font-weight:400}input[type=checkbox]{accent-color:var(--primary);transform:none;width:16px;height:16px;margin-right:5px}input:disabled{opacity:.55}input[type=file]{border:1px dashed var(--line);padding:12px;font-size:11px}input::file-selector-button{border:0;border-radius:5px;padding:7px 9px;background:var(--chip);color:var(--primary);margin-right:8px;cursor:pointer}.required{font-size:10px;color:var(--primary);margin-left:6px;background:var(--chip);padding:2px 5px;border-radius:4px}

@media(max-width:760px){body{padding:12px}.app-header{padding:18px;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:14px}h1{font-size:25px}.header-caption{font-size:14px}.header-side{text-align:left;display:flex;gap:12px;align-items:center;flex-wrap:wrap}#todayLabel{margin:0}.overview{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:12px 14px}.stat-name{font-size:14px}.stat strong{font-size:28px}.workspace{grid-template-columns:minmax(0,1fr);gap:18px}.list-column{grid-row:1}.editor-column{grid-row:2}.list-heading h2{font-size:22px}.card,.filter-panel{padding:18px}.item{padding:18px 16px}.item .work{font-size:21px}.item .date{font-size:16px}.item .gyosha{font-size:16px}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.toolbar .small{grid-column:1/-1;width:100%}.toolbar select{font-size:16px;width:100%}.chip{font-size:14px}.jump-nav{position:static;gap:8px}.jump-nav a{flex:1;white-space:nowrap;padding:10px 12px}.item .acts button{font-size:14px;padding:10px 12px}.item .acts button:last-child{margin-left:auto}.header-side #mode{font-size:13px}.list-heading{align-items:flex-start}#status{top:6px}#formCard>.row2:first-of-type{grid-template-columns:1fr}}
}

  </style>
</head>
<body>
  <header class="app-header"><div class="brand"><div class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="4" width="14" height="17" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><path d="m8 11 1.5 1.5L12 10m1 2h3m-8 5h8"/></svg></div><div><div class="eyebrow">WORK REQUEST</div><h1 id="title">作業依頼表</h1><p class="header-caption">期限・作業内容・資料を、ひとつの画面で。</p></div></div><div class="header-side"><span id="mode">管理モード</span><span id="todayLabel"></span></div></header>
  <p style="font-size:14px;color:var(--sub);margin:0 0 10px">選択中の業者の全件数（検索・完了表示の条件は含みません）</p>
  <section class="overview" aria-label="選択中の業者の全作業件数。検索条件と完了表示の切り替えには連動しません。">
    <div class="stat"><div class="stat-name"><i class="dot"></i>未完了</div><strong id="statOpen">—</strong><small>件</small></div>
    <div class="stat overdue"><div class="stat-name"><i class="dot"></i>期限超過</div><strong id="statLate">—</strong><small>件</small></div>
    <div class="stat today"><div class="stat-name"><i class="dot"></i>本日期限</div><strong id="statToday">—</strong><small>件</small></div>
    <div class="stat complete"><div class="stat-name"><i class="dot"></i>完了</div><strong id="statDone">—</strong><small>件</small></div>
  </section>
  <div id="status" role="status" aria-live="polite"></div>
  <main class="workspace" id="workspace"><aside class="editor-column" id="editorColumn">

  <!-- ===== 登録フォーム(管理側のみ) ===== -->
  <div class="card" id="formCard"><h2 class="section-title"><span class="index" aria-hidden="true">＋</span><span id="formTitle">作業を登録</span></h2><p class="section-help">業者と作業内容を入力して、依頼を追加。</p>
    <div class="row2">
      <div>
        <label for="f_date">作業期限</label>
        <input type="date" id="f_date">
        <label class="inline"><input type="checkbox" id="f_tbd" onchange="toggleTbd()">未定</label>
      </div>
      <div>
        <label for="f_gyosha">業者<span class="required">必須</span></label>
        <input id="f_gyosha" list="gyoshaList" placeholder="例: ○○電気">
        <datalist id="gyoshaList"></datalist>
      </div>
    </div>
    <label for="f_work">作業内容<span class="required">必須</span></label>
    <input id="f_work" placeholder="例: 3F 配線立上げ">
    <label for="f_memo">備考 <span style="font-weight:400">任意</span></label>
    <textarea id="f_memo" rows="2" placeholder="場所・注意点など"></textarea>

    <label for="f_files">添付資料 <span style="font-weight:400">任意</span></label><p class="attachment-help">PDF・Excel・画像など、1ファイル40MBまで。何回でも追加できます。</p>
    <div class="filelist" id="fileList"></div>
    <div class="filelist" id="pendingList"></div>
    <input type="file" id="f_files" multiple
      accept=".pdf,.xlsx,.xls,.xlsm,.csv,.docx,.doc,.pptx,.jpg,.jpeg,.png,.heic,application/pdf,image/*"
      onchange="addPending()">

    <input type="hidden" id="f_id">
    <div class="row2 form-actions">
      <button id="submitBtn" onclick="submitData()">登録する</button>
      <button class="sub" id="cancelBtn" onclick="resetForm()">クリア</button>
    </div>
  </div>

  <!-- ===== 業者別QR / 印刷(管理側のみ) ===== -->
  <div class="card" id="qrCard"><h2 class="section-title">共有・印刷</h2><p class="section-help">業者ごとの閲覧用QRと依頼表を作成。</p>
    <div class="row2" style="margin-bottom:10px;">
      <button class="sub" onclick="toggleQR()">業者別QRを表示</button>
      <button class="sub" onclick="printAll()">業者別に印刷</button>
    </div>
    <div id="qrArea" class="hidden"></div>
  </div>

  </aside><section class="list-column" id="listSection" aria-label="作業一覧"><div class="list-heading"><div><h2>作業一覧</h2><p>期限・作業内容・業者を確認</p></div><span id="resultCount" aria-live="polite">— 件</span></div>
  <div class="filter-panel"><div class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input type="search" id="searchInput" placeholder="作業内容・業者・備考を検索" aria-label="作業を検索" oninput="render()"></div>
  <!-- ===== 一覧操作 ===== -->
  <div class="toolbar">
    <div><label for="sortKey">並び順</label><select id="sortKey" onchange="render()">
      <option value="date">期限順</option>
      <option value="work">作業内容順</option>
      <option value="gyosha">業者順</option>
    </select>
    </div><div><label for="showDone">表示する作業</label><select id="showDone" onchange="render()">
      <option value="open">未完了のみ</option>
      <option value="all">完了も表示</option>
    </select>
    </div><button class="small" id="reloadBtn" onclick="load()">更新</button>
  </div>
  <p class="filter-caption" id="contractorCaption">業者で絞り込み</p><div class="chips" id="chips" aria-label="業者の絞り込み"></div></div>
  <div id="list"></div>

  </section></main><p class="footer-note">業者ごとの進捗を確認して、スムーズな作業へ。</p>

  <div id="printArea"></div>

  <script>
    // ============================================
    // 設定: GASのWebアプリURL
    // ============================================
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbyrg6I7W1EwnK3DdtGcjoVlIYBXOqBdAVBtLpvRORFp6NrW-C0CEaeiGGAeuZXEqev7XQ/exec';
    const MAX_FILE_MB = 40;          // 1ファイルの上限
    const CHUNK_SIZE = 1.5 * 1024 * 1024; // 分割アップロードの1回分(binary bytes)
    let pendingFiles = [];           // 送信待ちファイル(何回でも追加できる)

    const params = new URLSearchParams(location.search);
    const VIEW_GYOSHA = params.get('gyosha') || '';   // ?gyosha=○○ なら業者閲覧モード
    let rows = [];
    let filterGyosha = '';

    // ---------- 通信 ----------
    function api(payload) {
      if (!GAS_URL) return Promise.reject('GAS_URLが未設定');
      return fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload) })
        .then(r => r.json())
        .then(res => { if (!res.ok) throw res.error; return res.result; });
    }
    function setStatus(msg, cls) {
      const el = document.getElementById('status');
      el.textContent = msg; el.className = cls || '';
    }

    // ---------- 読み込み ----------
    function load() {
      setStatus('読み込み中...');
      return api({ action: 'list' }).then(r => {
        rows = r;
        buildGyosha();
        render();
        setStatus('');
      }).catch(e => setStatus('エラー: ' + e, 'ng'));
    }

    function gyoshaNames() {
      return [...new Set(rows.map(r => r['業者']).filter(Boolean))].sort();
    }

    function buildGyosha() {
      const names = gyoshaNames();
      document.getElementById('gyoshaList').innerHTML = names.map(n => `<option value="${esc(n)}">`).join('');
      if (VIEW_GYOSHA) return;
      const chips = document.getElementById('chips');
      chips.innerHTML = `<button class="chip ${filterGyosha===''?'on':''}" onclick="setFilter('')">全業者</button>` +
        names.map(n => `<button class="chip ${filterGyosha===n?'on':''}" onclick="setFilter(${esc(JSON.stringify(n))})">${esc(n)}</button>`).join('');
    }
    function setFilter(n) { filterGyosha = n; buildGyosha(); render(); }

    // ---------- 一覧描画 ----------
    function isDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s || ''); }
    function dateKey(s) { return isDate(s) ? s : (s === '未定' ? '9998' : '9999'); } // 未定は末尾

    function getFiltered() {
      const sortKey = document.getElementById('sortKey').value;
      const showDone = document.getElementById('showDone').value;
      const g = VIEW_GYOSHA || filterGyosha;
      let list = rows.filter(r => !g || r['業者'] === g);
      const query = document.getElementById('searchInput').value.trim().toLocaleLowerCase();
      if(query) list = list.filter(r => ['作業内容','業者','備考'].some(k => String(r[k] || '').toLocaleLowerCase().includes(query)));
      if (showDone === 'open') list = list.filter(r => !r['完了']);
      list.sort((a, b) => {
        if (sortKey === 'date')   return dateKey(a['期限']).localeCompare(dateKey(b['期限']));
        if (sortKey === 'work')   return String(a['作業内容']).localeCompare(String(b['作業内容']), 'ja');
        if (sortKey === 'gyosha') return String(a['業者']).localeCompare(String(b['業者']), 'ja') || dateKey(a['期限']).localeCompare(dateKey(b['期限']));
        return 0;
      });
      return list;
    }

    function filesHtml(files) {
      if (!files || !files.length) return '';
      return `<div class="files">${files.map(f => `<a href="${esc(f.url)}" target="_blank" rel="noopener">📎 ${esc(f.name)}</a>`).join('')}</div>`;
    }

    function render() {
      const list = getFiltered();
      const today = todayStr();
      updateOverview(today);
      document.getElementById('resultCount').textContent = list.length + ' 件';
      const el = document.getElementById('list');
      if (!list.length) { el.innerHTML = '<div class="empty"><b>表示する作業はありません</b><small>絞り込み条件を変更するか、作業を登録してください。</small></div>'; return; }
      el.innerHTML = list.map(r => {
        const tbd = r['期限'] === '未定';
        const late = !r['完了'] && isDate(r['期限']) && r['期限'] < today;
        const acts = VIEW_GYOSHA ? '' : `
          <div class="acts">
            <button class="${r['完了'] ? 'sub' : ''}" onclick="toggle('${r['ID']}')">${r['完了'] ? '未完了に戻す' : '完了にする'}</button>
            <button class="sub" onclick="edit('${r['ID']}')">編集</button>
            <button class="danger" onclick="del('${r['ID']}')">削除</button>
          </div>`;
        return `<div class="item ${r['完了']?'done':''} ${late?'late':''} ${tbd?'tbd':''}">
          <div class="top">
            <span class="date">期限：${esc(isDate(r['期限']) ? r['期限'].slice(0,4)+'年 '+labelDate(r['期限']) : labelDate(r['期限']))}<span class="badge ${r['完了']?'done':late?'late':tbd?'tbd':''}">${r['完了']?'完了':late?'期限超過':tbd?'期限未定':r['期限']===today?'本日期限':'未完了'}</span></span>
            <span class="gyosha">${esc(r['業者'])}</span>
          </div>
          <div class="work">${esc(r['作業内容'])}</div>
          ${r['備考'] ? `<div class="memo"><span class="memo-caption">備考</span>${esc(r['備考'])}</div>` : ''}
          ${filesHtml(r['添付'])}
          ${acts}
        </div>`;
      }).join('');
    }

    // ---------- 登録/編集 ----------
    function toggleTbd() {
      const on = document.getElementById('f_tbd').checked;
      const d = document.getElementById('f_date');
      d.disabled = on; if (on) d.value = '';
    }

    // ---------- 添付キュー ----------
    function addPending() {
      const inp = document.getElementById('f_files');
      Array.from(inp.files).forEach(f => {
        if (f.size > MAX_FILE_MB * 1024 * 1024) { setStatus(`${f.name} は${MAX_FILE_MB}MB超えなので追加できない`, 'ng'); return; }
        if (!pendingFiles.some(p => p.name === f.name && p.size === f.size)) pendingFiles.push(f);
      });
      inp.value = '';   // 同じファイルをまた選べるようにリセット
      renderPending();
    }
    function removePending(i) { pendingFiles.splice(i, 1); renderPending(); }
    function renderPending() {
      const el = document.getElementById('pendingList');
      el.innerHTML = pendingFiles.map((f, i) => `
        <div class="frow">
          <span>🆕 ${esc(f.name)} <small style="color:var(--sub)">(${(f.size/1024/1024).toFixed(1)}MB)</small></span>
          <button class="sub" onclick="removePending(${i})">外す</button>
        </div>`).join('');
    }

    function readFileB64(file) {
      return new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => res(fr.result.split(',')[1]);
        fr.onerror = () => rej('読込失敗: ' + file.name);
        fr.readAsDataURL(file);
      });
    }

    // 分割アップロード: base64を4の倍数で切って送る
    async function uploadOne(id, f, label) {
      const b64 = await readFileB64(f);
      const chunkChars = Math.floor(CHUNK_SIZE * 4 / 3 / 4) * 4;
      const count = Math.ceil(b64.length / chunkChars);
      const { tmpId } = await api({ action: 'attachStart', name: f.name });
      for (let i = 0; i < count; i++) {
        setStatus(`${label} ${f.name} 送信中 ${Math.round((i / count) * 100)}%`);
        await api({ action: 'attachChunk', tmpId: tmpId, index: i, data: b64.slice(i * chunkChars, (i + 1) * chunkChars) });
      }
      setStatus(`${label} ${f.name} 保存中...`);
      await api({ action: 'attachFinish', id: id, tmpId: tmpId, count: count, name: f.name, mime: f.type || 'application/octet-stream' });
    }

    async function uploadFiles(id, files) {
      for (let i = 0; i < files.length; i++) {
        await uploadOne(id, files[i], `(${i+1}/${files.length})`);
      }
    }

    async function submitData() {
      const tbd = document.getElementById('f_tbd').checked;
      const data = {
        '期限': tbd ? '未定' : document.getElementById('f_date').value,
        '作業内容': document.getElementById('f_work').value.trim(),
        '業者': document.getElementById('f_gyosha').value.trim(),
        '備考': document.getElementById('f_memo').value.trim(),
      };
      if (!data['作業内容']) { setStatus('作業内容を入れてね', 'ng'); return; }
      if (!data['業者']) { setStatus('業者を入れてね', 'ng'); return; }
      const isEdit = !!document.getElementById('f_id').value;
      let id = document.getElementById('f_id').value;
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; setStatus('送信中...');
      try {
        if (isEdit) {
          await api({ action: 'update', id: id, data: data });
        } else {
          const r = await api({ action: 'add', data: data });
          id = r.id;
        }
        if (pendingFiles.length) await uploadFiles(id, pendingFiles);
        resetForm();
        await load();
        setStatus(isEdit ? '更新したよ' : '登録したよ', 'ok');
      } catch (e) {
        setStatus('エラー: ' + e, 'ng');
      }
      btn.disabled = false;
    }

    function resetForm() {
      ['f_date','f_work','f_gyosha','f_memo','f_id','f_files'].forEach(i => document.getElementById(i).value = '');
      document.getElementById('f_tbd').checked = false;
      document.getElementById('f_date').disabled = false;
      document.getElementById('fileList').innerHTML = '';
      pendingFiles = []; renderPending();
      document.getElementById('submitBtn').textContent = '登録する';
      document.getElementById('formTitle').textContent = '作業を登録';
    }

    function renderFileList(id, files) {
      const el = document.getElementById('fileList');
      if (!files || !files.length) { el.innerHTML = ''; return; }
      el.innerHTML = files.map((f, i) => `
        <div class="frow">
          <span>📎 <a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.name)}</a></span>
          <button class="danger" onclick="detach('${id}', ${i})">削除</button>
        </div>`).join('');
    }

    function edit(id) {
      const r = rows.find(x => x['ID'] === id); if (!r) return;
      document.getElementById('f_id').value = id;
      const tbd = r['期限'] === '未定';
      document.getElementById('f_tbd').checked = tbd;
      document.getElementById('f_date').disabled = tbd;
      document.getElementById('f_date').value = isDate(r['期限']) ? r['期限'] : '';
      document.getElementById('f_work').value = r['作業内容'];
      document.getElementById('f_gyosha').value = r['業者'];
      document.getElementById('f_memo').value = r['備考'];
      document.getElementById('f_files').value = '';
      pendingFiles = []; renderPending();
      renderFileList(id, r['添付']);
      document.getElementById('submitBtn').textContent = '更新する';
      document.getElementById('formTitle').textContent = '作業を編集';
      document.getElementById('formCard').scrollIntoView({behavior:'auto',block:'start'});
      document.getElementById('f_work').focus({preventScroll:true});
    }

    function detach(id, index) {
      if (!confirm('この添付を削除する?')) return;
      setStatus('削除中...');
      api({ action: 'detach', id: id, index: index }).then(res => {
        renderFileList(id, res.files);
        const r = rows.find(x => x['ID'] === id); if (r) r['添付'] = res.files;
        render(); setStatus('削除したよ', 'ok');
      }).catch(e => setStatus('エラー: ' + e, 'ng'));
    }

    function toggle(id) {
      setStatus('更新中...');
      api({ action: 'toggle', id: id }).then(load).catch(e => setStatus('エラー: ' + e, 'ng'));
    }
    function del(id) {
      if (!confirm('削除する?(添付も消えます)')) return;
      api({ action: 'delete', id: id }).then(load).catch(e => setStatus('エラー: ' + e, 'ng'));
    }

    // ---------- 業者別QR ----------
    function gyoshaUrl(name) {
      const u = new URL(location.href);
      u.search = '?gyosha=' + encodeURIComponent(name);
      return u.toString();
    }
    function toggleQR() {
      const area = document.getElementById('qrArea');
      if (!area.classList.contains('hidden')) { area.classList.add('hidden'); return; }
      area.classList.remove('hidden');
      area.innerHTML = '';
      const names = gyoshaNames();
      if (!names.length) { area.innerHTML = '<div class="empty">業者がまだないよ</div>'; return; }
      names.forEach(n => {
        const box = document.createElement('div'); box.className = 'qrbox';
        const qr = document.createElement('div'); qr.className = 'qr';
        const info = document.createElement('div'); info.className = 'info';
        const url = gyoshaUrl(n);
        info.innerHTML = `<b>${esc(n)}</b><small>${esc(url)}</small>
          <div style="margin-top:6px;"><button class="small sub" onclick="printOne(${esc(JSON.stringify(n))})">この業者だけ印刷</button></div>`;
        box.appendChild(qr); box.appendChild(info); area.appendChild(box);
        new QRCode(qr, { text: url, width: 110, height: 110 });
      });
    }

    // ---------- 印刷 ----------
    function buildSheet(name) {
      const today = todayStr();
      const list = rows.filter(r => r['業者'] === name && !r['完了'])
        .sort((a, b) => dateKey(a['期限']).localeCompare(dateKey(b['期限'])));
      const sheet = document.createElement('div'); sheet.className = 'psheet';
      sheet.innerHTML = `
        <h2>作業依頼表 — ${esc(name)} 様</h2>
        <div class="pmeta">
          <div>発行日: ${fmtJp(today)}<br>下記の作業を期限までにお願いします。<br>最新の内容・添付資料(PDF等)はQRから確認できます。</div>
          <div class="pqr"></div>
        </div>
        <table>
          <thead><tr><th style="width:20%">期限</th><th>作業内容</th><th style="width:30%">備考</th></tr></thead>
          <tbody>${list.length ? list.map(r => `<tr>
              <td>${labelDate(r['期限'])}</td>
              <td>${esc(r['作業内容'])}${r['添付'] && r['添付'].length ? `<div class="pfile">添付: ${r['添付'].map(f => esc(f.name)).join(' / ')}</div>` : ''}</td>
              <td>${esc(r['備考'])}</td></tr>`).join('')
            : '<tr><td colspan="3">未完了の作業はありません</td></tr>'}</tbody>
        </table>`;
      new QRCode(sheet.querySelector('.pqr'), { text: gyoshaUrl(name), width: 90, height: 90 });
      return sheet;
    }
    function printOne(name) {
      const area = document.getElementById('printArea');
      area.innerHTML = ''; area.appendChild(buildSheet(name));
      setTimeout(() => window.print(), 300);
    }
    function printAll() {
      const names = gyoshaNames();
      if (!names.length) { setStatus('業者がまだないよ', 'ng'); return; }
      const area = document.getElementById('printArea');
      area.innerHTML = '';
      names.forEach(n => area.appendChild(buildSheet(n)));
      setTimeout(() => window.print(), 300);
    }

    // ---------- 共通 ----------
    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
    function fmtJp(s) {
      if (!isDate(s)) return s || '';
      const [y, m, d] = s.split('-');
      const w = ['日','月','火','水','木','金','土'][new Date(+y, +m-1, +d).getDay()];
      return `${+m}/${+d}(${w})`;
    }
    function labelDate(s) {
      if (s === '未定') return '未定';
      if (!s) return '期限なし';
      return fmtJp(s);
    }

    function updateOverview(today) {
      const g = VIEW_GYOSHA || filterGyosha;
      const scoped = rows.filter(r => !g || r['業者'] === g);
      const open = scoped.filter(r => !r['完了']);
      document.getElementById('statOpen').textContent = open.length;
      document.getElementById('statLate').textContent = open.filter(r => isDate(r['期限']) && r['期限'] < today).length;
      document.getElementById('statToday').textContent = open.filter(r => r['期限'] === today).length;
      document.getElementById('statDone').textContent = scoped.length - open.length;
      document.querySelectorAll('#chips button').forEach(b => b.setAttribute('aria-pressed', b.classList.contains('on')));
    }
    document.getElementById('todayLabel').textContent = '今日 ' + fmtJp(todayStr());
    // ---------- 初期化 ----------
    (function init() {
      if (VIEW_GYOSHA) {
        document.getElementById('contractorCaption').classList.add('hidden');
        document.getElementById('workspace').classList.add('viewer');
        document.getElementById('editorColumn').classList.add('hidden');
        document.getElementById('formCard').classList.add('hidden');
        document.getElementById('qrCard').classList.add('hidden');
        document.getElementById('chips').classList.add('hidden');
        document.getElementById('title').textContent = VIEW_GYOSHA + ' 様 作業依頼';
        document.getElementById('mode').textContent = '閲覧専用';
        document.querySelector('#sortKey option[value="gyosha"]').remove();
      }
      load();
    })();
  </script>
</body>
</html>
