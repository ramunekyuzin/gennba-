<!DOCTYPE html>
<html lang="ja">
<head>
<script src="lock.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リスト作成</title>
<meta name="color-scheme" content="light dark">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{color-scheme:light;--bg:#f1f3f6;--paper:#fff;--field:#f7f8fa;--ink:#24272e;--muted:#69707d;--line:#dfe3ea;--accent:#2f6fd6;--soft:#e6eefc;--danger:#c0392b}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#14161b;--paper:#1f222a;--field:#191c23;--ink:#eef1f6;--muted:#a7aebb;--line:#363b47;--accent:#8db4ff;--soft:#26324a;--danger:#ff9a8f}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;color:var(--ink);background:var(--bg);line-height:1.7}
.app{max-width:560px;margin:auto;padding:20px 16px 40px}
h1{font-size:20px;padding-bottom:12px;border-bottom:1px solid var(--line)}
h2{font-size:17px;margin-bottom:4px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 16px;margin-top:18px}
label{display:block;font-size:16px;font-weight:600;color:var(--muted);margin-bottom:6px}
input{width:100%;min-height:48px;padding:10px 12px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);outline:0}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
input[aria-invalid="true"]{border-color:var(--danger)}
button{font:inherit;font-size:16px;min-height:48px;padding:10px 16px;font-weight:600;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button:disabled{opacity:.6;cursor:wait}
.wide{width:100%;margin-top:12px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.del{color:var(--danger)}
.field+.field,.grid+.field,.field+.grid{margin-top:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .field{margin-top:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.tabs button{padding:8px 4px}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.item{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.item-head span{font-weight:700}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 0}
.total+.total{border-top:1px solid var(--line)}
.total span{font-weight:600;color:var(--muted)}
.total strong{font-size:20px;overflow-wrap:anywhere;text-align:right}
.total.big strong{font-size:28px}
.note{font-size:16px;color:var(--muted);margin-top:8px}
.err{color:var(--danger)}
</style>
</head>
<body>
<div class="app">
  <h1>リスト作成</h1>

  <div class="card">
    <button id="load" class="wide" type="button" style="margin-top:0">前回のExcelを読み込む</button>
    <input id="file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
    <button id="reset" class="wide del" type="button">新しく作る(入力を全部消す)</button>
    <p class="note" id="loadMsg">入力した内容はこの端末に自動で残ります。</p>
  </div>

  <div class="card">
    <div class="field">
      <label for="title">リストの名前</label>
      <input id="title" type="text" autocomplete="off" placeholder="例:資材リスト">
    </div>
    <div class="field">
      <label for="site">現場名</label>
      <input id="site" type="text" autocomplete="off" placeholder="例:〇〇ビル新築工事">
    </div>
    <div class="field">
      <label for="made">作成日</label>
      <input id="made" type="date">
    </div>
  </div>

  <div class="card">
    <div class="tabs" id="tabs"></div>
    <h2 id="listHead">明細</h2>
    <div id="rows"></div>
    <button id="addRow" class="wide" type="button">+ 行を足す</button>
  </div>

  <div class="card">
    <div class="total"><span>契約金</span><strong id="t_contract">0円</strong></div>
    <div class="total"><span>差引契約金額(契約金 − 相殺額)</span><strong id="t_contractDiff">0円</strong></div>
    <div class="total"><span>今回請求</span><strong id="t_current">0円</strong></div>
    <div class="total"><span>相殺額</span><strong id="t_offset">0円</strong></div>
    <div class="total big"><span>差引請求額</span><strong id="t_diff">0円</strong></div>
    <p class="note err" id="totalNote"></p>
  </div>

  <div class="card">
    <button id="save" class="wide primary" type="button">Excelで保存</button>
    <p class="note" id="msg"></p>
  </div>
</div>

<script>
// 列は固定:日付・品名・数量・単位・金額
const COLS = [
  { key: 'date',   label: '日付', type: 'date' },
  { key: 'name',   label: '品名', type: 'text' },
  { key: 'qty',    label: '数量', type: 'text', mode: 'decimal' },
  { key: 'unit',   label: '単位', type: 'text' },
  { key: 'amount', label: '金額', type: 'text', mode: 'numeric' },
];

// 明細の種類(それぞれExcelの別シートになる)
const LISTS = [
  { key: 'contract', label: '契約金' },
  { key: 'current',  label: '今回請求' },
  { key: 'offset',   label: '相殺額' },
];

const rowsEl = document.getElementById('rows');
const tabsEl = document.getElementById('tabs');
const listHeadEl = document.getElementById('listHead');
const totalNoteEl = document.getElementById('totalNote');
const msgEl = document.getElementById('msg');
const titleEl = document.getElementById('title');
const siteEl = document.getElementById('site');
const madeEl = document.getElementById('made');

function today() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function newRow() {
  return { date: today(), name: '', qty: '', unit: '', amount: '' };
}

let data = { contract: [newRow()], current: [newRow()], offset: [newRow()] };
let active = 'current';
madeEl.value = today();

// ---- この端末に自動で残す ----
const STORE_KEY = 'list-tool-v1';

function store() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      title: titleEl.value, site: siteEl.value, made: madeEl.value, active, data,
    }));
  } catch (e) { /* 保存できない環境(プライベートモード等)では何もしない */ }
}

function cleanRows(list) {
  if (!Array.isArray(list)) return [newRow()];
  const rows = list.map(r => {
    const row = newRow();
    COLS.forEach(c => { row[c.key] = r && typeof r[c.key] === 'string' ? r[c.key] : ''; });
    return row;
  });
  return rows.length ? rows : [newRow()];
}

function restore() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { saved = null; }
  if (!saved || typeof saved !== 'object') return;
  titleEl.value = typeof saved.title === 'string' ? saved.title : '';
  siteEl.value = typeof saved.site === 'string' ? saved.site : '';
  madeEl.value = typeof saved.made === 'string' && saved.made ? saved.made : today();
  const d = saved.data || {};
  data = { contract: cleanRows(d.contract), current: cleanRows(d.current), offset: cleanRows(d.offset) };
  if (['contract', 'current', 'offset'].includes(saved.active)) active = saved.active;
}

restore();
document.addEventListener('input', store);

// 全角数字・カンマ・円記号が入っていても読めるようにする
function toNumber(text) {
  const s = String(text)
    .replace(/[０-９．－]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[,，\s円¥￥]/g, '');
  if (s === '' || !/^-?\d*\.?\d+$/.test(s)) return null;
  return Number(s);
}

function isEmpty(row) {
  return COLS.every(c => c.key === 'date' || String(row[c.key]).trim() === '');
}

function yen(n) {
  return n.toLocaleString('ja-JP') + '円';
}

function el(tag, props) {
  const e = document.createElement(tag);
  Object.assign(e, props || {});
  return e;
}

function checkNumber(input, key) {
  if (key !== 'amount' && key !== 'qty') return;
  const bad = input.value.trim() !== '' && toNumber(input.value) === null;
  input.setAttribute('aria-invalid', bad ? 'true' : 'false');
}

function makeField(row, r, col) {
  const field = el('div', { className: 'field' });
  const id = col.key + '_' + r;
  field.append(el('label', { htmlFor: id, textContent: col.label }));
  const input = el('input', { id, type: col.type, value: row[col.key], autocomplete: 'off' });
  if (col.mode) input.inputMode = col.mode;
  input.addEventListener('input', () => {
    row[col.key] = input.value;
    checkNumber(input, col.key);
    if (col.key === 'amount') updateTotals();
  });
  checkNumber(input, col.key);
  field.append(input);
  return field;
}

function renderTabs() {
  tabsEl.replaceChildren();
  LISTS.forEach(l => {
    const b = el('button', { type: 'button', textContent: l.label });
    b.setAttribute('aria-pressed', l.key === active ? 'true' : 'false');
    b.addEventListener('click', () => {
      active = l.key;
      renderTabs();
      renderRows();
    });
    tabsEl.append(b);
  });
  listHeadEl.textContent = LISTS.find(l => l.key === active).label + 'の明細';
}

function renderRows() {
  const rows = data[active];
  rowsEl.replaceChildren();
  rows.forEach((row, r) => {
    const item = el('div', { className: 'item' });
    const head = el('div', { className: 'item-head' });
    head.append(el('span', { textContent: (r + 1) + '行目' }));
    const del = el('button', { type: 'button', className: 'del', textContent: '行を消す' });
    del.addEventListener('click', () => {
      if (!isEmpty(row) && !confirm((r + 1) + '行目を消しますか?')) return;
      rows.splice(r, 1);
      if (rows.length === 0) rows.push(newRow());
      renderRows();
    });
    head.append(del);
    item.append(head);

    const [cDate, cName, cQty, cUnit, cAmount] = COLS;
    item.append(makeField(row, r, cDate), makeField(row, r, cName));
    const grid = el('div', { className: 'grid' });
    grid.append(makeField(row, r, cQty), makeField(row, r, cUnit));
    item.append(grid, makeField(row, r, cAmount));
    rowsEl.append(item);
  });
  updateTotals();
  store();
}

// 1つの明細の合計と、数字になっていない行の番号
function calcTotal(rows) {
  let sum = 0;
  const bad = [];
  rows.forEach((row, r) => {
    if (String(row.amount).trim() === '') return;
    const n = toNumber(row.amount);
    if (n === null) bad.push(r + 1); else sum += n;
  });
  return { sum: Math.round(sum * 100) / 100, bad };
}

function calcAll() {
  const t = {};
  const bad = [];
  LISTS.forEach(l => {
    const r = calcTotal(data[l.key]);
    t[l.key] = r.sum;
    if (r.bad.length) bad.push(l.label + 'の' + r.bad.join('・') + '行目');
  });
  t.diff = Math.round((t.current - t.offset) * 100) / 100;
  t.contractDiff = Math.round((t.contract - t.offset) * 100) / 100;
  return { t, bad };
}

function updateTotals() {
  const { t, bad } = calcAll();
  ['contract', 'contractDiff', 'current', 'offset', 'diff'].forEach(k => {
    document.getElementById('t_' + k).textContent = yen(t[k]);
  });
  totalNoteEl.textContent = bad.length ? bad.join('、') + 'の金額が数字になっていません(合計に入っていません)' : '';
}

document.getElementById('addRow').addEventListener('click', () => {
  const rows = data[active];
  rows.push(newRow());
  renderRows();
  document.getElementById('name_' + (rows.length - 1)).focus();
});

// "2026-11-10" → Excelの日付(ずれないようにUTCで作る)
function toDate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null;
}

const FONT = { name: 'Yu Gothic', size: 11 };
const THIN = { style: 'thin', color: { argb: 'FF808080' } };
const BOX = { top: THIN, left: THIN, bottom: THIN, right: THIN };
const DOUBLE_TOP = { top: { style: 'double', color: { argb: 'FF808080' } }, left: THIN, bottom: THIN, right: THIN };
const HEAD_FILL = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFDCE6F2' } };
const TOTAL_FILL = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF2F2F2' } };

function newSheet(wb, name, widths) {
  const ws = wb.addWorksheet(name, {
    pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0,
      margins: { left: 0.6, right: 0.6, top: 0.8, bottom: 0.8, header: 0.3, footer: 0.3 } },
  });
  ws.columns = widths.map(width => ({ width }));
  return ws;
}

// 1〜2行目:タイトル・現場名・作成日
function putHeader(ws, lastCol, title, site, made) {
  const leftEnd = lastCol === 'E' ? 'C' : 'A';
  const rightStart = lastCol === 'E' ? 'D' : 'B';
  ws.mergeCells('A1:' + lastCol + '1');
  const t = ws.getCell('A1');
  t.value = title;
  t.font = { ...FONT, size: 18, bold: true };
  t.alignment = { horizontal: 'center', vertical: 'middle' };
  ws.getRow(1).height = 36;

  if (leftEnd !== 'A') ws.mergeCells('A2:' + leftEnd + '2');
  const s = ws.getCell('A2');
  s.value = site ? '現場名:' + site : '';
  s.font = { ...FONT, size: 12 };
  if (rightStart !== lastCol) ws.mergeCells(rightStart + '2:' + lastCol + '2');
  const d = ws.getCell(rightStart + '2');
  d.value = made ? '作成日 ' + made.replace(/-/g, '/') : '';
  d.font = FONT;
  d.alignment = { horizontal: 'right' };
  ws.getRow(2).height = 22;
}

// 明細のシートを作り、合計のセル番地を返す
// offset:契約金シートだけ渡す { ref: 相殺額の合計セル, sum: 相殺額の合計, diff: 差引契約金額 }
function addDetailSheet(wb, label, title, site, made, rows, sum, offset) {
  const ws = newSheet(wb, label, [13, 34, 10, 9, 16]);
  putHeader(ws, 'E', title + '(' + label + ')', site, made);

  const head = ws.getRow(4);
  COLS.forEach((c, i) => {
    const cell = head.getCell(i + 1);
    cell.value = c.label;
    cell.font = { ...FONT, bold: true };
    cell.fill = HEAD_FILL;
    cell.alignment = { horizontal: 'center', vertical: 'middle' };
    cell.border = BOX;
  });
  head.height = 22;

  rows.forEach((row, i) => {
    const r = ws.getRow(5 + i);
    const qty = toNumber(row.qty);
    const amount = toNumber(row.amount);
    const vals = [toDate(row.date) || '', row.name.trim(), qty ?? row.qty.trim(), row.unit.trim(), amount ?? ''];
    vals.forEach((v, c) => {
      const cell = r.getCell(c + 1);
      cell.value = v;
      cell.font = FONT;
      cell.border = BOX;
      cell.alignment = { vertical: 'middle', wrapText: c === 1 };
    });
    r.getCell(1).numFmt = 'yyyy/m/d';
    r.getCell(1).alignment = { horizontal: 'center', vertical: 'middle' };
    // 整数に「#,##0.##」を使うと「10.」と点が残るので分ける
    r.getCell(3).numFmt = qty !== null && !Number.isInteger(qty) ? '#,##0.##' : '#,##0';
    r.getCell(3).alignment = { horizontal: 'right', vertical: 'middle' };
    r.getCell(4).alignment = { horizontal: 'center', vertical: 'middle' };
    r.getCell(5).numFmt = '#,##0';
    r.height = 20;
  });

  const tr = 5 + rows.length;
  ws.mergeCells('A' + tr + ':D' + tr);
  const tl = ws.getCell('A' + tr);
  tl.value = '合計金額';
  tl.font = { ...FONT, bold: true };
  tl.alignment = { horizontal: 'right', vertical: 'middle' };
  const tv = ws.getCell('E' + tr);
  tv.value = rows.length ? { formula: 'SUM(E5:E' + (tr - 1) + ')', result: sum } : 0;
  tv.numFmt = '"¥"#,##0';
  tv.font = { ...FONT, bold: true, size: 12 };
  for (let c = 1; c <= 5; c++) {
    const cell = ws.getRow(tr).getCell(c);
    cell.border = DOUBLE_TOP;
    cell.fill = TOTAL_FILL;
  }
  ws.getRow(tr).height = 24;

  // 契約金シート:合計の下に「相殺額」と「差引契約金額」を足す
  let last = tr;
  if (offset) {
    const extra = [
      { label: '相殺額', value: { formula: offset.ref, result: offset.sum }, bold: false },
      { label: '差引契約金額', value: { formula: 'E' + tr + '-E' + (tr + 1), result: offset.diff }, bold: true },
    ];
    extra.forEach((x, i) => {
      const r = tr + 1 + i;
      ws.mergeCells('A' + r + ':D' + r);
      const l = ws.getCell('A' + r);
      l.value = x.label;
      l.font = { ...FONT, bold: x.bold };
      l.alignment = { horizontal: 'right', vertical: 'middle' };
      const v = ws.getCell('E' + r);
      v.value = x.value;
      v.numFmt = '"¥"#,##0';
      v.font = { ...FONT, bold: x.bold, size: x.bold ? 12 : 11 };
      for (let c = 1; c <= 5; c++) {
        const cell = ws.getRow(r).getCell(c);
        cell.border = x.bold ? DOUBLE_TOP : BOX;
        if (x.bold) cell.fill = TOTAL_FILL;
      }
      ws.getRow(r).height = 24;
    });
    last = tr + 2;
  }

  ws.pageSetup.printArea = 'A1:E' + last;
  ws.views = [{ state: 'frozen', ySplit: 4 }];
  return "'" + label + "'!E" + tr;
}

// 集計シート:各シートの合計を式で参照する
function fillSummary(ws, title, site, made, refs, t) {
  putHeader(ws, 'B', title + '(集計)', site, made);

  const head = ws.getRow(4);
  ['項目', '金額'].forEach((v, i) => {
    const cell = head.getCell(i + 1);
    cell.value = v;
    cell.font = { ...FONT, bold: true };
    cell.fill = HEAD_FILL;
    cell.alignment = { horizontal: 'center', vertical: 'middle' };
    cell.border = BOX;
  });
  head.height = 22;

  // 5:契約金 6:差引契約金額 7:今回請求 8:相殺額 9:差引請求額
  const lines = [
    { label: '契約金', value: { formula: refs.contract, result: t.contract } },
    { label: '差引契約金額(契約金 − 相殺額)', value: { formula: 'B5-B8', result: t.contractDiff }, bold: true },
    { label: '今回請求', value: { formula: refs.current, result: t.current } },
    { label: '相殺額', value: { formula: refs.offset, result: t.offset } },
  ];
  lines.forEach((x, i) => {
    const r = ws.getRow(5 + i);
    r.getCell(1).value = x.label;
    r.getCell(2).value = x.value;
    r.getCell(2).numFmt = '"¥"#,##0';
    [1, 2].forEach(c => { r.getCell(c).font = { ...FONT, size: 12, bold: !!x.bold }; r.getCell(c).border = BOX; });
    r.height = 26;
  });

  const dr = ws.getRow(9);
  dr.getCell(1).value = '差引請求額(今回請求 − 相殺額)';
  dr.getCell(2).value = { formula: 'B7-B8', result: t.diff };
  dr.getCell(2).numFmt = '"¥"#,##0';
  [1, 2].forEach(c => {
    const cell = dr.getCell(c);
    cell.font = { ...FONT, size: 13, bold: true };
    cell.border = DOUBLE_TOP;
    cell.fill = TOTAL_FILL;
    cell.alignment = { vertical: 'middle' };
  });
  dr.height = 30;
  ws.pageSetup.printArea = 'A1:B9';
}

async function buildWorkbook(title, site, made, lists, t) {
  const wb = new ExcelJS.Workbook();
  // 集計を一番左にしたいので先に作り、中身は明細のあとで入れる
  const summary = newSheet(wb, '集計', [34, 22]);
  const refs = {};
  // 相殺額シートの合計の行は「5行目 + 明細の数」(契約金シートより後に作るので先に計算)
  const offsetInfo = { ref: "'相殺額'!E" + (5 + lists.offset.length), sum: t.offset, diff: t.contractDiff };
  LISTS.forEach(l => {
    refs[l.key] = addDetailSheet(wb, l.label, title, site, made, lists[l.key], t[l.key],
      l.key === 'contract' ? offsetInfo : null);
  });
  fillSummary(summary, title, site, made, refs, t);
  return wb;
}

document.getElementById('save').addEventListener('click', async () => {
  msgEl.textContent = '';
  msgEl.classList.remove('err');
  const fail = text => { msgEl.textContent = text; msgEl.classList.add('err'); };

  const lists = {};
  LISTS.forEach(l => { lists[l.key] = data[l.key].filter(r => !isEmpty(r)); });
  const count = LISTS.reduce((n, l) => n + lists[l.key].length, 0);
  if (count === 0) return fail('明細に何か入力してください');
  const { t, bad } = calcAll();
  if (bad.length) return fail(bad.join('、') + 'の金額を数字にしてください');
  if (typeof ExcelJS === 'undefined') return fail('Excelを作る部品が読み込めませんでした。通信を確認して、ページを開き直してください');

  const title = titleEl.value.trim() || 'リスト';
  const btn = document.getElementById('save');
  btn.disabled = true;
  try {
    const wb = await buildWorkbook(title, siteEl.value.trim(), madeEl.value, lists, t);
    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const name = title.replace(/[\\/:*?"<>|]/g, '_') + '.xlsx';
    const a = el('a', { href: URL.createObjectURL(blob), download: name });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    msgEl.textContent = name + ' を保存しました(差引請求額 ' + yen(t.diff) + ')';
  } catch (e) {
    fail('保存できませんでした:' + e.message);
  } finally {
    btn.disabled = false;
  }
});

// ---- 新しく作る ----
document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('入力した内容を全部消して、新しく作りますか?')) return;
  titleEl.value = '';
  siteEl.value = '';
  madeEl.value = today();
  data = { contract: [newRow()], current: [newRow()], offset: [newRow()] };
  active = 'current';
  msgEl.textContent = '';
  document.getElementById('loadMsg').textContent = '新しく作り直しました。';
  renderTabs();
  renderRows();
});

// ---- 前回のExcelを読み込む ----
const fileEl = document.getElementById('file');
const loadMsgEl = document.getElementById('loadMsg');

document.getElementById('load').addEventListener('click', () => fileEl.click());

// セルの中身を文字にする(式・リッチテキスト・日付にも対応)
function cellText(v) {
  if (v === null || v === undefined) return '';
  if (v instanceof Date) return v.toISOString().slice(0, 10);
  if (typeof v === 'object') {
    if ('result' in v) return cellText(v.result);
    if (Array.isArray(v.richText)) return v.richText.map(t => t.text).join('');
    if ('text' in v) return String(v.text);
    return '';
  }
  return String(v).trim();
}

// 日付セル → "2026-11-10"(文字の「2026/11/10」も読む)
function cellDate(v) {
  if (v && typeof v === 'object' && !(v instanceof Date) && 'result' in v) v = v.result;
  if (v instanceof Date) return v.toISOString().slice(0, 10);
  const m = /^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/.exec(cellText(v));
  return m ? m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0') : '';
}

function readDetail(ws) {
  const rows = [];
  for (let r = 5; r <= ws.rowCount; r++) {
    const row = ws.getRow(r);
    if (cellText(row.getCell(1).value) === '合計金額') break;
    const item = {
      date: cellDate(row.getCell(1).value),
      name: cellText(row.getCell(2).value),
      qty: cellText(row.getCell(3).value),
      unit: cellText(row.getCell(4).value),
      amount: cellText(row.getCell(5).value),
    };
    if (!isEmpty(item)) rows.push(item);
  }
  return rows.length ? rows : [newRow()];
}

// 3つのシートがないExcel用:どのシートでも「品名」「金額」の見出し行を探して、その下を読む
function findTable(wb) {
  for (const ws of wb.worksheets) {
    const maxRow = Math.min(ws.rowCount, 30);
    for (let r = 1; r <= maxRow; r++) {
      const row = ws.getRow(r);
      const cols = {};
      for (let c = 1; c <= Math.max(row.cellCount, 1); c++) {
        const text = cellText(row.getCell(c).value).replace(/\s/g, '');
        const col = COLS.find(k => k.label === text);
        if (col && !(col.key in cols)) cols[col.key] = c;
      }
      if ('name' in cols && 'amount' in cols) return { ws, headRow: r, cols };
    }
  }
  return null;
}

function readTable({ ws, headRow, cols }) {
  const rows = [];
  for (let r = headRow + 1; r <= ws.rowCount; r++) {
    const row = ws.getRow(r);
    const item = {};
    COLS.forEach(c => {
      const v = c.key in cols ? row.getCell(cols[c.key]).value : null;
      item[c.key] = c.key === 'date' ? cellDate(v) : cellText(v);
    });
    const texts = COLS.map(c => c.key in cols ? cellText(row.getCell(cols[c.key]).value) : '');
    if (texts.some(t => t.startsWith('合計'))) break;
    if (isEmpty(item)) {
      if (rows.length) break;   // 明細のあとの空行で終わり
      continue;
    }
    rows.push(item);
  }
  return rows;
}

fileEl.addEventListener('change', async () => {
  const file = fileEl.files[0];
  fileEl.value = '';
  if (!file) return;
  loadMsgEl.classList.remove('err');
  const fail = text => { loadMsgEl.textContent = text; loadMsgEl.classList.add('err'); };
  if (typeof ExcelJS === 'undefined') return fail('Excelを読む部品が読み込めませんでした。通信を確認して、ページを開き直してください');

  try {
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(await file.arrayBuffer());
    const sheets = LISTS.map(l => wb.getWorksheet(l.label));
    const table = sheets.every(s => !s) ? findTable(wb) : null;
    if (sheets.every(s => !s) && !table) return fail('「品名」と「金額」の見出しが見つからないので読み込めませんでした');
    const tableRows = table ? readTable(table) : null;
    if (table && tableRows.length === 0) return fail('見出しの下に明細が見つかりませんでした');

    const hasInput = LISTS.some(l => data[l.key].some(r => !isEmpty(r))) || titleEl.value.trim() || siteEl.value.trim();
    if (hasInput && !confirm('今の入力を消して、「' + file.name + '」の内容を読み込みますか?')) return;

    if (table) {
      // タイトルはA1(見出しより上にあるとき)、なければファイル名。現場名は「現場名:」で始まるA2から
      const ws = table.ws;
      const a1 = table.headRow > 1 ? cellText(ws.getCell('A1').value) : '';
      const a2 = table.headRow > 2 ? cellText(ws.getCell('A2').value) : '';
      titleEl.value = a1 || file.name.replace(/\.xlsx$/i, '');
      siteEl.value = /^現場名[::]/.test(a2) ? a2.replace(/^現場名[::]\s*/, '') : '';
      madeEl.value = today();
      data = { contract: [newRow()], current: tableRows, offset: [newRow()] };
      active = 'current';
      msgEl.textContent = '';
      loadMsgEl.textContent = '「' + file.name + '」の明細' + tableRows.length + '行を「今回請求」に読み込みました。作成日は今日にしています。';
      renderTabs();
      renderRows();
      return;
    }

    const first = wb.getWorksheet('集計') || sheets.find(s => s);
    titleEl.value = cellText(first.getCell('A1').value).replace(/[((](集計|契約金|今回請求|相殺額)[))]$/, '');
    siteEl.value = cellText(first.getCell('A2').value).replace(/^現場名:/, '');
    madeEl.value = today();
    const next = {};
    LISTS.forEach((l, i) => { next[l.key] = sheets[i] ? readDetail(sheets[i]) : [newRow()]; });
    data = next;
    active = 'current';
    msgEl.textContent = '';
    loadMsgEl.textContent = '「' + file.name + '」を読み込みました。作成日は今日にしています。';
    renderTabs();
    renderRows();
  } catch (e) {
    fail('読み込めませんでした:' + e.message);
  }
});

renderTabs();
renderRows();
</script>
</body>
