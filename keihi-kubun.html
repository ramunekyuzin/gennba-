<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>経費仕分け</title>
<style>
:root{color-scheme:light dark;--bg:#edf2f8;--paper:#fff;--ink:#20334d;--muted:#596c83;--line:#d8e2ee;--accent:#2457b8;--soft:#eef4ff;--shadow:0 6px 28px #20334d09}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",Meiryo,sans-serif;display:flex;flex-direction:column;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left);height:100vh;height:100dvh}.header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:15px 24px;background:var(--paper);border-bottom:1px solid var(--line);flex-shrink:0}.brand{display:flex;align-items:center;gap:12px;min-width:0}.mark{width:40px;height:40px;border-radius:12px;background:#203b61;color:#fff;display:grid;place-items:center;flex-shrink:0}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}h1{font-size:18px;line-height:1.4;margin:0;letter-spacing:.04em}.subtitle{font-size:11px;color:var(--muted);margin:3px 0 0}.actions{display:flex;align-items:center;gap:8px}.button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);font-family:inherit;font-size:12px;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}.button:hover{background:var(--soft)}.button svg{width:16px;height:16px}.button.primary{background:var(--soft);color:var(--accent);border-color:transparent}.button:focus-visible{outline:3px solid #80aaf0;outline-offset:3px}.workspace{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;margin:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow)}iframe{display:block;border:0;width:100%;flex:1;min-height:0;background:var(--paper)}.loading{position:absolute;left:50%;top:16px;transform:translateX(-50%);display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow);border-radius:10px;padding:10px 16px;max-width:calc(100% - 24px);font-size:12px;color:var(--muted);pointer-events:none;z-index:1}.loading[hidden]{display:none}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}.help{padding:8px 18px 10px;font-size:11px;color:var(--muted);text-align:right;flex-shrink:0;margin:0}.restore{display:none;position:fixed;top:8px;right:12px;z-index:5;box-shadow:var(--shadow);min-height:36px}.focused .header,.focused .help{display:none}.focused .workspace{margin:0;border:0;border-radius:0}.focused .restore{display:inline-flex}.focused .workspace{padding-top:50px}#notice{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 16px;font-size:12px;max-width:calc(100vw - 24px);z-index:8}#notice:empty{display:none}
@media(prefers-color-scheme:dark){:root{--bg:#101927;--paper:#192638;--ink:#e4edf8;--muted:#a7b7ce;--line:#34465e;--accent:#aac9ff;--soft:#263c5d;--shadow:0 6px 28px #0002}.mark{background:#304c74}}
@media(max-width:640px){.header{padding:12px;gap:12px;flex-wrap:wrap}.brand{flex:1}.subtitle{font-size:10px}.actions{width:100%;display:grid;grid-template-columns:1fr 1.2fr 1.2fr;gap:6px}.button{padding:8px;font-size:11px;min-height:42px}.workspace{margin:8px;border-radius:10px}.help{font-size:10px;padding:3px 12px 8px;text-align:left}h1{font-size:17px}}
</style>
</head>
<body>
<header class="header">
  <div class="brand"><div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 7h8M8 11h3m3 0h2M8 15h3m3 0h2"/></svg></div><div><h1>経費仕分け</h1><p class="subtitle">経費の整理・出来高入力をスムーズに</p></div></div>
  <nav class="actions" aria-label="表示の操作">
    <button class="button" id="reload" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M19 12a7 7 0 1 0-2 5M20 7l-3-3"/></svg>再読み込み</button>
    <button class="button" id="expand" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5"/></svg>画面を広く使う</button>
    <a class="button primary" href="https://script.google.com/macros/s/AKfycbwgvxNO1XkCvcSkZfcaeXU9-LDjsVh9wXVBtfS2igwyv48a45MioPn3K7QJo5kIPKZsHg/exec?page=keihi" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7M21 3 11 13M10 5H4v15h15v-6"/></svg>別タブで開く</a>
  </nav>
</header>
<button class="button restore" id="restore" type="button">通常表示に戻す</button>
<main class="workspace" aria-label="経費仕分け画面">
  <div class="loading" id="loading" role="status"><span class="dot" aria-hidden="true"></span><span id="loadingText">経費仕分け画面を読み込んでいます…</span></div>
  <iframe id="app" src="https://script.google.com/macros/s/AKfycbwgvxNO1XkCvcSkZfcaeXU9-LDjsVh9wXVBtfS2igwyv48a45MioPn3K7QJo5kIPKZsHg/exec?page=keihi" allow="clipboard-write" title="経費仕分け"></iframe>
</main>
<p class="help">画面が表示されない場合やログインが必要な場合は「別タブで開く」をお試しください。</p>
<div id="notice" role="status" aria-live="polite"></div>
<script>
const frame=document.getElementById('app');
const loading=document.getElementById('loading');
const expand=document.getElementById('expand');
const restore=document.getElementById('restore');
let timer;
function startLoading(){
  loading.hidden=false;
  document.getElementById('loadingText').textContent='経費仕分け画面を読み込んでいます…';
  clearTimeout(timer);
  timer=setTimeout(()=>{document.getElementById('loadingText').textContent='表示されない場合は「別タブで開く」をお試しください。';},15000);
}
frame.addEventListener('load',()=>{clearTimeout(timer);loading.hidden=true;});
document.getElementById('reload').addEventListener('click',()=>{
  if(!confirm('画面を再読み込みしますか？ 保存していない入力内容は失われる場合があります。'))return;
  startLoading();frame.src=frame.getAttribute('src');
});
function setExpanded(enabled){
  document.body.classList.toggle('focused',enabled);
  expand.setAttribute('aria-pressed',String(enabled));
  (enabled?restore:expand).focus();
}
expand.addEventListener('click',()=>setExpanded(true));
restore.addEventListener('click',()=>setExpanded(false));
startLoading();
</script>
</body>
</html>
