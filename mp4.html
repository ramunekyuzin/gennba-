<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>音声→MP4変換</title>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<style>
  :root {
    --bg: #f3f5f8; --card: #fff; --text: #222; --sub: #777; --line: #ccd;
    --btn: #1565c0; --btn-text: #fff; --bar-bg: #e3e7ee;
    --err: #c62828; --ok: #2e7d32; --shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --card: #1e2227; --text: #eaeaea; --sub: #aaa; --line: #3a3f46;
      --btn: #4a8be0; --btn-text: #fff; --bar-bg: #2a2f36;
      --err: #ef7a6e; --ok: #5fc97c; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--bg); color: var(--text); font-size: 16px;
  }
  .wrap { max-width: 600px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 16px; }
  .card {
    background: var(--card); border-radius: 12px; padding: 16px;
    box-shadow: var(--shadow); margin-bottom: 16px;
  }
  label { display: block; font-weight: bold; margin: 16px 0 8px; }
  label:first-child { margin-top: 0; }
  select {
    width: 100%; font-size: 16px; padding: 12px;
    border: 1px solid var(--line); border-radius: 8px; font-family: inherit;
    background: var(--card); color: var(--text);
  }
  .btn {
    display: block; width: 100%; min-height: 52px; margin-top: 16px;
    font-size: 17px; font-weight: bold; font-family: inherit; text-align: center;
    border: none; border-radius: 10px; cursor: pointer;
    background: var(--btn); color: var(--btn-text); text-decoration: none; line-height: 52px;
  }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.sub { background: transparent; color: var(--btn); border: 2px solid var(--btn); line-height: 48px; }
  input[type=file] { display: none; }
  .file-name { margin-top: 10px; color: var(--sub); word-break: break-all; }
  .bar { height: 12px; background: var(--bar-bg); border-radius: 6px; overflow: hidden; margin-top: 16px; }
  .bar div { height: 100%; width: 0; background: var(--btn); transition: width .2s; }
  .msg { margin-top: 10px; min-height: 22px; }
  .msg.err { color: var(--err); }
  .msg.ok { color: var(--ok); }
  .hint { font-size: 16px; color: var(--sub); line-height: 1.6; margin: 0; padding-left: 1.2em; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>音声→MP4変換</h1>

  <div class="card">
    <label>① 音声ファイルを選ぶ</label>
    <label for="file" class="btn sub" style="margin-top:0">ファイルを選ぶ</label>
    <input type="file" id="file" accept="audio/*,video/*,.m4a,.mp3,.wav,.aac,.ogg,.opus,.flac">
    <div class="file-name" id="fileName">まだ選ばれていません</div>

    <label for="bitrate">② 音質</label>
    <select id="bitrate">
      <option value="96000">ふつう(96kbps・小さめ)</option>
      <option value="128000" selected>きれい(128kbps)</option>
      <option value="192000">とてもきれい(192kbps・大きめ)</option>
    </select>

    <button class="btn" id="run" disabled>MP4に変換する</button>
    <div class="bar"><div id="bar"></div></div>
    <div class="msg" id="msg"></div>
    <a class="btn hidden" id="save">MP4を保存する</a>
  </div>

  <div class="card">
    <ul class="hint">
      <li>画面は真っ黒で、音だけが入ったMP4になります。</li>
      <li>変換はこの端末の中だけで行い、ファイルはどこにも送りません。</li>
      <li>長い音声(1時間以上など)はスマホだと止まることがあります。</li>
    </ul>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const SAMPLE_RATE = 48000;
const W = 640, H = 360;
let file = null, saveUrl = null;

function setMsg(text, cls) { $('msg').textContent = text; $('msg').className = 'msg' + (cls ? ' ' + cls : ''); }
function setBar(p) { $('bar').style.width = Math.round(p * 100) + '%'; }

$('file').addEventListener('change', e => {
  file = e.target.files[0] || null;
  $('fileName').textContent = file ? file.name : 'まだ選ばれていません';
  $('run').disabled = !file;
  $('save').classList.add('hidden');
  setBar(0); setMsg('');
});

$('run').addEventListener('click', async () => {
  $('run').disabled = true;
  $('save').classList.add('hidden');
  setBar(0);
  try {
    const blob = await convert(file, Number($('bitrate').value));
    if (saveUrl) URL.revokeObjectURL(saveUrl);
    saveUrl = URL.createObjectURL(blob);
    const name = file.name.replace(/\.[^.]+$/, '') + '.mp4';
    $('save').href = saveUrl;
    $('save').download = name;
    $('save').classList.remove('hidden');
    setBar(1);
    setMsg('できました(' + (blob.size / 1024 / 1024).toFixed(1) + 'MB)。「MP4を保存する」を押してください。', 'ok');
  } catch (err) {
    console.error(err);
    setMsg(err.userMsg || '変換できませんでした:' + err.message, 'err');
  } finally {
    $('run').disabled = !file;
  }
});

function fail(userMsg) { const e = new Error(userMsg); e.userMsg = userMsg; return e; }

// エンコーダの処理待ちがたまりすぎないように少し待つ
async function waitQueue(enc) {
  while (enc.encodeQueueSize > 20) await new Promise(r => setTimeout(r, 5));
}

async function convert(file, bitrate) {
  if (!window.AudioEncoder || !window.VideoEncoder) {
    throw fail('このブラウザはMP4の作成に対応していません。ChromeかSafariを最新にしてください。');
  }

  setMsg('音声を読み込んでいます…');
  const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
  let buf;
  try {
    buf = await ctx.decodeAudioData(await file.arrayBuffer());
  } catch (e) {
    throw fail('このファイルは読み込めませんでした。別の形式のファイルで試してください。');
  } finally {
    ctx.close();
  }

  const channels = Math.min(buf.numberOfChannels, 2);
  const audioConfig = { codec: 'mp4a.40.2', sampleRate: SAMPLE_RATE, numberOfChannels: channels, bitrate };
  if (!(await AudioEncoder.isConfigSupported(audioConfig)).supported) {
    throw fail('このブラウザはAAC(MP4の音声)の作成に対応していません。ChromeかSafariを最新にしてください。');
  }
  const videoConfig = { codec: 'avc1.42001f', width: W, height: H, bitrate: 100000, framerate: 1 };
  const useVideo = (await VideoEncoder.isConfigSupported(videoConfig)).supported;

  const muxer = new Mp4Muxer.Muxer({
    target: new Mp4Muxer.ArrayBufferTarget(),
    video: useVideo ? { codec: 'avc', width: W, height: H } : undefined,
    audio: { codec: 'aac', numberOfChannels: channels, sampleRate: SAMPLE_RATE },
    fastStart: 'in-memory',
    firstTimestampBehavior: 'offset'
  });

  let encErr = null;
  const audioEnc = new AudioEncoder({
    output: (chunk, meta) => muxer.addAudioChunk(chunk, meta),
    error: e => { encErr = e; }
  });
  audioEnc.configure(audioConfig);

  let videoEnc = null;
  if (useVideo) {
    videoEnc = new VideoEncoder({
      output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
      error: e => { encErr = e; }
    });
    videoEnc.configure(videoConfig);
  }

  // 黒い画面(1秒に1コマ)
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const c2d = canvas.getContext('2d');
  c2d.fillStyle = '#000'; c2d.fillRect(0, 0, W, H);
  const seconds = Math.max(1, Math.ceil(buf.duration));
  let nextSec = 0;

  setMsg('MP4に変換しています…');
  const total = buf.length;
  const STEP = SAMPLE_RATE; // 1秒ずつ
  const src = [];
  for (let ch = 0; ch < channels; ch++) src.push(buf.getChannelData(ch));

  for (let pos = 0; pos < total; pos += STEP) {
    if (encErr) throw encErr;
    const n = Math.min(STEP, total - pos);
    const data = new Float32Array(n * channels);
    for (let ch = 0; ch < channels; ch++) data.set(src[ch].subarray(pos, pos + n), ch * n);
    const ad = new AudioData({
      format: 'f32-planar', sampleRate: SAMPLE_RATE, numberOfFrames: n,
      numberOfChannels: channels, timestamp: Math.round(pos / SAMPLE_RATE * 1e6), data
    });
    audioEnc.encode(ad);
    ad.close();
    await waitQueue(audioEnc);

    // 音の位置に合わせて映像のコマも進める
    while (videoEnc && nextSec < seconds && nextSec * SAMPLE_RATE <= pos) {
      const vf = new VideoFrame(canvas, { timestamp: nextSec * 1e6, duration: 1e6 });
      videoEnc.encode(vf, { keyFrame: nextSec % 10 === 0 });
      vf.close();
      nextSec++;
      await waitQueue(videoEnc);
    }
    setBar(pos / total * 0.95);
  }
  while (videoEnc && nextSec < seconds) {
    const vf = new VideoFrame(canvas, { timestamp: nextSec * 1e6, duration: 1e6 });
    videoEnc.encode(vf, { keyFrame: nextSec % 10 === 0 });
    vf.close();
    nextSec++;
  }

  setMsg('仕上げています…');
  await audioEnc.flush();
  if (videoEnc) await videoEnc.flush();
  if (encErr) throw encErr;
  audioEnc.close();
  if (videoEnc) videoEnc.close();
  muxer.finalize();
  return new Blob([muxer.target.buffer], { type: 'video/mp4' });
}
</script>
</body>
</html>
