<!DOCTYPE html>
<html lang="ja">
<head>
<script src="lock.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>協力業者一覧</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5f8; --card: #fff; --text: #182b43; --sub: #64748b; --line: #e1e7ef;
      --main: #234e75; --mainText: #fff; --chip: #edf3f8; --chipText: #305675;
      --ok: #257967; --ng: #bc4545;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #111c2b; --card: #1a283a; --text: #e6edf5; --sub: #a0b0c4; --line: #304155;
        --main: #5084b6; --chip: #273c54; --chipText: #bbd8f4; --ok: #7bd2b5; --ng: #ffa59e;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.6;
      max-width: 1120px; margin: 0 auto; padding: 24px 16px calc(40px + env(safe-area-inset-bottom));
    }
    body.isDragging { user-select: none; -webkit-user-select: none; }
    button, input, a { -webkit-tap-highlight-color: transparent; font-family: inherit; }
    button, a { touch-action: manipulation; }
    button { cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #70b6da; outline-offset: 3px; }

    .appHeader { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    h1 { font-size: 24px; letter-spacing: .04em; }
    .eyebrow { font-size: 11px; letter-spacing: .18em; color: var(--sub); font-weight: 700; }
    #reloadBtn {
      min-height: 44px; padding: 8px 16px; font-size: 16px; border-radius: 10px;
      background: var(--card); color: var(--text); border: 1px solid var(--line);
    }

    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tabs button {
      flex: 1; min-height: 50px; font-size: 16px; font-weight: bold; border-radius: 12px;
      background: var(--card); color: var(--text); border: 1px solid var(--line);
    }
    .tabs button.on { background: var(--main); color: var(--mainText); border-color: var(--main); }

    .search { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 6px 0 10px; }
    input[type=search], #newGyoshu {
      width: 100%; height: 54px; padding: 12px 16px; font-size: 16px;
      border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text);
    }
    .chips { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
    .chips button {
      flex: 0 0 auto; min-height: 44px; padding: 8px 14px; font-size: 16px;
      border-radius: 999px; background: var(--card); color: var(--text); border: 1px solid var(--line); white-space: nowrap;
    }
    .chips button.on { background: var(--main); color: var(--mainText); border-color: var(--main); }
    .chips button.over { outline: 3px dashed var(--main); outline-offset: -3px; background: var(--chip); color: var(--chipText); }
    .resultsBar { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 14px; color: var(--sub); }
    #saving { color: var(--ok); text-align: right; }
    #saving.ng { color: var(--ng); }

    #addRow { display: flex; gap: 8px; margin: 4px 0 6px; }
    #addRow button {
      flex-shrink: 0; min-height: 54px; padding: 8px 16px; font-size: 16px; font-weight: bold;
      border: none; border-radius: 12px; background: var(--main); color: var(--mainText);
    }
    .dragTip { font-size: 14px; color: var(--sub); margin-bottom: 4px; }
    #exportRow { display: flex; gap: 8px; margin: 4px 0 6px; }
    #kojiName {
      flex: 1; min-width: 0; height: 54px; padding: 12px 16px; font-size: 16px;
      border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text);
    }
    #exportBtn {
      flex-shrink: 0; min-height: 54px; padding: 8px 16px; font-size: 16px; font-weight: bold;
      border-radius: 12px; background: var(--card); color: var(--ok); border: 2px solid var(--ok);
    }
    .boss {
      min-height: 44px; padding: 6px 12px; font-size: 14px; border-radius: 10px; white-space: nowrap;
      background: transparent; color: var(--sub); border: 1px solid var(--line);
    }
    .boss.on { background: var(--ok); color: #fff; border-color: var(--ok); font-weight: bold; }
    .who { display: flex; align-items: center; gap: 10px; }
    .who > div { flex: 1; min-width: 0; }

    #status { text-align: center; margin: 16px 0; color: var(--sub); }
    #status.ng { color: var(--ng); }
    #status:empty { display: none; }
    .empty {
      text-align: center; color: var(--sub); padding: 32px 16px;
      border: 1px dashed var(--line); border-radius: 16px; background: var(--card);
    }
    .empty strong { display: block; color: var(--text); margin-bottom: 4px; }

    .group { margin-top: 18px; padding: 4px; border-radius: 16px; border: 3px solid transparent; }
    .group.over { border: 3px dashed var(--main); background: var(--chip); }
    .groupTitle {
      font-size: 18px; font-weight: bold; padding: 4px 4px 8px; display: flex; align-items: center; gap: 8px;
    }
    .groupTitle span { font-size: 14px; font-weight: normal; color: var(--sub); margin-right: auto; }
    .groupTitle button {
      min-height: 44px; padding: 4px 14px; font-size: 14px; border-radius: 10px;
      background: transparent; color: var(--ng); border: 1px solid var(--line);
    }
    .groupTitle button.rename { color: var(--main); }
    .dropHint {
      border: 2px dashed var(--line); border-radius: 14px; padding: 20px 12px;
      text-align: center; color: var(--sub); background: var(--card);
    }
    .company {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px 16px; margin-bottom: 10px;
    }
    .companyHead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .companyName { font-size: 18px; font-weight: bold; overflow-wrap: anywhere; flex: 1 1 auto; min-width: 0; }
    .grip {
      flex-shrink: 0; width: 44px; height: 44px; display: grid; place-items: center;
      font-size: 22px; border-radius: 10px; background: var(--chip); color: var(--chipText);
      cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .company.dragging { opacity: .35; }
    .ghost {
      position: fixed; z-index: 50; margin: 0; pointer-events: none; opacity: .92;
      box-shadow: 0 12px 32px rgba(0,0,0,.25); transform: rotate(-1deg);
    }

    /* 一覧 */
    .person { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
    .who b { font-size: 17px; }
    .who .pos { display: block; font-size: 14px; color: var(--sub); overflow-wrap: anywhere; }
    .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .companyHead .links { margin-top: 0; }
    .links a {
      display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 8px 12px;
      font-size: 16px; border-radius: 10px; text-decoration: none;
      background: var(--chip); color: var(--chipText); overflow-wrap: anywhere;
    }
    .noData { font-size: 14px; color: var(--sub); align-self: center; }
    .colHead { display: none; }

    /* 選ぶ */
    .check { display: flex; align-items: center; gap: 12px; min-height: 48px; cursor: pointer; }
    .check input { width: 26px; height: 26px; flex-shrink: 0; accent-color: var(--main); cursor: pointer; }
    .check.all { font-size: 18px; font-weight: bold; flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .check.one { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; }
    .check.one .pos { font-size: 14px; color: var(--sub); }
    .company.picked { border-color: var(--main); }
    .tag {
      display: inline-block; margin-left: 8px; padding: 2px 10px; border-radius: 999px; vertical-align: middle;
      font-size: 14px; font-weight: normal; background: var(--chip); color: var(--chipText);
    }

    /* PC: 一覧を表っぽく横に並べる */
    @media (min-width: 800px) {
      body { padding: 36px 32px 60px; }
      .colHead, .person {
        display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1.4fr); gap: 12px; align-items: center;
      }
      .colHead { font-size: 14px; color: var(--sub); padding: 0 17px 6px; }
      .person .links { margin-top: 0; }
      .companyName { flex: 0 1 auto; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header class="appHeader">
    <div><div class="eyebrow">PARTNERS</div><h1>協力業者一覧</h1></div>
    <button id="reloadBtn" onclick="load()">↻ 更新</button>
  </header>

  <div id="main" style="display:none">
    <div class="tabs" role="tablist">
      <button id="tabList" class="on" role="tab" aria-selected="true" onclick="setMode('list')">一覧</button>
      <button id="tabPick" role="tab" aria-selected="false" onclick="setMode('pick')">名刺から選ぶ</button>
    </div>
    <div class="search">
      <input id="q" type="search" aria-label="検索" placeholder="会社・名前・業種・電話で検索" oninput="render()">
      <div class="chips" id="chips"></div>
      <div class="resultsBar"><div id="count" role="status"></div><div id="saving" role="status" aria-live="polite"></div></div>
    </div>
    <div id="listTools">
      <div id="addRow">
        <input id="newGyoshu" maxlength="30" aria-label="新しい業種名" placeholder="新しい業種名（例: 鳶・土工）" enterkeyhint="done" onkeydown="if (event.key === 'Enter') addGyoshu()">
        <button id="addGyoshuBtn" onclick="addGyoshu()">＋ 追加</button>
      </div>
      <p class="dragTip">会社の「⠿」をつまんで上の業種ボタンへドラッグすると、その業種に入ります（一覧では業種の枠でもOK。選ぶ画面ではチェックも付きます）。</p>
      <div id="exportRow">
        <input id="kojiName" maxlength="60" aria-label="工事名" placeholder="工事名（エクセルに入ります）" onchange="saveKoji()">
        <button id="exportBtn" onclick="exportExcel()">📥 エクセル出力</button>
      </div>
    </div>
    <div id="list"></div>
  </div>

  <div id="status" role="status" aria-live="polite"></div>

  <script>
    // ============================================
    // 協力業者用GAS WebアプリのURL（デプロイ後に貼る）
    // ============================================
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbykkzJKHWbnVt4XeR8o9RjlZmfnZM2lW3nOXqoixe4RYFlPRQA_nZ584puN8l30cyUC/exec';
    const FLAG_ON = '○';   // 協力業者だけど、まだ業種に入れていない
    const UNSORTED = '未振り分け';
    const CACHE_KEY = 'kyoryoku-cache';   // 前回のデータの保存名
    const KOJI_KEY = 'kyoryoku-koji';     // 前回入れた工事名の保存名
    const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

    let people = [];       // 名刺1枚 = 1人
    let customGyoshu = []; // 自分たちで追加した業種
    let mode = 'list';     // 'list' 一覧 / 'pick' 名刺から選ぶ
    let gyoshuSel = '';    // 選択中の業種（空なら全部）
    let pending = 0;       // 保存中の数
    let drag = null;       // ドラッグ中の情報
    let renderLater = false;

    try { document.getElementById('kojiName').value = localStorage.getItem(KOJI_KEY) || ''; } catch (e) { /* なくてもOK */ }
    load();

    // ---------- 通信 ----------
    async function api(body) {
      if (!GAS_URL) throw new Error('GAS_URL が未設定');
      const r = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(body),
      });
      const res = await r.json();
      if (!res.ok) throw new Error(res.error);
      return res.result;
    }

    // 前回のデータがあれば先に表示して、裏で最新を取ってきて差し替える
    async function load() {
      const reload = document.getElementById('reloadBtn');
      if (reload.disabled) return;
      reload.disabled = true;
      if (!people.length) {
        const cached = readCache();
        if (cached) { applyData(cached); showMain(); }
      }
      if (people.length) reload.textContent = '↻ 確認中…';
      else setStatus('読み込み中...');
      try {
        const res = await api({ action: 'list' });
        if (!pending) {   // 保存中なら、保存し終わるまで手元の状態を優先する
          applyData(res);
          writeCache();
          showMain();
        }
      } catch (err) {
        if (people.length) setSaving(0, '最新を読み込めませんでした（前回のデータを表示中）: ' + err.message);
        else setStatus('読み込めませんでした。更新ボタンで再試行してください。' + err.message, true);
      } finally {
        reload.disabled = false;
        reload.textContent = '↻ 更新';
      }
    }

    function applyData(res) {
      customGyoshu = res.gyoshu || [];
      people = res.people.filter(p => p['会社名'] || p['氏名']);
      people.forEach(p => {
        p._company = String(p['会社名'] || '（会社名なし）').trim();
        p._hay = norm([p['会社名'], p['業種'], p['部署'], p['役職'], p['氏名'], p['ふりがな'], p['電話'], p['携帯'], p['メール']].join(' '));
        applyFlag(p, p['協力業者']);
        p._boss = !!p['責任者'];
      });
      groupCompanies();
    }

    // 会社名（株式会社などを無視）か会社の電話番号が同じなら、同じ会社としてまとめる
    function groupCompanies() {
      const parent = {};
      const find = x => parent[x] === x ? x : (parent[x] = find(parent[x]));
      const union = (a, b) => { parent[find(a)] = find(b); };
      people.forEach(p => {
        const nodes = [];
        const key = companyKey(p['会社名']);
        if (key) nodes.push('n:' + key);
        splitNums(p['電話']).forEach(n => nodes.push('t:' + n.tel));
        if (!nodes.length) nodes.push('r:' + p._row);
        nodes.forEach(n => { if (!(n in parent)) parent[n] = n; });
        nodes.slice(1).forEach(n => union(n, nodes[0]));
        p._node = nodes[0];
      });
      const clusters = {};
      people.forEach(p => {
        const root = find(p._node);
        (clusters[root] || (clusters[root] = [])).push(p);
      });
      // 表示名は一番多く使われている書き方（同じ数なら長いほう）
      Object.values(clusters).forEach(list => {
        const cnt = {};
        list.forEach(p => { if (p['会社名']) cnt[p._company] = (cnt[p._company] || 0) + 1; });
        const name = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || b.length - a.length)[0] || list[0]._company;
        list.forEach(p => p._company = name);
      });
    }

    // 会社名の比べ用（株式会社・有限会社・(株) などと、全角半角・空白の違いを無視）
    function companyKey(name) {
      return norm(String(name || '').normalize('NFKC')
        .replace(/株式会社|有限会社|合同会社|合資会社|\(株\)|\(有\)|\(同\)/g, ''));
    }

    // 会社の並び順（株式会社などを無視した文字順）
    function cmpCompany(a, b) {
      return companyKey(a).localeCompare(companyKey(b), 'ja') || a.localeCompare(b, 'ja');
    }

    function showMain() {
      document.getElementById('main').style.display = 'block';
      setStatus('');
      render();
    }

    // ---------- 前回のデータ（この端末のブラウザに保存） ----------
    function readCache() {
      try {
        const c = JSON.parse(localStorage.getItem(CACHE_KEY));
        return c && Array.isArray(c.people) ? c : null;
      } catch (e) { return null; }
    }

    // 画面の今の状態（チェック・業種の変更後）を保存する
    function writeCache() {
      try {
        const out = people.map(p => {
          const o = {};
          Object.keys(p).forEach(k => { if (k[0] !== '_' || k === '_row') o[k] = p[k]; });
          o['協力業者'] = p._flag;
          o['責任者'] = p._boss ? FLAG_ON : '';
          return o;
        });
        localStorage.setItem(CACHE_KEY, JSON.stringify({ people: out, gyoshu: customGyoshu }));
      } catch (e) { /* 保存できなくても動作には関係ない */ }
    }

    // 「協力業者」列の値から、一覧での業種を決める
    function applyFlag(p, v) {
      p._flag = v || '';
      p._on = !!p._flag;
      p._gyoshu = (p._flag && p._flag !== FLAG_ON) ? p._flag : UNSORTED;
    }

    function setStatus(msg, ng) {
      const s = document.getElementById('status');
      s.textContent = msg;
      s.className = ng ? 'ng' : '';
    }

    // ---------- 表示 ----------
    // 全角半角・大小・カタカナひらがな・空白ハイフン括弧をそろえる
    function norm(s) {
      return String(s || '').normalize('NFKC').toLowerCase()
        .replace(/[ァ-ヶ]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60))
        .replace(/[\s\-‐‑–—−ー()（）]/g, '');
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, ch =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function setMode(m) {
      mode = m;
      document.getElementById('tabList').className = m === 'list' ? 'on' : '';
      document.getElementById('tabPick').className = m === 'pick' ? 'on' : '';
      document.getElementById('tabList').setAttribute('aria-selected', m === 'list');
      document.getElementById('tabPick').setAttribute('aria-selected', m === 'pick');
      gyoshuSel = '';
      render();
    }

    function pickGyoshu(g) {
      gyoshuSel = (gyoshuSel === g) ? '' : g;
      render();
    }

    // 自分たちで振り分けた業種でまとめる（選んでいない人は業種なし）
    function keyOf(p) { return p._on ? p._gyoshu : ''; }

    function render() {
      if (drag) { renderLater = true; return; }
      const isList = mode === 'list';
      const base = isList ? people.filter(p => p._on) : people;

      // 業種の並び（追加した順。未振り分けは最後）
      const count = {};
      base.forEach(p => count[keyOf(p)] = (count[keyOf(p)] || 0) + 1);
      const custom = customGyoshu.slice();
      const others = Object.keys(count).filter(g => g && !custom.includes(g))
        .sort((a, b) => gyoshuRank(a) - gyoshuRank(b) || count[b] - count[a]);
      const gyoshuList = custom.concat(others);
      if (gyoshuSel && !gyoshuList.includes(gyoshuSel)) gyoshuSel = '';

      const chip = (g, label) =>
        `<button class="${gyoshuSel === g ? 'on' : ''}" aria-pressed="${gyoshuSel === g}" data-g="${esc(g)}" onclick="pickGyoshu(this.dataset.g)">${esc(label)}</button>`;
      document.getElementById('chips').innerHTML =
        chip('', `すべて ${base.length}`) + gyoshuList.map(g => chip(g, `${g} ${count[g] || 0}`)).join('');

      // 絞り込み
      const words = document.getElementById('q').value.trim().split(/[\s　]+/).map(norm).filter(Boolean);
      const hit = base.filter(p => (!gyoshuSel || keyOf(p) === gyoshuSel) && words.every(w => p._hay.includes(w)));

      // 選ぶ画面: 業種で分けずに会社を並べる
      if (!isList) {
        const byCompany = {};
        hit.forEach(p => (byCompany[p._company] || (byCompany[p._company] = [])).push(p));
        const companies = Object.keys(byCompany).sort(cmpCompany);
        document.getElementById('count').textContent =
          `${companies.length}社 ${hit.length}人中 ${hit.filter(p => p._on).length}人を選択中`;
        document.getElementById('list').innerHTML =
          companies.map(c => pickHtml(c, byCompany[c])).join('') || emptyHtml(base.length);
        document.querySelectorAll('input[data-mixed="1"]').forEach(el => el.indeterminate = true);
        document.getElementById('exportRow').style.display = 'none';
        return;
      }

      // 一覧: 業種 → 会社 でまとめる
      const groups = {};
      hit.forEach(p => {
        const g = groups[keyOf(p)] || (groups[keyOf(p)] = {});
        (g[p._company] || (g[p._company] = [])).push(p);
      });

      const nCompany = Object.values(groups).reduce((n, g) => n + Object.keys(g).length, 0);
      document.getElementById('count').textContent = `${nCompany}社 ${hit.length}人`;

      // 追加した業種は空でも枠を出す（ドラッグの行き先になる）。検索中は出さない
      const show = gyoshuList.filter(g => groups[g] ||
        (custom.includes(g) && !words.length && (!gyoshuSel || gyoshuSel === g)));

      const html = show.map(g => {
        const companies = Object.keys(groups[g] || {}).sort(cmpCompany);
        const canDelete = custom.includes(g) && !count[g];
        return `<section class="group" data-g="${esc(g)}">
          <h2 class="groupTitle">${esc(g)}<span>${companies.length}社</span>
            ${custom.includes(g) ? `<button class="rename" data-g="${esc(g)}" onclick="renameGyoshu(this.dataset.g, this)">名前変更</button>` : ''}
            ${canDelete ? `<button data-g="${esc(g)}" onclick="deleteGyoshu(this.dataset.g, this)">削除</button>` : ''}</h2>
          ${companies.length ? '<div class="colHead"><div>担当</div><div>携帯</div><div>メール</div></div>' : ''}
          ${companies.length
            ? companies.map(c => companyHtml(g, c, groups[g][c])).join('')
            : '<div class="dropHint">ここに会社をドラッグ</div>'}
        </section>`;
      }).join('');

      document.getElementById('list').innerHTML = html || emptyHtml(base.length);
      document.getElementById('exportRow').style.display = '';

      // 会社まとめチェックの「一部だけ選択中」表示
      document.querySelectorAll('input[data-mixed="1"]').forEach(el => el.indeterminate = true);
    }

    function gyoshuRank(g) { return g === UNSORTED ? 1 : 0; }

    function emptyHtml(baseCount) {
      if (mode === 'list' && !people.some(p => p._on)) {
        return '<div class="empty"><strong>まだ協力業者がありません</strong>「名刺から選ぶ」でチェックすると、ここに載ります。</div>';
      }
      if (!baseCount) return '<div class="empty"><strong>名刺がありません</strong>名刺検索ツールで名刺を登録してください。</div>';
      return '<div class="empty"><strong>一致するものがありません</strong>キーワードや業種を変えてください。</div>';
    }

    // 一覧の会社カード（会社の電話は会社名の横に1回だけ）
    function companyHtml(g, company, list) {
      const seen = new Set();
      const tels = [];
      list.forEach(p => splitNums(p['電話']).forEach(n => {
        if (!seen.has(n.tel)) { seen.add(n.tel); tels.push(telLink(n)); }
      }));
      return `<div class="company" data-g="${esc(g)}" data-c="${esc(company)}">
        <div class="companyHead">
          <span class="grip" role="img" aria-label="ドラッグして業種を移動" onpointerdown="dragStart(event, this)">⠿</span>
          <div class="companyName">${esc(company)}</div>
          ${tels.length ? `<div class="links">${tels.join('')}</div>` : ''}
        </div>
        ${list.map(personHtml).join('')}
      </div>`;
    }

    function personHtml(p) {
      const pos = [p['部署'], p['役職']].filter(Boolean).join('　');
      const tels = splitNums(p['携帯']).map(telLink);
      const mails = String(p['メール'] || '').split('/').map(s => s.trim()).filter(Boolean)
        .map(m => `<a href="mailto:${esc(m)}">✉ ${esc(m)}</a>`);
      return `<div class="person">
        <div class="who"><div>${pos ? `<span class="pos">${esc(pos)}</span>` : ''}<b>${esc(p['氏名'] || '（氏名なし）')}</b></div>
          <button class="boss ${p._boss ? 'on' : ''}" aria-pressed="${p._boss}" onclick="toggleBoss(${Number(p._row)})">${p._boss ? '★責任者' : '☆責任者'}</button></div>
        <div class="links">${tels.join('') || '<span class="noData">携帯なし</span>'}</div>
        <div class="links">${mails.join('') || '<span class="noData">メールなし</span>'}</div>
      </div>`;
    }

    function telLink(n) {
      return `<a href="tel:${esc(n.tel)}" aria-label="${esc(n.text)}に電話">☎ ${esc(n.text)}</a>`;
    }

    // 「03-1234-5678 / 043-...」を1つずつに分ける
    function splitNums(s) {
      return String(s || '').split('/').map(x => x.trim())
        .map(x => ({ text: x, tel: x.replace(/[^\d+]/g, '') }))
        .filter(x => x.tel.length >= 6);
    }

    // 選ぶ画面の会社カード
    function pickHtml(company, list) {
      const rows = list.map(p => p._row).join(',');
      const nOn = list.filter(p => p._on).length;
      const all = nOn === list.length;
      // 見出しが無いので、チェック済みの人が入っている業種を会社名の横に出す
      const tags = [...new Set(list.filter(p => p._on).map(p => p._gyoshu))]
        .map(g => `<span class="tag">${esc(g)}</span>`).join('');
      return `<div class="company ${nOn ? 'picked' : ''}" data-g="" data-c="${esc(company)}">
        <div class="companyHead">
          <span class="grip" role="img" aria-label="ドラッグして業種に入れる" onpointerdown="dragStart(event, this)">⠿</span>
          <label class="check all"><input type="checkbox" data-rows="${rows}" ${all ? 'checked' : ''} data-mixed="${nOn && !all ? 1 : 0}" onchange="toggle(this)">
            <span>${esc(company)}${tags}</span></label>
        </div>
        ${list.map(p => `<label class="check one"><input type="checkbox" data-rows="${p._row}" ${p._on ? 'checked' : ''} onchange="toggle(this)">
          <span>${esc(p['氏名'] || '（氏名なし）')} <span class="pos">${esc(p['役職'] || '')}</span></span></label>`).join('')}
      </div>`;
    }

    // ---------- 保存 ----------
    // 選ぶ画面のチェック。同じ会社がもう業種に振り分け済みなら、その業種に入れる
    function toggle(el) {
      const on = el.checked;
      const rows = el.dataset.rows.split(',').map(Number);
      const targets = people.filter(p => rows.includes(Number(p._row)) && p._on !== on);
      if (!targets.length) return;
      const byCompany = {};
      targets.forEach(p => {
        let v = '';
        if (on) {
          const mate = people.find(m => m._on && m._company === p._company && m._flag !== FLAG_ON);
          v = mate ? mate._flag : FLAG_ON;
        }
        (byCompany[v] || (byCompany[v] = [])).push(p);
      });
      Object.keys(byCompany).forEach(v => save(byCompany[v], v));
    }

    // 会社を別の業種へ移す（選ぶ画面ではチェックしていない人もまとめてチェックして入れる）
    function moveCompany(from, company, to) {
      const targets = people.filter(p => p._company === company && (mode === 'pick' || (p._on && p._gyoshu === from)));
      if (targets.length) save(targets, to === UNSORTED ? FLAG_ON : to);
    }

    // field: '協力業者'（業種）か '責任者'
    async function save(targets, value, field) {
      field = field || '協力業者';
      const get = p => field === '責任者' ? (p._boss ? FLAG_ON : '') : p._flag;
      const set = (p, v) => field === '責任者' ? (p._boss = !!v) : applyFlag(p, v);
      const prev = targets.map(get);
      targets.forEach(p => set(p, value));
      render();
      setSaving(+1);
      try {
        const res = await api({
          action: 'set', field: field, value: value,
          items: targets.map(p => ({ row: p._row, name: p['氏名'], company: p['会社名'] })),
        });
        setSaving(-1);
        writeCache();
        if (res.skipped) {
          setSaving(0, `${res.skipped}件はシートの並びが変わっていたので保存できませんでした。読み直します`);
          load();
        }
      } catch (err) {
        targets.forEach((p, i) => set(p, prev[i]));
        render();
        setSaving(-1, '保存できませんでした: ' + err.message);
      }
    }

    // 責任者は1社に何人でも。押すたびに付け外しする
    function toggleBoss(row) {
      const p = people.find(x => Number(x._row) === Number(row));
      if (p) save([p], p._boss ? '' : FLAG_ON, '責任者');
    }

    function setSaving(d, ngMsg) {
      pending += d;
      const s = document.getElementById('saving');
      if (ngMsg) { s.textContent = ngMsg; s.className = 'ng'; return; }
      if (s.className === 'ng' && !pending) return;
      s.className = '';
      s.textContent = pending ? '保存中…' : '保存しました';
    }

    // ---------- 業種の追加・名前変更・削除 ----------
    async function addGyoshu() {
      const input = document.getElementById('newGyoshu');
      const name = input.value.trim();
      if (!name) { input.focus(); return; }
      if (name === UNSORTED) { setSaving(0, `「${UNSORTED}」は業種名に使えません`); return; }
      const btn = document.getElementById('addGyoshuBtn');
      btn.disabled = true;
      setSaving(+1);
      try {
        customGyoshu = await api({ action: 'addGyoshu', name: name });
        input.value = '';
        setSaving(-1);
        writeCache();
        gyoshuSel = '';
        render();
      } catch (err) {
        setSaving(-1, '追加できませんでした: ' + err.message);
      } finally { btn.disabled = false; }
    }

    async function renameGyoshu(from, btn) {
      const input = prompt(`「${from}」の新しい名前`, from);
      if (input == null) return;
      const to = input.trim();
      if (!to || to === from) return;
      if (to === UNSORTED || to === FLAG_ON) { setSaving(0, `「${to}」は業種名に使えません`); return; }
      if (to.length > 30) { setSaving(0, '業種名は30文字までにしてください'); return; }
      if (customGyoshu.includes(to) && !confirm(`「${to}」はもうあります。「${from}」の会社を「${to}」にまとめますか？`)) return;
      btn.disabled = true;
      setSaving(+1);
      try {
        const res = await api({ action: 'renameGyoshu', from: from, to: to });
        customGyoshu = res.gyoshu;
        people.forEach(p => { if (p._flag === from) applyFlag(p, to); });
        if (gyoshuSel === from) gyoshuSel = to;
        setSaving(-1);
        writeCache();
        render();
      } catch (err) {
        btn.disabled = false;
        setSaving(-1, '名前を変えられませんでした: ' + err.message);
      }
    }

    async function deleteGyoshu(name, btn) {
      btn.disabled = true;
      setSaving(+1);
      try {
        customGyoshu = await api({ action: 'deleteGyoshu', name: name });
        setSaving(-1);
        writeCache();
        render();
      } catch (err) {
        btn.disabled = false;
        setSaving(-1, '削除できませんでした: ' + err.message);
      }
    }

    // ---------- エクセル出力 ----------
    // 業種に入れた会社だけ、一覧と同じ順番で「工事名・業種名・会社名・責任者名・電話番号」を出す
    async function exportExcel() {
      const byGyoshu = {};
      people.filter(p => p._on && p._gyoshu !== UNSORTED).forEach(p => {
        const g = byGyoshu[p._gyoshu] || (byGyoshu[p._gyoshu] = {});
        (g[p._company] || (g[p._company] = [])).push(p);
      });
      const order = customGyoshu.concat(Object.keys(byGyoshu).filter(g => !customGyoshu.includes(g)))
        .filter(g => byGyoshu[g]);
      if (!order.length) { setSaving(0, '業種に入れた会社がないので、出力できるものがありません'); return; }

      const koji = document.getElementById('kojiName').value.trim();
      saveKoji();

      // 責任者: 選んだ人全員（1人1行） → いなければチェックが1人だけならその人 → それ以外は空欄
      // 電話番号は会社の番号（同じ会社の名刺の「電話」から、同じ番号は1つにまとめる）
      const rows = [['工事名', '業種名', '会社名', '責任者名', '電話番号']];
      const noBoss = [];
      order.forEach(g => Object.keys(byGyoshu[g]).sort(cmpCompany).forEach(c => {
        const list = byGyoshu[g][c];
        let bosses = list.filter(p => p._boss);
        if (!bosses.length && list.length === 1) bosses = list;
        if (!bosses.length) noBoss.push(c);
        const seen = new Set();
        const tels = [];
        people.filter(p => p._company === c).forEach(p => splitNums(p['電話']).forEach(n => {
          if (!seen.has(n.tel)) { seen.add(n.tel); tels.push(n.text); }
        }));
        // 責任者が何人かいれば、1人1行で出す
        (bosses.length ? bosses : [null]).forEach(b =>
          rows.push([koji, g, c, b ? b['氏名'] : '', tels.join(' / ')]));
      }));
      if (noBoss.length && !confirm(`責任者が決まっていない会社が${noBoss.length}社あります（${noBoss.slice(0, 3).join('、')}${noBoss.length > 3 ? ' など' : ''}）。\n責任者名を空欄のまま出力しますか？`)) return;

      const safe = s => s.replace(/[\\/:*?"<>|]/g, '').slice(0, 40);
      const fileName = `協力業者一覧${koji ? '_' + safe(koji) : ''}.xlsx`;

      // PCのChrome・Edgeは保存先を選べる（前のファイルを選べば上書き）。ボタンを押した直後に開く必要があるので最初に出す
      let handle = null;
      if (window.showSaveFilePicker) {
        try {
          handle = await showSaveFilePicker({
            suggestedName: fileName,
            types: [{ description: 'Excel', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }],
          });
        } catch (err) {
          if (err.name === 'AbortError') return;   // キャンセル
          handle = null;                           // 開けなかったら普通のダウンロードにする
        }
      }

      const btn = document.getElementById('exportBtn');
      btn.disabled = true;
      try {
        await loadXlsx();
        const ws = XLSX.utils.aoa_to_sheet(rows);
        ws['!cols'] = [{ wch: 30 }, { wch: 16 }, { wch: 34 }, { wch: 16 }, { wch: 30 }];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, '協力業者一覧');
        if (handle) {
          const w = await handle.createWritable();
          await w.write(XLSX.write(wb, { bookType: 'xlsx', type: 'array' }));
          await w.close();
          setSaving(0);
          document.getElementById('saving').textContent = `「${handle.name}」に保存しました`;
        } else {
          XLSX.writeFile(wb, fileName);
        }
      } catch (err) {
        const locked = err.name === 'NoModificationAllowedError' || err.name === 'InvalidStateError';
        setSaving(0, locked
          ? '保存できませんでした。エクセルでそのファイルを開いていたら閉じてから、もう一度出力してください'
          : 'エクセルを作れませんでした: ' + err.message);
      } finally { btn.disabled = false; }
    }

    function saveKoji() {
      try { localStorage.setItem(KOJI_KEY, document.getElementById('kojiName').value.trim()); } catch (e) { /* なくてもOK */ }
    }

    // エクセル用のライブラリは、出力するときだけ読み込む（開くのが遅くならないように）
    function loadXlsx() {
      if (window.XLSX) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = XLSX_URL;
        s.onload = resolve;
        s.onerror = () => reject(new Error('ライブラリを読み込めませんでした（電波を確認してください）'));
        document.head.appendChild(s);
      });
    }

    // ---------- ドラッグ（マウス・指どちらでも） ----------
    function dragStart(e, grip) {
      if (e.button > 0 || drag) return;
      e.preventDefault();
      const card = grip.closest('.company');
      const r = card.getBoundingClientRect();
      const ghost = card.cloneNode(true);
      ghost.classList.add('ghost');
      ghost.style.width = r.width + 'px';
      ghost.style.left = r.left + 'px';
      ghost.style.top = r.top + 'px';
      document.body.appendChild(ghost);
      card.classList.add('dragging');
      document.body.classList.add('isDragging');
      drag = {
        card: card, ghost: ghost, grip: grip, from: card.dataset.g, company: card.dataset.c,
        dx: e.clientX - r.left, dy: e.clientY - r.top, x: e.clientX, y: e.clientY, over: null,
        top: document.querySelector('.search').getBoundingClientRect().bottom, // 検索欄の下から自動スクロール
        timer: setInterval(autoScroll, 16),
      };
      grip.setPointerCapture(e.pointerId);
      grip.onpointermove = dragMove;
      grip.onpointerup = () => dragEnd(true);
      grip.onpointercancel = () => dragEnd(false);
    }

    function dragMove(e) {
      if (!drag) return;
      drag.x = e.clientX;
      drag.y = e.clientY;
      drag.ghost.style.left = (e.clientX - drag.dx) + 'px';
      drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
      updateOver();
    }

    // 指の下にある業種の枠・上の業種ボタンを光らせる（「すべて」ボタンは対象外）
    function updateOver() {
      const el = document.elementFromPoint(drag.x, drag.y);
      const sec = el && (el.closest('.chips button[data-g]:not([data-g=""])') || el.closest('.group'));
      if (sec === drag.over) return;
      if (drag.over) drag.over.classList.remove('over');
      drag.over = (sec && sec.dataset.g !== drag.from) ? sec : null;
      if (drag.over) drag.over.classList.add('over');
    }

    // 画面の端に来たら自動でスクロール
    // 業種ボタンの列の左右の端では、ボタンの列を横にスクロール
    function autoScroll() {
      if (!drag) return;
      const m = 80;
      const chips = document.getElementById('chips');
      const cr = chips.getBoundingClientRect();
      if (drag.y >= cr.top && drag.y <= cr.bottom) {
        const e = 48;
        let h = 0;
        if (drag.x < cr.left + e) h = -8;
        else if (drag.x > cr.right - e) h = 8;
        if (h) { chips.scrollLeft += h; updateOver(); }
        return;
      }
      let d = 0;
      const top = Math.max(drag.top, 0);
      if (drag.y >= top && drag.y < top + m) d = -Math.ceil((top + m - drag.y) / 6);
      else if (drag.y > innerHeight - m) d = Math.ceil((drag.y - innerHeight + m) / 6);
      if (d) { scrollBy(0, d); updateOver(); }
    }

    function dragEnd(drop) {
      if (!drag) return;
      const d = drag;
      drag = null;
      clearInterval(d.timer);
      d.grip.onpointermove = d.grip.onpointerup = d.grip.onpointercancel = null;
      d.ghost.remove();
      d.card.classList.remove('dragging');
      document.body.classList.remove('isDragging');
      if (d.over) d.over.classList.remove('over');
      if (drop && d.over) moveCompany(d.from, d.company, d.over.dataset.g);
      else if (renderLater) render();
      renderLater = false;
    }
  </script>
</body>
