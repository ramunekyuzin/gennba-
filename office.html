<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f6fb" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="事務所ツール">
<title>事務所ツール</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563eb'/%3E%3Cpath d='M17 18h30v8H17zm0 12h13v16H17zm17 0h13v16H34z' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f1ea; --paper: #ffffff; --ink: #1f2933; --ink-2: #5b6570;
    --line: #dcd6c8; --accent: #c2410c; --accent-soft: #fde8dc; --muted: #e9e4d8;
    --danger: #b91c1c;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 18px rgba(0,0,0,.05);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161b22; --paper: #1f2731; --ink: #eef1f5; --ink-2: #a3adb8;
      --line: #313b47; --accent: #fb923c; --accent-soft: #3a2a1f; --muted: #2a3340;
      --danger: #f87171;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 80px; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  header h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: .02em; }
  header h1 small { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); letter-spacing: .08em; margin-bottom: 2px; }
  .clock { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 14px; text-align: right; white-space: nowrap; }

  .search {
    display: flex; align-items: center; gap: 10px; background: var(--paper);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px;
    margin-bottom: 22px; box-shadow: var(--shadow);
  }
  .search svg { flex: none; width: 20px; height: 20px; stroke: var(--ink-2); }
  .search input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; font-size: 17px; min-width: 0; }
  .search input::placeholder { color: var(--ink-2); }
  .search button { display: none; border: 0; background: var(--muted); color: var(--ink-2); width: 32px; height: 32px; border-radius: 50%; font-size: 18px; line-height: 1; cursor: pointer; }
  .search.has-text button { display: inline-flex; align-items: center; justify-content: center; }

  section { margin-bottom: 26px; }
  section h2 { font-size: 15px; font-weight: 700; color: var(--ink-2); margin: 0 0 10px 2px; display: flex; align-items: center; gap: 8px; }
  section h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  section.hidden { display: none; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }

  .card {
    position: relative; display: flex; gap: 14px; align-items: center;
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; min-height: 84px; text-decoration: none; color: inherit;
    box-shadow: var(--shadow); transition: transform .08s ease, border-color .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .card:active { transform: scale(.985); }
  .card:hover { border-color: var(--accent); }
  .card.hidden { display: none; }
  .icon { flex: none; width: 48px; height: 48px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 22px; font-weight: 800; }
  .body { flex: 1; min-width: 0; }
  .name { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .desc { font-size: 14px; color: var(--ink-2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .arrow { flex: none; color: var(--ink-2); font-size: 20px; }
  .tag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--muted); color: var(--ink-2); white-space: nowrap; }
  .card.soon { opacity: .6; cursor: default; }
  .card.soon:hover { border-color: var(--line); }
  .card.soon:active { transform: none; }

  /* 編集モード */
  .tools { position: absolute; top: 8px; right: 8px; display: none; gap: 6px; }
  body.edit .tools { display: flex; }
  body.edit .card { padding-right: 90px; }
  body.edit .arrow { display: none; }
  .tools button { border: 0; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; background: var(--muted); color: var(--ink); }
  .tools button.del { color: var(--danger); }

  .fab {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
    display: flex; gap: 10px; z-index: 5;
  }
  .fab button {
    border: 0; border-radius: 999px; padding: 14px 20px; font: inherit; font-size: 15px; font-weight: 700;
    background: var(--paper); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); cursor: pointer;
  }
  .fab button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .fab button.add { display: none; }
  body.edit .fab button.add { display: inline-block; }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .modal-bg.show { display: flex; }
  .modal {
    width: 100%; max-width: 560px; background: var(--paper); color: var(--ink);
    border-radius: 18px 18px 0 0; padding: 20px 18px calc(24px + env(safe-area-inset-bottom));
    max-height: 90vh; overflow: auto;
  }
  @media (min-width: 600px) { .modal-bg { align-items: center; } .modal { border-radius: 18px; } }
  .modal h3 { margin: 0 0 14px; font-size: 18px; }
  .modal label { display: block; font-size: 13px; color: var(--ink-2); margin: 10px 0 4px; }
  .modal input, .modal select {
    width: 100%; padding: 13px; font: inherit; font-size: 16px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--bg); color: var(--ink);
  }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; min-width: 0; }
  .btns { display: flex; gap: 10px; margin-top: 18px; }
  .btns button { flex: 1; border: 0; border-radius: 12px; padding: 15px; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
  .btns .ok { background: var(--accent); color: #fff; }
  .btns .cancel { background: var(--muted); color: var(--ink); }
  .btns button:disabled { opacity: .5; }
  .msg { font-size: 14px; margin-top: 10px; min-height: 20px; }
  .msg.ng { color: var(--danger); }

  .empty, .loading { text-align: center; color: var(--ink-2); padding: 32px 0; }
  .empty { display: none; }
  .empty.show { display: block; }
  footer { text-align: center; color: var(--ink-2); font-size: 12px; margin-top: 30px; }

  /* 2026 redesign: professional, clean and touch-friendly */
  :root {
    --bg:#f3f6fb; --paper:#fff; --ink:#172033; --ink-2:#667085;
    --line:#e3e8f0; --accent:#2563eb; --accent-soft:#eaf2ff;
    --muted:#f1f4f8; --danger:#dc2626;
    --shadow:0 8px 30px rgba(15,23,42,.07); --radius:18px;
  }
  @media (prefers-color-scheme:dark) {
    :root {
      --bg:#0b1019; --paper:#141c2a; --ink:#f0f4fa; --ink-2:#9aa7ba;
      --line:#263246; --accent:#60a5fa; --accent-soft:#182a46;
      --muted:#1d2737; --danger:#f87171;
      --shadow:0 10px 34px rgba(0,0,0,.28);
    }
  }
  button,input,a { -webkit-tap-highlight-color:transparent; }
  button:focus-visible,input:focus-visible,a:focus-visible { outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent); outline-offset:3px; }
  .wrap { max-width:1040px; padding:24px 18px 104px; }
  .hero { position:relative; overflow:hidden; border-radius:26px; padding:28px; margin-bottom:18px; color:#fff; background:linear-gradient(135deg,#111827 0%,#1e3a8a 68%,#075985 100%); box-shadow:0 18px 48px rgba(15,23,42,.18); }
  .hero::after { content:""; position:absolute; width:260px; height:260px; right:-80px; top:-120px; border-radius:50%; border:50px solid rgba(255,255,255,.06); pointer-events:none; }
  header { position:relative; z-index:1; align-items:flex-start; margin-bottom:0; }
  header h1 { font-size:clamp(25px,4vw,34px); font-weight:850; line-height:1.25; }
  header h1 small { color:#93c5fd; font-size:12px; font-weight:700; letter-spacing:.15em; margin-bottom:5px; }
  .clock { color:#dbeafe; padding:7px 11px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); border-radius:999px; backdrop-filter:blur(8px); }
  .summary { position:relative; z-index:1; display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
  .summary-item { display:flex; align-items:center; gap:8px; min-height:34px; padding:6px 12px; border-radius:10px; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.1); color:#dbeafe; font-size:13px; }
  .summary-item strong { color:#fff; font-size:15px; }
  .theme-panel { display:flex; align-items:center; gap:8px; margin:0 0 18px; padding:10px; overflow-x:auto; scrollbar-width:none; background:var(--paper); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); }
  .theme-panel::-webkit-scrollbar { display:none; }
  .theme-label { flex:none; padding:0 7px; color:var(--ink-2); font-size:13px; font-weight:800; }
  .mode-divider { flex:none; width:1px; height:26px; background:var(--line); margin:0 2px; }
  .theme-btn { flex:none; border:1px solid var(--line); background:var(--muted); color:var(--ink-2); border-radius:999px; padding:8px 12px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; transition:.15s; }
  .theme-btn:hover { border-color:var(--accent); color:var(--accent); }
  .theme-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 28%,transparent); }
  .edit-status { display:none; align-items:center; color:#fff; background:rgba(37,99,235,.78); border:1px solid rgba(255,255,255,.15); border-radius:999px; padding:5px 10px; font-size:12px; font-weight:800; }
  body.edit .edit-status { display:inline-flex; }
  body.edit .hero { box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 38%,transparent),0 18px 48px rgba(15,23,42,.18); }
  .search { padding:14px 16px; margin-bottom:28px; border-radius:16px; transition:border-color .2s,box-shadow .2s; }
  .search:focus-within { border-color:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 11%,transparent),var(--shadow); }
  section { margin-bottom:32px; }
  section h2 { color:var(--ink); font-weight:800; margin-bottom:12px; letter-spacing:.02em; }
  .section-count { color:var(--ink-2); background:var(--muted); border:1px solid var(--line); border-radius:999px; font-size:12px; padding:2px 8px; }
  .grid { grid-template-columns:repeat(auto-fill,minmax(285px,1fr)); gap:14px; }
  .card { min-height:94px; padding:17px; transition:transform .18s,border-color .18s,box-shadow .18s; }
  .card:hover { border-color:color-mix(in srgb,var(--accent) 45%,var(--line)); transform:translateY(-2px); box-shadow:0 16px 40px rgba(37,99,235,.14); }
  .icon { width:52px; height:52px; border-radius:15px; background:linear-gradient(145deg,var(--accent-soft),color-mix(in srgb,var(--accent-soft) 75%,var(--paper))); font-size:21px; font-weight:850; border:1px solid color-mix(in srgb,var(--accent) 12%,transparent); }
  .name { font-size:16px; font-weight:800; flex-wrap:wrap; line-height:1.4; }
  .desc { margin-top:4px; }
  .arrow { color:var(--accent); font-size:22px; transition:transform .18s; }
  .card:hover .arrow { transform:translateX(3px); }
  .card.soon { opacity:.68; box-shadow:none; }
  .fab { right:max(18px,calc((100vw - 1040px)/2)); bottom:calc(18px + env(safe-area-inset-bottom)); }
  .fab button { box-shadow:0 10px 30px rgba(15,23,42,.16); transition:transform .15s,box-shadow .15s; }
  .fab button:hover { transform:translateY(-2px); box-shadow:0 14px 34px rgba(15,23,42,.22); }
  .modal-bg { background:rgba(3,7,18,.62); backdrop-filter:blur(5px); }
  .modal { border-radius:24px 24px 0 0; padding:24px 22px calc(26px + env(safe-area-inset-bottom)); }
  .modal h3 { font-size:20px; margin-bottom:17px; }
  .modal label { font-size:14px; font-weight:700; margin-top:12px; }
  .modal input { border-radius:12px; transition:border-color .15s,box-shadow .15s; }
  .modal input:focus { outline:0; border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 12%,transparent); }
  .empty,.loading { padding:48px 20px; background:var(--paper); border:1px dashed var(--line); border-radius:var(--radius); }
  .loading::before { content:""; display:block; width:26px; height:26px; margin:0 auto 12px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (min-width:600px) { .modal { border-radius:24px; } }
  @media (max-width:600px) {
    .wrap { padding:14px 12px 100px; }
    .hero { border-radius:20px; padding:21px 18px 19px; }
    .clock { font-size:12px; padding:6px 9px; }
    .summary { margin-top:18px; }
    .summary-item { font-size:12px; }
    .search { position:sticky; top:8px; z-index:4; margin-bottom:24px; }
    .grid { grid-template-columns:1fr; }
    .card { min-height:88px; }
    .fab { right:12px; }
    .fab button { padding:13px 17px; }
  }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }

  /* B: 現場オレンジ — 親しみやすく視認性の高い業務画面 */
  html[data-theme="orange"] {
    --bg:#f7f5f0; --paper:#fffefa; --ink:#29251f; --ink-2:#726b61;
    --line:#e7dfd2; --accent:#e65b16; --accent-soft:#fff0e5; --muted:#f3eee5;
    --shadow:0 7px 24px rgba(80,55,24,.08);
  }
  html[data-theme="orange"] .hero { color:#2c2115; background:linear-gradient(135deg,#fff8ed 0%,#ffd8a8 55%,#fb923c 130%); box-shadow:0 18px 44px rgba(194,65,12,.14); border:1px solid #f5c98f; }
  html[data-theme="orange"] .hero::after { border-color:rgba(234,88,12,.08); }
  html[data-theme="orange"] header h1 small { color:#c2410c; }
  html[data-theme="orange"] .clock,html[data-theme="orange"] .summary-item { color:#6b4024; background:rgba(255,255,255,.44); border-color:rgba(194,65,12,.14); }
  html[data-theme="orange"] .summary-item strong { color:#2c2115; }

  /* C: モノクロ — 図面や資料になじむシャープな設計 */
  html[data-theme="mono"] {
    --bg:#f2f2f2; --paper:#fff; --ink:#111; --ink-2:#666;
    --line:#d8d8d8; --accent:#111; --accent-soft:#eeeeee; --muted:#f3f3f3;
    --shadow:0 5px 0 rgba(0,0,0,.07); --radius:8px;
  }
  html[data-theme="mono"] .hero { color:#fff; background:#151515; border-radius:8px; box-shadow:8px 8px 0 #cfcfcf; }
  html[data-theme="mono"] .hero::after { width:190px; height:190px; border-radius:0; border:1px solid rgba(255,255,255,.16); transform:rotate(24deg); }
  html[data-theme="mono"] header h1 { letter-spacing:-.03em; }
  html[data-theme="mono"] header h1 small { color:#bbb; }
  html[data-theme="mono"] .clock,html[data-theme="mono"] .summary-item { color:#ddd; border-radius:3px; }
  html[data-theme="mono"] .summary-item strong { color:#fff; }
  html[data-theme="mono"] .search,html[data-theme="mono"] .theme-panel,html[data-theme="mono"] .card,html[data-theme="mono"] .icon { border-radius:6px; }
  html[data-theme="mono"] .card:hover { box-shadow:6px 6px 0 #cfcfcf; border-color:#111; }
  html[data-theme="mono"] .theme-btn { border-radius:4px; }

  /* D: エメラルド — 柔らかく見やすいデジタル管理画面 */
  html[data-theme="emerald"] {
    --bg:#eef7f4; --paper:#ffffff; --ink:#17332c; --ink-2:#647d76;
    --line:#d8e9e3; --accent:#0f8a70; --accent-soft:#def5ed; --muted:#e8f2ee;
    --shadow:0 10px 28px rgba(15,118,110,.08); --radius:20px;
  }
  html[data-theme="emerald"] .hero { background:linear-gradient(135deg,#064e3b 0%,#0f766e 60%,#0891b2 120%); box-shadow:0 18px 46px rgba(6,78,59,.2); }
  html[data-theme="emerald"] header h1 small { color:#99f6e4; }
  html[data-theme="emerald"] .clock,html[data-theme="emerald"] .summary-item { color:#ccfbf1; }
  html[data-theme="emerald"] .card:hover { box-shadow:0 16px 40px rgba(15,138,112,.15); }

  /* 表示モード：4テーマすべてに適用 */
  html[data-mode="dark"] {
    color-scheme:dark;
    --bg:#0b1019; --paper:#141c2a; --ink:#f0f4fa; --ink-2:#9aa7ba;
    --line:#29354a; --accent-soft:#182a46; --muted:#1d2737;
    --danger:#f87171; --shadow:0 10px 34px rgba(0,0,0,.3);
  }
  html[data-mode="dark"][data-theme="blue"] { --accent:#60a5fa; }
  html[data-mode="dark"][data-theme="orange"] { --accent:#fb923c; --accent-soft:#3c281d; }
  html[data-mode="dark"][data-theme="orange"] .hero { color:#fff; background:linear-gradient(135deg,#1c1917 0%,#7c2d12 72%,#c2410c 130%); border-color:#7c2d12; box-shadow:0 18px 46px rgba(0,0,0,.3); }
  html[data-mode="dark"][data-theme="orange"] .clock,html[data-mode="dark"][data-theme="orange"] .summary-item { color:#ffedd5; background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.12); }
  html[data-mode="dark"][data-theme="orange"] .summary-item strong { color:#fff; }
  html[data-mode="dark"][data-theme="mono"] { --accent:#f5f5f5; --accent-soft:#292929; --bg:#090909; --paper:#161616; --ink:#f5f5f5; --ink-2:#aaa; --line:#363636; --muted:#242424; }
  html[data-mode="dark"][data-theme="mono"] .hero { background:#050505; box-shadow:8px 8px 0 #333; }
  html[data-mode="dark"][data-theme="mono"] .card:hover { box-shadow:6px 6px 0 #333; border-color:#eee; }
  html[data-mode="dark"][data-theme="emerald"] { --accent:#34d399; --accent-soft:#153b34; --bg:#081612; --paper:#10231f; --ink:#ecfdf5; --ink-2:#92b8ad; --line:#244039; --muted:#19302a; }
  html[data-mode="dark"][data-theme="emerald"] .hero { background:linear-gradient(135deg,#022c22 0%,#115e59 68%,#155e75 120%); }

/* Explicit light palettes stay light regardless of device appearance. */
html[data-mode="light"]{color-scheme:light;--bg:#f3f6fb;--paper:#fff;--ink:#172033;--ink-2:#667085;--line:#e3e8f0;--accent:#2563eb;--accent-soft:#eaf2ff;--muted:#f1f4f8;--danger:#dc2626;--shadow:0 8px 30px #0f172a12}
html[data-mode="light"][data-theme="orange"]{--bg:#f7f5f0;--paper:#fffefa;--ink:#29251f;--ink-2:#726b61;--line:#e7dfd2;--accent:#bd4b12;--accent-soft:#fff0e5;--muted:#f3eee5}
html[data-mode="light"][data-theme="mono"]{--bg:#f2f2f2;--paper:#fff;--ink:#111;--ink-2:#666;--line:#d8d8d8;--accent:#111;--accent-soft:#eee;--muted:#f3f3f3}
html[data-mode="light"][data-theme="emerald"]{--bg:#eef7f4;--paper:#fff;--ink:#17332c;--ink-2:#647d76;--line:#d8e9e3;--accent:#0f8068;--accent-soft:#def5ed;--muted:#e8f2ee}
.theme-panel{flex-wrap:wrap;overflow:visible}.unit-panel[hidden]{display:none!important}.unit-mark{display:none}.theme-btn.active{background:var(--accent);color:var(--paper)}html[data-mode="dark"] .theme-btn.active,html[data-mode="dark"] .fab .primary,html[data-mode="dark"] .btns .ok{color:var(--bg)}
/* UNIT 01: angular command panels */
html[data-mode="dark"][data-look="eva"]{--bg:#080b0e;--paper:#10161b;--ink:#e2e9e6;--ink-2:#9cafae;--line:#2b3e41;--accent:#b8f33c;--accent-soft:#26371b;--muted:#1b272c;--danger:#ff946c;--violet:#a080e7;--purple:#7652b2;--warning:#f18b35;--shadow:none;--radius:0px}
html[data-mode="dark"][data-look="eva"][data-unit="unit00"]{--bg:#070d14;--paper:#0d1a27;--line:#2b4358;--accent:#63d6ff;--accent-soft:#15354a;--muted:#142c3d;--violet:#87baff;--purple:#326999;--warning:#ffb554;--ink-2:#a3b8cd}
html[data-mode="dark"][data-look="eva"][data-unit="unit02"]{--bg:#130909;--paper:#211113;--line:#563237;--accent:#ff7666;--accent-soft:#421e23;--muted:#301a20;--violet:#ffb157;--purple:#a83b3e;--warning:#ffb157;--ink-2:#d0a9ab}
html[data-mode="dark"][data-look="eva"][data-unit="amber"]{--bg:#100d06;--paper:#1c180f;--line:#4d4127;--accent:#ffc75c;--accent-soft:#382b13;--muted:#292312;--violet:#ffdb87;--purple:#94702d;--warning:#f89c49;--ink-2:#c4b595}
html[data-mode="dark"][data-look="eva"] body{background:linear-gradient(#93b19f08 1px,transparent 1px),linear-gradient(90deg,#93b19f08 1px,transparent 1px),var(--bg);background-size:32px 32px}
html[data-mode="dark"][data-look="eva"] .hero{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-top:6px solid var(--purple);border-radius:0;box-shadow:none;padding-right:166px}
html[data-mode="dark"][data-look="eva"] .hero::after{display:none}html[data-mode="dark"][data-look="eva"] header{display:block}html[data-mode="dark"][data-look="eva"] header h1{font-size:clamp(30px,5vw,48px);letter-spacing:.07em;font-weight:900}html[data-mode="dark"][data-look="eva"] header h1 small{font-family:monospace;color:var(--warning);font-size:10px;letter-spacing:.1em}
html[data-mode="dark"][data-look="eva"] .clock{display:inline-block;border:0;border-left:2px solid var(--violet);border-radius:0;background:transparent;color:var(--ink-2);margin-top:15px;backdrop-filter:none;padding:0 10px;font-size:12px}
html[data-mode="dark"][data-look="eva"] .unit-mark{display:flex;position:absolute;right:26px;top:30px;width:105px;flex-direction:column;align-items:center;color:var(--violet);border-left:1px solid var(--line)}.unit-mark small{font-size:10px;letter-spacing:.2em}.unit-mark strong{font-family:Impact,monospace;font-size:76px;line-height:1.2}
html[data-mode="dark"][data-look="eva"] .summary-item{background:transparent;border:1px solid var(--line);border-radius:0;color:var(--ink-2);font-size:11px}html[data-mode="dark"][data-look="eva"] .summary-item strong{color:var(--accent)}
html[data-mode="dark"][data-look="eva"] .theme-panel,html[data-mode="dark"][data-look="eva"] .theme-btn,html[data-mode="dark"][data-look="eva"] .search,html[data-mode="dark"][data-look="eva"] .card,html[data-mode="dark"][data-look="eva"] .icon,html[data-mode="dark"][data-look="eva"] .modal,html[data-mode="dark"][data-look="eva"] .modal input,html[data-mode="dark"][data-look="eva"] .fab button{border-radius:0;box-shadow:none}
html[data-mode="dark"][data-look="eva"] .card{border-top:3px solid var(--purple);background:var(--paper)}html[data-mode="dark"][data-look="eva"] .card:hover{border-color:var(--accent);box-shadow:none}html[data-mode="dark"][data-look="eva"] .icon{background:var(--accent-soft);color:var(--accent);border:1px solid var(--line)}html[data-mode="dark"][data-look="eva"] section h2{font-size:14px;color:var(--violet);letter-spacing:.09em}html[data-mode="dark"][data-look="eva"] .section-count,html[data-mode="dark"][data-look="eva"] .tag{border-radius:2px}html[data-mode="dark"][data-look="eva"] .modal{border-top:4px solid var(--purple)}
/* UNIT 00: instrument rings and curved frames */
html[data-mode="dark"][data-look="eva"][data-unit="unit00"] .hero{border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:26px 4px 26px 4px;background:radial-gradient(circle at 90% 10%,#21538555,transparent 65%),var(--paper)}html[data-mode="dark"][data-look="eva"][data-unit="unit00"] header h1{font-weight:600;letter-spacing:.14em}html[data-mode="dark"][data-look="eva"][data-unit="unit00"] .unit-mark{border:1px solid var(--accent);border-radius:50%;height:100px;width:100px;justify-content:center;outline:1px solid var(--line);outline-offset:5px}html[data-mode="dark"][data-look="eva"][data-unit="unit00"] .unit-mark strong{font-size:46px}html[data-mode="dark"][data-look="eva"][data-unit="unit00"] .card{border:1px solid var(--line);border-left:3px solid var(--purple);border-radius:17px 3px 17px 3px}html[data-mode="dark"][data-look="eva"][data-unit="unit00"] .icon{border-radius:50%}html[data-mode="dark"][data-look="eva"][data-unit="unit00"] .search,html[data-mode="dark"][data-look="eva"][data-unit="unit00"] .modal{border-radius:14px}html[data-mode="dark"][data-look="eva"][data-unit="unit00"] section h2::after{height:3px;background:transparent;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
/* UNIT 02: offset red borders and slanted headings */
html[data-mode="dark"][data-look="eva"][data-unit="unit02"] .hero{border:0;border-left:9px solid var(--accent);border-bottom:4px solid var(--violet);background:linear-gradient(125deg,#8d272733,transparent),var(--paper)}html[data-mode="dark"][data-look="eva"][data-unit="unit02"] header h1{font-style:italic;letter-spacing:.02em}html[data-mode="dark"][data-look="eva"][data-unit="unit02"] .unit-mark{border:0;border-bottom:6px solid var(--violet);background:var(--purple);color:#fff1d6;transform:skew(-5deg)}html[data-mode="dark"][data-look="eva"][data-unit="unit02"] .card{border:1px solid var(--line);border-left:5px solid var(--purple);box-shadow:3px 3px 0 var(--line)}html[data-mode="dark"][data-look="eva"][data-unit="unit02"] section h2{background:var(--accent-soft);padding:10px 12px;border-left:4px solid var(--accent)}html[data-mode="dark"][data-look="eva"][data-unit="unit02"] .icon{border:0;border-bottom:3px solid var(--violet)}
html[data-mode="dark"][data-look="eva"][data-unit="amber"] .hero{border:1px dashed var(--violet);border-top:5px solid var(--purple)}html[data-mode="dark"][data-look="eva"][data-unit="amber"] .card{border:1px dashed var(--line);border-top:3px solid var(--purple)}html[data-mode="dark"][data-look="eva"][data-unit="amber"] header h1{font-family:monospace;font-weight:600}html[data-mode="dark"][data-look="eva"][data-unit="amber"] section h2::after{height:3px;background:transparent;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
@media(max-width:600px){.theme-panel{gap:6px}.theme-btn{padding:8px 10px;font-size:11px}.mode-divider{display:none}.theme-label{font-size:11px}html[data-mode="dark"][data-look="eva"] .hero{padding:22px 98px 22px 18px}html[data-mode="dark"][data-look="eva"] header h1{font-size:29px}html[data-mode="dark"][data-look="eva"] .unit-mark{right:15px;top:28px;width:66px}.unit-mark strong{font-size:52px}html[data-mode="dark"][data-look="eva"][data-unit="unit00"] .unit-mark{width:64px;height:64px}html[data-mode="dark"][data-look="eva"][data-unit="unit00"] .unit-mark strong{font-size:30px}html[data-mode="dark"][data-look="eva"] .summary{margin-right:-80px}html[data-mode="dark"][data-look="eva"] header h1 small{font-size:9px}html[data-mode="dark"][data-look="eva"] .search{top:8px}}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <header>
      <h1><small id="heroKicker">GENBA OFFICE</small><span id="heroTitle">事務所ツール</span></h1>
      <div class="clock" id="clock"></div>
    </header>
    <div class="unit-mark" aria-hidden="true"><small>UNIT</small><strong id="unitNumber">01</strong></div>
    <div class="summary" aria-live="polite">
      <div class="summary-item"><span>利用できるツール</span><strong id="toolCount">—</strong></div>
      <div class="summary-item"><span>カテゴリ</span><strong id="catCount">—</strong></div>
      <span class="edit-status">編集モード中</span>
    </div>
  </div>

  <nav class="theme-panel" aria-label="デザインを選択">
    <span class="theme-label">デザイン</span>
    <button class="theme-btn active" type="button" data-theme="blue">A ブルー</button>
    <button class="theme-btn" type="button" data-theme="orange">B オレンジ</button>
    <button class="theme-btn" type="button" data-theme="mono">C モノクロ</button>
    <button class="theme-btn" type="button" data-theme="emerald">D エメラルド</button>
    <span class="mode-divider" aria-hidden="true"></span>
    <span class="theme-label">表示</span>
    <button class="theme-btn mode-btn active" type="button" data-mode-choice="auto">自動</button>
    <button class="theme-btn mode-btn" type="button" data-mode-choice="light">☀ ライト</button>
    <button class="theme-btn mode-btn" type="button" data-mode-choice="dark">☾ ダーク</button>
  </nav>

<div class="theme-panel unit-panel" id="unitPanel" role="group" aria-label="ダーク用デザイン" hidden><span class="theme-label">ダーク用デザイン</span><button type="button" class="theme-btn unit-btn" data-unit-choice="standard">通常4配色</button><button type="button" class="theme-btn unit-btn" data-unit-choice="unit01">初号機</button><button type="button" class="theme-btn unit-btn" data-unit-choice="unit00">零号機</button><button type="button" class="theme-btn unit-btn" data-unit-choice="unit02">弐号機</button><button type="button" class="theme-btn unit-btn" data-unit-choice="amber">アンバー</button></div>
  <div class="search" id="searchBox">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="ツールを検索" autocomplete="off" enterkeyhint="search">
    <button id="clear" type="button" aria-label="クリア">×</button>
  </div>

  <div class="loading" id="loading">読み込み中…</div>
  <div id="sections"></div>
  <div class="empty" id="empty">見つからなかった</div>

  <footer>タップで各ツールが開きます</footer>
</div>

<div class="fab">
  <button class="add primary" id="addBtn">＋ 追加</button>
  <button id="editBtn">編集</button>
</div>

<!-- 合言葉 -->
<div class="modal-bg" id="passModal">
  <div class="modal">
    <h3>編集モード</h3>
    <label>合言葉</label>
    <input id="passInput" type="password" autocomplete="off" enterkeyhint="done">
    <div class="msg" id="passMsg"></div>
    <div class="btns">
      <button class="cancel" onclick="closeModal('passModal')">やめる</button>
      <button class="ok" id="passOk" onclick="submitPass()">OK</button>
    </div>
  </div>
</div>

<!-- 追加・編集 -->
<div class="modal-bg" id="formModal">
  <div class="modal">
    <h3 id="formTitle">ツールを追加</h3>
    <input type="hidden" id="fId">
    <div class="row">
      <div>
        <label>カテゴリ</label>
        <input id="fCat" list="catList" placeholder="例: 事務">
        <datalist id="catList"></datalist>
      </div>
      <div>
        <label>アイコン(1〜3文字)</label>
        <input id="fIcon" maxlength="3" placeholder="例: 区">
      </div>
    </div>
    <label>名前</label>
    <input id="fName" placeholder="例: 原価区分振り分け">
    <label>説明</label>
    <input id="fDesc" placeholder="一言で">
    <label>URL(空なら「準備中」表示)</label>
    <input id="fUrl" type="url" placeholder="https://…" inputmode="url">
    <label>タグ(任意)</label>
    <input id="fTag" placeholder="例: PC内 / 準備中">
    <div class="msg" id="formMsg"></div>
    <div class="btns">
      <button class="cancel" onclick="closeModal('formModal')">やめる</button>
      <button class="ok" id="formOk" onclick="submitForm()">保存</button>
    </div>
  </div>
</div>

<script>
// ============================================
// GASのWebアプリURL(デプロイしたらここに貼る)
// ============================================
const GAS_URL = "https://script.google.com/macros/s/AKfycbxKW8JNfxJs2HLOGGRZVWvSgUhsDG-oLFT0Bw0osTJy6wqtc4Ngtg9s_36py_Ae39_J/exec";

let TOOLS = [];      // シートから取ったフラットな配列
let PASS = sessionStorage.getItem("officePass") || "";

const sectionsEl = document.getElementById("sections");
const emptyEl    = document.getElementById("empty");
const loadingEl  = document.getElementById("loading");
const qEl        = document.getElementById("q");
const clearEl    = document.getElementById("clear");
const searchBox  = document.getElementById("searchBox");

// ---------- 通常4配色 + ダーク限定デザイン ----------
const paletteNames=['blue','orange','mono','emerald'];
let palette=localStorage.getItem('officeToolsPalette')||localStorage.getItem('officeTheme')||'blue';
if(!paletteNames.includes(palette))palette='blue';
const systemDark=window.matchMedia('(prefers-color-scheme: dark)');
let modeChoice=localStorage.getItem('officeMode')||'auto';
let unitChoice=localStorage.getItem('officeToolsUnit')||'standard';
if(!['standard','unit01','unit00','unit02','amber'].includes(unitChoice))unitChoice='standard';
function refreshAppearance(){
 const resolved=modeChoice==='auto'?(systemDark.matches?'dark':'light'):modeChoice;
 const eva=resolved==='dark'&&unitChoice!=='standard';
 document.documentElement.dataset.theme=palette;
 document.documentElement.dataset.mode=resolved;
 document.documentElement.dataset.look=eva?'eva':'standard';
 document.documentElement.dataset.unit=unitChoice;
 document.getElementById('unitPanel').hidden=resolved!=='dark';
 document.querySelectorAll('.theme-btn[data-theme]').forEach(b=>{const on=!eva&&b.dataset.theme===palette;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on));});
 document.querySelectorAll('.mode-btn').forEach(b=>{const on=b.dataset.modeChoice===modeChoice;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on));});
 document.querySelectorAll('.unit-btn').forEach(b=>{const on=b.dataset.unitChoice===unitChoice;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on));});
 const text={unit01:['01','UNIT 01 / COMMAND CENTER','事務所ツール'],unit00:['00','UNIT 00 / OPERATIONS DESK','業務管制室'],unit02:['02','UNIT 02 / MISSION BOARD','業務作戦室'],amber:['AM','AMBER / FIELD TERMINAL','業務記録室']}[unitChoice];
 document.getElementById('heroKicker').textContent=eva?text[1]:'GENBA OFFICE';
 document.getElementById('heroTitle').textContent=eva?text[2]:'事務所ツール';
 document.getElementById('unitNumber').textContent=eva?text[0]:'01';
 document.querySelectorAll('meta[name="theme-color"]').forEach(meta=>meta.remove());
 const meta=document.createElement('meta');meta.name='theme-color';meta.content=resolved==='dark'?'#0b1019':'#f3f6fb';document.head.appendChild(meta);
}
function setTheme(t){palette=paletteNames.includes(t)?t:'blue';unitChoice='standard';localStorage.setItem('officeToolsPalette',palette);localStorage.setItem('officeToolsUnit',unitChoice);refreshAppearance();}
function setMode(v){modeChoice=['auto','light','dark'].includes(v)?v:'auto';localStorage.setItem('officeMode',modeChoice);refreshAppearance();}
function setUnit(v){unitChoice=['standard','unit01','unit00','unit02','amber'].includes(v)?v:'standard';localStorage.setItem('officeToolsUnit',unitChoice);refreshAppearance();}
document.querySelectorAll('.theme-btn[data-theme]').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.theme)));
document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.modeChoice)));
document.querySelectorAll('.unit-btn').forEach(b=>b.addEventListener('click',()=>setUnit(b.dataset.unitChoice)));
systemDark.addEventListener('change',()=>{if(modeChoice==='auto')refreshAppearance();});
setMode(modeChoice);

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function api(body){
  const r = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "エラー");
  return j.result;
}

async function load(){
  if (!GAS_URL) { loadingEl.textContent = "GAS_URL が未設定"; return; }
  try {
    const r = await fetch(GAS_URL + "?t=" + Date.now());
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    TOOLS = j.result;
    loadingEl.style.display = "none";
    render(); filter();
  } catch (e) {
    loadingEl.textContent = "読み込み失敗: " + e.message;
  }
}

function grouped(){
  const map = new Map();
  TOOLS.forEach(t => {
    const c = t["カテゴリ"] || "その他";
    if (!map.has(c)) map.set(c, []);
    map.get(c).push(t);
  });
  return map;
}

function render(){
  const g = grouped();
  document.getElementById("catList").innerHTML = [...g.keys()].map(c => `<option value="${esc(c)}">`).join("");
  sectionsEl.innerHTML = [...g.entries()].map(([cat, items]) => `
    <section>
      <h2>${esc(cat)} <span class="section-count">${items.length}</span></h2>
      <div class="grid">
        ${items.map(t => {
          const soon = !t["URL"];
          const tag  = t["タグ"] ? `<span class="tag">${esc(t["タグ"])}</span>` : "";
          const key  = esc((t["名前"] || "") + " " + (t["説明"] || ""));
          const tools = `<div class="tools">
              <button type="button" onclick="openForm('${esc(t["ID"])}');return false;">編集</button>
              <button type="button" class="del" onclick="delTool('${esc(t["ID"])}','${esc(t["名前"])}');return false;">削除</button>
            </div>`;
          const open  = soon ? `<div class="card soon" data-key="${key}">`
                             : `<a class="card" href="${esc(t["URL"])}" target="_blank" rel="noopener" data-key="${key}">`;
          const close = soon ? `</div>` : `</a>`;
          return `${open}
            <div class="icon">${esc(t["アイコン"] || (t["名前"] || "?").slice(0,1))}</div>
            <div class="body">
              <div class="name">${esc(t["名前"])}${tag}</div>
              <div class="desc">${esc(t["説明"])}</div>
            </div>
            <div class="arrow">${soon ? "" : "›"}</div>
            ${tools}
          ${close}`;
        }).join("")}
      </div>
    </section>`).join("");
  document.getElementById("toolCount").textContent = TOOLS.filter(t => t["URL"]).length;
  document.getElementById("catCount").textContent = g.size;
}

function filter(){
  const q = qEl.value.trim().toLowerCase();
  searchBox.classList.toggle("has-text", q.length > 0);
  let shown = 0;
  document.querySelectorAll("section").forEach(sec => {
    let n = 0;
    sec.querySelectorAll(".card").forEach(card => {
      const hit = !q || card.dataset.key.toLowerCase().includes(q);
      card.classList.toggle("hidden", !hit);
      if (hit) n++;
    });
    sec.classList.toggle("hidden", n === 0);
    shown += n;
  });
  emptyEl.classList.toggle("show", shown === 0 && TOOLS.length > 0);
}

// ---------- 編集モード ----------
function openModal(id){ document.getElementById(id).classList.add("show"); }
function closeModal(id){ document.getElementById(id).classList.remove("show"); }

document.getElementById("editBtn").addEventListener("click", () => {
  if (document.body.classList.contains("edit")) {
    document.body.classList.remove("edit");
    document.getElementById("editBtn").textContent = "編集";
    return;
  }
  if (PASS) { enterEdit(); return; }
  document.getElementById("passMsg").textContent = "";
  document.getElementById("passInput").value = "";
  openModal("passModal");
  setTimeout(() => document.getElementById("passInput").focus(), 50);
});
document.getElementById("passInput").addEventListener("keydown", e => { if (e.key === "Enter") submitPass(); });

async function submitPass(){
  const p = document.getElementById("passInput").value;
  const btn = document.getElementById("passOk");
  btn.disabled = true;
  try {
    await api({ action: "checkPass", pass: p });
    PASS = p; sessionStorage.setItem("officePass", p);
    closeModal("passModal"); enterEdit();
  } catch (e) {
    document.getElementById("passMsg").textContent = e.message; document.getElementById("passMsg").className = "msg ng";
  }
  btn.disabled = false;
}

function enterEdit(){
  document.body.classList.add("edit");
  document.getElementById("editBtn").textContent = "完了";
}

document.getElementById("addBtn").addEventListener("click", () => openForm(""));

function openForm(id){
  const t = TOOLS.find(x => x["ID"] === id) || {};
  document.getElementById("formTitle").textContent = id ? "ツールを編集" : "ツールを追加";
  document.getElementById("fId").value   = id;
  document.getElementById("fCat").value  = t["カテゴリ"] || "";
  document.getElementById("fIcon").value = t["アイコン"] || "";
  document.getElementById("fName").value = t["名前"] || "";
  document.getElementById("fDesc").value = t["説明"] || "";
  document.getElementById("fUrl").value  = t["URL"] || "";
  document.getElementById("fTag").value  = t["タグ"] || "";
  document.getElementById("formMsg").textContent = "";
  openModal("formModal");
}

async function submitForm(){
  const id = document.getElementById("fId").value;
  const data = {
    "カテゴリ": document.getElementById("fCat").value.trim() || "その他",
    "アイコン": document.getElementById("fIcon").value.trim(),
    "名前":     document.getElementById("fName").value.trim(),
    "説明":     document.getElementById("fDesc").value.trim(),
    "URL":      document.getElementById("fUrl").value.trim(),
    "タグ":     document.getElementById("fTag").value.trim(),
  };
  const msg = document.getElementById("formMsg");
  if (!data["名前"]) { msg.textContent = "名前は必須"; msg.className = "msg ng"; return; }
  const btn = document.getElementById("formOk");
  btn.disabled = true; msg.textContent = "保存中…"; msg.className = "msg";
  try {
    if (id) await api({ action: "update", pass: PASS, id: id, data: data });
    else    await api({ action: "add",    pass: PASS, data: data });
    closeModal("formModal");
    await load();
  } catch (e) {
    msg.textContent = e.message; msg.className = "msg ng";
    if (/合言葉/.test(e.message)) { PASS = ""; sessionStorage.removeItem("officePass"); }
  }
  btn.disabled = false;
}

async function delTool(id, name){
  if (!confirm(`「${name}」を削除する？`)) return;
  try {
    await api({ action: "delete", pass: PASS, id: id });
    await load();
  } catch (e) {
    alert(e.message);
    if (/合言葉/.test(e.message)) { PASS = ""; sessionStorage.removeItem("officePass"); }
  }
}

// ---------- 時計・検索 ----------
function tick(){
  const d = new Date();
  const w = ["日","月","火","水","木","金","土"][d.getDay()];
  const pad = n => String(n).padStart(2,"0");
  document.getElementById("clock").textContent = `${d.getMonth()+1}/${d.getDate()}(${w}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
qEl.addEventListener("input", filter);
clearEl.addEventListener("click", () => { qEl.value = ""; filter(); qEl.focus(); });
document.querySelectorAll(".modal-bg").forEach(m => m.addEventListener("click", e => { if (e.target === m) m.classList.remove("show"); }));

tick(); setInterval(tick, 15000);
load();
</script>
</body>
