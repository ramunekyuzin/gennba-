<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1c2430" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="事務所ツール">
<title>事務所ツール</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f1ea; --paper: #ffffff; --ink: #1f2933; --ink-2: #5b6570;
    --line: #dcd6c8; --accent: #c2410c; --accent-soft: #fde8dc; --muted: #e9e4d8;
    --danger: #b91c1c;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 18px rgba(0,0,0,.05);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161b22; --paper: #1f2731; --ink: #eef1f5; --ink-2: #a3adb8;
      --line: #313b47; --accent: #fb923c; --accent-soft: #3a2a1f; --muted: #2a3340;
      --danger: #f87171;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 80px; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  header h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: .02em; }
  header h1 small { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); letter-spacing: .08em; margin-bottom: 2px; }
  .clock { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 14px; text-align: right; white-space: nowrap; }

  .search {
    display: flex; align-items: center; gap: 10px; background: var(--paper);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px;
    margin-bottom: 22px; box-shadow: var(--shadow);
  }
  .search svg { flex: none; width: 20px; height: 20px; stroke: var(--ink-2); }
  .search input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; font-size: 17px; min-width: 0; }
  .search input::placeholder { color: var(--ink-2); }
  .search button { display: none; border: 0; background: var(--muted); color: var(--ink-2); width: 32px; height: 32px; border-radius: 50%; font-size: 18px; line-height: 1; cursor: pointer; }
  .search.has-text button { display: inline-flex; align-items: center; justify-content: center; }

  section { margin-bottom: 26px; }
  section h2 { font-size: 15px; font-weight: 700; color: var(--ink-2); margin: 0 0 10px 2px; display: flex; align-items: center; gap: 8px; }
  section h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  section.hidden { display: none; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }

  .card {
    position: relative; display: flex; gap: 14px; align-items: center;
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; min-height: 84px; text-decoration: none; color: inherit;
    box-shadow: var(--shadow); transition: transform .08s ease, border-color .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .card:active { transform: scale(.985); }
  .card:hover { border-color: var(--accent); }
  .card.hidden { display: none; }
  .icon { flex: none; width: 48px; height: 48px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 22px; font-weight: 800; }
  .body { flex: 1; min-width: 0; }
  .name { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .desc { font-size: 14px; color: var(--ink-2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .arrow { flex: none; color: var(--ink-2); font-size: 20px; }
  .tag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--muted); color: var(--ink-2); white-space: nowrap; }
  .card.soon { opacity: .6; cursor: default; }
  .card.soon:hover { border-color: var(--line); }
  .card.soon:active { transform: none; }

  /* 編集モード */
  .tools { position: absolute; top: 8px; right: 8px; display: none; gap: 6px; }
  body.edit .tools { display: flex; }
  body.edit .card { padding-right: 90px; }
  body.edit .arrow { display: none; }
  .tools button { border: 0; border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; background: var(--muted); color: var(--ink); }
  .tools button.del { color: var(--danger); }

  .fab {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
    display: flex; gap: 10px; z-index: 5;
  }
  .fab button {
    border: 0; border-radius: 999px; padding: 14px 20px; font: inherit; font-size: 15px; font-weight: 700;
    background: var(--paper); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); cursor: pointer;
  }
  .fab button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .fab button.add { display: none; }
  body.edit .fab button.add { display: inline-block; }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .modal-bg.show { display: flex; }
  .modal {
    width: 100%; max-width: 560px; background: var(--paper); color: var(--ink);
    border-radius: 18px 18px 0 0; padding: 20px 18px calc(24px + env(safe-area-inset-bottom));
    max-height: 90vh; overflow: auto;
  }
  @media (min-width: 600px) { .modal-bg { align-items: center; } .modal { border-radius: 18px; } }
  .modal h3 { margin: 0 0 14px; font-size: 18px; }
  .modal label { display: block; font-size: 13px; color: var(--ink-2); margin: 10px 0 4px; }
  .modal input, .modal select {
    width: 100%; padding: 13px; font: inherit; font-size: 16px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--bg); color: var(--ink);
  }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; min-width: 0; }
  .btns { display: flex; gap: 10px; margin-top: 18px; }
  .btns button { flex: 1; border: 0; border-radius: 12px; padding: 15px; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
  .btns .ok { background: var(--accent); color: #fff; }
  .btns .cancel { background: var(--muted); color: var(--ink); }
  .btns button:disabled { opacity: .5; }
  .msg { font-size: 14px; margin-top: 10px; min-height: 20px; }
  .msg.ng { color: var(--danger); }

  .empty, .loading { text-align: center; color: var(--ink-2); padding: 32px 0; }
  .empty { display: none; }
  .empty.show { display: block; }
  footer { text-align: center; color: var(--ink-2); font-size: 12px; margin-top: 30px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1><small>GENBA OFFICE</small>事務所ツール</h1>
    <div class="clock" id="clock"></div>
  </header>

  <div class="search" id="searchBox">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="ツールを検索" autocomplete="off" enterkeyhint="search">
    <button id="clear" type="button" aria-label="クリア">×</button>
  </div>

  <div class="loading" id="loading">読み込み中…</div>
  <div id="sections"></div>
  <div class="empty" id="empty">見つからなかった</div>

  <footer>タップで各ツールが開きます</footer>
</div>

<div class="fab">
  <button class="add primary" id="addBtn">＋ 追加</button>
  <button id="editBtn">編集</button>
</div>

<!-- 合言葉 -->
<div class="modal-bg" id="passModal">
  <div class="modal">
    <h3>編集モード</h3>
    <label>合言葉</label>
    <input id="passInput" type="password" autocomplete="off" enterkeyhint="done">
    <div class="msg" id="passMsg"></div>
    <div class="btns">
      <button class="cancel" onclick="closeModal('passModal')">やめる</button>
      <button class="ok" id="passOk" onclick="submitPass()">OK</button>
    </div>
  </div>
</div>

<!-- 追加・編集 -->
<div class="modal-bg" id="formModal">
  <div class="modal">
    <h3 id="formTitle">ツールを追加</h3>
    <input type="hidden" id="fId">
    <div class="row">
      <div>
        <label>カテゴリ</label>
        <input id="fCat" list="catList" placeholder="例: 事務">
        <datalist id="catList"></datalist>
      </div>
      <div>
        <label>アイコン(1〜3文字)</label>
        <input id="fIcon" maxlength="3" placeholder="例: 区">
      </div>
    </div>
    <label>名前</label>
    <input id="fName" placeholder="例: 原価区分振り分け">
    <label>説明</label>
    <input id="fDesc" placeholder="一言で">
    <label>URL(空なら「準備中」表示)</label>
    <input id="fUrl" type="url" placeholder="https://…" inputmode="url">
    <label>タグ(任意)</label>
    <input id="fTag" placeholder="例: PC内 / 準備中">
    <div class="msg" id="formMsg"></div>
    <div class="btns">
      <button class="cancel" onclick="closeModal('formModal')">やめる</button>
      <button class="ok" id="formOk" onclick="submitForm()">保存</button>
    </div>
  </div>
</div>

<script>
// ============================================
// GASのWebアプリURL(デプロイしたらここに貼る)
// ============================================
const GAS_URL = "https://script.google.com/macros/s/AKfycbxKW8JNfxJs2HLOGGRZVWvSgUhsDG-oLFT0Bw0osTJy6wqtc4Ngtg9s_36py_Ae39_J/exec";

let TOOLS = [];      // シートから取ったフラットな配列
let PASS = sessionStorage.getItem("officePass") || "";

const sectionsEl = document.getElementById("sections");
const emptyEl    = document.getElementById("empty");
const loadingEl  = document.getElementById("loading");
const qEl        = document.getElementById("q");
const clearEl    = document.getElementById("clear");
const searchBox  = document.getElementById("searchBox");

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function api(body){
  const r = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "エラー");
  return j.result;
}

async function load(){
  if (!GAS_URL) { loadingEl.textContent = "GAS_URL が未設定"; return; }
  try {
    const r = await fetch(GAS_URL + "?t=" + Date.now());
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    TOOLS = j.result;
    loadingEl.style.display = "none";
    render(); filter();
  } catch (e) {
    loadingEl.textContent = "読み込み失敗: " + e.message;
  }
}

function grouped(){
  const map = new Map();
  TOOLS.forEach(t => {
    const c = t["カテゴリ"] || "その他";
    if (!map.has(c)) map.set(c, []);
    map.get(c).push(t);
  });
  return map;
}

function render(){
  const g = grouped();
  document.getElementById("catList").innerHTML = [...g.keys()].map(c => `<option value="${esc(c)}">`).join("");
  sectionsEl.innerHTML = [...g.entries()].map(([cat, items]) => `
    <section>
      <h2>${esc(cat)}</h2>
      <div class="grid">
        ${items.map(t => {
          const soon = !t["URL"];
          const tag  = t["タグ"] ? `<span class="tag">${esc(t["タグ"])}</span>` : "";
          const key  = esc((t["名前"] || "") + " " + (t["説明"] || ""));
          const tools = `<div class="tools">
              <button type="button" onclick="openForm('${esc(t["ID"])}');return false;">編集</button>
              <button type="button" class="del" onclick="delTool('${esc(t["ID"])}','${esc(t["名前"])}');return false;">削除</button>
            </div>`;
          const open  = soon ? `<div class="card soon" data-key="${key}">`
                             : `<a class="card" href="${esc(t["URL"])}" target="_blank" rel="noopener" data-key="${key}">`;
          const close = soon ? `</div>` : `</a>`;
          return `${open}
            <div class="icon">${esc(t["アイコン"] || (t["名前"] || "?").slice(0,1))}</div>
            <div class="body">
              <div class="name">${esc(t["名前"])}${tag}</div>
              <div class="desc">${esc(t["説明"])}</div>
            </div>
            <div class="arrow">${soon ? "" : "›"}</div>
            ${tools}
          ${close}`;
        }).join("")}
      </div>
    </section>`).join("");
}

function filter(){
  const q = qEl.value.trim().toLowerCase();
  searchBox.classList.toggle("has-text", q.length > 0);
  let shown = 0;
  document.querySelectorAll("section").forEach(sec => {
    let n = 0;
    sec.querySelectorAll(".card").forEach(card => {
      const hit = !q || card.dataset.key.toLowerCase().includes(q);
      card.classList.toggle("hidden", !hit);
      if (hit) n++;
    });
    sec.classList.toggle("hidden", n === 0);
    shown += n;
  });
  emptyEl.classList.toggle("show", shown === 0 && TOOLS.length > 0);
}

// ---------- 編集モード ----------
function openModal(id){ document.getElementById(id).classList.add("show"); }
function closeModal(id){ document.getElementById(id).classList.remove("show"); }

document.getElementById("editBtn").addEventListener("click", () => {
  if (document.body.classList.contains("edit")) {
    document.body.classList.remove("edit");
    document.getElementById("editBtn").textContent = "編集";
    return;
  }
  if (PASS) { enterEdit(); return; }
  document.getElementById("passMsg").textContent = "";
  document.getElementById("passInput").value = "";
  openModal("passModal");
  setTimeout(() => document.getElementById("passInput").focus(), 50);
});
document.getElementById("passInput").addEventListener("keydown", e => { if (e.key === "Enter") submitPass(); });

async function submitPass(){
  const p = document.getElementById("passInput").value;
  const btn = document.getElementById("passOk");
  btn.disabled = true;
  try {
    await api({ action: "checkPass", pass: p });
    PASS = p; sessionStorage.setItem("officePass", p);
    closeModal("passModal"); enterEdit();
  } catch (e) {
    document.getElementById("passMsg").textContent = e.message; document.getElementById("passMsg").className = "msg ng";
  }
  btn.disabled = false;
}

function enterEdit(){
  document.body.classList.add("edit");
  document.getElementById("editBtn").textContent = "完了";
}

document.getElementById("addBtn").addEventListener("click", () => openForm(""));

function openForm(id){
  const t = TOOLS.find(x => x["ID"] === id) || {};
  document.getElementById("formTitle").textContent = id ? "ツールを編集" : "ツールを追加";
  document.getElementById("fId").value   = id;
  document.getElementById("fCat").value  = t["カテゴリ"] || "";
  document.getElementById("fIcon").value = t["アイコン"] || "";
  document.getElementById("fName").value = t["名前"] || "";
  document.getElementById("fDesc").value = t["説明"] || "";
  document.getElementById("fUrl").value  = t["URL"] || "";
  document.getElementById("fTag").value  = t["タグ"] || "";
  document.getElementById("formMsg").textContent = "";
  openModal("formModal");
}

async function submitForm(){
  const id = document.getElementById("fId").value;
  const data = {
    "カテゴリ": document.getElementById("fCat").value.trim() || "その他",
    "アイコン": document.getElementById("fIcon").value.trim(),
    "名前":     document.getElementById("fName").value.trim(),
    "説明":     document.getElementById("fDesc").value.trim(),
    "URL":      document.getElementById("fUrl").value.trim(),
    "タグ":     document.getElementById("fTag").value.trim(),
  };
  const msg = document.getElementById("formMsg");
  if (!data["名前"]) { msg.textContent = "名前は必須"; msg.className = "msg ng"; return; }
  const btn = document.getElementById("formOk");
  btn.disabled = true; msg.textContent = "保存中…"; msg.className = "msg";
  try {
    if (id) await api({ action: "update", pass: PASS, id: id, data: data });
    else    await api({ action: "add",    pass: PASS, data: data });
    closeModal("formModal");
    await load();
  } catch (e) {
    msg.textContent = e.message; msg.className = "msg ng";
    if (/合言葉/.test(e.message)) { PASS = ""; sessionStorage.removeItem("officePass"); }
  }
  btn.disabled = false;
}

async function delTool(id, name){
  if (!confirm(`「${name}」を削除する？`)) return;
  try {
    await api({ action: "delete", pass: PASS, id: id });
    await load();
  } catch (e) {
    alert(e.message);
    if (/合言葉/.test(e.message)) { PASS = ""; sessionStorage.removeItem("officePass"); }
  }
}

// ---------- 時計・検索 ----------
function tick(){
  const d = new Date();
  const w = ["日","月","火","水","木","金","土"][d.getDay()];
  const pad = n => String(n).padStart(2,"0");
  document.getElementById("clock").textContent = `${d.getMonth()+1}/${d.getDate()}(${w}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
qEl.addEventListener("input", filter);
clearEl.addEventListener("click", () => { qEl.value = ""; filter(); qEl.focus(); });
document.querySelectorAll(".modal-bg").forEach(m => m.addEventListener("click", e => { if (e.target === m) m.classList.remove("show"); }));

tick(); setInterval(tick, 15000);
load();
</script>
</body>
</html>
