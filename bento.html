<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5ef">
<meta name="color-scheme" content="light dark">
<title>お弁当注文</title>
<style>
:root{color-scheme:light;--bg:#f7f5ef;--paper:#fffefa;--ink:#253b32;--muted:#6c766d;--line:#dddcd2;--green:#345b45;--soft:#eaf0e6;--accent:#bf703e;--shadow:0 8px 30px #35442d09}
*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}body{height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink)}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}button,a,summary{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px}svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.header{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:22px 32px 20px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:14px}.logo{display:grid;place-items:center;width:50px;height:50px;border-radius:16px;color:var(--green);background:var(--soft);border:1px solid var(--line)}.logo svg{width:30px;height:30px}.eyebrow{font-size:9px;letter-spacing:.2em;font-weight:700;color:var(--accent);margin-bottom:5px}h1{font-size:24px;line-height:1.4;letter-spacing:.1em;font-weight:700;margin:0}.today{text-align:right;font-size:13px;font-variant-numeric:tabular-nums}.today small{display:block;font-size:10px;color:var(--muted);margin-bottom:6px;letter-spacing:.08em}
main{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:1760px;margin:0 auto;padding:21px 28px 12px;gap:16px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px}.intro h2{font-size:15px;margin:0;display:flex;align-items:center;gap:9px;font-weight:700}.intro h2::before{content:"";width:7px;height:7px;display:block;border-radius:50%;background:var(--accent)}.intro p{margin:5px 0 0 16px;font-size:12px;color:var(--muted);line-height:1.7}.actions{display:flex;align-items:center;gap:8px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:12px;font-weight:600;white-space:nowrap;transition:background .15s,transform .15s}.btn:hover{background:var(--soft)}.btn:active{transform:translateY(1px)}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.primary:hover{filter:brightness(1.1)}.icon-btn{width:42px;padding:10px}.btn svg{width:17px;height:17px}
.panel{flex:1;min-height:260px;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:white;box-shadow:var(--shadow)}.panel::before{content:"";height:4px;flex-shrink:0;background:linear-gradient(90deg,#345b45 0 66%,#bfcbb0 66% 86%,#d4a46c 86%)}iframe{display:block;width:100%;flex:1;min-height:0;border:0;background:white}
footer{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;padding:0 2px;gap:12px;line-height:1.7}.signature{font-size:9px;letter-spacing:.16em}.help{position:relative}summary{display:flex;align-items:center;gap:6px;cursor:pointer;list-style:none;padding:5px 0}summary::-webkit-details-marker{display:none}summary svg{width:15px;height:15px}.help-content{position:absolute;bottom:35px;left:0;width:min(350px,calc(100vw - 36px));padding:17px;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 25px #0002;z-index:2;font-size:12px}.help-content p{margin:0}.help-content a{text-decoration:underline;text-underline-offset:3px;color:var(--green)}
body.compact .header,body.compact .intro,body.compact footer{display:none}body.compact main{max-width:none;padding:10px;gap:10px}body.compact .toolbar{justify-content:flex-end}
:root[data-theme="dark"]{color-scheme:dark;--bg:#19221d;--paper:#253129;--ink:#edf0e7;--muted:#b0baad;--line:#3c493e;--green:#41664c;--soft:#304135;--accent:#e6af75;--shadow:0 8px 30px #0002}:root[data-theme="dark"] .help-content a{color:#bdd9b5}:root[data-theme="dark"] .logo{color:#bdd9b5}
@media(max-width:640px){.header{padding:16px;gap:12px}.brand{gap:11px}.logo{width:44px;height:44px;border-radius:14px}.logo svg{width:26px;height:26px}h1{font-size:21px}.eyebrow{font-size:8px}.today{font-size:11px}.today small{font-size:9px}main{padding:15px 10px max(8px,env(safe-area-inset-bottom));gap:12px}.toolbar{flex-direction:column;align-items:stretch;gap:12px;padding:0 4px}.intro h2{font-size:14px}.intro p{font-size:11px}.actions{width:100%}.btn{min-height:44px;padding:10px;flex:1}.btn.icon-btn{flex:0 0 44px}.panel{border-radius:12px}.signature{display:none}footer{padding:0 5px}body.compact main{padding:8px}}
@media(max-width:350px){h1{font-size:18px}.today{font-size:10px}.header{padding:14px 12px}.actions{gap:6px}.btn{font-size:11px;gap:5px}}
@media(max-height:550px){body{height:auto;min-height:100dvh}.panel{height:75vh;min-height:320px;flex:none}.header{padding-top:12px;padding-bottom:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="header">
 <div class="brand"><div class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="4" y="7" width="24" height="20" rx="5"/><path d="M18 7v20M4 18h14M7 3h18"/><circle cx="11" cy="12.5" r="2"/><path d="m22 12 2 2-2 2m0 4 2 2"/></svg></div><div><div class="eyebrow">DAILY LUNCH</div><h1>お弁当注文</h1></div></div>
 <div class="today"><small>今日の日付</small><time id="today"></time></div>
</header>
<main>
 <div class="toolbar">
  <div class="intro"><h2>お昼の準備を、ここから。</h2><p>お弁当の注文・確認はこちらから。</p></div>
  <div class="actions">
   <button class="btn icon-btn" id="theme" type="button" aria-label="外枠をダーク表示にする" title="外枠の明るさを切り替え" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13A8.5 8.5 0 0 1 11 3.5 8.5 8.5 0 1 0 20.5 13Z"/></svg></button>
   <button class="btn" id="expand" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span>広く表示</span></button>
   <a class="btn primary app-link" href="https://script.google.com/macros/s/AKfycbxd7JIC-VaKO575-rLpCmyN-IXh4pX57WxR-Iubv8r55ptMxy78lnsqkWLY2hUl6YmJnA/exec" target="_blank" rel="noopener noreferrer">別タブで開く<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7m0-7L10 14m0-11H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg></a>
  </div>
 </div>
 <section class="panel" aria-label="お弁当の注文画面"><iframe id="app" title="お弁当注文"></iframe></section>
 <footer><details class="help"><summary><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4m0 3h.01"/></svg>画面が表示されないとき</summary><div class="help-content"><p>画面が真っ白な場合やログインを求められる場合は、<a class="app-link" href="https://script.google.com/macros/s/AKfycbxd7JIC-VaKO575-rLpCmyN-IXh4pX57WxR-Iubv8r55ptMxy78lnsqkWLY2hUl6YmJnA/exec" target="_blank" rel="noopener noreferrer">別タブで開く</a>をお試しください。</p></div></details><span class="signature">A LITTLE BREAK, A GOOD LUNCH.</span></footer>
</main>
<script>
(function(){
 'use strict';
 const GAS_URL='https://script.google.com/macros/s/AKfycbxd7JIC-VaKO575-rLpCmyN-IXh4pX57WxR-Iubv8r55ptMxy78lnsqkWLY2hUl6YmJnA/exec';
 // 名前・表示形式・年月など、既存のクエリ文字列をそのまま渡す。
 const appUrl=GAS_URL+location.search;
 document.getElementById('app').src=appUrl;
 document.querySelectorAll('.app-link').forEach(function(a){a.href=appUrl;});
 const date=new Date();
 const time=document.getElementById('today');
 time.textContent=new Intl.DateTimeFormat('ja-JP',{month:'long',day:'numeric',weekday:'short'}).format(date);
 time.dateTime=[date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');
 const expand=document.getElementById('expand');
 function setCompact(active){document.body.classList.toggle('compact',active);expand.setAttribute('aria-pressed',String(active));expand.querySelector('span').textContent=active?'通常表示に戻す':'広く表示';}
 expand.addEventListener('click',function(){setCompact(!document.body.classList.contains('compact'));});
 document.addEventListener('keydown',function(e){if(e.key==='Escape')setCompact(false);});
 const theme=document.getElementById('theme');
 function setTheme(dark){document.documentElement.dataset.theme=dark?'dark':'light';theme.setAttribute('aria-pressed',String(dark));theme.setAttribute('aria-label',dark?'外枠をライト表示にする':'外枠をダーク表示にする');document.querySelector('meta[name="theme-color"]').content=dark?'#19221d':'#f7f5ef';}
 let saved=null;try{saved=localStorage.getItem('bento-shell-theme');}catch(e){}
 setTheme(saved==='dark'||(saved!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches));
 theme.addEventListener('click',function(){const dark=document.documentElement.dataset.theme!=='dark';setTheme(dark);try{localStorage.setItem('bento-shell-theme',dark?'dark':'light');}catch(e){}});
})();
</script>
</body>
</html>
