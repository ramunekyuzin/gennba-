<!DOCTYPE html>
<html lang="ja">
<head>
<script src="lock.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10%足す・引く</title>
<meta name="color-scheme" content="light dark">
<style>
:root{color-scheme:light;--bg:#f1f3f6;--paper:#fff;--field:#f7f8fa;--ink:#24272e;--muted:#69707d;--line:#dfe3ea;--accent:#2f6fd6;--soft:#e6eefc;--plus:#1f8a4c;--minus:#c0392b}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#14161b;--paper:#1f222a;--field:#191c23;--ink:#eef1f6;--muted:#a7aebb;--line:#363b47;--accent:#8db4ff;--soft:#26324a;--plus:#7fd8a2;--minus:#ff9a8f}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;color:var(--ink);background:var(--bg);line-height:1.7}
.app{max-width:560px;margin:auto;padding:20px 16px 40px}
h1{font-size:20px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px 16px;margin-top:18px}
label{display:block;font-size:16px;font-weight:600;color:var(--muted);margin-bottom:6px}
input{width:100%;padding:14px;font:inherit;font-size:24px;font-weight:700;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);outline:0}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
button{font:inherit;font-size:16px;width:100%;min-height:50px;margin-top:12px;padding:12px 16px;font-weight:600;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.result{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 0}
.result+.result{border-top:1px solid var(--line)}
.result span{font-size:16px;font-weight:600;color:var(--muted)}
.result strong{font-size:30px;overflow-wrap:anywhere;text-align:right}
#plus{color:var(--plus)}
#minus{color:var(--minus)}
.note{font-size:16px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <h1>10%足す・引く</h1>

  <div class="card">
    <label for="num">数字を入れる</label>
    <input id="num" type="text" inputmode="decimal" autocomplete="off" placeholder="例:10000">
    <button id="clear" type="button">消す</button>
  </div>

  <div class="card">
    <div class="result"><span>10%足した数字</span><strong id="plus">-</strong></div>
    <div class="result"><span>10%引いた数字</span><strong id="minus">-</strong></div>
    <p class="note" id="msg"></p>
  </div>
</div>

<script>
const numEl = document.getElementById('num');
const plusEl = document.getElementById('plus');
const minusEl = document.getElementById('minus');
const msgEl = document.getElementById('msg');

// 全角数字やカンマが入っていても読めるようにする
function toNumber(text) {
  const s = text
    .replace(/[０-９．－]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[,，\s円¥￥]/g, '');
  if (s === '' || !/^-?\d*\.?\d+$/.test(s)) return null;
  return Number(s);
}

// 小数点以下を切り上げてカンマ区切りにする
// 先に計算誤差(1000×1.1 が 1100.0000000000002 になる等)を消してから切り上げる
function format(n) {
  const fixed = Math.round(n * 1e6) / 1e6;
  return Math.ceil(fixed).toLocaleString('ja-JP');
}

function update() {
  const text = numEl.value.trim();
  const n = toNumber(text);
  if (n === null) {
    plusEl.textContent = '-';
    minusEl.textContent = '-';
    msgEl.textContent = text === '' ? '' : '数字だけを入れてください';
    return;
  }
  plusEl.textContent = format(n * 1.1);
  minusEl.textContent = format(n * 0.9);
  msgEl.textContent = '';
}

numEl.addEventListener('input', update);
document.getElementById('clear').addEventListener('click', () => {
  numEl.value = '';
  update();
  numEl.focus();
});
</script>
</body>
</html>
