<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>砕石費用 抜き出し</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#f5f3ee; --panel:#ffffff; --ink:#1f1d1a; --sub:#6b665e; --line:#d9d4ca;
    --accent:#2f5d50; --accent-ink:#ffffff; --drop:#e9e5dc; --hit:#fff4c2; --bad:#b3261e; --ok:#2f7d4f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#181a1b; --panel:#22252a; --ink:#ececec; --sub:#a4a8ad; --line:#3a3e44;
      --accent:#6fb59f; --accent-ink:#0f1a16; --drop:#2a2e33; --hit:#3d3a1f; --bad:#ff8a80; --ok:#7fd39a;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif}
  main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:22px;margin:0 0 4px}
  .lead{color:var(--sub);margin:0 0 20px;font-size:14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
  .drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:120px;border:2px dashed var(--line);background:var(--drop);border-radius:10px;padding:28px 16px;text-align:center;cursor:pointer;transition:border-color .15s}
  .drop.over{border-color:var(--accent)}
  .drop input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
  .drop .t1{display:block;font-size:17px;font-weight:700;line-height:1.4}
  .drop .t2{display:block;color:var(--sub);font-size:14px;line-height:1.4}
  .row{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end}
  label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--sub);flex:1 1 180px}
  label.f input,label.f select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
  label.c{display:flex;align-items:center;gap:8px;font-size:15px;min-height:44px}
  label.c input{width:20px;height:20px}
  button{font:inherit;font-size:16px;min-height:44px;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
  button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:default}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  h2{font-size:17px;margin:0 0 10px}
  table{width:100%;border-collapse:collapse;font-size:15px;table-layout:fixed}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
  th{color:var(--sub);font-weight:600;font-size:13px}
  td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  #daily th:nth-child(1),#daily td:nth-child(1){width:34%}
  #daily th:nth-child(2),#daily td:nth-child(2){width:22%}
  #daily th:nth-child(3),#daily td:nth-child(3){width:18%}
  #daily th:nth-child(4),#daily td:nth-child(4){width:26%}
  tr.total td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none}
  tr.month td{background:var(--drop);font-weight:700}
  .hit-top td{border-bottom:none;padding-bottom:4px;white-space:nowrap}
  .hit-top td.chk{width:44px}
  .hit-top td.dt{width:140px}
  .hit-top td.un{width:120px}
  .hit-top td.pp{width:90px}
  .hit-top td.am{width:130px}
  .hit-top td.sp{width:auto}
  .hit-raw td{padding-top:0}
  .hit-raw .raw{white-space:normal}
  .raw{font-size:13px;color:var(--sub);word-break:break-all}
  .raw mark{background:var(--hit);color:var(--ink);padding:0 2px}
  input.cell{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-height:40px;width:100%}
  input.cell.num{text-align:right}
  input.cell.warn{border-color:var(--bad)}
  .chkmark{font-size:12px;color:var(--ok)}
  .chkmark.ng{color:var(--bad)}
  .status{font-size:14px;color:var(--sub);margin-top:10px;min-height:1.4em}
  .status.err{color:var(--bad)}
  .file{font-size:13px;color:var(--sub)}
  .empty{color:var(--sub);font-size:15px;text-align:center;padding:20px 0}
  .wrap{overflow-x:auto}
  @media (max-width:600px){ th,td{padding:8px 6px;font-size:14px} }
</style>
</head>
<body>
<main>
  <h1>砕石費用 抜き出し</h1>
  <p class="lead">請求書PDFを入れると、品名に指定ワードを含む行から日付・単価・人数・金額を拾って、日別と月合計を出します。処理はこのブラウザの中だけで行われ、ファイルはどこにも送信されません。</p>

  <div class="panel">
    <div class="drop" id="drop" role="button" tabindex="0">
      <input type="file" id="files" accept="application/pdf,.pdf" multiple>
      <span class="t1">PDFをここにドロップ、またはクリックして選択</span>
      <span class="t2">複数ファイルまとめてOK（文字が選択できるPDFのみ）</span>
    </div>

    <div class="row" style="margin-top:14px">
      <label class="f">拾うワード（カンマ区切り）
        <input id="kw" value="砕石" placeholder="砕石, RC-40, C-40">
      </label>
      <label class="f">年が書かれていないときの年
        <input id="year" type="number" value="2026" min="2000" max="2100">
      </label>
    </div>
    <div class="row" style="margin-top:6px">
      <label class="c"><input type="checkbox" id="carry" checked> 日付がない行は、直前に出てきた日付を使う</label>
      <label class="c"><input type="checkbox" id="skipSum" checked> 「合計」「小計」を含む行は除外</label>
    </div>
    <div class="actions">
      <button class="pri" id="run" disabled>抜き出す</button>
      <button id="csv" disabled>CSVをダウンロード</button>
      <button id="clear" disabled>クリア</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="panel" id="resultPanel" hidden>
    <h2>日別・月合計</h2>
    <div class="wrap"><table id="daily"></table></div>
  </div>

  <div class="panel" id="hitPanel" hidden>
    <h2>拾った行（確認用）</h2>
    <p class="lead" style="margin-bottom:8px">チェックを外した行は集計から除きます。単価×人数＝金額が合わない行は金額欄が赤くなるので、数字を直してください。直すと集計に即反映されます。</p>
    <div class="wrap"><table id="hits"></table></div>
  </div>
</main>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $ = id => document.getElementById(id);
let loadedFiles = [];
let hits = [];   // {file,page,date,unit,count,amount,line,use}

// ---------- PDF → 行テキスト ----------
async function pdfToLines(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  const pages = [];
  for(let p=1;p<=pdf.numPages;p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const rows = [];
    for(const it of tc.items){
      if(!it.str || !it.str.trim()) continue;
      const x = it.transform[4], y = it.transform[5];
      let row = rows.find(r => Math.abs(r.y - y) < 3);
      if(!row){ row = {y, items:[]}; rows.push(row); }
      row.items.push({x, s:it.str});
    }
    rows.sort((a,b)=>b.y-a.y);
    pages.push(rows.map(r => r.items.sort((a,b)=>a.x-b.x).map(i=>i.s).join(" ").replace(/\s+/g," ").trim()));
  }
  return pages;
}

// ---------- 解析ロジック ----------
const DATE_RE = /(?:(\d{4})[\/\-年.](\d{1,2})[\/\-月.](\d{1,2})日?)|(?:(?:令和|R|Ｒ)\s?(\d{1,2})[年.\/\-](\d{1,2})[月.\/\-](\d{1,2})日?)|(?:(?<![\d,])(\d{1,2})[\/月](\d{1,2})日?(?![\d,\/]))/g;

function findDates(line, defaultYear){
  const out = [];
  for(const m of line.matchAll(DATE_RE)){
    let y,mo,d;
    if(m[1]){ y=+m[1]; mo=+m[2]; d=+m[3]; }
    else if(m[4]){ y=2018 + (+m[4]); mo=+m[5]; d=+m[6]; }
    else { y=defaultYear; mo=+m[7]; d=+m[8]; }
    if(mo<1||mo>12||d<1||d>31) continue;
    out.push({y,mo,d,text:m[0],index:m.index});
  }
  return out;
}
function fmtDate(o){ return `${o.y}/${String(o.mo).padStart(2,"0")}/${String(o.d).padStart(2,"0")}`; }

function toHalf(s){ return s.replace(/[０-９，．／]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0)); }

// 行から 単価・人数・金額 を推定
function findFigures(line, dates){
  let s = toHalf(line);
  for(const d of dates) s = s.replace(toHalf(d.text), " ".repeat(d.text.length));
  // 税率(10% / 8 %)は金額ではないので消す
  s = s.replace(/\d+(?:\.\d+)?\s*[%％]/g, m => " ".repeat(m.length));
  // 品名に混ざる寸法・重量(0.7t, 5t, 10mm, 2m3 など)も消す
  s = s.replace(/\d+(?:\.\d+)?\s*(?:t|ｔ|kg|㎥|m3|mm|cm|m)(?![A-Za-z])/gi, m => " ".repeat(m.length));

  // 「3人」「3名」「3.0人」のような明示の人数
  let count = null;
  const pm = s.match(/(\d+(?:\.\d+)?)\s*(人|名|人工|人区)/);
  if(pm){ count = parseFloat(pm[1]); s = s.replace(pm[0], " ".repeat(pm[0].length)); }

  // 残りの数字候補（小数は数量扱いで別枝）
  const cands = [];
  for(const m of s.matchAll(/(?<![\d.])(\d{1,3}(?:,\d{3})+|\d+(?:\.\d+)?)(?![\d,])/g)){
    const raw = m[1];
    const v = parseFloat(raw.replace(/,/g,""));
    if(!Number.isFinite(v)) continue;
    cands.push({v, idx:m.index, raw, dec:raw.includes(".")});
  }
  if(!cands.length) return {unit:null, count, amount:null};

  // 金額＝一番右の整数
  const ints = cands.filter(c=>!c.dec);
  const amount = ints.length ? ints[ints.length-1].v : null;
  let rest = cands.filter(c => c !== ints[ints.length-1]);

  let unit = null;
  if(count==null){
    // 人数が明示されていない: 残りの中から 単価×人数＝金額 になる組を探す
    let found = false;
    if(amount!=null){
      for(let i=0;i<rest.length && !found;i++) for(let j=0;j<rest.length;j++){
        if(i===j) continue;
        if(Math.abs(rest[i].v*rest[j].v - amount) < 0.5){
          unit = Math.max(rest[i].v,rest[j].v); count = Math.min(rest[i].v,rest[j].v); found = true; break;
        }
      }
    }
    if(!found){
      if(rest.length>=2){
        // 一般に単価のほうが大きい。小数があればそれを人数(数量)扱い
        const dec = rest.find(c=>c.dec);
        if(dec){ count = dec.v; const r2 = rest.filter(c=>c!==dec); unit = r2.length ? r2[r2.length-1].v : null; }
        else { const sorted=[...rest].sort((a,b)=>b.v-a.v); unit=sorted[0].v; count=sorted[sorted.length-1].v; }
      } else if(rest.length===1){
        unit = rest[0].v;
        if(amount!=null && unit>0 && amount%unit===0) count = amount/unit;
      } else if(amount!=null){
        unit = amount; count = 1;
      }
    }
  } else {
    // 人数あり: 単価は 金額÷人数 が候補にあればそれ、無ければ残りの一番右
    if(amount!=null && count>0){
      const q = amount/count;
      const hit = rest.find(c=>Math.abs(c.v-q)<0.5);
      unit = hit ? hit.v : (rest.length ? rest[rest.length-1].v : (Number.isInteger(q)?q:null));
    } else if(rest.length){ unit = rest[rest.length-1].v; }
  }
  return {unit, count, amount};
}

function extract(pages, fileName, opt){
  const res = [];
  let lastDate = null;
  for(let p=0;p<pages.length;p++){
    for(const line of pages[p]){
      const half = toHalf(line);
      const dates = findDates(half, opt.year);
      if(dates.length) lastDate = dates[0];
      if(!opt.keywords.some(k => line.includes(k))) continue;
      if(opt.skipSum && /合計|小計|消費税/.test(line)) continue;
      const date = dates.length ? dates[0] : (opt.carry ? lastDate : null);
      const f = findFigures(half, dates);
      res.push({file:fileName, page:p+1, date: date?fmtDate(date):"", unit:f.unit, count:f.count, amount:f.amount, line, use:true});
    }
  }
  return res;
}

// ---------- 表示 ----------
function yen(n){ return n==null ? "" : Math.round(n).toLocaleString("ja-JP"); }
function num(n){ return n==null ? "" : (Number.isInteger(n) ? String(n) : n.toFixed(1)); }
function consistent(h){ return h.unit!=null && h.count!=null && h.amount!=null && Math.abs(h.unit*h.count - h.amount) < 0.5; }

function renderHits(){
  const t = $("hits");
  if(!hits.length){ t.innerHTML = `<tr><td class="empty">指定ワードを含む行が見つかりませんでした。ワードを変えるか、PDFが文字選択できるか確認してください。</td></tr>`; return; }
  const kws = keywords();
  let html = `<tr class="hit-top"><th class="chk"></th><th class="dt">日付</th><th class="un n">単価</th><th class="pp n">人数</th><th class="am n">金額</th><th class="sp">ファイル / 検算</th></tr>`;
  hits.forEach((h,i)=>{
    let esc = h.line.replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
    for(const k of kws) esc = esc.split(k).join(`<mark>${k}</mark>`);
    const ok = consistent(h);
    html += `<tr class="hit-top">
      <td class="chk"><input type="checkbox" data-i="${i}" class="use" ${h.use?"checked":""} style="width:20px;height:20px"></td>
      <td class="dt"><input type="text" data-i="${i}" data-k="date" class="cell ed" value="${h.date}" placeholder="日付"></td>
      <td class="un"><input type="text" data-i="${i}" data-k="unit" class="cell num ed" value="${num(h.unit)}" inputmode="decimal" placeholder="単価"></td>
      <td class="pp"><input type="text" data-i="${i}" data-k="count" class="cell num ed" value="${num(h.count)}" inputmode="decimal" placeholder="人数"></td>
      <td class="am"><input type="text" data-i="${i}" data-k="amount" class="cell num ed ${ok?"":"warn"}" value="${num(h.amount)}" inputmode="numeric" placeholder="金額"></td>
      <td class="sp file">${h.file} p.${h.page}　<span class="chkmark ${ok?"":"ng"}">${ok?"単価×人数＝金額 OK":"要確認"}</span></td>
    </tr>
    <tr class="hit-raw"><td colspan="6" class="raw">${esc}</td></tr>`;
  });
  t.innerHTML = html;
  t.querySelectorAll(".use").forEach(el=>el.onchange=e=>{hits[+e.target.dataset.i].use=e.target.checked; renderDaily();});
  t.querySelectorAll(".ed").forEach(el=>el.onchange=e=>{
    const h = hits[+e.target.dataset.i], k = e.target.dataset.k;
    if(k==="date"){ h.date = e.target.value.trim(); }
    else { const v = parseFloat(toHalf(e.target.value).replace(/[^\d.]/g,"")); h[k] = Number.isFinite(v)?v:null; }
    renderHits(); renderDaily();
  });
}

function aggregate(){
  const byDay = new Map();
  for(const h of hits){
    if(!h.use || h.amount==null) continue;
    const key = h.date || "日付不明";
    const o = byDay.get(key) || {amount:0, count:0, units:new Set()};
    o.amount += h.amount;
    if(h.count!=null) o.count += h.count;
    if(h.unit!=null) o.units.add(h.unit);
    byDay.set(key, o);
  }
  const days = [...byDay.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
  const months = new Map();
  for(const [d,o] of days){
    const mk = d==="日付不明" ? "日付不明" : d.slice(0,7);
    const m = months.get(mk) || {amount:0,count:0};
    m.amount += o.amount; m.count += o.count;
    months.set(mk,m);
  }
  return {days, months};
}
function unitLabel(set){
  const a = [...set];
  if(!a.length) return "";
  if(a.length===1) return yen(a[0]);
  return a.map(yen).join(" / ");
}
function mLabel(mk){ return mk==="日付不明" ? "日付不明 合計" : `${+mk.slice(0,4)}年${+mk.slice(5,7)}月 合計`; }

function renderDaily(){
  const {days, months} = aggregate();
  const t = $("daily");
  if(!days.length){ t.innerHTML = `<tr><td class="empty">集計対象がありません。</td></tr>`; return; }
  let html = `<tr><th>日付</th><th class="n">単価（円）</th><th class="n">人数</th><th class="n">金額（円）</th></tr>`;
  let curM = null, gA = 0, gC = 0;
  const monthRow = mk => { const m = months.get(mk); return `<tr class="month"><td>${mLabel(mk)}</td><td class="n"></td><td class="n">${num(m.count)}</td><td class="n">${yen(m.amount)}</td></tr>`; };
  for(const [d,o] of days){
    const mk = d==="日付不明" ? "日付不明" : d.slice(0,7);
    if(curM!==null && mk!==curM) html += monthRow(curM);
    curM = mk;
    html += `<tr><td>${d}</td><td class="n">${unitLabel(o.units)}</td><td class="n">${num(o.count)}</td><td class="n">${yen(o.amount)}</td></tr>`;
    gA += o.amount; gC += o.count;
  }
  html += monthRow(curM);
  if(months.size>1) html += `<tr class="total"><td>総合計</td><td class="n"></td><td class="n">${num(gC)}</td><td class="n">${yen(gA)}</td></tr>`;
  t.innerHTML = html;
}

// ---------- CSV ----------
function downloadCSV(){
  const {days, months} = aggregate();
  const rows = [["日付","単価","人数","金額"]];
  let curM = null;
  const push = mk => { const m = months.get(mk); rows.push([mLabel(mk),"",num(m.count),Math.round(m.amount)]); };
  for(const [d,o] of days){
    const mk = d==="日付不明" ? "日付不明" : d.slice(0,7);
    if(curM!==null && mk!==curM) push(curM);
    curM = mk;
    rows.push([d, unitLabel(o.units).replace(/,/g,""), num(o.count), Math.round(o.amount)]);
  }
  if(curM!==null) push(curM);
  rows.push([]);
  rows.push(["--- 拾った行（確認用） ---"]);
  rows.push(["使用","日付","単価","人数","金額","ファイル","ページ","行の内容"]);
  for(const h of hits) rows.push([h.use?"○":"", h.date, num(h.unit), num(h.count), num(h.amount), h.file, h.page, h.line]);
  const csv = rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `砕石費用_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

// ---------- イベント ----------
function keywords(){ return $("kw").value.split(/[,、，]/).map(s=>s.trim()).filter(Boolean); }
function setStatus(msg, err){ const s=$("status"); s.textContent=msg; s.classList.toggle("err",!!err); }

function setFiles(list){
  loadedFiles = [...list].filter(f=>/\.pdf$/i.test(f.name) || f.type==="application/pdf");
  $("run").disabled = !loadedFiles.length;
  $("clear").disabled = !loadedFiles.length;
  setStatus(loadedFiles.length ? `${loadedFiles.length}件のPDFを読み込み待ち：${loadedFiles.map(f=>f.name).join("、")}` : "PDFファイルが選ばれていません", !loadedFiles.length);
}

$("files").onchange = e => setFiles(e.target.files);
const drop = $("drop");
["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over");}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over");}));
drop.addEventListener("drop", e => setFiles(e.dataTransfer.files));
drop.addEventListener("click", () => $("files").click());
drop.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); $("files").click(); } });

$("run").onclick = async () => {
  const opt = {
    keywords: keywords(),
    year: parseInt($("year").value,10) || new Date().getFullYear(),
    carry: $("carry").checked,
    skipSum: $("skipSum").checked,
  };
  if(!opt.keywords.length){ setStatus("拾うワードを1つ以上入れてください", true); return; }
  hits = [];
  $("run").disabled = true;
  const noText = [];
  for(let i=0;i<loadedFiles.length;i++){
    const f = loadedFiles[i];
    setStatus(`読み取り中 ${i+1}/${loadedFiles.length}：${f.name}`);
    try{
      const pages = await pdfToLines(f);
      if(pages.every(p=>p.length===0)) noText.push(f.name);
      hits.push(...extract(pages, f.name, opt));
    }catch(err){
      console.error(err);
      noText.push(`${f.name}（開けませんでした）`);
    }
  }
  renderHits(); renderDaily();
  $("resultPanel").hidden = false;
  $("hitPanel").hidden = false;
  $("csv").disabled = !hits.length;
  $("run").disabled = false;
  let msg = `完了：${hits.length}行を拾いました`;
  const ng = hits.filter(h=>!consistent(h)).length;
  if(ng) msg += `（うち${ng}行は単価×人数≠金額なので確認してください）`;
  if(noText.length) msg += `　／　文字を読み取れなかったPDF：${noText.join("、")}（スキャン画像の可能性あり）`;
  setStatus(msg, noText.length>0);
};

$("csv").onclick = downloadCSV;

$("clear").onclick = () => {
  loadedFiles = []; hits = [];
  $("files").value = "";
  $("resultPanel").hidden = true; $("hitPanel").hidden = true;
  $("run").disabled = true; $("csv").disabled = true; $("clear").disabled = true;
  setStatus("");
};
</script>
</body>
</html>
