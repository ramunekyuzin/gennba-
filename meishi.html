<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142840">
  <title>名刺検索</title>
  <style>
    :root{--bg:#f3f6fa;--surface:#fff;--ink:#182b42;--muted:#65758a;--line:#dfe7f0;--primary:#185aa8;--pale:#eaf3ff;--success:#167957;--danger:#bd3944;--shadow:0 8px 28px rgba(25,49,80,.07)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.55}
    button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}a{color:inherit}
    .shell{max-width:1120px;margin:auto;padding:0 22px 70px}
    .top{background:#142840;color:white}.top-inner{max-width:1120px;margin:auto;padding:25px 22px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .eyebrow{color:#98bde6;font-size:11px;font-weight:800;letter-spacing:.15em}.top h1{font-size:26px;line-height:1.25;margin:5px 0 3px}.top p{margin:0;color:#bdccdc;font-size:13px}
    .refresh{flex:none;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);color:white;border-radius:12px;min-height:44px;padding:0 17px;font-weight:700}
    .toolbar{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin:22px 0 16px}.searchbox{position:relative}.searchbox svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
    #q{width:100%;height:54px;padding:0 48px 0 47px;border:1px solid var(--line);border-radius:15px;background:var(--surface);color:var(--ink);outline:none;box-shadow:var(--shadow);font-size:16px}#q:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(24,90,168,.13)}#q::placeholder{color:#8996a8}
    #clearBtn{position:absolute;right:9px;top:8px;width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:22px;display:none}
    .addBtn{height:54px;padding:0 22px;border:0;border-radius:15px;background:var(--primary);color:white;font-weight:800;white-space:nowrap;box-shadow:0 6px 16px rgba(24,90,168,.2)}
    .meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}.meta strong{font-size:16px}.meta small{color:var(--muted)}
    .chips{display:flex;gap:8px;overflow-x:auto;padding:3px 2px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.chips::-webkit-scrollbar{display:none}.chips button{flex:none;min-height:42px;padding:0 15px;border:1px solid var(--line);border-radius:100px;background:var(--surface);color:var(--muted);white-space:nowrap;font-size:13px;font-weight:700}.chips button.on{background:var(--ink);border-color:var(--ink);color:white}
    #list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:var(--shadow)}
    .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.company{font-size:13px;color:var(--muted);font-weight:700;overflow-wrap:anywhere}.gyoshu{flex:none;font-size:11px;padding:3px 9px;border-radius:100px;background:var(--pale);color:var(--primary);font-weight:700}
    .warn{margin-top:12px;padding:10px 12px;border-radius:10px;background:#fff4e8;color:#9b4e13;font-size:12px;line-height:1.5;overflow-wrap:anywhere}.name{font-size:21px;font-weight:800;margin:8px 0 0;overflow-wrap:anywhere}.kana{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:1px}.pos{font-size:13px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
    .info{display:grid;gap:7px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}.info-row{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px}.info b{color:var(--muted);font-weight:500}
    .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.btns a,.btns button{display:inline-flex;justify-content:center;align-items:center;flex:1 1 calc(50% - 8px);min-height:44px;padding:9px 10px;text-align:center;border:1px solid #d6e5f8;border-radius:11px;background:var(--pale);color:var(--primary);font-size:13px;font-weight:800;text-decoration:none}.btns button{cursor:pointer}
    #status,#upStatus{font-size:14px;text-align:center;line-height:1.6}#status{padding:18px;color:var(--muted)}#status:empty{display:none}#upStatus{margin:0 0 12px}#upStatus:empty{display:none}.ng{color:var(--danger)!important}.ok{color:var(--success)!important}
    .empty{grid-column:1/-1;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:42px 20px;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:4px}
    :focus-visible{outline:3px solid #72aaf2;outline-offset:2px}
    @media(max-width:700px){.shell{padding:0 15px 95px}.top-inner{padding:21px 16px 23px}.top h1{font-size:23px}.top p{font-size:12px}.refresh{padding:0 13px}.toolbar{grid-template-columns:1fr;margin:16px 0 13px;gap:10px}.addBtn{width:100%}.meta{margin-bottom:7px}#list{grid-template-columns:1fr;gap:10px}.card{padding:17px}.info{gap:9px}.chips{margin:0 -15px;padding:3px 15px 13px}.btns a,.btns button{min-height:46px}}
    @media(max-width:360px){.top p{max-width:215px}.card-top{flex-wrap:wrap}.btns a,.btns button{flex-basis:100%}}
    @media(prefers-reduced-motion:no-preference){button,a{transition:filter .15s,transform .15s}button:active,a:active{transform:scale(.98)}}
  </style>
</head>
<body>
  <header class="top"><div class="top-inner"><div><div class="eyebrow">BUSINESS CARD DIRECTORY</div><h1>名刺検索</h1><p>連絡先を探して、すぐに電話やメールへ</p></div><button type="button" class="refresh" id="reloadBtn" onclick="load(true)">↻ 更新</button></div></header>
  <main class="shell">
    <div id="main" style="display:none">
      <div class="toolbar">
        <div class="searchbox"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg><input id="q" type="search" autocomplete="off" aria-label="名刺を検索" placeholder="会社名・氏名・電話番号など" oninput="render()"><button type="button" id="clearBtn" aria-label="検索を消去" onclick="clearSearch()">×</button></div>
        <button type="button" class="addBtn" id="addBtn" onclick="document.getElementById('photo').click()">＋ 名刺を追加（写真・PDF）</button>
      </div>
      <input id="photo" type="file" accept="image/*,application/pdf,.pdf" multiple hidden onchange="uploadPhotos(this)">
      <div id="upStatus" role="status" aria-live="polite"></div>
      <div class="meta"><strong>登録した名刺</strong><small id="count"></small></div>
      <div class="chips" id="chips" aria-label="業種で絞り込み"></div>
      <div id="list"></div>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycby0nenuLFaz6xbxueS4FQV2WBR0ur4mqN8oga_BoqwzZc1FMg68pHuN-mBeDD3Z50Rm/exec';
    const MAX_SHOW = 200;
    const PARALLEL = 3;
    const PDF_MAX_MB = 20;
    let cards = [], gyoshuSel = '', loading = false;
    load();
    async function api(body) {
      if (!GAS_URL) throw new Error('GAS_URL が未設定');
      const r = await fetch(GAS_URL, {method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)});
      if (!r.ok) throw new Error('通信に失敗しました (' + r.status + ')');
      const res = await r.json();
      if (!res.ok) throw new Error(res.error || '処理に失敗しました');
      return res.result;
    }
    async function load() {
      if (loading) return;
      loading = true;
      const btn = document.getElementById('reloadBtn');
      btn.disabled = true;
      setStatus(cards.length ? '更新中…' : '名刺を読み込み中…');
      try {
        const next = (await api({action:'list'})).reverse();
        next.forEach(c => c._hay = norm([c['会社名'],c['業種'],c['部署'],c['役職'],c['氏名'],c['ふりがな'],c['電話'],c['携帯'],c['FAX'],c['メール'],c['住所'],c['URL'],c['メモ'],c['ファイル名']].join(' ')));
        cards = next;
        document.getElementById('main').style.display = 'block';
        setStatus('');
        renderChips();render();
      } catch(err) {setStatus('読み込めませんでした。更新を押して再試行してください。' + (err.message ? ' (' + err.message + ')' : ''),true)}
      finally {loading=false;btn.disabled=false}
    }
    function norm(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[\u30a1-\u30f6]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60)).replace(/[\s\-‐‑–—−ー()（）]/g,'')}
    function render(){
      const q=document.getElementById('q'),raw=q.value.trim(),words=raw.split(/[\s　]+/).map(norm).filter(Boolean);
      document.getElementById('clearBtn').style.display=raw?'block':'none';
      const hit=cards.filter(c=>(!gyoshuSel||(gyoshuSel==='__check'?!!c['要確認']:(c['業種']||'未分類')===gyoshuSel))&&words.every(w=>c._hay.includes(w)));
      document.getElementById('count').textContent=hit.length+'件 / 全'+cards.length+'件'+(hit.length>MAX_SHOW?'（先頭'+MAX_SHOW+'件を表示）':'');
      document.getElementById('list').innerHTML=hit.slice(0,MAX_SHOW).map(cardHtml).join('')||'<div class="empty"><strong>名刺が見つかりませんでした</strong>検索語や業種を変えてお試しください</div>';
    }
    function clearSearch(){const q=document.getElementById('q');q.value='';render();q.focus()}
    function renderChips(){
      const count={};cards.forEach(c=>{const g=c['業種']||'未分類';count[g]=(count[g]||0)+1});
      const nCheck=cards.filter(c=>c['要確認']).length;if(gyoshuSel==='__check'&&!nCheck)gyoshuSel='';else if(gyoshuSel&&gyoshuSel!=='__check'&&!count[gyoshuSel])gyoshuSel='';
      const chips=document.getElementById('chips');chips.replaceChildren();
      const add=(g,label)=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.className=gyoshuSel===g?'on':'';b.setAttribute('aria-pressed',String(gyoshuSel===g));b.addEventListener('click',()=>pickGyoshu(g));chips.appendChild(b)};
      add('','すべて '+cards.length);if(nCheck)add('__check','⚠ 要確認 '+nCheck);
      Object.keys(count).sort((a,b)=>count[b]-count[a]).forEach(g=>add(g,g+' '+count[g]));
    }
    function pickGyoshu(g){gyoshuSel=gyoshuSel===g?'':g;renderChips();render()}
    function cardHtml(c){
      const pos=[c['部署'],c['役職']].filter(Boolean).join('　');
      const info=[['電話',c['電話']],['携帯',c['携帯']],['FAX',c['FAX']],['メール',c['メール']],['住所',c['住所']],['URL',c['URL']],['メモ',c['メモ']]].filter(x=>x[1]).map(x=>'<div class="info-row"><b>'+x[0]+'</b><span>'+esc(x[1])+'</span></div>').join('');
      const btns=[];
      splitNums(c['携帯']).forEach(n=>btns.push('<a href="tel:'+n+'">📱 携帯に電話</a>'));
      splitNums(c['電話']).forEach(n=>btns.push('<a href="tel:'+n+'">📞 電話する</a>'));
      if(c['メール']){const mail=String(c['メール']).split('/')[0].trim();btns.push('<a href="mailto:'+esc(mail)+'">✉ メール</a>')}
      if(c['住所'])btns.push('<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query='+encodeURIComponent(c['住所'])+'">地図を見る</a>');
      if(c['fileId'])btns.push('<button type="button" class="fileBtn" data-file-id="'+esc(c['fileId'])+'">名刺を見る</button>');
      return '<article class="card"><div class="card-top"><div class="company">'+esc(c['会社名']||'会社名なし')+'</div>'+(c['業種']?'<span class="gyoshu">'+esc(c['業種'])+'</span>':'')+'</div><div class="name">'+esc(c['氏名']||'（氏名なし）')+(c['ふりがな']?'<span class="kana">'+esc(c['ふりがな'])+'</span>':'')+'</div>'+(pos?'<div class="pos">'+esc(pos)+'</div>':'')+(c['要確認']?'<div class="warn">⚠ 要確認: '+esc(c['要確認'])+'（名刺を見て確認）</div>':'')+(info?'<div class="info">'+info+'</div>':'')+(btns.length?'<div class="btns">'+btns.join('')+'</div>':'')+'</article>';
    }
    document.getElementById('list').addEventListener('click',e=>{const btn=e.target.closest('button[data-file-id]');if(btn)openFile(btn.dataset.fileId)});
    function splitNums(s){return String(s||'').split('/').map(x=>x.replace(/[^\d+]/g,'')).filter(x=>x.length>=6)}
    function shrink(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{const scale=Math.min(1,2400/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*scale);cv.height=Math.round(img.height*scale);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);resolve(cv.toDataURL('image/jpeg',.85).split(',')[1])}catch(err){reject(err)}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('画像を開けませんでした'))};img.src=url})}
    function readBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(new Error('ファイルを読み込めませんでした'));reader.readAsDataURL(file)})}
    function isPdf(file){return file.type==='application/pdf'||/\.pdf$/i.test(file.name)}
    async function uploadPhotos(input){
      const files=Array.from(input.files||[]);input.value='';if(!files.length)return;
      const btn=document.getElementById('addBtn'),st=document.getElementById('upStatus');btn.disabled=true;
      const added=[],dups=[],errors=[];let next=0,done=0;
      const show=()=>{st.className='';st.textContent='読み取り中… '+done+'/'+files.length+'ファイル 完了'+(added.length?'（'+added.length+'件追加済み）':'')};
      show();
      async function worker(){while(next<files.length){const i=next++;
        try{let r;if(isPdf(files[i])){if(files[i].size>PDF_MAX_MB*1024*1024)throw new Error('PDFは'+PDF_MAX_MB+'MBまでです');r=await api({action:'upload',mimeType:'application/pdf',data:await readBase64(files[i])})}
          else{r=await api({action:'upload',mimeType:'image/jpeg',data:await shrink(files[i])})}
          added.push(...(r.names||[]));dups.push(...(r.dupNames||[]));if(!r.count&&!(r.dupNames||[]).length)errors.push(files[i].name+': 名刺が見つかりませんでした')}
        catch(err){errors.push(files[i].name+': '+err.message)}done++;show();
      }}
      try{await Promise.all(Array.from({length:Math.min(PARALLEL,files.length)},worker))}
      finally{btn.disabled=false}
      st.className=errors.length?'ng':'ok';
      st.textContent=[added.length?'✓ '+added.length+'件追加: '+added.join('、'):'',dups.length?'登録済みのためスキップ: '+dups.join('、'):'',errors.length?'エラー: '+errors.join(' / '):''].filter(Boolean).join(' / ');
      if(added.length)load();
    }
    async function openFile(fileId){
      const w=window.open('','_blank');if(w)w.document.write('<p style="font-family:sans-serif;padding:20px">読み込み中...</p>');
      try{const f=await api({action:'pdf',fileId}),bin=atob(f.data),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const url=URL.createObjectURL(new Blob([bytes],{type:f.mimeType}));if(w)w.location.href=url;else location.href=url;setTimeout(()=>URL.revokeObjectURL(url),60000)}
      catch(err){if(w)w.close();alert('名刺を開けませんでした: '+err.message)}
    }
    function setStatus(msg,ng){const el=document.getElementById('status');el.textContent=msg;el.className=ng?'ng':''}
    function esc(s){return String(s||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
  </script>
</body>
</html>
