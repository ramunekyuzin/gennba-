<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>名刺検索</title>
  <style>
    :root{--bg:#f3f6fb;--card:#fff;--text:#172033;--sub:#687386;--line:#e2e8f0;--main:#1769e0;--main2:#0e4fb7;--soft:#eaf2ff;--ok:#15945d;--ng:#d84b4b;--shadow:0 8px 28px rgba(25,45,80,.08)}
    @media(prefers-color-scheme:dark){:root{--bg:#0e131b;--card:#171e29;--text:#eef3fb;--sub:#9da9ba;--line:#293445;--main:#5b9cff;--main2:#79adff;--soft:#202e44;--ok:#54cf91;--ng:#ff7979;--shadow:0 8px 28px rgba(0,0,0,.22)}}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
    body{padding:0 14px 40px;max-width:760px;margin:auto}
    h1{position:sticky;top:0;z-index:20;margin:0 -14px 14px;padding:14px max(14px,env(safe-area-inset-right)) 12px max(14px,env(safe-area-inset-left));font-size:20px;display:flex;justify-content:space-between;align-items:center;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    h1:before{content:"▣";color:var(--main);margin-right:8px}h1 button{margin-left:auto;width:auto;padding:8px 11px;font-size:13px;background:var(--card);color:var(--sub);border:1px solid var(--line);border-radius:10px}
    button,a{touch-action:manipulation}button{font-family:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
    .addBtn{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:15px;font-weight:800;background:linear-gradient(135deg,var(--ok),color-mix(in srgb,var(--ok) 75%,#000));color:#fff;box-shadow:var(--shadow);margin:0 0 10px}
    #upStatus{font-size:13px;text-align:center;margin:0 2px 10px;line-height:1.55}.ng{color:var(--ng)!important}.ok{color:var(--ok)!important}
    .search{position:sticky;top:61px;z-index:15;margin:0 -4px 14px;padding:8px 4px 10px;background:linear-gradient(var(--bg) 82%,transparent)}
    .search:before{content:"⌕";position:absolute;left:19px;top:21px;font-size:22px;color:var(--sub);z-index:1}
    input[type=search]{appearance:none;width:100%;height:50px;padding:0 44px 0 46px;font-size:16px;border:1px solid var(--line);border-radius:15px;background:var(--card);color:var(--text);outline:none;box-shadow:0 3px 14px rgba(20,40,70,.06)}
    input[type=search]:focus{border-color:var(--main);box-shadow:0 0 0 3px color-mix(in srgb,var(--main) 16%,transparent)}
    .chips{display:flex;gap:7px;overflow-x:auto;margin-top:9px;padding:1px 1px 5px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.chips::-webkit-scrollbar{display:none}
    .chips button{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:var(--card);color:var(--text);font-size:13px;white-space:nowrap}.chips button.on{background:var(--main);border-color:var(--main);color:#fff;font-weight:700}
    #count{font-size:12px;color:var(--sub);padding:5px 3px 0}#status{text-align:center;font-size:14px;margin:24px 0;color:var(--sub)}
    .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--main)}
    .company{font-size:13px;color:var(--sub);font-weight:650;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.gyoshu{display:inline-flex;font-size:11px;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--main);font-weight:750}
    .name{font-size:21px;font-weight:850;letter-spacing:.01em;margin:5px 0 2px}.kana{display:block;font-size:11px;color:var(--sub);font-weight:500;margin:3px 0 0}.pos{font-size:13px;color:var(--sub);margin-top:4px}
    .info{margin-top:13px;border-top:1px solid var(--line);padding-top:10px;font-size:13px;line-height:1.55}.info>div{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;padding:5px 0;word-break:break-word}.info b{color:var(--sub);font-weight:600;font-size:12px}
    .btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:13px}.btns a,.btns button{width:100%;min-height:44px;padding:10px 8px;border:0;border-radius:11px;text-decoration:none;text-align:center;font-size:14px;font-weight:750;background:var(--soft);color:var(--main);display:flex;align-items:center;justify-content:center}.btns a:active,.btns button:active,.addBtn:active{transform:scale(.98)}
    mark{background:#ffe17a;color:#172033;border-radius:3px;padding:0 1px}
    @media(min-width:620px){body{padding-left:20px;padding-right:20px}.card{padding:19px}.kana{display:inline;margin-left:8px}.btns{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:380px){body{padding-left:10px;padding-right:10px}.name{font-size:19px}.btns{grid-template-columns:1fr 1fr}.btns a,.btns button{font-size:13px;padding:9px 5px}}
    @media(prefers-reduced-motion:no-preference){.card{animation:rise .18s ease both}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}}
  </style>
</head>
<body>
  <h1><span>名刺検索</span><button id="reloadBtn" onclick="load(true)">↻ 更新</button></h1>

  <div id="main" style="display:none">
    <button class="addBtn" id="addBtn" onclick="document.getElementById('photo').click()">📷 名刺を撮って追加</button>
    <input id="photo" type="file" accept="image/*" multiple style="display:none" onchange="uploadPhotos(this)">
    <div id="upStatus"></div>

    <div class="search">
      <input id="q" type="search" placeholder="名前・会社・業種・電話で検索" oninput="render()">
      <div class="chips" id="chips"></div>
      <div id="count"></div>
    </div>
    <div id="list"></div>
  </div>

  <div id="status"></div>

  <script>
    // ============================================
    // GAS WebアプリのURL（デプロイ後に貼る）
    // ============================================
    const GAS_URL = 'https://script.google.com/macros/s/AKfycby0nenuLFaz6xbxueS4FQV2WBR0ur4mqN8oga_BoqwzZc1FMg68pHuN-mBeDD3Z50Rm/exec';
    const MAX_SHOW = 200;

    let cards = [];
    let gyoshuSel = ''; // 選択中の業種（空なら全部）

    load();

    // ---------- 通信 ----------
    async function api(body) {
      if (!GAS_URL) throw new Error('GAS_URL が未設定');
      const r = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(body),
      });
      const res = await r.json();
      if (!res.ok) throw new Error(res.error);
      return res.result;
    }

    async function load(force) {
      setStatus('読み込み中...');
      try {
        cards = (await api({ action: 'list' })).reverse(); // 新しい順
        cards.forEach(c => c._hay = norm([
          c['会社名'], c['業種'], c['部署'], c['役職'], c['氏名'], c['ふりがな'], c['電話'], c['携帯'],
          c['FAX'], c['メール'], c['住所'], c['URL'], c['メモ'], c['ファイル名'],
        ].join(' ')));
        document.getElementById('main').style.display = 'block';
        setStatus('');
        renderChips();
        render();
      } catch (err) {
        setStatus('エラー: ' + err.message, true);
      }
    }

    // ---------- 検索 ----------
    // 全角半角・大小・カタカナひらがな・空白ハイフン括弧をそろえる
    function norm(s) {
      return String(s || '').normalize('NFKC').toLowerCase()
        .replace(/[\u30a1-\u30f6]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60))
        .replace(/[\s\-‐‑–—−ー()（）]/g, '');
    }

    function render() {
      const raw = document.getElementById('q').value.trim();
      const words = raw.split(/[\s　]+/).map(norm).filter(Boolean);
      const hit = cards.filter(c =>
        (!gyoshuSel || (c['業種'] || '未分類') === gyoshuSel) &&
        words.every(w => c._hay.includes(w)));

      document.getElementById('count').textContent =
        `${hit.length}件` + (hit.length > MAX_SHOW ? `（先頭${MAX_SHOW}件を表示）` : '') + ` / 全${cards.length}件`;

      document.getElementById('list').innerHTML = hit.slice(0, MAX_SHOW).map(cardHtml).join('')
        || '<div id="status">見つからなかった</div>';
    }

    // 業種ボタン（多い順）
    function renderChips() {
      const count = {};
      cards.forEach(c => { const g = c['業種'] || '未分類'; count[g] = (count[g] || 0) + 1; });
      const list = Object.keys(count).sort((a, b) => count[b] - count[a]);
      if (gyoshuSel && !count[gyoshuSel]) gyoshuSel = '';
      const btn = (g, label) =>
        `<button class="${gyoshuSel === g ? 'on' : ''}" onclick="pickGyoshu('${esc(g)}')">${esc(label)}</button>`;
      document.getElementById('chips').innerHTML =
        btn('', `すべて ${cards.length}`) + list.map(g => btn(g, `${g} ${count[g]}`)).join('');
    }

    function pickGyoshu(g) {
      gyoshuSel = (gyoshuSel === g) ? '' : g;
      renderChips();
      render();
    }

    function cardHtml(c) {
      const pos = [c['部署'], c['役職']].filter(Boolean).join('　');
      const info = [
        ['電話', c['電話']], ['携帯', c['携帯']], ['FAX', c['FAX']],
        ['メール', c['メール']], ['住所', c['住所']], ['URL', c['URL']], ['メモ', c['メモ']],
      ].filter(x => x[1]).map(x => `<div><b>${x[0]}</b> ${esc(x[1])}</div>`).join('');

      const btns = [];
      splitNums(c['携帯']).forEach(n => btns.push(`<a href="tel:${n}">📱 携帯</a>`));
      splitNums(c['電話']).forEach(n => btns.push(`<a href="tel:${n}">📞 電話</a>`));
      if (c['メール']) btns.push(`<a href="mailto:${esc(c['メール'].split('/')[0].trim())}">✉ メール</a>`);
      if (c['住所']) btns.push(`<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c['住所'])}">🗺 地図</a>`);
      if (c['fileId']) btns.push(`<button onclick="openFile('${esc(c['fileId'])}')">📄 名刺を見る</button>`);

      return `<div class="card">
        <div class="company">${esc(c['会社名'])}${c['業種'] ? `<span class="gyoshu">${esc(c['業種'])}</span>` : ''}</div>
        <div class="name">${esc(c['氏名'] || '（氏名なし）')}<span class="kana">${esc(c['ふりがな'])}</span></div>
        ${pos ? `<div class="pos">${esc(pos)}</div>` : ''}
        <div class="info">${info}</div>
        <div class="btns">${btns.join('')}</div>
      </div>`;
    }

    function splitNums(s) {
      return String(s || '').split('/').map(x => x.replace(/[^\d+]/g, '')).filter(x => x.length >= 6);
    }

    // ---------- 写真で追加 ----------
    // スマホ写真は大きいので長辺1800pxのJPEGに縮めて送る（iPhoneのHEICもここでJPEGになる）
    function shrink(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const max = 1800;
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const cv = document.createElement('canvas');
          cv.width = Math.round(img.width * scale);
          cv.height = Math.round(img.height * scale);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          URL.revokeObjectURL(url);
          resolve(cv.toDataURL('image/jpeg', 0.85).split(',')[1]);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を開けなかった')); };
        img.src = url;
      });
    }

    async function uploadPhotos(input) {
      const files = Array.from(input.files || []);
      input.value = '';
      if (!files.length) return;
      const btn = document.getElementById('addBtn');
      const st = document.getElementById('upStatus');
      btn.disabled = true;
      const added = [], errors = [];
      for (let i = 0; i < files.length; i++) {
        st.className = '';
        st.textContent = `読み取り中… ${i + 1}/${files.length}枚目（10〜30秒くらい）`;
        try {
          const data = await shrink(files[i]);
          const r = await api({ action: 'upload', mimeType: 'image/jpeg', data: data });
          if (r.count) added.push(...r.names); else errors.push(`${i + 1}枚目: 名刺が見つからなかった`);
        } catch (err) {
          errors.push(`${i + 1}枚目: ${err.message}`);
        }
      }
      btn.disabled = false;
      st.className = errors.length ? 'ng' : 'ok';
      st.innerHTML = (added.length ? `✅ ${added.length}件 追加: ${added.map(esc).join('、')}` : '')
        + (errors.length ? `<br>⚠ ${errors.map(esc).join('<br>')}` : '');
      if (added.length) load();
    }

    // ---------- 名刺ファイル表示 ----------
    async function openFile(fileId) {
      const w = window.open('', '_blank'); // iPhoneのポップアップブロック対策で先に開く
      if (w) w.document.write('<p style="font-family:sans-serif;padding:20px">読み込み中...</p>');
      try {
        const f = await api({ action: 'pdf', fileId: fileId });
        const bin = atob(f.data);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const url = URL.createObjectURL(new Blob([bytes], { type: f.mimeType }));
        if (w) w.location.href = url; else location.href = url;
      } catch (err) {
        if (w) w.close();
        alert('開けなかった: ' + err.message);
      }
    }

    // ---------- 共通 ----------
    function setStatus(msg, ng) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = ng ? 'ng' : '';
    }

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, ch =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }
  </script>
</body>
</html>
