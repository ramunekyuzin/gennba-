*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.6}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 14px 10px}
.hrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
h1{margin:0;font-size:14px;font-weight:700;letter-spacing:.02em;color:var(--ink2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1 b{color:var(--ink);font-size:18px}
.tabs{display:flex;background:var(--chip);border-radius:10px;padding:3px;flex:none}
.tabs button{font:inherit;font-size:13px;padding:6px 12px;border:none;border-radius:8px;background:transparent;color:var(--ink);font-weight:500;min-height:34px}
.tabs button.on{background:var(--paper);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.icon{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);min-height:34px;flex:none}
.search{display:flex;gap:8px}

.chip.on{background:var(--chip-on);color:var(--chip-on-ink);font-weight:700}

main{padding:10px 12px 60px;max-width:820px;margin:0 auto}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.none{text-align:center;color:var(--ink2);padding:40px 0}

button{cursor:pointer}

.item{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}

.cand .cn{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--ry)}

.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}

.tog input{width:18px;height:18px}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}

<body>
<header>
  <div class="hrow">
    <h1><b><span class="brand-mark" aria-hidden="true">⇄</span>細目 ⇄ 略番</b>検索・照合・コピーを、ひとつの画面で。</h1>
    <div class="tabs">
      <button id="tabI" aria-pressed="true" class="on" type="button">細目から探す</button>
      <button id="tabR" aria-pressed="false" type="button">略番から探す</button>
    </div>
    <button id="load" class="icon" type="button">データ読込</button>
  </div>
  <div class="search">
    <input id="q" aria-label="細目・略番・工種を検索" type="search" placeholder="例: 12 / 外部足場 / 直接仮設" autocomplete="off" enterkeyhint="search">
    <button id="clr" aria-label="検索語を消す" title="検索語を消す" type="button">✕</button>
  </div>
  <div class="filter-row"><label for="groupSelect">略番の工種</label><select id="groupSelect"></select><button id="resetFilters" type="button">条件をリセット</button></div>
  <div class="meta" id="meta" role="status" aria-live="polite"></div>
</header>
<main id="list"></main>

<div class="overlay" id="ov">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="importTitle">
    <h2 id="importTitle">項目シートを読み込む</h2>
    <ol class="import-steps"><li>出来高の「項目」シートを全選択してコピー</li><li>下の欄へ貼り付け、読み取り結果を確認</li><li>「読み込む」で反映</li></ol><p>列の順番：現場／No／工種／細目／金額／区分／メモ／略番（任意）。見出し行も貼り付けできます。</p>
    <textarea aria-label="項目シートのデータ" id="paste" placeholder="ここに貼り付け"></textarea>
    <div class="preview" id="preview" aria-live="polite"></div><div class="ok" id="okmsg" role="status"></div>
    <div class="bar">
      <button id="doLoad" class="pri" type="button" disabled>読み込む</button>
      <button id="close" type="button">閉じる</button>
    </div><p class="saved-note">この端末のブラウザに保存します。元のシートは変更しません。</p><details class="danger-zone"><summary>保存データの管理</summary><button id="clearAI" type="button">AI判定を消す</button><button id="clearItems" type="button">細目データを消す</button><button id="clearMap" type="button">手動リンクを消す</button><button id="clearLearn" type="button">学習を消す</button></details>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

function hl(text,terms){
  let html=esc(text);
  if(!terms.length) return html;
  let out=html;
  for(const t of terms){ if(!t) continue; const re=new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"); out=out.replace(re,m=>"\u0001"+m+"\u0002"); }
  return out.replace(/\u0001/g,"<mark>").replace(/\u0002/g,"</mark>");
}

// 2文字以上の共通部分文字列の長さ
function lcs(a,b){
  let best=0;
  for(let i=0;i<a.length;i++){
    for(let j=0;j<b.length;j++){
      let k=0; while(i+k<a.length&&j+k<b.length&&a[i+k]===b[j+k]) k++;
      if(k>best) best=k;
    }
  }
  return best>=2?best:0;
}

const KS_DEFAULT=[["先行","20"],["土工","20"],["杭","26"],["山留","23"],["山止","23"],["コン","29"],["型枠","28"],["鉄筋","36"],["鉄骨","37"],["耐火","38"],["免震","77"],["組積","40"],["ECP","40"],["ALC","40"],["防水","43"],["タイル","45"],["木","46"],["屋根","49"],["金属","50"],["左官","53"],["建具","56"],["ガラス","58"],["塗装","59"],["内装","61"],["雑","68"],["昇降","76"],["EV","76"],["外構","71"],["付帯","71"],["やりかえ","71"],["トレンチ","71"],["撤去","78"],["解体","78"],["設備","77"],["電気","73"],["現場管理","95"],["経費","95"],["変更","0"],["FO","37"]];
function ksDefault(ks){ const k=norm(ks); if(!k) return null; for(const [key,n] of KS_DEFAULT){ if(k.includes(norm(key))) return Number(n)||null; } return null; }
let LEARN={}; try{LEARN=JSON.parse(localStorage.getItem("saimoku_learn")||"{}")}catch(e){LEARN={}}
// 細目名にこの言葉が入っていたら工種列の既定より優先する
const HARD=[["山留",23],["山止",23],["水替",23],["改良杭",26],["杭",26],["くい",26],["足場",13],["残土",20],["根伐",20],["根切",20],["埋戻",20],["鋤取",20],["産廃",18],["産業廃棄物",18],["ガードマン",11],["警備",11],["交通誘導",11],["解体",78],["撤去",78],["エレベーター",76],["EV",76],["生コン",31],["コン材",31],["型枠",28],["打設",29],["ポンプ車",29],["耐火被覆",38],["ALC",40],["ECP",40],["シーリング",42],["塗膜",43],["アス防",41],["アスファルト防水",41],["タイル",45],["ガラス",58],["塗装",59],["LGS",51],["軽量",51],["PB",61],["ボード",61],["クロス",61],["塗床",60],["OA",60],["建具",56],["シャッター",56],["サッシ",56],["家具",67],["ブース",67],["外構",71],["舗装",71],["植栽",71],["保険",83],["積算",99],["設計",98],["人件費",96],["派遣",96]];
function expand(nm){ let x=nm; for(const k in SYN){ if(nm.includes(norm(k))) x+=" "+norm(SYN[k]); } return x; }
// 候補を上位から返す [{n,score,why}]
function candidates(it){
  const nm=norm(it.name), ks=norm(it.ks), memo=norm(it.memo), nx=expand(nm), def=ksDefault(it.ks);
  const out=[];
  DATA.forEach((r,ri)=>{
    let s=0, why="";
    const k=norm(r.k.replace(/【削除:([^】]*)】/g,"$1").replace(/【[^】]*】/g,"")), g=norm(r.g);
    if(k&&nm===k){s+=100;why="工種名と一致";}
    else if(k&&(nm.includes(k)||k.includes(nm))&&Math.min(nm.length,k.length)>=2){s+=35;why="工種名「"+clean(r.k)+"」";}
    // 内訳(説明文)のキーワードで判定
    let bt=0, btok="";
    for(const tk of TOKS[ri]){
      const t=tk.n; let v=0;
      if(nm.includes(t)) v=45+t.length*3;
      else if(nx.includes(t)) v=40+t.length*2;
      else if(t.includes(nm)&&nm.length>=2) v=35;
      else { const L=lcs(nx,t); if(L) v=L*9; }
      if(v===0&&memo&&(memo.includes(t)||t.includes(memo))) v=25;
      if(v>bt){bt=v;btok=tk.o;}
    }
    if(bt){ s+=bt; if(!why||bt>=35) why="内訳「"+btok+"」"; }
    if(g&&ks&&(ks.includes(g)||g.includes(ks))&&Math.min(ks.length,g.length)>=2) s+=25;
    for(const [kw,n] of HARD){ if(nm.includes(norm(kw))){ if(r.n===n){ s+=120; why="キーワード「"+kw+"」"; } break; } }
    if(def){ if(r.n===def){ s+=45; if(!why) why="工種「"+it.ks+"」の既定"; } else if(BYN[def]&&r.g===BYN[def].g) s+=25; else s-=15; }
    if(g&&nm.includes(g)&&g.length>=2) s+=15;
    const mm=(it.memo||"").match(/(?:略番|#)\s*(\d{1,3})/);
    if(mm&&Number(mm[1])===r.n){s+=200;why="メモに略番指定";}
    if(s>25) out.push({n:r.n,score:s,why});
  });
  out.sort((a,b)=>b.score-a.score);
  return out.slice(0,3);
}
function guess(it){ const c=candidates(it); return (c.length&&c[0].score>=40)?c[0]:null; }
function linkOf(it,prev){
  if(Object.prototype.hasOwnProperty.call(MAP,it.no)&&MAP[it.no]===null)return {n:null,src:"none"};
  if(MAP[it.no]!==undefined&&MAP[it.no]!==null&&MAP[it.no]!==""){ return {n:Number(MAP[it.no]),src:"man"}; }
  if(it.ryaku&&BYN[Number(it.ryaku)]){ return {n:Number(it.ryaku),src:"sht"}; }
  const ln=LEARN[norm(it.ks+"|"+it.name)]||LEARN[norm(it.name)];
  if(ln&&BYN[ln]) return {n:ln,src:"auto",why:"学習(前に同じ名前で選択)"};
  const ai=AIMAP[it.no]; if(ai&&BYN[ai.n]) return {n:ai.n,src:ai.low?"ailow":"ai",why:ai.why||"AI判定"};
  if(/^(同上|〃|仝上)/.test(it.name.trim())&&prev&&prev.n) return {n:prev.n,src:"auto",why:"同上 → 前の行と同じ"};
  const g=guess(it); return g?{n:g.n,src:"auto",why:g.why}:{n:null,src:"none"};
}
let aiBusy=false,aiProgress="";

function rememberChange(){undoState={map:JSON.stringify(MAP),learn:JSON.stringify(LEARN)};}
let LINKS={};
function rebuild(){ LINKS={}; let prev=null; for(const it of ITEMS){ LINKS[it.no]=linkOf(it,prev); prev=LINKS[it.no]; } }
function learn(it,n){ if(!it) return; const k=norm(it.ks+"|"+it.name); if(n) LEARN[k]=Number(n); else delete LEARN[k]; }
function itemsFor(n){ return ITEMS.filter(it=>LINKS[it.no]&&LINKS[it.no].n===n); }
const SRC={man:"手動",sht:"シート",auto:"自動",ai:"AI",ailow:"AI要確認",none:"未設定"};

/* ===== 項目シートの解析 ===== */
function parseItems(text){
  const lines=text.replace(/\r/g,"").split("\n").filter(l=>l.trim());
  let idx={no:1,ks:2,name:3,amt:4,grp:5,memo:6,ryaku:7};
  const out=[];
  for(let i=0;i<lines.length;i++){
    const j=lines[i].split("\t").map(x=>x.trim());
    if(i===0&&j.some(x=>/^(細目|細目名)$/.test(x))){
      const f=re=>j.findIndex(x=>re.test(x));
      idx={no:f(/^(no|№|番号)$/i),ks:f(/^工種$/),name:f(/^(細目|細目名)$/),amt:f(/^金額/),grp:f(/^(区分|グループ)$/),memo:f(/^(メモ|備考)$/),ryaku:f(/^略番$/)};
      continue;
    }
    const name=j[idx.name]||""; if(!name) continue;
    const no=(j[idx.no]||"").replace(/[^\d.]/g,""); if(!no) continue;
    const amt=Number((j[idx.amt]||"").replace(/[^\d.-]/g,""))||0;
    const ry=idx.ryaku>=0?(j[idx.ryaku]||"").replace(/[^\d]/g,""):"";
    out.push({no,ks:j[idx.ks]||"",name,amt,grp:idx.grp>=0?(j[idx.grp]||""):"",memo:idx.memo>=0?(j[idx.memo]||""):"",ryaku:ry});
  }
  return out;
}

function cands(it,l){

}

  let rows=DATA.filter(r=>!grp||r.g===grp);
  if(onlyLinked&&ITEMS.length) rows=rows.filter(r=>itemsFor(r.n).length);

    rows=rows.filter(r=>{
      const its=itemsFor(r.n);

    (ITEMS.length?`<span>細目 ${ITEMS.length}件（リンク済 ${linked}）</span>`:`<span class="warn">細目未読込 → 右上「データ読込」</span>`);
  let html=ITEMS.length?`<label class="tog"><input type="checkbox" id="onlyL" ${onlyLinked?"checked":""}> 細目がリンクされた略番だけ表示</label>`:"";
  if(!rows.length){ $("list").innerHTML=html+'<div class="none">条件に一致する項目がありません。<br><small>検索語や絞り込み条件を見直してください。</small></div>'; bindTog(); return; }
  $("list").innerHTML=html+rows.map(r=>{
    const its=itemsFor(r.n), tot=its.reduce((a,i)=>a+(i.amt||0),0);
    const lk=its.length?`<div class="links">${its.map(i=>`
      <div class="lk"><span class="lno">No.${hl(String(i.no),terms)}</span><span class="lks">${hl(i.ks,terms)}</span><span class="lnm">${hl(i.name,terms)}</span>${i.amt?`<span class="lamt">${yen(i.amt)}</span>`:""}<span class="st ${LINKS[i.no].src}">${SRC[LINKS[i.no].src]}</span></div>`).join("")}
      ${its.length>1&&tot?`<div class="sum">計 ${yen(tot)}</div>`:""}</div>`
      :(ITEMS.length?`<div class="nolink">対応する細目なし</div>`:"");
    return `<div class="card">
      <div class="top"><span class="num">${hl(String(r.n),terms)}</span><span class="name">${hl(clean(r.k),terms)}</span><span class="grp">${hl(r.g,terms)}</span><span class="code">${hl(r.c,terms)}</span></div>
      <details class="criterion"><summary>査定基準の内訳を見る</summary><p>${hl(clean(r.d)||"内訳の記載はありません",terms)}</p></details>
      ${lk}
    </div>`;}).join("")+'<div class="hint">数字は略番か細目Noにピンポイント。細目名でも略番を探せる</div>';
  bindTog();
}
function bindTog(){ const c=$("onlyL"); if(c) c.onchange=()=>{onlyLinked=c.checked;renderR();}; }

function syncAIState(){
  for(const id of ["load","doLoad","clearItems","clearMap","clearLearn","clearAI"]){const el=$(id);if(el)el.disabled=aiBusy;}
  if(!aiBusy)previewImport();
}
async function aiRun(){
  if(aiBusy)return;
  const targets=ITEMS.filter(it=>{const l=LINKS[it.no];return l.src!=="man"&&l.src!=="sht";});
  if(!targets.length){toast("AIに送る対象がありません（手動・シート確定分は対象外）");return;}
  if(!confirm(`${targets.length}件をAIで判定します。手動・シート確定分は送りません。続けますか？`))return;
  aiBusy=true;aiProgress=`0 / ${targets.length}件`;syncAIState();render();
  const ryaku=DATA.map(r=>({n:r.n,g:r.g,k:clean(r.k),d:clean(r.d).slice(0,160)}));
  try{
    for(let i=0;i<targets.length;i+=40){
      const chunk=targets.slice(i,i+40).map(it=>({no:it.no,ks:it.ks,name:it.name,memo:it.memo||"",hint:LINKS[it.no].n||null}));
      const res=await fetch(AI_GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({items:chunk,ryaku})});
      if(!res.ok)throw new Error(`通信エラー（${res.status}）`);
      const j=await res.json();if(j.error)throw new Error(j.error);
      const allowed=new Set(chunk.map(it=>String(it.no)));
      for(const r of (j.results||[])){if(r&&allowed.has(String(r.no))&&BYN[Number(r.n)])AIMAP[String(r.no)]={n:Number(r.n),why:"AI: "+(r.why||""),low:r.conf==="low"};}
      aiProgress=`${Math.min(i+40,targets.length)} / ${targets.length}件`;
      save();rebuild();render();
    }
    toast("AI判定が完了しました。要確認の項目をご確認ください。");
  }catch(e){alert("AI判定でエラー: "+e.message);}
  finally{aiBusy=false;aiProgress="";syncAIState();render();}
}
async function copy(t){
 try{if(navigator.clipboard&&navigator.clipboard.writeText) await navigator.clipboard.writeText(t);else throw Error();toast("コピーしました");}
 catch(e){const ta=document.createElement("textarea");ta.value=t;ta.style.cssText="position:fixed;left:-9999px";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy");}catch(e){}ta.remove();toast(ok?"コピーしました":"コピーできませんでした。ブラウザの権限を確認してください。");}
}
function save(){ try{localStorage.setItem(LS_ITEMS,JSON.stringify(ITEMS));localStorage.setItem(LS_MAP,JSON.stringify(MAP));localStorage.setItem("saimoku_learn",JSON.stringify(LEARN));localStorage.setItem(LS_AI,JSON.stringify(AIMAP));}catch(e){} }
function render(){ tab==="I"?renderI():renderR(); }
function chips(){
  $("groupSelect").innerHTML='<option value="">すべての工種</option>'+GROUPS.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join("");$("groupSelect").value=grp;
}
function setTab(t){ tab=t; $("tabI").classList.toggle("on",t==="I"); $("tabI").setAttribute("aria-pressed",String(t==="I"));$("tabR").setAttribute("aria-pressed",String(t==="R")); $("tabR").classList.toggle("on",t==="R");
  $("q").placeholder=t==="I"?"例: 12 / 外部足場 / 直接仮設":"例: 13 / 足場 / ガードマン"; render(); }

$("tabI").onclick=()=>setTab("I");
$("tabR").onclick=()=>setTab("R");
$("q").addEventListener("input",render);
$("clr").onclick=()=>{$("q").value="";render();$("q").focus();};
$("load").onclick=()=>{$("ov").classList.add("on");$("okmsg").textContent=ITEMS.length?`現在 ${ITEMS.length}件 読込済`:"";previewImport();$("paste").focus();};
$("close").onclick=closeImport;
$("ov").onclick=e=>{if(e.target===$("ov"))closeImport();};
$("doLoad").onclick=()=>{
  const items=parseItems($("paste").value);
  if(!items.length){$("okmsg").textContent="細目が読み取れなかった。項目シートを列ごとコピーして貼ってね";return;}
  if(ITEMS.length&&!confirm(`現在の細目${ITEMS.length}件を、読み込んだ${items.length}件に置き換えますか？`))return;
  ITEMS=items; undoState=null;onlyNone=false;grp="";$("q").value="";chips();save(); rebuild();
  $("okmsg").textContent=`${items.length}件 読み込んだ`; $("paste").value="";
  toast(`細目 ${items.length}件を読み込んだ`); setTab("I"); setTimeout(closeImport,400);
};
$("clearItems").onclick=()=>{ if(!confirm("細目データを消す？（手動リンクは残る）"))return; ITEMS=[]; undoState=null;save(); rebuild(); $("okmsg").textContent="消した"; render(); };
$("clearAI").onclick=()=>{ if(!confirm("AI判定の結果を全部消す？"))return; AIMAP={}; undoState=null;save(); rebuild(); $("okmsg").textContent="AI判定を消した"; render(); };
$("clearLearn").onclick=()=>{ if(!confirm("学習した名前→略番を全部消す？"))return; LEARN={}; undoState=null;save(); rebuild(); $("okmsg").textContent="学習を消した"; render(); };
$("clearMap").onclick=()=>{ if(!confirm("手動で割り当てた略番を全部消す？"))return; MAP={}; undoState=null;save(); rebuild(); $("okmsg").textContent="手動リンクを消した"; render(); };

function closeImport(){$("ov").classList.remove("on");$("load").focus();}
function previewImport(){
 const rows=parseItems($("paste").value),seen=new Set();const duplicate=rows.some(r=>{if(seen.has(r.no))return true;seen.add(r.no);return false;});
 $("doLoad").disabled=!rows.length||duplicate;
 $("preview").innerHTML=rows.length?`<b>${rows.length}件を読み取りました${duplicate?"：Noが重複しています。元シートを確認してください。":"（先頭3件）"}</b><table><thead><tr><th>No</th><th>細目</th><th>金額</th></tr></thead><tbody>${rows.slice(0,3).map(r=>`<tr><td>${esc(r.no)}</td><td>${esc(r.name)}</td><td>${yen(r.amt)||"—"}</td></tr>`).join("")}</tbody></table>`:($("paste").value.trim()?"読み取れる行がありません。列の順番とNo・細目を確認してください。":"");
}
$("paste").addEventListener("input",()=>{$("okmsg").textContent="";previewImport();});
$("groupSelect").onchange=()=>{grp=$("groupSelect").value;render();};
$("resetFilters").onclick=()=>{grp="";onlyNone=false;onlyLinked=false;$("q").value="";chips();render();};
$("list").addEventListener("click",e=>{if(e.target.closest('[data-open-import]'))$("load").click();});
document.addEventListener("keydown",e=>{
 if(!$("ov").classList.contains("on"))return;
 if(e.key==="Escape"){e.preventDefault();closeImport();}
 if(e.key==="Tab"){const els=[...$("ov").querySelectorAll('button:not(:disabled),textarea,summary')].filter(el=>el.getClientRects().length);const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
});
rebuild(); chips(); render();
</script>
</body>
</html>
