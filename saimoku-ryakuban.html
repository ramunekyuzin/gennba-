<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>細目⇄略番 — 出来高と査定基準のリンク</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#eef2f0; --paper:#fbfdfc; --ink:#171d1b; --ink2:#55615d; --line:#cfd8d4;
  --accent:#1f6f8b; --accent-soft:#dbeaf0; --mark:#ffe58a; --chip:#dde5e2; --chip-on:#171d1b; --chip-on-ink:#fbfdfc;
  --red:#c2331f; --ry:#b5461c; --ry-soft:#f6e2d8; --auto:#7a6210; --auto-soft:#f7edc4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131817; --paper:#1c2321; --ink:#e6ece9; --ink2:#98a5a0; --line:#2f3a37;
    --accent:#6fb7d3; --accent-soft:#17303a; --mark:#7a6210; --chip:#252e2b; --chip-on:#e6ece9; --chip-on-ink:#131817;
    --red:#ff7b66; --ry:#e8834f; --ry-soft:#3a2418; --auto:#e0c15a; --auto-soft:#3a3114;
  }
}
:root[data-theme="dark"]{
  --bg:#131817; --paper:#1c2321; --ink:#e6ece9; --ink2:#98a5a0; --line:#2f3a37;
  --accent:#6fb7d3; --accent-soft:#17303a; --mark:#7a6210; --chip:#252e2b; --chip-on:#e6ece9; --chip-on-ink:#131817;
  --red:#ff7b66; --ry:#e8834f; --ry-soft:#3a2418; --auto:#e0c15a; --auto-soft:#3a3114;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.6}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 14px 10px}
.hrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
h1{margin:0;font-size:14px;font-weight:700;letter-spacing:.02em;color:var(--ink2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1 b{color:var(--ink);font-size:18px}
.tabs{display:flex;background:var(--chip);border-radius:10px;padding:3px;flex:none}
.tabs button{font:inherit;font-size:13px;padding:6px 12px;border:none;border-radius:8px;background:transparent;color:var(--ink);font-weight:500;min-height:34px}
.tabs button.on{background:var(--paper);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.icon{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);min-height:34px;flex:none}
.search{display:flex;gap:8px}
.search input{flex:1;font:inherit;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);outline:none;-webkit-appearance:none}
.search input:focus{border-color:var(--accent)}
.search button{font:inherit;padding:0 16px;border:none;border-radius:12px;background:var(--chip);color:var(--ink);font-weight:500}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:none;background:var(--chip);color:var(--ink);white-space:nowrap}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink);font-weight:700}
.meta{font-size:12.5px;color:var(--ink2);padding:6px 2px 0;display:flex;gap:10px;flex-wrap:wrap}
.meta .warn{color:var(--red)}
main{padding:10px 12px 60px;max-width:820px;margin:0 auto}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.none{text-align:center;color:var(--ink2);padding:40px 0}
.hint{font-size:12.5px;color:var(--ink2);text-align:center;padding:24px 10px 0}
button{cursor:pointer}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.bar button{font:inherit;font-size:13px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);min-height:38px}
.bar button.pri{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on);font-weight:700}
/* 細目タブ */
.kgrp{font-size:13px;font-weight:700;color:var(--ink2);margin:14px 4px 6px;letter-spacing:.04em}
.item{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.irow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ino{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:0 8px;font-size:14px}
.inm{font-weight:700;font-size:16px}
.iamt{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--ink2)}
.imemo{font-size:12.5px;color:var(--ink2);flex-basis:100%}
.sel{display:flex;align-items:center;gap:8px;margin-top:8px}
.sel select{flex:1;font:inherit;font-size:14px;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:40px;max-width:100%}
.sel select.auto{border-color:var(--auto)}
.sel select.man{border-color:var(--ry)}
.st{font-size:11px;padding:2px 7px;border-radius:5px;white-space:nowrap;background:var(--chip);color:var(--ink2)}
.st.auto{background:var(--auto-soft);color:var(--auto)}
.st.man{background:var(--ry-soft);color:var(--ry)}
.st.none{background:var(--accent-soft);color:var(--accent)}
.rcode{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink2);margin-top:4px;word-break:break-all}
.rcode b{color:var(--auto);font-weight:700}
.cands{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.cand{font:inherit;font-size:12.5px;padding:5px 10px;border:1px dashed var(--line);border-radius:999px;background:transparent;color:var(--ink);display:flex;align-items:center;gap:6px;min-height:32px}
.cand .cn{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--ry)}
.cand small{color:var(--ink2);font-size:11px}
/* 略番タブ */
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.num{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-weight:700;font-size:22px;color:var(--ry);letter-spacing:.02em;min-width:2.2em}
.name{font-weight:700;font-size:17px}
.grp{font-size:12px;color:var(--ink2);margin-left:auto}
.code{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--ink2);flex-basis:100%}
.links{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.lk{display:flex;align-items:baseline;gap:8px;font-size:13.5px;padding:3px 0;flex-wrap:wrap}
.lk .lno{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:0 7px;font-size:13px}
.lk .lks{color:var(--ink2);font-size:12px}
.lk .lnm{font-weight:500}
.lk .lamt{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--ink2)}
.sum{font-size:12.5px;color:var(--ink2);margin-top:4px;text-align:right;font-family:"JetBrains Mono",monospace}
.nolink{font-size:12.5px;color:var(--ink2);margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.tog{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);margin:0 4px 10px}
.tog input{width:18px;height:18px}
/* 読込パネル */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.panel{background:var(--paper);width:100%;max-width:820px;border-radius:18px 18px 0 0;padding:16px 16px 26px;max-height:92vh;overflow:auto}
.panel h2{margin:0 0 6px;font-size:17px}
.panel p{margin:0 0 10px;font-size:13.5px;color:var(--ink2)}
.panel textarea{width:100%;height:200px;font:13px "JetBrains Mono",monospace;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
.ok{font-size:13px;color:var(--accent);margin-top:8px;min-height:1.2em}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--chip-on);color:var(--chip-on-ink);padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1><b>細目⇄略番</b>　出来高×査定基準</h1>
    <div class="tabs">
      <button id="tabI" class="on" type="button">細目</button>
      <button id="tabR" type="button">略番</button>
    </div>
    <button id="load" class="icon" type="button">📋 読込</button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="例: 12 / 外部足場 / 直接仮設" autocomplete="off" enterkeyhint="search">
    <button id="clr" type="button">✕</button>

  <div class="chips" id="chips"></div>
  <div class="meta" id="meta"></div>

<main id="list"></main>

    <textarea id="paste" placeholder="ここに貼り付け"></textarea>
    <div class="ok" id="okmsg"></div>
    <div class="bar">
      <button id="doLoad" class="pri" type="button">読み込む</button>
      <button id="clearItems" type="button">細目データを消す</button>
      <button id="clearMap" type="button">手動リンクを消す</button>
      <button id="close" type="button">閉じる</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

function hl(text,terms){
  let html=esc(text);
  if(!terms.length) return html;
  let out=html;
  for(const t of terms){ if(!t) continue; const re=new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"); out=out.replace(re,m=>"\u0001"+m+"\u0002"); }
  return out.replace(/\u0001/g,"<mark>").replace(/\u0002/g,"</mark>");
}

// 2文字以上の共通部分文字列の長さ
function lcs(a,b){
  let best=0;
  for(let i=0;i<a.length;i++){
    for(let j=0;j<b.length;j++){
      let k=0; while(i+k<a.length&&j+k<b.length&&a[i+k]===b[j+k]) k++;
      if(k>best) best=k;
    }
  }
  return best>=2?best:0;
}

// よく使う略称→内訳の言い方(細目名側に足して照合)
const SYN={"産廃":"産業廃棄物","警備":"保安要員 ガードマン","誘導":"保安要員","生コン":"生コンクリート","電気":"電力","水道":"水道","ダンプ":"運搬費","トラック":"運搬費","重機":"一般重機使用料","ユニック":"レッカー","クレーン":"レッカー","足場":"足場組立て","型枠":"型枠組立て解体","仮囲い":"仮囲い","ガードマン":"保安要員","携帯":"携帯電話代","コピー":"コピー","事務所":"工事事務所","トイレ":"仮設便所","ハウス":"工事事務所","土間":"生コンクリート","鉄筋":"鉄筋","溶接":"溶接","はつり":"はつり","解体":"解体","塗装":"塗装","防水":"防水","タイル":"タイル","左官":"左官","建具":"建具","ガラス":"ガラス","クロス":"クロス","家具":"造作家具","看板":"看板","写真":"工事用写真","測量":"測量","地盤":"土質調査","杭":"くい","くい":"くい","山留":"山止め","山留め":"山止め","埋戻":"埋戻し","根切":"根切り","砕石":"砕石","砂利":"砂利","保険":"保険料","印紙":"契約印紙","通信":"通信費","交通":"交通費","駐車":"駐車代","給料":"社員給料","派遣":"派遣社員費用","清掃":"清掃","養生":"養生","運搬":"運搬費","廃棄":"産業廃棄物"};
function expand(nm){ let x=nm; for(const k in SYN){ if(nm.includes(norm(k))) x+=" "+norm(SYN[k]); } return x; }
// 候補を上位から返す [{n,score,why}]
function candidates(it){
  const nm=norm(it.name), ks=norm(it.ks), memo=norm(it.memo), nx=expand(nm);
  const out=[];
  DATA.forEach((r,ri)=>{
    let s=0, why="";
    const k=norm(r.k.replace(/【削除:([^】]*)】/g,"$1").replace(/【[^】]*】/g,"")), g=norm(r.g);
    if(k&&nm===k){s+=100;why="工種名と一致";}
    else if(k&&(nm.includes(k)||k.includes(nm))&&Math.min(nm.length,k.length)>=2){s+=35;why="工種名「"+clean(r.k)+"」";}
    // 内訳(説明文)のキーワードで判定
    let bt=0, btok="";
    for(const tk of TOKS[ri]){
      const t=tk.n; let v=0;
      if(nm.includes(t)) v=45+t.length*3;
      else if(nx.includes(t)) v=40+t.length*2;
      else if(t.includes(nm)&&nm.length>=2) v=35;
      else { const L=lcs(nx,t); if(L) v=L*9; }
      if(v===0&&memo&&(memo.includes(t)||t.includes(memo))) v=25;
      if(v>bt){bt=v;btok=tk.o;}
    }
    if(bt){ s+=bt; if(!why||bt>=35) why="内訳「"+btok+"」"; }
    if(g&&ks&&(ks.includes(g)||g.includes(ks))&&Math.min(ks.length,g.length)>=2) s+=25;
    if(g&&nm.includes(g)&&g.length>=2) s+=15;
    const mm=(it.memo||"").match(/(?:略番|#)\s*(\d{1,3})/);
    if(mm&&Number(mm[1])===r.n){s+=200;why="メモに略番指定";}
    if(s>25) out.push({n:r.n,score:s,why});
  });
  out.sort((a,b)=>b.score-a.score);
  return out.slice(0,3);
}
function guess(it){ const c=candidates(it); return (c.length&&c[0].score>=40)?c[0]:null; }
function linkOf(it){
  if(MAP[it.no]!==undefined&&MAP[it.no]!==null&&MAP[it.no]!==""){ return {n:Number(MAP[it.no]),src:"man"}; }
  if(it.ryaku&&BYN[Number(it.ryaku)]){ return {n:Number(it.ryaku),src:"sht"}; }
  const g=guess(it); return g?{n:g.n,src:"auto",why:g.why}:{n:null,src:"none"};
}
let LINKS={};
function rebuild(){ LINKS={}; for(const it of ITEMS) LINKS[it.no]=linkOf(it); }
function itemsFor(n){ return ITEMS.filter(it=>LINKS[it.no]&&LINKS[it.no].n===n); }
const SRC={man:"手動",sht:"シート",auto:"自動",none:"未"};

/* ===== 項目シートの解析 ===== */
function parseItems(text){
  const lines=text.replace(/\r/g,"").split("\n").filter(l=>l.trim());
  let idx={no:1,ks:2,name:3,amt:4,grp:5,memo:6,ryaku:7};
  const out=[];
  for(let i=0;i<lines.length;i++){
    const j=lines[i].split("\t").map(x=>x.trim());
    if(i===0&&j.some(x=>/^(細目|細目名)$/.test(x))){
      const f=re=>j.findIndex(x=>re.test(x));
      idx={no:f(/^(no|№|番号)$/i),ks:f(/^工種$/),name:f(/^(細目|細目名)$/),amt:f(/^金額/),grp:f(/^(区分|グループ)$/),memo:f(/^(メモ|備考)$/),ryaku:f(/^略番$/)};
      continue;
    }
    const name=j[idx.name]||""; if(!name) continue;
    const no=(j[idx.no]||"").replace(/[^\d.]/g,""); if(!no) continue;
    const amt=Number((j[idx.amt]||"").replace(/[^\d.-]/g,""))||0;
    const ry=idx.ryaku>=0?(j[idx.ryaku]||"").replace(/[^\d]/g,""):"";
    out.push({no,ks:j[idx.ks]||"",name,amt,grp:idx.grp>=0?(j[idx.grp]||""):"",memo:idx.memo>=0?(j[idx.memo]||""):"",ryaku:ry});
  }
  return out;
}

/* ===== 描画: 細目タブ ===== */
function renderI(){
  const terms=$("q").value.trim().split(/\s+/).filter(Boolean), nterms=terms.map(norm);
  if(!ITEMS.length){
    $("meta").innerHTML='<span class="warn">細目がまだ読み込まれていません</span>';
    $("list").innerHTML='<div class="none">右上「📋 読込」から出来高の「項目」シートを貼り付けてね</div>';return;
  }
  const rows=ITEMS.filter(it=>{
    const l=LINKS[it.no], r=l.n?BYN[l.n]:null;
    if(grp&&(!r||r.g!==grp)) return false;
    if(!nterms.length) return true;
    const hay=norm(it.name+" "+it.ks+" "+it.grp+" "+it.memo+" "+(r?clean(r.k)+" "+r.g+" "+r.c:""));
    return nterms.every(t=>/^\d+$/.test(t)?(String(it.no)===t||(l.n&&String(l.n)===t)):hay.includes(t));
  });
  const cnt={man:0,sht:0,auto:0,none:0}; for(const it of ITEMS) cnt[LINKS[it.no].src]++;
  $("meta").innerHTML=`<span>${rows.length}件 / 全${ITEMS.length}件</span><span>手動${cnt.man}・シート${cnt.sht}・自動${cnt.auto}・未${cnt.none}</span>`;
  const opts=DATA.map(r=>`<option value="${r.n}">${r.n}　${esc(clean(r.k))}（${esc(r.g)}）</option>`).join("");
  let html=`<div class="bar">
    <button id="copyMap" class="pri" type="button">No→略番 をコピー（H列貼付用）</button>
    <button id="copyTbl" type="button">対応表をコピー</button>
    <button id="fixAuto" type="button">自動を手動に確定</button>
  </div>`;
  if(!rows.length){ $("list").innerHTML=html+'<div class="none">該当なし</div>'; bindBar(); return; }
  let cur=null;
  for(const it of rows){
    const key=it.ks+(it.grp?"　"+it.grp:"");
    if(key!==cur){cur=key;html+=`<div class="kgrp">${hl(key,terms)}</div>`;}
    const l=LINKS[it.no], r=l.n?BYN[l.n]:null;
    html+=`<div class="item">
      <div class="irow"><span class="ino">No.${hl(String(it.no),terms)}</span><span class="inm">${hl(it.name,terms)}</span>${it.amt?`<span class="iamt">${yen(it.amt)}</span>`:""}${it.memo?`<span class="imemo">${hl(it.memo,terms)}</span>`:""}</div>
      <div class="sel">
        <select data-no="${esc(it.no)}" class="${l.src==="auto"?"auto":l.src==="man"?"man":""}"><option value="">— 略番未設定 —</option>${opts}</select>
        <span class="st ${l.src}">${SRC[l.src]}</span>
      </div>
      ${r?`<div class="rcode">${esc(r.c)}　${l.why?`<b>${esc(l.why)}</b>　`:""}${hl(clean(r.d).slice(0,60),terms)}${clean(r.d).length>60?"…":""}</div>`:""}
      ${cands(it,l)}
    </div>`;
  }
  $("list").innerHTML=html+'<div class="hint">略番の内訳(説明文)に細目名の言葉が含まれていれば自動で振り分け、黄色で根拠を表示。下の候補をタップかプルダウンで直すと「手動」保存（この端末のみ）。共有は「No→略番をコピー」→項目シートのH列に貼る</div>';
  $("list").querySelectorAll(".cand").forEach(b=>b.onclick=()=>{ MAP[b.dataset.no]=Number(b.dataset.n); save(); rebuild(); renderI(); toast(`No.${b.dataset.no} → 略番${b.dataset.n}`); });
  $("list").querySelectorAll("select").forEach(s=>{
    s.value=LINKS[s.dataset.no].n?String(LINKS[s.dataset.no].n):"";
    s.onchange=()=>{ MAP[s.dataset.no]=s.value?Number(s.value):""; save(); rebuild(); renderI(); };
  });
  bindBar();
}
function cands(it,l){
  const cs=candidates(it).filter(c=>c.n!==l.n);
  if(!cs.length) return "";
  return `<div class="cands">${cs.map(c=>`<button type="button" class="cand" data-no="${esc(it.no)}" data-n="${c.n}"><span class="cn">${c.n}</span>${esc(clean(BYN[c.n].k))}<small>${esc(c.why)}</small></button>`).join("")}</div>`;
}
function bindBar(){
  const b1=$("copyMap"),b2=$("copyTbl"),b3=$("fixAuto");
  if(b1) b1.onclick=()=>{ copy(ITEMS.map(it=>`${it.no}\t${LINKS[it.no].n||""}`).join("\n")); toast("No→略番 をコピーした"); };
  if(b2) b2.onclick=()=>{ copy("No\t工種\t細目\t金額\t略番\t略番工種\t工種コード\n"+ITEMS.map(it=>{const l=LINKS[it.no],r=l.n?BYN[l.n]:null;return `${it.no}\t${it.ks}\t${it.name}\t${it.amt||""}\t${l.n||""}\t${r?clean(r.k):""}\t${r?r.c:""}`;}).join("\n")); toast("対応表をコピーした"); };
  if(b3) b3.onclick=()=>{ let c=0; for(const it of ITEMS){const l=LINKS[it.no]; if(l.src==="auto"){MAP[it.no]=l.n;c++;}} save(); rebuild(); renderI(); toast(`自動${c}件を手動に確定`); };
}

/* ===== 描画: 略番タブ(略番→どの細目か) ===== */
function renderR(){
  const terms=$("q").value.trim().split(/\s+/).filter(Boolean), nterms=terms.map(norm);
  let rows=DATA.filter(r=>!grp||r.g===grp);
  if(onlyLinked&&ITEMS.length) rows=rows.filter(r=>itemsFor(r.n).length);
  if(nterms.length){
    rows=rows.filter(r=>{
      const its=itemsFor(r.n);
      const hay=norm(clean(r.k)+" "+r.c+" "+clean(r.d)+" "+r.g+" "+its.map(i=>i.name+" "+i.ks+" "+i.memo).join(" "));
      return nterms.every(t=>/^\d+$/.test(t)?(String(r.n)===t||its.some(i=>String(i.no)===t)):hay.includes(t));
    });
  }
  const linked=ITEMS.filter(it=>LINKS[it.no]&&LINKS[it.no].n).length;
  $("meta").innerHTML=`<span>${rows.length}件${grp?`　▸ ${esc(grp)}`:""}</span>`+
    (ITEMS.length?`<span>細目 ${ITEMS.length}件（リンク済 ${linked}）</span>`:`<span class="warn">細目未読込 → 右上「📋 読込」</span>`);
  let html=ITEMS.length?`<label class="tog"><input type="checkbox" id="onlyL" ${onlyLinked?"checked":""}> 細目がリンクされた略番だけ表示</label>`:"";
  if(!rows.length){ $("list").innerHTML=html+'<div class="none">該当なし</div>'; bindTog(); return; }
  $("list").innerHTML=html+rows.map(r=>{
    const its=itemsFor(r.n), tot=its.reduce((a,i)=>a+(i.amt||0),0);
    const lk=its.length?`<div class="links">${its.map(i=>`
      <div class="lk"><span class="lno">No.${hl(String(i.no),terms)}</span><span class="lks">${hl(i.ks,terms)}</span><span class="lnm">${hl(i.name,terms)}</span>${i.amt?`<span class="lamt">${yen(i.amt)}</span>`:""}<span class="st ${LINKS[i.no].src}">${SRC[LINKS[i.no].src]}</span></div>`).join("")}
      ${its.length>1&&tot?`<div class="sum">計 ${yen(tot)}</div>`:""}</div>`
      :(ITEMS.length?`<div class="nolink">対応する細目なし</div>`:"");
    return `<div class="card">
      <div class="top"><span class="num">${hl(String(r.n),terms)}</span><span class="name">${hl(clean(r.k),terms)}</span><span class="grp">${hl(r.g,terms)}</span><span class="code">${hl(r.c,terms)}</span></div>
      ${lk}
    </div>`;}).join("")+'<div class="hint">数字は略番か細目Noにピンポイント。細目名でも略番を探せる</div>';
  bindTog();
}
function bindTog(){ const c=$("onlyL"); if(c) c.onchange=()=>{onlyLinked=c.checked;renderR();}; }

function copy(t){
  const fb=s=>{const ta=document.createElement("textarea");ta.value=s;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(()=>fb(t)); else fb(t);
}
function save(){ try{localStorage.setItem(LS_ITEMS,JSON.stringify(ITEMS));localStorage.setItem(LS_MAP,JSON.stringify(MAP));}catch(e){} }
function render(){ tab==="I"?renderI():renderR(); }
function chips(){
  $("chips").innerHTML=['<button class="chip'+(grp?"":" on")+'" data-g="">すべて</button>']
    .concat(GROUPS.map(g=>`<button class="chip${grp===g?" on":""}" data-g="${esc(g)}">${esc(g)}</button>`)).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{grp=b.dataset.g;chips();render();});
}
function setTab(t){ tab=t; $("tabI").classList.toggle("on",t==="I"); $("tabR").classList.toggle("on",t==="R");
  $("q").placeholder=t==="I"?"例: 12 / 外部足場 / 直接仮設":"例: 13 / 足場 / ガードマン"; render(); }

$("tabI").onclick=()=>setTab("I");
$("tabR").onclick=()=>setTab("R");
$("q").addEventListener("input",render);
$("clr").onclick=()=>{$("q").value="";grp="";chips();render();$("q").focus();};
$("load").onclick=()=>{$("ov").classList.add("on");$("okmsg").textContent=ITEMS.length?`現在 ${ITEMS.length}件 読込済`:"";$("paste").focus();};
$("close").onclick=()=>$("ov").classList.remove("on");
$("ov").onclick=e=>{if(e.target===$("ov"))$("ov").classList.remove("on");};
$("doLoad").onclick=()=>{
  const items=parseItems($("paste").value);
  if(!items.length){$("okmsg").textContent="細目が読み取れなかった。項目シートを列ごとコピーして貼ってね";return;}
  ITEMS=items; save(); rebuild();
  $("okmsg").textContent=`${items.length}件 読み込んだ`; $("paste").value="";
  toast(`細目 ${items.length}件を読み込んだ`); setTab("I"); setTimeout(()=>$("ov").classList.remove("on"),400);
};
$("clearItems").onclick=()=>{ if(!confirm("細目データを消す？（手動リンクは残る）"))return; ITEMS=[]; save(); rebuild(); $("okmsg").textContent="消した"; render(); };
$("clearMap").onclick=()=>{ if(!confirm("手動で割り当てた略番を全部消す？"))return; MAP={}; save(); rebuild(); $("okmsg").textContent="手動リンクを消した"; render(); };

rebuild(); chips(); render();
</script>
