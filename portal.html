<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>現場ポータル</title>
  <meta name="theme-color" content="#163e58">
  <style>
    :root{--ink:#203546;--muted:#627583;--brand:#176b82;--line:#e0e8ec;--bg:#f2f6f8}
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.7;padding-bottom:calc(100px + env(safe-area-inset-bottom));overflow-wrap:anywhere}
    button,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}a{color:var(--brand)}:focus-visible{outline:3px solid #e4a92e;outline-offset:4px}
    header{background:linear-gradient(120deg,#15384f,#1b5a70);color:white;padding:30px max(22px,calc((100% - 1040px)/2));border-bottom:4px solid #66c9ba}header .brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}header .brand::after{content:"現場ポータル / SITE PORTAL";font-size:11px;letter-spacing:.14em;font-weight:700;color:#c9e3ea}header .logo{display:none;background:white;border-radius:8px;padding:6px 10px}header .logo img{height:25px;display:block}header h1{font-size:clamp(23px,4vw,32px);line-height:1.45;letter-spacing:.03em}header .sub{font-size:14px;color:#d8e9ef;margin-top:10px;max-width:800px}
    .hero{display:none;width:calc(100% - 32px);max-width:1040px;height:240px;object-fit:cover;background:#dce8ee;margin:24px auto 0;border-radius:18px}main{max-width:1088px;margin:auto;padding:24px 24px 0}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 4px 18px #20354605;min-width:0}.card h2{font-size:17px;color:var(--ink);margin-bottom:18px;display:flex;align-items:center;gap:10px}.card h2::before{content:"";width:4px;height:18px;border-radius:4px;background:#219a98;flex:none}.sec{display:none}.sec.on{display:block}#sec-home.on{display:grid;grid-template-columns:1.05fr 1fr;gap:20px;align-items:start}.kv{display:grid;grid-template-columns:100px minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid #edf1f4}.kv:last-child{border:0;padding-bottom:0}.kv .k{color:var(--muted);font-size:13px;padding-top:3px}.kv .v{white-space:pre-wrap;font-size:15px}
    .news{padding:16px 0;border-bottom:1px solid #edf1f4;font-size:15px;display:flex;flex-direction:column;gap:5px;white-space:pre-wrap}.news:first-child{padding-top:0}.news:last-child{border:0;padding-bottom:0}.news .d{color:var(--brand);font-weight:700;font-size:12px;letter-spacing:.04em}.empty{background:#f6f8fa;border-radius:10px;padding:20px 14px;color:var(--muted);font-size:14px;text-align:center;list-style:none}
    .links a{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:relative;padding:16px 38px 16px 16px;margin-top:10px;background:#f2f7f9;border:1px solid #e7eff2;border-radius:12px;color:#215d74;text-decoration:none;font-size:15px;font-weight:600;min-height:56px}.links a::after{content:"↗";position:absolute;right:15px;color:#627d8d}.links a:hover{background:#e6f1f3}.doc-date{font-size:12px;color:var(--muted);font-weight:400}
    input{width:100%;min-height:52px;padding:13px 16px;font-size:16px;border:1px solid #bdced7;background:#fff;border-radius:12px;color:var(--ink)}input::placeholder{color:#788996}label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}button{min-height:48px;border:0;border-radius:12px;background:var(--brand);color:white;padding:12px 18px;font-weight:600}button:active{filter:brightness(.93)}#pinCard{max-width:460px;margin:20px auto}#pinCard button{width:100%;margin-top:14px}#pinCard p{color:var(--muted);font-size:14px;margin-bottom:20px}
    .contact{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}.contact:last-child{border:0}.contact .info{flex:1;min-width:160px}.role{color:var(--muted);font-size:13px}.name{font-size:18px;font-weight:700;margin:3px 0}.company{font-size:14px;color:#526977}.note{font-size:13px;color:var(--muted);margin-top:6px;white-space:pre-wrap}.contact-actions{display:flex;gap:8px}.contact a.tel{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:82px;min-height:48px;padding:10px 14px;border-radius:12px;background:#e5f4ef;color:#176347;text-decoration:none;font-size:14px;font-weight:700}.contact a.mail{background:#eaf1f8;color:#225a8b}.contact.kinkyu{border-left:3px solid #d97960;padding-left:14px}.contact.kinkyu .role{color:#a44834}.group-title{margin:24px 0 0!important;font-size:14px!important}.contact-count{color:var(--muted);font-size:13px;margin-top:10px}
    ul.rules{list-style:none;counter-reset:rule}.rules li:not(.empty){position:relative;counter-increment:rule;padding:18px 0 18px 48px;white-space:pre-wrap;border-bottom:1px solid var(--line)}.rules li:last-child{border:0}.rules li:not(.empty)::before{content:counter(rule,decimal-leading-zero);position:absolute;left:0;top:18px;border-radius:8px;background:#e9f4f3;color:#247d7b;width:32px;text-align:center;font-size:13px;font-weight:700;line-height:32px}
    nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:8px;background:#fffffffa;border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom));z-index:10;box-shadow:0 -4px 24px #20354606}nav.tabs button{flex:1;max-width:230px;background:transparent;color:#617684;font-size:12px;padding:7px 8px;border-radius:12px;line-height:1.45;min-height:58px}nav.tabs .ic{display:block;font-size:20px;margin-bottom:3px}nav.tabs button.on{background:#e7f3f3;color:#116775;font-weight:700}.updated{text-align:center;font-size:12px;color:var(--muted);margin:24px 0 10px}#status{text-align:center;color:var(--muted);font-size:14px;padding:24px;white-space:pre-line}#retry{display:block;margin:0 auto 20px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.toolbar span{font-size:13px;color:var(--muted)}.toolbar button{background:white;color:var(--brand);border:1px solid var(--line);font-size:13px;min-height:44px;padding:8px 14px}
    @media(min-width:760px){#sec-contact,#sec-rules{max-width:800px;margin:auto}}
    @media(max-width:650px){header{padding:22px 20px}header .brand{margin-bottom:12px}main{padding:18px 14px 0}#sec-home.on{grid-template-columns:minmax(0,1fr);gap:14px}.card{padding:20px 18px;border-radius:16px}.hero{height:180px;margin-top:16px}.kv{grid-template-columns:76px minmax(0,1fr);gap:12px}.contact{gap:12px}.contact-actions{width:100%}.contact-actions a.tel{flex:1}.toolbar{margin-bottom:14px}.card h2{font-size:16px}.news{font-size:16px}}
    @media(prefers-reduced-motion:no-preference){button,a{transition:background .15s,color .15s}}
    nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:68px;padding:5px 8px;font-weight:600;letter-spacing:.03em}
    nav.tabs .ic{display:flex;align-items:center;justify-content:center;width:54px;height:34px;margin:0;border-radius:12px}
    nav.tabs .ic svg{display:block;width:24px;height:24px}
    nav.tabs button.on{background:transparent;color:#116775}
    nav.tabs button.on .ic{background:#d9eeeb;box-shadow:inset 0 0 0 1px #c9e5e1}
    nav.tabs button.on .ic svg{stroke-width:2}
    @media(hover:hover){nav.tabs button:hover .ic{background:#edf4f6}nav.tabs button.on:hover .ic{background:#cfe9e4}}
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <!-- ★ ロゴ: リポジトリに logo.png を置くと表示(無ければ非表示) -->
      <div class="logo" id="logoBox"><img src="logo.png" alt="" onload="document.getElementById('logoBox').style.display='block'" onerror="this.parentNode.remove()"></div>
    </div>
    <h1 id="siteName">現場ポータル</h1>
    <div class="sub" id="siteSub">読み込み中...</div>
  </header>

  <!-- 現場写真(現場情報の「写真」にURLを入れると表示) -->
  <img class="hero" id="hero" alt="">

  <main>
    <div id="pinCard" class="card" style="display:none">
      <h2>現場ポータルへようこそ</h2><p>現場で共有された合言葉を入力してください。</p><label for="pin">合言葉</label>
      <input id="pin" type="password" inputmode="numeric" placeholder="共有された番号" onkeydown="if(event.key==='Enter')savePin()">
      <button onclick="savePin()">開く</button>
    </div>

    <div id="status" role="status" aria-live="polite">読み込み中...</div><button id="retry" hidden onclick="load()" style="display:none">もう一度読み込む</button><div id="toolbar" class="toolbar" style="display:none"><span>現場の情報を、ひとつに。</span><button id="refresh" onclick="load()">↻ 最新情報に更新</button></div>

    <section id="sec-home" class="sec">
      <div class="card"><h2>お知らせ</h2><div id="news"></div></div>
      <div class="card"><h2>現場情報</h2><div id="info"></div></div>
      <div class="card"><h2>資料・PDF</h2><div id="docs" class="links"></div></div>
      <div class="card"><h2>リンク</h2><div id="links" class="links"></div></div>
    </section>

    <section id="sec-contact" class="sec">
      <div class="card">
        <h2>連絡先</h2><label for="q">連絡先を検索</label><input id="q" type="search" placeholder="名前・会社・役割で検索" oninput="renderContacts()"><div id="contactCount" class="contact-count" aria-live="polite"></div>
        <div id="contacts"></div>
      </div>
    </section>

    <section id="sec-rules" class="sec">
      <div class="card"><h2>現場ルール</h2><ul class="rules" id="rules"></ul></div>
    </section>

    <div class="updated" id="updated"></div>
  </main>

  <nav aria-label="メインメニュー" class="tabs" id="tabs" style="display:none">
    <button class="on" onclick="showTab('home')"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="m3 10 9-7 9 7"/><path d="M5 9v11h5v-6h4v6h5V9"/></svg></span>ホーム</button>
    <button onclick="showTab('contact')"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false"><rect x="5" y="3" width="15" height="18" rx="3"/><path d="M3 7h4M3 12h4M3 17h4"/><circle cx="12.5" cy="9" r="2.5"/><path d="M9 17v-1a3.5 3.5 0 0 1 7 0v1"/></svg></span>連絡先</button>
    <button onclick="showTab('rules')"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" focusable="false"><rect x="5" y="5" width="14" height="16" rx="3"/><rect x="9" y="3" width="6" height="4" rx="1.5"/><path d="m9 13 2 2 4-4M9 18h6"/></svg></span>ルール</button>
  </nav>

  <script>
    // ★ GASのWebアプリURLをここに入れる
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx-UTuS9k4NNP_bzp_fSF6yEEZe08PSAk9byDCaptjsGry3Fq55jl8xbL3gf8Odyx3IEA/exec';

    // 現場情報で表示用に使う項目(一覧には出さない)
    const HIDDEN_INFO = ['写真'];

    let DATA = null;
    let activeTab = 'home';
    let sessionPin = '';
    function readPin(){try{return localStorage.getItem('portal_pin') || sessionPin}catch(e){return sessionPin}}
    function safeUrl(value){try{const u=new URL(String(value));return ['http:','https:'].includes(u.protocol)?u.href:''}catch(e){return ''}}

    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function setStatus(msg) { const el = document.getElementById('status'); el.style.display = msg ? 'block' : 'none'; el.textContent = msg || ''; }

    function showTab(name) {
      activeTab = name;
      document.querySelectorAll('nav.tabs button').forEach((b,i)=>b.setAttribute('aria-current',['home','contact','rules'][i]===name?'page':'false'));
      document.querySelectorAll('.sec').forEach(s => s.classList.toggle('on', s.id === 'sec-' + name));
      document.querySelectorAll('nav.tabs button').forEach((b, i) => b.classList.toggle('on', ['home','contact','rules'][i] === name));
      document.getElementById('hero').style.display = (name === 'home' && document.getElementById('hero').dataset.ok) ? 'block' : 'none';
      window.scrollTo(0, 0);
    }

    function savePin() {
      sessionPin = document.getElementById('pin').value.trim();
      if(!sessionPin){document.getElementById('pin').focus();return}
      try{localStorage.setItem('portal_pin', sessionPin)}catch(e){}
      document.getElementById('pinCard').style.display = 'none';
      load();
    }

    // GoogleドライブのURLなら画像として表示できる形に変換
    function toImageUrl(url) {
      url = String(url || '').trim();
      const m = url.match(/\/d\/([\w-]{20,})/) || url.match(/[?&]id=([\w-]{20,})/);
      if (url.includes('drive.google.com') && m) return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1200';
      return url;
    }

    async function load() {
      const refresh=document.getElementById('refresh');
      const retry=document.getElementById('retry');
      refresh.disabled=true; retry.style.display='none';
      setStatus('最新の情報を読み込んでいます…');
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),20000);
      try{
        const r=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'all',pin:readPin()}),signal:controller.signal});
        if(!r.ok)throw new Error('HTTP '+r.status);
        const res=await r.json();
        if(!res.ok){
          if(res.error==='PIN_REQUIRED'){
            DATA=null;
            document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
            ['tabs','toolbar','hero'].forEach(id=>document.getElementById(id).style.display='none');
            document.getElementById('updated').textContent='';
            document.getElementById('pinCard').style.display='block';
            document.getElementById('siteSub').textContent='合言葉を入力してご利用ください';
            setStatus(readPin()?'合言葉を確認して、もう一度入力してください。':'');
            return;
          }
          throw new Error(res.error || '取得できませんでした');
        }
        DATA=res.result;
        document.getElementById('pinCard').style.display='none';
        setStatus('');render();
      }catch(err){
        setStatus('情報を読み込めませんでした。通信環境を確認して再度お試しください。'+(DATA?'\n現在は前回取得した情報を表示しています。':''));
        retry.hidden=false;retry.style.display='block';
        if(!DATA)document.getElementById('siteSub').textContent='接続を確認してください';
      }finally{clearTimeout(timer);refresh.disabled=false;}
    }

    function render() {
      const info = DATA['現場情報'] || [];
      const get = k => (info.find(r => r['項目'] === k) || {})['内容'] || '';
      document.getElementById('siteName').textContent = get('現場名') || '現場ポータル';
      document.getElementById('siteSub').textContent = [get('住所'), get('工期')].filter(Boolean).join('　');

      // 現場写真
      const hero = document.getElementById('hero');
      const photo = safeUrl(toImageUrl(get('写真')));
      delete hero.dataset.ok; hero.style.display='none';
      if (photo) {
        hero.onload = () => { hero.dataset.ok = '1'; if (document.getElementById('sec-home').classList.contains('on')) hero.style.display = 'block'; };
        hero.onerror = () => { delete hero.dataset.ok; hero.style.display = 'none'; };
        hero.src = photo;
      }

      const shown = info.filter(r => !HIDDEN_INFO.includes(r['項目']));
      document.getElementById('info').innerHTML = shown.length
        ? shown.map(r => `<div class="kv"><div class="k">${esc(r['項目'])}</div><div class="v">${esc(r['内容'])}</div></div>`).join('')
        : '<div class="empty">未登録</div>';

      const news = DATA['お知らせ'] || [];
      document.getElementById('news').innerHTML = news.length
        ? news.slice().reverse().map(r => `<div class="news"><span class="d">${esc(r['日付'])}</span><span>${esc(r['内容'])}</span></div>`).join('')
        : '<div class="empty">お知らせはありません</div>';

      const rules = DATA['現場ルール'] || [];
      document.getElementById('rules').innerHTML = rules.length
        ? rules.map(r => `<li>${esc(r['内容'])}</li>`).join('')
        : '<li class="empty">未登録</li>';

      const links = (DATA['リンク'] || []).filter(r=>safeUrl(r['URL']));
      document.getElementById('links').innerHTML = links.length
        ? links.map(r => `<a href="${esc(safeUrl(r['URL']))}" target="_blank" rel="noopener">${esc(r['名前'])}</a>`).join('')
        : '<div class="empty">未登録</div>';

      const docs = (DATA['資料'] || []).filter(r=>safeUrl(r['URL']));
      document.getElementById('docs').innerHTML = docs.length
        ? docs.slice().reverse().map(r => `<a href="${esc(safeUrl(r['URL']))}" target="_blank" rel="noopener">📄 ${esc(r['名前'])} <span class="doc-date">${esc(r['日付'])}</span></a>`).join('')
        : '<div class="empty">資料はありません</div>';

      renderContacts();
      document.getElementById('updated').textContent = DATA.updatedAt ? 'データ更新：' + DATA.updatedAt : '';
      document.getElementById('toolbar').style.display = 'flex';
      document.getElementById('tabs').style.display = 'flex';
      showTab(activeTab);
    }

    function isEmergency(r){return !!r['緊急'] && !['false','0','いいえ','なし'].includes(String(r['緊急']).trim().toLowerCase());}
    function renderContacts() {
      const q=document.getElementById('q').value.trim().toLowerCase();
      const all=DATA?.['連絡先'] || [];
      const list=all.filter(r=>!q || ['役割','会社','名前','備考','電話'].some(k=>String(r[k] || '').toLowerCase().includes(q)));
      document.getElementById('contactCount').textContent=q ? list.length+'件の検索結果 / 全'+all.length+'件' : '全'+all.length+'件';
      document.getElementById('contacts').innerHTML=list.length ? [true,false].map(emergency=>{
        const rows=list.filter(r=>isEmergency(r)===emergency);
        if(!rows.length)return '';
        return `<h2 class="group-title">${emergency?'緊急連絡先':'職員・関係者'} · ${rows.length}件</h2>`+rows.map(r=>{
          const phone=String(r['電話'] || '').replace(/[^0-9+#*]/g,'');
          const name=String(r['名前'] || r['会社'] || '連絡先');
          return `<div class="contact ${emergency?'kinkyu':''}"><div class="info"><div class="role">${esc(r['役割'])}</div><div class="name">${esc(name)}</div>${r['名前'] && r['会社']?`<div class="company">${esc(r['会社'])}</div>`:''}${r['備考']?`<div class="note">${esc(r['備考'])}</div>`:''}</div>${phone || r['メール']?`<div class="contact-actions">${phone?`<a class="tel" href="tel:${esc(phone)}" aria-label="${esc(name)}に電話">☎ 電話</a>`:''}${r['メール']?`<a class="tel mail" href="mailto:${esc(r['メール'])}" aria-label="${esc(name)}にメール">✉ メール</a>`:''}</div>`:''}</div>`;
        }).join('');
      }).join('') : '<div class="empty">'+(q?'該当する連絡先はありません。検索する言葉を変えてください。':'連絡先はまだ登録されていません。')+'</div>';
    }

    load();
  </script>
</body>
</html>
